worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    # Per-path Cache-Control, resolved into ONE server-level `add_header`.
    #
    # nginx's `add_header` is NOT additive across scopes: a `location` that sets
    # ANY header of its own DISCARDS every `add_header` inherited from the
    # enclosing `server`/`http` block. This file used to set Cache-Control inside
    # `location = /remoteEntry.js`, `location /assets/` and `location /health`,
    # which silently dropped the server-level CORS headers below in exactly the
    # three locations that serve the Module-Federation bundle — the host page
    # could not read remoteEntry.js or its chunks cross-origin.
    #
    # Keeping every `add_header` at server level and varying only the VALUE per
    # path makes that failure mode structurally impossible. An empty value means
    # nginx emits no header at all, so paths with no cache policy are unchanged.
    map $uri $clock_cache_control {
        default              "";
        ~^/remoteEntry\.js$  "no-cache, no-store, must-revalidate";
        ~^/assets/           "public, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CORS so the host page can fetch remoteEntry.js and chunks cross-origin.
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        # remoteEntry.js must never be cached stale; /assets/ is immutable.
        add_header 'Cache-Control' $clock_cache_control always;
        if ($request_method = 'OPTIONS') { return 204; }

        location = /remoteEntry.js {
            try_files $uri =404;
        }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location /health {
            # `default_type`, not `add_header Content-Type` — the latter would
            # both clobber the inherited CORS headers and emit a SECOND
            # Content-Type alongside the one nginx derives for `return`.
            default_type text/plain;
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
