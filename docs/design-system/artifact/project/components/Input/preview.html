<!-- @dsCard group="Forms" height=230 -->
<style>
  body { margin: 0; padding: 28px; background: var(--bg-primary); display: flex; flex-direction: column; gap: 18px; max-width: 360px; }
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  label { font-family: var(--font-sans); font-size: 0.8125rem; font-weight: 500; color: var(--text-secondary); line-height: 1.2; }
  input { width: 100%; box-sizing: border-box; padding: var(--space-3); font-family: var(--font-sans); font-size: 0.8125rem; color: var(--text-primary); background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); outline: none; }
  input::placeholder { color: var(--text-tertiary); }
  input.focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.err { border-color: var(--error-color); }
  .msg { display: inline-flex; align-items: center; gap: var(--space-1); font-family: var(--font-sans); font-size: 0.75rem; font-weight: 500; color: var(--error-color); line-height: 1.3; }
  svg { flex: none; }
</style>
<div class="field">
  <label>Workspace name</label>
  <input value="runtime-fabric" />
</div>
<div class="field">
  <label>Remote entry URL</label>
  <input class="focus" value="https://apps.fuzefront.com/remoteEntry.js" />
</div>
<div class="field">
  <label>Scope</label>
  <input class="err" value="" placeholder="e.g. read:apps" />
  <span class="msg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>A scope is required.</span>
</div>
