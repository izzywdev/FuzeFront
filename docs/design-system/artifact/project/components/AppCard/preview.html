<style>@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap");</style>
<style>
  body { margin: 0; padding: 28px; background: var(--bg-primary); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: var(--space-6); background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); }
  .card.hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: transparent; }
  .card.off { opacity: 0.6; filter: grayscale(0.5); }
  .seam { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent-color) 0%, var(--accent-2) 100%); }
  .head { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-4); }
  .icon { position: relative; width: 40px; height: 40px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: linear-gradient(135deg, #2f1f4f, var(--accent-color)); }
  .icon.mf { background: linear-gradient(135deg, #15414f, var(--accent-2)); }
  .icon.iframe { background: linear-gradient(135deg, #4a3a12, var(--warning-color)); }
  .hdot { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; border-radius: 999px; border: 2px solid var(--bg-tertiary); }
  .hdot.ok { background: var(--success-color); }
  .hdot.no { background: var(--error-color); }
  h3 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
  h3.dim { color: var(--text-tertiary); }
  .ibadge { display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; line-height: 1; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-color); margin-top: var(--space-1); }
  p { margin: 0; color: var(--text-secondary); font-size: 0.8125rem; line-height: 1.4; }
  .offlbl { margin-left: var(--space-2); font-size: 0.8125rem; font-weight: 400; color: var(--error-color); }
</style>
<div class="card hover">
  <span class="seam"></span>
  <div class="head">
    <div class="icon mf">🔗<span class="hdot ok"></span></div>
    <div><h3>FuzeBI</h3><span class="ibadge">module-federation</span></div>
  </div>
  <p>Analytics workspace mounted as a federated remote.</p>
</div>
<div class="card off">
  <div class="head">
    <div class="icon iframe">🖼️<span class="hdot no"></span></div>
    <div><h3 class="dim">Legacy Portal<span class="offlbl">(Offline)</span></h3><span class="ibadge">iframe</span></div>
  </div>
  <p>Remote unreachable — card is inert and grayscaled.</p>
</div>
