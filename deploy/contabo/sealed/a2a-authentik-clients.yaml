# SealedSecret — A2A machine-identity client secrets (ns fuzefront). FuzeInfra#981.
#
# Consumed by the Authentik worker/server (deploy/helm/fuzefront/templates/
# authentik.yaml → env AUTHENTIK_A2A_FUZEAGENT_CLIENT_SECRET /
# AUTHENTIK_A2A_FUZEFRONT_CLIENT_SECRET), which the declarative blueprint
# authentik/blueprints/provider-oidc-a2a.yaml reads via !Env to stamp each A2A
# client_credentials provider's client_secret at CREATION time.
#
# Ciphertext ONLY — sealed offline against
# https://sealed-secrets.prod.fuzefront.com/v1/cert.pem (strict scope: locked to
# name `a2a-authentik-clients` + namespace `fuzefront`). No plaintext exists in
# git or in this session's history; the plaintext was generated, sealed, and
# shredded in one step. To rotate: generate a new value, re-seal into this file,
# AND re-seal the SAME value into the caller namespace(s), then bump the
# `fuzefront.io/blueprint-reapply` marker in provider-oidc-a2a.yaml (Authentik
# honours client_secret only at provider creation — see that file's header).
#
# sync-wave "-1": this Secret must materialise before the Authentik pods restart
# and apply the blueprint, so the provider is created WITH a real secret rather
# than an empty one (matches a2a-card-signing.yaml).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: a2a-authentik-clients
  namespace: fuzefront
spec:
  encryptedData:
    A2A_FUZEAGENT_CLIENT_SECRET: 
    A2A_FUZEFRONT_CLIENT_SECRET: 
  template:
    metadata:
      creationTimestamp: null
      name: a2a-authentik-clients
      namespace: fuzefront
    type: Opaque
