# A2A per-product pod secrets for the `fuzefront` namespace (see
# deploy/helm/fuzefront/values-prod.yaml `a2a:` block and docs/a2a/README.md).
#
# SCAFFOLD ONLY — both SealedSecrets below have an EMPTY encryptedData (zero
# keys, zero secret material). This is intentional: this session had no
# reachable path to the sealed-secrets controller's public cert (the
# published URL at sealed-secrets.prod.fuzefront.com is blocked at this
# sandbox's outbound proxy — the same restriction documented for
# app.fuzefront.com — and no fallback cert is committed at
# deploy/sealed-secrets/sealing-cert.pem), so no ciphertext could be produced
# here. A valid, empty SealedSecret is still useful: it is a real target
# `rotate-sealed-secret.yml` (or a human with kubeseal + the real cert) can
# MERGE a real key into via `kubeseal --merge-into`, without inventing a new
# manifest shape later.
#
# To seal the real values once you have cluster/cert access:
#
#   a2a-card-signing (self-generatable — no external credential needed):
#     gh workflow run rotate-sealed-secret.yml \
#       -f scope=fuzefront/a2a-card-signing \
#       -f key=jws.key \
#       -f manifest=deploy/contabo/sealed/a2a-fuzefront-secrets.yaml
#
#   a2a-provider-anthropic (needs a REAL Anthropic API key — not
#   self-generatable; rotate-sealed-secret.yml only random-generates, by
#   design, so this one must be sealed by hand):
#     bash scripts/seal-secret.sh fuzefront/a2a-provider-anthropic \
#       api-key=@/path/to/real-key.txt \
#       --out deploy/contabo/sealed/a2a-fuzefront-secrets.yaml
#
# Both merge into this same file/namespace. Once real ciphertext lands, Argo
# (deploy/argocd/applications/fuzefront-sealed.yaml) syncs it on merge and the
# a2a-fuzefront Deployment (a2a.yaml) starts finding both keys.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: a2a-card-signing
  namespace: fuzefront
spec:
  encryptedData: {}
  template:
    metadata:
      name: a2a-card-signing
      namespace: fuzefront
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: a2a-provider-anthropic
  namespace: fuzefront
spec:
  encryptedData: {}
  template:
    metadata:
      name: a2a-provider-anthropic
      namespace: fuzefront
