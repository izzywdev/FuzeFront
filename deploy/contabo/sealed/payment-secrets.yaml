# payment-service per-service SealedSecret — SCAFFOLD.
#
# The payment-service gateway is a SCAFFOLD (not the live money path yet) and is
# DISABLED in values-prod (paymentService.enabled: false). The only key below,
# STRIPE_SECRET_KEY, is `optional: true` in the Deployment
# (templates/payment-service.yaml). So the gateway runs in degraded mode (serves
# /health only) even before this Secret holds a real value — nothing is gated on
# it today. Internal-API auth no longer uses a sealed shared bearer: callers now
# present a FuzeFront-issued MANAGED SERVICE TOKEN, verified against
# security-service via SECURITY_SERVICE_URL (a plain env, not a secret) — so the
# retired PAYMENT_INTERNAL_TOKEN key is intentionally gone from this Secret.
#
# encryptedData is intentionally EMPTY: valid kubeseal ciphertext is
# cluster-specific and can only be produced against the live sealed-secrets public
# cert, which the repo owner fetches at seal time. DO NOT hand-write ciphertext.
#
# TO POPULATE (repo owner — plaintext never touches git/chat/CI logs):
#   deploy/scripts/seal-secret.sh STRIPE_SECRET_KEY --scope fuzefront/payment-secrets
# That merges the sealed value into this file's spec.encryptedData in place.
# Then: git add + commit + push; Argo (FuzeInfra-operated) syncs it and the
# in-cluster controller decrypts it into the real `payment-secrets` Secret.
#
# GO-LIVE for the gateway (a later, deliberate step): seal STRIPE_SECRET_KEY here,
# then flip paymentService.enabled: true in values-prod in a deploy window (the
# release.yml image build is already wired).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: payment-secrets
  namespace: fuzefront
spec:
  encryptedData: {}
    # STRIPE_SECRET_KEY: <sealed — run seal-secret.sh>
  template:
    metadata:
      name: payment-secrets
      namespace: fuzefront
    type: Opaque
