# =============================================================================
# Argo CD AppProject — fuzefront
# =============================================================================
# MOVED HERE FROM FuzeInfra (argocd/projects/fuzefront.yaml) as part of the
# family's decentralisation: a repo owns its own deploy/** — Helm, Argo
# Applications, SealedSecrets, and now its AppProject. FuzeInfra's
# `argocd-register` workflow applies this directory once (its `path` input is
# documented as holding "Argo Application/AppProject manifests" and it runs
# `kubectl apply -f "$DIR/"`), after which Argo polls and self-syncs from here.
#
# RESOLVED 2026-10-05 (issue #1137). FuzeInfra's duplicate copy
# (`argocd/projects/fuzefront.yaml`, Namespace-only) was the structural cause of
# a race: TWO repos wrote the same `fuzefront` AppProject, last-write-wins, and
# whichever FuzeInfra `deploy-prod.yml` run applied its narrow copy last froze
# every FuzeFront rollout — Argo does not skip an unpermitted cluster-scoped
# resource, it ABORTS THE WHOLE SYNC, and this chart was rendering a
# ClusterRole/ClusterRoleBinding the narrow copy forbade. That is what actually
# kept applications-service migrations 013/014 from executing in prod: the pods
# that would have run them were never created. FuzeInfra#1308 deleted its
# duplicate file and now gates registration (`validate_consumer_appproject.py`)
# so a wide copy can never be re-applied — `clusterResourceWhitelist` MUST be
# `core/Namespace` only, permanently, no exceptions. FuzeInfra#1306 adopted the
# `fuzefront-workload-authenticator` ClusterRole/ClusterRoleBinding into its own
# chart (same names, same live objects, narrowed to `tokenreviews: create`
# only) so retiring them here is a true no-op for the running grant. This
# file's `clusterResourceWhitelist` is narrowed back to Namespace-only below,
# paired with `securityService.workloadIdentity.clusterRbac.enabled: false` in
# `deploy/helm/fuzefront/values.yaml` in the SAME change — see that file and
# `deploy/scripts/check-cluster-scoped-whitelist.sh`, which enforces the pairing
# rather than merely documenting it. Full timeline: FuzeInfra#639 (step 4),
# FuzeInfra#1306, FuzeInfra#1308, docs/planning/workload-identity-layering.md.
#
# ── THE ONE RULE THAT IS NOT NEGOTIABLE ─────────────────────────────────────
# `fuzeinfra` IS DELIBERATELY NOT A DESTINATION, and this is the whole reason
# the project was centralised in the first place. FuzeFront previously
# self-created a `fuzefront` project that granted itself the `fuzeinfra`
# namespace, and used it to redeploy a DUPLICATE FuzeInfra: split-brain
# Postgres/Kafka, control-plane saturation, cluster-wide 502
# (FuzeFront#95 / FuzeInfra#93, boundary added in FuzeInfra#99).
#
# Owning this file again does not re-open that door — the boundary travels with
# the file. A consumer that needs an infra service reaches it over in-cluster
# service DNS (`<svc>.fuzeinfra.svc.cluster.local`); cross-namespace networking
# needs no Argo destination. If you ever find yourself wanting `fuzeinfra` here,
# the thing you actually want is a DNS name.
#
# ── LEAST PRIVILEGE, DERIVED FROM THIS REPO'S OWN CHARTS ────────────────────
# FuzeInfra's copy ONCE carried `clusterResourceWhitelist: {group: "*", kind:
# "*"}`, which let an Application in this project create ClusterRoles,
# ClusterRoleBindings and CRDs — and, combined with the `argocd` destination
# below, modify AppProjects, including this one. The object whose sole purpose
# is to BE the security boundary could be used to rewrite that boundary.
#
# Measured instead: every `kind:` rendered by this repo's three charts
# (deploy/helm/fuzefront, deploy/helm/unleash,
# FuzeQuality/deploy/helm/fuzequality). As of this change, none of them renders
# a cluster-scoped resource other than the Namespace Argo itself creates
# (CreateNamespace=true) — the workload-authenticator ClusterRole/
# ClusterRoleBinding that used to be the other two entries here is now owned by
# FuzeInfra (FuzeInfra#1306 adoption) and `securityService.workloadIdentity.
# clusterRbac.enabled` defaults to `false` (`deploy/helm/fuzefront/values.yaml`)
# so this chart never renders it again. Namespace is the complete cluster-scoped
# allow-list. Re-derive it if a chart starts rendering something new — do not
# widen it back to a wildcard, and do not re-add ClusterRole/ClusterRoleBinding
# without first checking whether FuzeInfra's adoption already covers the need
# (docs/planning/workload-identity-layering.md).
#
# THIS IS NO LONGER A HAND-MAINTAINED CLAIM. `deploy/scripts/
# check-cluster-scoped-whitelist.sh`, run per values overlay by
# helm-validate.yml, parses the list BELOW out of this very file and asserts it
# both ways against the rendered charts: nothing cluster-scoped renders that is
# not listed here (the 2026-09-28 freeze), and nothing is listed here that no
# template renders (so a grant cannot outlive the template that justified it).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzefront
  namespace: argocd
spec:
  description: FuzeFront products (consumers of FuzeInfra) — may deploy ONLY into their assigned namespaces.
  sourceRepos:
    - https://github.com/izzywdev/FuzeFront.git
  destinations:
    # The product's workloads.
    - namespace: fuzefront
      server: https://kubernetes.default.svc
    # FuzeQuality is maintained in this repository but has an isolated workload
    # namespace and consumes shared infrastructure over service DNS.
    - namespace: fuzequality
      server: https://kubernetes.default.svc
    # JUSTIFIED, and only because this repo genuinely has an app-of-apps:
    # deploy/argocd/app-of-apps.yaml is an Application whose destination
    # namespace is `argocd` and which creates the child Applications under
    # deploy/argocd/applications/. A repo WITHOUT an app-of-apps must not list
    # this — it is write access to the namespace where AppProjects live.
    - namespace: argocd
      server: https://kubernetes.default.svc
    # NOTE: `fuzeinfra` is deliberately absent. See the rule above.
  clusterResourceWhitelist:
    # Narrowed from `*/*` to the exact cluster-scoped resources this repo's
    # charts need — which, as of issue #1137 / FuzeInfra#1306+#1308, is just the
    # Namespace Argo itself creates via CreateNamespace=true. See the header.
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    # Unrestricted is fine here — it is already scoped to the destinations above.
    - group: '*'
      kind: '*'
