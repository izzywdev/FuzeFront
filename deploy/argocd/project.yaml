# =============================================================================
# Argo CD AppProject — fuzefront
# =============================================================================
# MOVED HERE FROM FuzeInfra (argocd/projects/fuzefront.yaml) as part of the
# family's decentralisation: a repo owns its own deploy/** — Helm, Argo
# Applications, SealedSecrets, and now its AppProject. FuzeInfra's
# `argocd-register` workflow applies this directory once (its `path` input is
# documented as holding "Argo Application/AppProject manifests" and it runs
# `kubectl apply -f "$DIR/"`), after which Argo polls and self-syncs from here.
#
# FuzeInfra's copy MUST BE DELETED. Until then both exist and registration is
# last-write-wins, so whichever ran most recently is what the cluster holds.
# Ownership was settled by owner ruling FuzeInfra#639, which REVERSED the
# ownership half of FuzeInfra#625: consumers own their AppProject, and
# `argocd-register.yml` no longer skips `kind: AppProject` from a consumer path.
# (#625's other outcome — the fleet-wide permission narrowing in #629 — stands.)
# The deletion is step 4 of #639's own sequencing and has not happened yet.
#
# THIS IS NOT COSMETIC DEBT — IT IS AN ARMED RE-FREEZE (measured 2026-10-04):
# FuzeInfra's copy still carries `clusterResourceWhitelist: [Namespace]` only,
# and its `deploy-prod.yml` re-applies `argocd/projects/*.yaml` on any push
# touching that directory. Nothing reconciles the AppProject continuously — the
# app-of-apps watches `deploy/argocd/applications`, not `deploy/argocd` — so the
# next such FuzeInfra push silently replaces this file's whitelist with the
# narrow one. The chart renders a ClusterRole; Argo then invalidates the sync
# task and ABORTS THE WHOLE SYNC rather than skipping that one resource, and
# every FuzeFront deploy stops dead. That is the 2026-09-28 incident verbatim.
# Delegated to FuzeInfra (this repo must never edit it). Analysis and the target
# architecture that removes the ClusterRole entirely:
# docs/planning/workload-identity-layering.md.
#
# ── THE ONE RULE THAT IS NOT NEGOTIABLE ─────────────────────────────────────
# `fuzeinfra` IS DELIBERATELY NOT A DESTINATION, and this is the whole reason
# the project was centralised in the first place. FuzeFront previously
# self-created a `fuzefront` project that granted itself the `fuzeinfra`
# namespace, and used it to redeploy a DUPLICATE FuzeInfra: split-brain
# Postgres/Kafka, control-plane saturation, cluster-wide 502
# (FuzeFront#95 / FuzeInfra#93, boundary added in FuzeInfra#99).
#
# Owning this file again does not re-open that door — the boundary travels with
# the file. A consumer that needs an infra service reaches it over in-cluster
# service DNS (`<svc>.fuzeinfra.svc.cluster.local`); cross-namespace networking
# needs no Argo destination. If you ever find yourself wanting `fuzeinfra` here,
# the thing you actually want is a DNS name.
#
# ── LEAST PRIVILEGE, DERIVED FROM THIS REPO'S OWN CHARTS ────────────────────
# FuzeInfra's copy carried `clusterResourceWhitelist: {group: "*", kind: "*"}`,
# which let an Application in this project create ClusterRoles,
# ClusterRoleBindings and CRDs — and, combined with the `argocd` destination
# below, modify AppProjects, including this one. The object whose sole purpose
# is to BE the security boundary could be used to rewrite that boundary.
#
# Measured instead: every `kind:` rendered by this repo's three charts
# (deploy/helm/fuzefront, deploy/helm/unleash,
# FuzeQuality/deploy/helm/fuzequality). The chart also renders the
# workload-authenticator ClusterRole and ClusterRoleBinding so the security
# service can validate Kubernetes service-account identities. Those exact RBAC
# kinds and Namespace are the complete cluster-scoped allow-list. Re-derive it if
# a chart starts rendering something new — do not widen it back to a wildcard.
#
# THIS IS NO LONGER A HAND-MAINTAINED CLAIM. `deploy/scripts/
# check-cluster-scoped-whitelist.sh`, run per values overlay by
# helm-validate.yml, parses the list BELOW out of this very file and asserts it
# both ways against the rendered charts: nothing cluster-scoped renders that is
# not listed here (the 2026-09-28 freeze), and nothing is listed here that no
# template renders (so a grant cannot outlive the template that justified it).
#
# THE TWO RBAC ENTRIES BELOW ARE TEMPORARY, AND ONLY ONE OF THEM IS IRREDUCIBLE.
# `tokenreviews: create` genuinely requires a ClusterRole — TokenReview is a
# non-namespaced virtual resource with no namespaced form. But a consumer holding
# it means this product's ServiceAccount can verify ANY ServiceAccount token in
# the cluster: FuzeFront's security service is acting as an identity provider for
# the cluster, which is a PLATFORM role, not an application role. The AppProject
# blocked it correctly; the mistake is the location of the function. The target
# is a FuzeInfra-owned identity broker on
# workload-identity.fuzeinfra.svc.cluster.local, after which these two entries
# are deleted and this list returns to Namespace-only, permanently. Retirement is
# a PAIRED change — set securityService.workloadIdentity.clusterRbac.enabled to
# false AND delete these two entries in the same PR; the guard above fails if you
# do only one. See docs/planning/workload-identity-layering.md.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzefront
  namespace: argocd
spec:
  description: FuzeFront products (consumers of FuzeInfra) — may deploy ONLY into their assigned namespaces.
  sourceRepos:
    - https://github.com/izzywdev/FuzeFront.git
  destinations:
    # The product's workloads.
    - namespace: fuzefront
      server: https://kubernetes.default.svc
    # FuzeQuality is maintained in this repository but has an isolated workload
    # namespace and consumes shared infrastructure over service DNS.
    - namespace: fuzequality
      server: https://kubernetes.default.svc
    # JUSTIFIED, and only because this repo genuinely has an app-of-apps:
    # deploy/argocd/app-of-apps.yaml is an Application whose destination
    # namespace is `argocd` and which creates the child Applications under
    # deploy/argocd/applications/. A repo WITHOUT an app-of-apps must not list
    # this — it is write access to the namespace where AppProjects live.
    - namespace: argocd
      server: https://kubernetes.default.svc
    # NOTE: `fuzeinfra` is deliberately absent. See the rule above.
  clusterResourceWhitelist:
    # Narrowed from `*/*` to the exact cluster-scoped resources rendered by
    # this repo's charts.
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    # Unrestricted is fine here — it is already scoped to the destinations above.
    - group: '*'
      kind: '*'
