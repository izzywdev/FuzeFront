# Root "app of apps": apply this once after bootstrap and Argo manages the rest.
#   kubectl apply -f deploy/argocd/app-of-apps.yaml
# NOTE: the `fuzefront` AppProject now lives in THIS repo, at
# deploy/argocd/project.yaml — decentralised from FuzeInfra along with the rest
# of the family. FuzeInfra's copy (argocd/projects/fuzefront.yaml) is pending
# deletion, tracked in FuzeInfra#625; until that lands both exist and
# registration is last-write-wins.
#
# This header previously said the opposite — "owned & provisioned by FuzeInfra
# (FuzeInfra#99). Do NOT apply a fuzefront AppProject from this repo" — which
# now reads as an instruction to refuse to apply, or to delete, the very file
# that carries the isolation boundary. What FuzeInfra#99 established is the
# RULE, not the file's location: `fuzeinfra` is never a destination for a
# consumer project. That rule travels with deploy/argocd/project.yaml and is
# restated at length in its header. Issue #502 was a stale, WIDER copy being
# re-applied.
#
# CORRECTED 2026-10-04 — this previously read "the in-repo copy is strictly
# narrower than FuzeInfra's (clusterResourceWhitelist is Namespace-only instead
# of `*/*`), so applying it cannot re-widen anything." That is NO LONGER TRUE and
# must not be relied on. PR #1198 widened THIS copy to permit ClusterRole and
# ClusterRoleBinding, while FuzeInfra's copy was narrowed to Namespace-only by
# FuzeInfra#629. On cluster-scoped resources the in-repo copy is now the WIDER of
# the two, and the direction of the last-write-wins race therefore matters:
#
#   * This copy (ClusterRole-permitting) is applied by FuzeInfra's
#     `argocd-register.yml` over `deploy/argocd/`, per owner ruling FuzeInfra#639.
#   * FuzeInfra's copy (Namespace-only) is applied by its `deploy-prod.yml` on any
#     push touching `argocd/projects/**` — last such push 2026-08-23.
#   * Nothing reconciles the AppProject continuously: the Application below
#     watches `deploy/argocd/applications`, NOT `deploy/argocd`, so project.yaml
#     is not self-healed by Argo. Only whichever imperative `kubectl apply` ran
#     most recently is in effect.
#
# So the next FuzeInfra push touching `argocd/projects/**` re-applies the
# Namespace-only copy and RE-FREEZES this entire Application — the chart renders
# a ClusterRole, Argo invalidates the sync task, and Argo aborts the whole sync
# operation rather than skipping one resource. That is the 2026-09-28 incident
# verbatim. Deleting FuzeInfra's duplicate (FuzeInfra#639 step 4) is the real fix
# and cannot be done from this repo; it is delegated. Analysis:
# docs/planning/workload-identity-layering.md.
#
# `project: fuzefront` below — and on every Application under
# deploy/argocd/applications/ — is what makes that AppProject enforce anything
# at all. An Application left on `project: default` resolves against the
# permissive cluster-wide project and never consults the narrow one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fuzefront-apps
  namespace: argocd
spec:
  project: fuzefront
  source:
    repoURL: https://github.com/izzywdev/FuzeFront.git
    targetRevision: master
    path: deploy/argocd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
