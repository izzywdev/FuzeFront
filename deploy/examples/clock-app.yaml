# Example on-the-fly microfrontend deployed independently of the host.
# It shares NOTHING with FuzeFront at build time — it is reached by the browser
# at its own ingress host and registered into the hub by configuration.
#
#   kubectl apply -f deploy/examples/clock-app.yaml
#   # add to hosts:  127.0.0.1 clock.dev.local
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clock-app
  namespace: fuzefront
  labels:
    app: clock-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clock-app
  template:
    metadata:
      labels:
        app: clock-app
    spec:
      # Hardening (semgrep yaml.kubernetes.security.run-as-non-root /
      # allow-privilege-escalation-no-securitycontext).
      #
      # `runAsNonRoot: true` on its own would make the kubelet REFUSE this pod:
      # clock-app/Dockerfile's final stage is nginx:alpine with no USER, so the
      # image declares root and the check fails before the container starts.
      # 101:101 is the `nginx` user/group that ships in the nginx:alpine base.
      # Running unprivileged is safe for this image specifically because
      # clock-app/nginx.conf listens on 8080 (not a privileged port) and sets
      # `pid /tmp/nginx.pid` (not /var/run), and the container only serves
      # static files, so it never writes to /var/cache/nginx.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clock-app
          image: fuzefront/clock-app:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clock-app
  namespace: fuzefront
  labels:
    app: clock-app
spec:
  selector:
    app: clock-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clock-app
  namespace: fuzefront
  annotations:
    # Trusted local TLS so the federated remote loads over https without a
    # mixed-content block (FuzeFront is served over https).
    cert-manager.io/cluster-issuer: fuzefront-local-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - clock.dev.local
      secretName: clock-dev-local-tls
  rules:
    - host: clock.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clock-app
                port:
                  number: 8080
