# =============================================================================
# Production overlay (Contabo k3s), consumed by the Argo CD `fuzefront` Application.
# Differs from local by: GHCR images, public host + TLS, sealed secret, prod
# Authentik OIDC, Prometheus metrics, pre-created Kafka topics, and node-2
# placement for heavy stateless services.
#
# Node topology (see docs/deployment/CONTABO_DEPLOYMENT.md):
#   node-1 (kubernetes.io/hostname=fuzefront-node-1): control-plane + stateful
#           (FuzeInfra Postgres/Redis/Kafka/Chroma live here on local-path).
#   node-2 (kubernetes.io/hostname=fuzefront-node-2): heavy stateless compute
#           (litellm/chat/billing). Relabel/rename to match the real join.
# All secrets come from the SealedSecret `fuzefront-secrets` — never inline here.
# =============================================================================
global:
  imagePullPolicy: IfNotPresent
  # Default placement: none (let the scheduler spread app pods across both nodes).
  # Heavy stateless services pin to node-2 via their own affinity blocks below.
  scheduling:
    nodeSelector: {}
    affinity: {}
    tolerations: []

# Prometheus scrape annotations on FuzeFront pods. The FuzeInfra Prometheus
# auto-discovers pods carrying prometheus.io/scrape=true (see Phase E). The
# backend exposes /metrics via prom-client; other pods are annotated for when
# their /metrics lands.
observability:
  metrics:
    enabled: true
    path: /metrics

backend:
  image:
    repository: ghcr.io/izzywdev/fuzefront-backend
    tag: 0eb0b6a451ea
  replicas: 2
  # Serves GET /api/flags for the host shell. Same CLIENT token as the
  # applications-service, read from the Unleash chart's own sealed Secret.
  featureFlags:
    unleashUrl: "http://fuzefront-unleash.fuzefront.svc.cluster.local:4242/api"
    appName: "fuzefront-host"
    tokenSecretName: "unleash-secrets"
    tokenSecretKey: "UNLEASH_CLIENT_TOKEN"

frontend:
  image:
    repository: ghcr.io/izzywdev/fuzefront-frontend
    tag: 0eb0b6a451ea
  replicas: 2

# Backend 3-way split. Images built by release.yml; `enabled` flips to true in
# the Phase 3 cutover. tag "" is rewritten by CI's release sed.
securityService:
  enabled: true   # serves /api/auth (local auth + seeded users); OIDC falls back to local
  # Synthetic account for post-prod e2e smoke (POST_PROD_EMAIL/POST_PROD_PASSWORD).
  # Fresh address (absent in prod) so the idempotent seed-admin hook does a clean
  # insert with the sealed FUZEFRONT_ADMIN_PASSWORD. See PR #213 (password reseal).
  adminEmail: admin@fuzefront.com
  # Signup email verification (PR #275) — OFF until the sender is proven.
  # While false the code auto-verifies every new account, i.e. verification is not
  # enforced. That remains the SAFE state until a real SMTP sender is proven
  # end-to-end: email-service is enabled and healthy, but with no SMTP host it
  # falls back in-code to localhost:1025 and silently drops every message.
  #
  # This is no longer guarded by prose alone: the chart FAILS TO RENDER if this is
  # true while emailService.email.smtp.host is empty, because flipping it without a
  # deliverable sender locks out EVERY new signup (created unverified, never
  # mailed). Go-live sequence — deploy/contabo/SEAL_PROD_SECRETS.md:
  #   1. owner seals SMTP_USER + SMTP_PASS
  #   2. set emailService.email.smtp.host below (GitOps)
  #   3. PROVE a real message reaches a real inbox  ← password reset revives here
  #   4. only then flip this to true, in a deploy window
  requireEmailVerification: false
  image:
    repository: ghcr.io/izzywdev/fuzefront-security-service
    tag: 0eb0b6a451ea
  # TEMPORARY MITIGATION: 1 replica.
  # The OIDC social-login state (PKCE verifier) lives in a PROCESS-LOCAL Map —
  # AuthentikIdentityProvider.socialStates / mfaChallenges. With 2 replicas and no
  # session affinity, /social/google/start stores state on pod A while the
  # /api/auth/oidc/callback lands on pod B, which has no idea what that state is —
  # observed live: start on ...66gfh, callback on ...pvhm2 -> authentication_failed.
  # Roughly half of all sign-ins failed this way, independent of every other fix.
  # Same flaw affects MFA challenges and broker codes (so 2FA breaks identically).
  # Pinning to 1 replica removes the split; it costs HA for the auth path, so this
  # is a stopgap. PROPER FIX: externalize that state to Redis (FuzeInfra provisions
  # it — delegate the DB/credentials request via @claude), then restore replicas: 2.
  replicas: 1
  # Server-brokered Google sign-in (PR #329). "true" = enabled — owner has
  # registered this callback in the Google console. Instant rollback: set to
  # "false" to revert to the legacy Authentik Google source flow (no rebuild).
  googleBrokered: "true"
  # Prod browser-facing Google callback URL (app host, not auth-dev).
  googleRedirectUri: "https://app.fuzefront.com/api/v1/security/social/google/callback"
  # @fuzefront/feature-flags (OpenFeature + Unleash) client — gates
  # fuzefront.identity.root-membership (FF-EPIC-17-S1/S2, default OFF in
  # Unleash) via utils/feature-flags.ts (init) + utils/rootMembershipFlag.ts
  # (read). Same token the standalone Unleash chart already seals into
  # `unleash-secrets` (key UNLEASH_CLIENT_TOKEN) — reused rather than
  # duplicated, mirroring applicationsService/backend above. It is a CLIENT
  # token: server-side only, never exposed to a browser.
  featureFlags:
    unleashUrl: "http://fuzefront-unleash.fuzefront.svc.cluster.local:4242/api"
    appName: "security-service"
    tokenSecretName: "unleash-secrets"
    tokenSecretKey: "UNLEASH_CLIENT_TOKEN"
  # Ingress NetworkPolicy allowing mendys-prod's datasets-service to reach
  # fuzefront-security in-cluster (FuzeFront#493 / FuzeInfra#339). Base
  # values.yaml default is OFF; enabling here is the deliberate deploy-window
  # step called out in FuzeInfra#501's fix — the policy was never actually
  # applied while Argo was stuck on the authentik-server-ingress port:0 bug.
  #
  # DEPLOY-WINDOW VERIFY after this syncs: from a mendys-prod pod,
  #   curl -sv --max-time 5 http://fuzefront-security.fuzefront.svc.cluster.local:3002/api/v1/security/session
  # should reach the service (not time out / connection-refused), and confirm
  # the existing Traefik + intra-fuzefront paths to fuzefront-security still work.
  networkPolicy:
    enabled: true

applicationsService:
  enabled: true   # serves /api/apps (MF app registry) — needed for MF apps to load
  image:
    repository: ghcr.io/izzywdev/fuzefront-applications-service
    tag: 0eb0b6a451ea
  replicas: 2
  # app.* registry events → FuzeInfra Kafka (cross-namespace DNS).
  kafka:
    brokers: "fuzeinfra-kafka.fuzeinfra.svc.cluster.local:9092"
  # Live flag platform. The token is the one the standalone Unleash chart already
  # seals into `unleash-secrets` (key UNLEASH_CLIENT_TOKEN) — reused rather than
  # duplicated, so no re-sealing is needed. It is a CLIENT token: server-side
  # only, never exposed to a browser.
  featureFlags:
    unleashUrl: "http://fuzefront-unleash.fuzefront.svc.cluster.local:4242/api"
    appName: "applications-service"
    tokenSecretName: "unleash-secrets"
    tokenSecretKey: "UNLEASH_CLIENT_TOKEN"

# ---- MCP SSE gateway: ON ---------------------------------------------------
# FuzeFront's own MCP pod, running the shared @fuzefront/mcp-gateway image this
# repo publishes, over the app-registry contract served by applicationsService
# above. ClusterIP only — deliberately NOT exposed through the ingress: the
# gateway forwards the caller's identity to the app-registry API and has no
# authentication of its own, so publishing it to the internet would put an
# unauthenticated front door on a tool surface that includes deleteApp.
# Reaching it from outside the cluster is a separate decision that needs an
# authenticating proxy.
#
# The tag is PINNED to a published :sha, verified present in GHCR
# (ghcr.io/izzywdev/fuze-mcp-gateway:12cb4f787248 →
# sha256:442078552b16112f007323085a28bdc17c1eb67b0c7eec37cd670f094352c3de),
# built by mcp-gateway-image.yml run 31411682066. NOT `latest`: the component
# that decides whether a tool is advertised as a safe read or an irreversible
# write must not roll forward silently.
#
# It happens to be the same SHA as applicationsService above because master
# commit 12cb4f78 triggered both release.yml and mcp-gateway-image.yml — the
# gateway and the API it fronts are from one commit. That is a coincidence of
# this release, not an invariant; the two tags move independently.
mcp:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/izzywdev/fuze-mcp-gateway
    tag: "12cb4f787248"
    pullPolicy: IfNotPresent

# Clock-app built-in MF remote. Served same-origin at app.fuzefront.com/apps/clock/
# (matches the seeded built-in manifest remoteEntry). Image built by release.yml
# (matrix add pending — deploy/PENDING-WORKFLOW-CHANGES.md); tag "" is rewritten
# by CI's release sed to the built SHA.
clockApp:
  enabled: true
  image:
    repository: ghcr.io/izzywdev/fuzefront-clock-app
    tag: 0eb0b6a451ea

# email-service — transactional sender behind the signup email-verification flow
# (PR #275). Its image IS built by release.yml on every release, but until this PR
# its repository was missing from the bump step's anchor list, so the tag below sat
# frozen at a stale SHA while the built image moved on. The anchor is now present,
# so the next release rewrites this tag automatically — do not hand-pin it.
emailService:
  enabled: true
  image:
    repository: ghcr.io/izzywdev/fuzefront-email-service
    tag: 0eb0b6a451ea
  email:
    provider: "smtp"
    from: "noreply@fuzefront.com"
    smtp:
      # EMPTY = the service falls back in-code to localhost:1025 and SILENTLY
      # DROPS every message. That fallback is why signup email-verification and
      # password reset have both been live-dead in prod: pod healthy, /health
      # green, zero delivery.
      #
      # Real relay = ZeptoMail. This host is SET, which mounts SMTP_USER/SMTP_PASS
      # as HARD secretKeyRefs on this path — so those two keys MUST be sealed into
      # fuzefront-secrets or the pod wedges in CreateContainerConfigError (loud)
      # instead of dropping mail at runtime (silent). That trade is deliberate.
      # (Setting this host before the keys were sealed is exactly what wedged the
      # rollout in issue #500.) See deploy/contabo/SEAL_PROD_SECRETS.md.
      host: "smtp.zeptomail.com"
      port: 587
      secure: false   # STARTTLS on 587; true for implicit TLS on 465

# sms-service — Twilio Verify dispatcher behind phone 2FA (SMS/voice, PR #274).
# Its image is built by release.yml, but its repository was likewise absent from
# the bump anchor list, so this tag stayed "" — an EMPTY TAG, meaning the service
# was never actually deployed in prod even though the security routes answered.
# The anchor now exists, so the next release writes the real SHA here.
#
# STILL DISABLED, deliberately. Enabling it now would CrashLoop the pod: the
# container requires SMS_AUTH_SECRET (a hard secretKeyRef, no `optional`) and the
# Twilio API-key credentials, not all of which exist in the fuzefront-secrets
# SealedSecret yet (verified against deploy/contabo/sealed/fuzefront-secrets.yaml).
# Auth uses a Twilio API Key (SK… SID + secret), NOT the account Auth Token —
# see services/sms-service/src/twilio-client.ts.
# GO-LIVE for phone 2FA is exactly two steps, in this order:
#   1. Owner seals the keys listed in deploy/contabo/SEAL_PROD_SECRETS.md
#      (TWILIO_ACCOUNT_SID, TWILIO_API_KEY_SID, TWILIO_API_KEY_SECRET,
#       TWILIO_VERIFY_SERVICE_SID, SMS_AUTH_SECRET) into fuzefront-secrets.
#      (SMS_AUTH_SECRET + TWILIO_ACCOUNT_SID were sealed in PR #578.)
#   2. Flip `enabled` to true here via GitOps in a deploy window.
# Until step 1 lands this MUST stay false — the empty tag hid a missing-secret
# failure that would otherwise surface as a CrashLoopBackOff on the umbrella sync.
smsService:
  enabled: false
  image:
    repository: ghcr.io/izzywdev/fuzefront-sms-service
    tag: 0eb0b6a451ea

# IMPORTANT: Before setting provisioningService.enabled: true in production, ensure
# the SealedSecret `fuzefront-secrets` contains the key INTERNAL_PROVISION_SECRET.
# Without it the provisioning-service pod will fail to start (missing env var).
# provisioning-service — image IS built by release.yml, but until this change it
# had no anchor in that workflow's bump step, so the tag below was never written
# and stayed "". It is enabled: false (inherited from values.yaml), so nothing
# rendered and the empty tag was inert rather than an InvalidImageName. The
# anchor exists now, so the next release writes a real SHA here.
provisioningService:
  # ENABLED. Preconditions are met: INTERNAL_PROVISION_SECRET is already sealed
  # into fuzefront-secrets (verified in deploy/contabo/sealed/fuzefront-secrets.yaml),
  # which is this service's ONLY hard secretKeyRef. It is a thin Kafka->HTTP bridge
  # (consumes identity.user.created -> security-service POST /internal/provision):
  # no database, no migrations, no ingress. The image is built + tag-bumped by
  # release.yml (anchor present), so nothing else gates it.
  enabled: true
  image:
    repository: ghcr.io/izzywdev/fuzefront-provisioning-service
    tag: 0eb0b6a451ea

# Billing-service (Stripe). Synced by the UMBRELLA `fuzefront` Argo Application
# (gated by billingService.enabled), NOT a separate Application: billing's
# templates live in this umbrella chart, so a second Argo app on the same chart
# path would DOUBLE-CLAIM the billing Deployment (that is exactly why the prior
# deploy/argocd/applications/billing.yaml was removed). A dedicated Argo app is
# only correct once billing is extracted into its own chart (tracked follow-up).
# Isolation that the hybrid model wants is still satisfied: billing has its OWN
# per-service `billing-secrets` SealedSecret + its own billing_svc DB role, so a
# pending/crashing billing pod CANNOT take down other services or read their
# secrets. Billing serves only once `billing-secrets` holds STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, BILLING_INTERNAL_TOKEN, BILLING_DB_PASSWORD (seal real
# values with deploy/scripts/seal-secret.sh; placeholders are committed in
# deploy/contabo/sealed/billing-secrets.yaml). The billing_svc role + `billing`
# schema are provisioned by the pre-install billing-db-bootstrap Job. NEVER
# hand-deploy — flip via GitOps.
billingService:
  # First-light: DISABLED. While false, NEITHER the billing Deployment NOR the
  # pre-install billing-db-bootstrap hook render — so billing has ZERO freeze
  # surface on the umbrella sync (no InvalidImageName, no PreSync-hook gate).
  # Billing is a backend microservice, not part of the MF platform shell, and the
  # host backend's billing proxy degrades gracefully without it — so it must not
  # gate go-live. GO-LIVE = flip this to true AND seal the real STRIPE_* keys.
  #
  # The claim that once stood here — "the image tag below is already auto-bumped
  # to the built SHA by release.yml" — was FALSE for the life of this file. The
  # image was built on every release, but billing-service had no anchor in that
  # workflow's bump step, so this tag never moved: it sat at 6135e6b5ed77
  # (2026-06-30, 142 commits behind) while enabled: true, i.e. prod ran a
  # month-old billing image. The anchor exists as of this change, so the next
  # release DOES rewrite this tag — do not hand-pin it.
  enabled: true
  image:
    repository: ghcr.io/izzywdev/fuzefront-billing-service
    tag: 0eb0b6a451ea
  # Enable the checkout payment path for the Mendys datasets marketplace:
  # product-key allowlist + currency/amount bounds (BILLING_PRODUCT_KEYS,
  # BILLING_PAYMENT_CURRENCIES, BILLING_PAYMENT_MAX_TOTAL_CENTS).
  payment:
    productKeys: "mendys-datasets"
    currencies: "usd,eur"
    maxTotalCents: "5000000"
  # Steer onto node-2 (keep LLM/chat/billing load off the DB-heavy node-1).
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["fuzefront-node-2"]

# payment-service — vendor-neutral payment GATEWAY (SCAFFOLD; not yet the live
# money path). Synced by the UMBRELLA `fuzefront` Argo Application (gated by
# paymentService.enabled), NOT a separate Application — its templates live in this
# umbrella chart, so a second Argo app on the same chart path would DOUBLE-CLAIM
# the Deployment (same hybrid-Argo rule that keeps billing/unleash in the
# umbrella). A dedicated Argo app is only correct once payment-service is extracted
# into its own chart (tracked follow-up). Isolation the hybrid model wants is still
# satisfied: it has its OWN per-service `payment-secrets` SealedSecret.
paymentService:
  # First-light: DISABLED. While false the Deployment does NOT render, so the
  # gateway adds ZERO freeze surface to the umbrella sync (no InvalidImageName even
  # though its release image build step is still pending — see
  # deploy/PENDING-WORKFLOW-CHANGES-payment-service.md). GO-LIVE for the gateway is
  # a deliberate later step: add the release.yml build, flip this to true, seal the
  # real STRIPE_SECRET_KEY / PAYMENT_INTERNAL_TOKEN. It is a SCAFFOLD, not the
  # money path — billing-service remains the live path until the migration.
  enabled: false
  image:
    repository: ghcr.io/izzywdev/fuzefront-payment-service
    tag: 0eb0b6a451ea
  # Steer onto node-2 (keep it off the DB-heavy node-1, like billing/chat/litellm).
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["fuzefront-node-2"]

permit:
  enabled: true

# Private GHCR pull secret (sealed; see deploy/contabo/README.md).
imagePullSecrets:
  - name: ghcr-pull

fuzeinfra:
  namespace: fuzeinfra
  # Consume the AUTHORITATIVE shared platform services (fuzeinfra-prod, the
  # terraform-provisioned FuzeInfra). Names are fuzeinfra-<component> per the
  # chart's databases.yaml. FuzeFront no longer deploys its own postgres/redis
  # (see deploy/argocd/applications/fuzeinfra.yaml) — that caused a split-brain.
  postgres:
    host: fuzeinfra-postgres.fuzeinfra.svc.cluster.local
    port: 5432
  redis:
    host: fuzeinfra-redis.fuzeinfra.svc.cluster.local
    port: 6379

database:
  name: fuzefront_platform
  # Least-privilege runtime role created by the bootstrap Job (connects with
  # DB_PASSWORD from the SealedSecret).
  user: fuzefront_user
  bootstrap:
    enabled: true
    superuser:
      # FuzeInfra Postgres superuser.
      username: fuzeinfra
      # Reads DB_SUPERUSER_PASSWORD from the existing (Sealed) Secret below.
      secretName: ""
      secretKey: DB_SUPERUSER_PASSWORD

# Secrets come from a SealedSecret. With the bootstrap/runtime split it MUST now
# include both DB_PASSWORD (the fuzefront_user runtime password) and
# DB_SUPERUSER_PASSWORD (the FuzeInfra Postgres superuser password used only by
# the bootstrap Job), alongside JWT_SECRET, SESSION_SECRET, PERMIT_API_KEY.
secret:
  existingSecret: fuzefront-secrets
  # GATE ONLY — the value is never used in prod, and that is the whole point.
  # templates/chat-service.yaml wraps the LITELLM_MASTER_KEY env block in
  # `{{- if .Values.secret.litellmMasterKey }}`. Because existingSecret is set
  # above, templates/secret.yaml never renders, so this key's *value* goes
  # nowhere; the real credential is the LITELLM_MASTER_KEY entry in the sealed
  # `fuzefront-secrets`. Leave this empty and the env var is silently omitted —
  # chat-service then starts healthy with no credential and 401s every LLM call,
  # with nothing in the logs to say why.
  #
  # Gating an env block on a secret VALUE is a footgun (FuzeInfra flagged it):
  # it couples a prod code path to a field prod deliberately does not set. The
  # right fix is to gate on chatService.enabled instead — tracked separately so
  # this PR stays a config change rather than a template change.
  litellmMasterKey: "managed-by-sealed-secret"

  # GATE ONLY — same pattern as litellmMasterKey above. Because existingSecret is
  # set, templates/secret.yaml never renders and this value goes nowhere; the real
  # credential is the CONSUMER_REGISTRATION_SECRET entry in the sealed
  # `fuzefront-secrets`. What this key actually switches on is
  # templates/consumer-registration-seed-job.yaml + -rbac.yaml, both wrapped in
  # `{{- if .Values.secret.consumerRegistrationSecret }}`. Without it the seed Job
  # does not render at all, so Secret/fuzefront-registration is never published in
  # this namespace and consuming products (FuzeHub, FuzeSales, …) have nothing to
  # read, seal, and commit for their own namespace.
  #
  # The Job mounts the key from the existing sealed Secret with `optional: true`
  # and exits 0 with a diagnostic if it is absent, so rendering it before the
  # sealed key lands is safe — it just no-ops until then.
  consumerRegistrationSecret: "managed-by-sealed-secret"

# Exposure model (verified against the LIVE cluster, 2026-06-23): prod is reached
# via the Cloudflare tunnel "FuzeInfra" -> k3s Traefik (default ingress, NOT
# disabled) -> standard Ingress host-routing. Cloudflare terminates TLS at the
# edge; the cluster is HTTP-only. So: ingressClassName traefik, NO cert-manager /
# Let's Encrypt, NO in-cluster TLS.
# PUBLIC host = app.fuzefront.com (and auth.fuzefront.com). It is deliberately
# OUTSIDE the *.prod.fuzefront.com zone, because *.prod is gated by the Cloudflare
# Access app "FuzeInfra Admin Services" (admin Zero-Trust) — the public platform
# must not sit behind that. The CF tunnel ingress rule app.fuzefront.com ->
# traefik.kube-system:80 + a proxied CNAME are FuzeInfra-owned (Terraform); see
# izzywdev/FuzeInfra#43. Traefik host-matches on app.fuzefront.com, so this Ingress
# host must equal it.
ingress:
  enabled: true
  className: traefik
  host: app.fuzefront.com
  # Tenant subdomains (FF-EPIC-16) — DISABLED. Do not re-enable on Traefik
  # without the router-priority fix; see below.
  #
  # This was set to '*.fuzefront.com' in #431 and IMMEDIATELY BROKE FuzePlan:
  # plan.fuzefront.com started serving the FuzeFront shell instead of
  # fuzeplan-frontend. Two wrong assumptions compounded:
  #
  #  1. "Nothing resolves here yet." False. The wildcard proxied CNAME already
  #     existed at Cloudflare, so every *.fuzefront.com host went live the
  #     moment this rule rendered — there was no DNS gate to wait behind.
  #  2. "Exact hosts beat wildcards, order does not matter." True for the
  #     Kubernetes Ingress spec and for ingress-nginx (local), but NOT for
  #     Traefik, which is what prod runs. Traefik orders routers by RULE
  #     LENGTH, not host specificity. The generated HostRegexp rule for the
  #     wildcard is longer than Host(`plan.fuzefront.com`), so the wildcard
  #     wins and shadows every single-label host in the cluster.
  #
  # app.fuzefront.com hid the bug because it fans out to the same backends
  # either way. plan.fuzefront.com did not.
  #
  # *.prod.fuzefront.com hosts (argocd, grafana, authentik-admin, the CF Access
  # OTP wall, ...) were NEVER at risk — they carry two labels and a k8s
  # wildcard matches exactly one.
  #
  # To re-enable safely: put the wildcard rule in its OWN Ingress object
  # carrying `traefik.ingress.kubernetes.io/router.priority` set LOW, so every
  # exact-host router outranks it, and verify against plan.fuzefront.com in a
  # deploy window before trusting it.
  # Re-enablement is a DEPLOY-WINDOW decision, not a code change. The mechanism
  # is now safe (own Ingress + router.priority: 1, measured on traefik 3.6.13),
  # but flipping this puts every *.fuzefront.com host live immediately — the
  # wildcard CNAME already exists at Cloudflare. Verify plan.fuzefront.com right
  # after the sync. Priority override: ingress.wildcardPriority.
  wildcardHost: ''
  annotations: {}
  tls:
    enabled: false
    secretName: fuzefront-app-tls

# Authentik IdP — production. NO public host: Authentik is ClusterIP-only and is
# reached by the browser ONLY through the app-hosted reverse-proxy path
# app.fuzefront.com/api/auth/idp/* (templates/ingress.yaml). This is the
# provider-agnostic security boundary — the IdP host is invisible to the browser.
# `host` is retained only as an internal/legacy label (no Ingress uses it now);
# the CF-tunnel `auth.fuzefront.com` public route is being dropped by FuzeInfra.
# OIDC issuer/redirect are app.fuzefront.com-hosted so the `iss` claim is
# FuzeFront-owned. Cookie domain is the apex so the session is shared across
# *.fuzefront.com. Secrets (AUTHENTIK_SECRET_KEY/BOOTSTRAP_*/CLIENT_SECRET) come
# from the SealedSecret `fuzefront-secrets` — none are set here.
authentik:
  enabled: true
  host: auth.fuzefront.com  # internal/legacy only — no public Ingress binds this
  # Admin-only host for the Authentik UI (cluster-admin debugging + using Authentik
  # for authN outside FuzeFront). Gated at the edge by the wildcard Cloudflare
  # Access app on *.prod.fuzefront.com (email-OTP allowlist), and surfaced as an
  # App Launcher tile. Carries NO OIDC traffic — the live OIDC reverse-proxy stays
  # under app.fuzefront.com and is untouched, so sign-in cannot be affected.
  adminIngress:
    enabled: true
    host: authentik.prod.fuzefront.com
  cookieDomain: fuzefront.com
  bootstrapEmail: admin@fuzefront.com
  oidc:
    enabled: true
    # App-hosted, reverse-proxied issuer at Authentik's NATIVE root path. Authentik
    # ignores X-Forwarded-Prefix, so it advertises discovery/authorize URLs at
    # /application/o/... (using the forwarded Host app.fuzefront.com); the app
    # Ingress routes those native Authentik paths (/application,/if,/source,...)
    # straight to authentik-server (no prefix, no strip), so the browser stays on
    # app.fuzefront.com and never sees the IdP host. Callback (redirectUri) is the
    # FuzeFront security-service route, unchanged.
    issuerUrl: "https://app.fuzefront.com/application/o/fuzefront/"
    redirectUri: "https://app.fuzefront.com/api/auth/oidc/callback"
    # Dedicated sign-in flow with a COMBINED identification+password stage
    # (blueprint: authentik/blueprints/flow-authentication.yaml). The built-in
    # default-authentication-flow uses two SEPARATE stages, so server-side
    # password login pays two sequential Authentik round-trips (identify, then
    # password); this collapses them to one. Only the server-side password path
    # uses it; browser/admin/Google logins keep the built-in flow. MFA stays
    # bound (fail-closed) — see the blueprint header.
    # DEPLOY-WINDOW VERIFY after this syncs (before trusting it):
    #   - the `fuzefront-auth` flow exists + is bound (Authentik admin > Flows),
    #     and a password sign-in for a NON-MFA account still succeeds; and
    #   - a password sign-in for an MFA-enrolled account is still refused on the
    #     server path (pushed to browser SSO), i.e. MFA is not bypassed.
    authFlowSlug: "fuzefront-auth"
    # No split-DNS in prod: real public DNS + a real Let's Encrypt cert mean the
    # backend reaches Authentik over the internet without a hostAlias or a custom
    # CA. Leave these empty so backend.yaml/security.yaml skip the dev-only bits.
    backendHostAliasIP: ""
    caConfigMap: ""
  # Enable the authentik-server ingress NetworkPolicy in prod so the fuzeagent A2A
  # server can fetch JWKS/discovery in-cluster (avoids the Cloudflare-tunnel hairpin
  # that caused 17-34s timeouts). The policy is additive: it also lists Traefik
  # (kube-system) and intra-fuzefront traffic, so login and in-namespace OIDC keep
  # working once k3s flips authentik-server to policy-selected. Origin: FuzeInfra#372;
  # unblocks FuzeAgent#93's in-cluster JWKS fetch.
  #
  # DEPLOY-WINDOW VERIFY after this syncs:
  #   from a fuzeagent pod: curl -s http://authentik-server.fuzefront.svc.cluster.local:9000/-/health/live/
  #   and confirm the Authentik login UI (Traefik→authentik) still works.
  networkPolicy:
    enabled: true

# Pre-create the prod Kafka topics (FuzeInfra Kafka is enabled in the Argo
# overlay). Avoids relying on broker auto-create for the prefixed topics.
# Re-enabled once the image was switched bitnami/kafka -> apache/kafka (the
# bitnami tag was unpullable and froze the sync hook) and the broker
# (fuzeinfra-kafka.fuzeinfra.svc:9092) was verified reachable.
kafkaTopics:
  # DISABLED: this Job is a helm post-upgrade hook with
  # hook-delete-policy: before-hook-creation, so every Argo sync attempt
  # deletes and recreates it, restarting it from zero. It creates topics at
  # ~40s each against the shared Kafka, so it never finishes before the next
  # attempt wipes it — and Argo blocks the WHOLE sync on it
  # ('waiting for completion of hook batch/Job/fuzefront-kafka-topics').
  # Net effect: no chart change could deploy at all. It blocked the Authentik
  # sign-in fix (#320) from ever reaching the cluster.
  # Topics fall back to broker auto-create meanwhile. Re-enable ONLY after the
  # job is made non-blocking (drop the helm hook annotations, or bound it with
  # activeDeadlineSeconds) so a slow Kafka can never wedge deploys again.
  enabled: false

# --- Heavy stateless services → node-2 -------------------------------------
# These are forward-looking placeholders (enabled flipped by Phase F). The
# affinity steers them onto node-2 so the LLM/chat/billing load stays off the
# DB-heavy node-1. nodeSelector uses the standard hostname label; adjust the
# value to the real node name after the 2nd-node join.
# The `litellm:` block that stood here is DELETED. FuzeFront never templated it —
# there is no litellm template in deploy/helm/fuzefront/templates/ — so it
# deployed nothing and only looked like config. The gateway is FuzeInfra's
# (helm/litellm + argocd/applications/litellm.yaml, namespace fuzeinfra); we
# consume it at chatService.litellmUrl. Its node affinity pinned
# `fuzefront-node-2`, a node that does not exist in the Contabo cluster, which is
# why FuzeInfra deliberately did not carry it across when they built the chart.

chatService:
  # ENABLED. The precondition recorded here — "flipping enabled on before an LLM
  # endpoint exists gets you a running pod that fails every turn" — is now met:
  # FuzeInfra's LiteLLM gateway is live at litellm.fuzeinfra.svc.cluster.local:4000
  # and its NetworkPolicy admits the `fuzefront` namespace by name.
  #
  # KNOWN, ACCEPTED AT MERGE TIME: the gateway's Anthropic account has no credit,
  # so /chat/completions returns 400 upstream while /embeddings (OpenAI-keyed)
  # works. Chat turns will fail until that funding is resolved by FuzeInfra —
  # this is a provider billing state, not a wiring defect, and the wiring is
  # deliberately landed now so it is proven and ready. See the PR body.
  #
  # The tag: line MUST stay immediately after repository: — release.yml's GitOps
  # bump step only rewrites a tag: found on the line directly following a matched
  # repository: anchor.
  enabled: true
  image:
    repository: ghcr.io/izzywdev/fuzefront-chat-service
    tag: 0eb0b6a451ea
  # #499: dedicated database so chat's knex migration ledger never collides
  # with the backend's `fuzefront_platform` knex_migrations rows (this is the
  # fix for the fuzefront-chat-db-migrate crash-loop that stuck the umbrella
  # Argo app Degraded/OutOfSync). Same value as the values.yaml default —
  # listed explicitly here since this is the values file prod actually syncs
  # from. See values.yaml chatService.dbName for the full rationale.
  dbName: fuzefront_chat
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["fuzefront-node-2"]

notificationService:
  # ENABLED. Its two hard secretKeyRefs — DB_PASSWORD and JWT_SECRET — are already
  # sealed into fuzefront-secrets (both used by the backend), so no NEW secret is
  # required to go live. NOTIFICATION_INTERNAL_TOKEN stays UNSET and that is safe:
  # its env block is if-guarded on secret.notificationInternalToken, so the service
  # simply DISABLES the /internal/publish fan-out (the inbox + bell still work).
  # Seal that token later, in a deploy window, once a producer is ready to publish.
  enabled: true
  # Dedicated DB so notification's knex ledger can't collide with the backend's in
  # fuzefront_platform — the chat-service #499 crash-loop, pre-empted. The
  # db-bootstrap Job creates fuzefront_notification and grants the runtime role
  # (gated on notificationService.enabled), and migrate below runs the schema.
  dbName: fuzefront_notification
  migrate:
    # REQUIRED when enabled: nothing else creates the notifications tables and
    # index.ts does not self-migrate, so without this the service boots against a
    # schema-less DB and every read fails on the first SELECT. Idempotent (knex).
    enabled: true
  # The tag: line MUST stay immediately after repository: — release.yml's GitOps
  # bump step only rewrites a tag: found on the line directly following a matched
  # repository: anchor.
  image:
    repository: ghcr.io/izzywdev/fuzefront-notification-service
    tag: 0eb0b6a451ea

# Selection-list-service (S14 / FFRNT-200). Ships dark (enabled: false) until
# the SealedSecret `selection-list-secrets` is provisioned in a deploy window.
# Feature flag: fuzefront.selection-lists.service (S15). GO-LIVE steps:
