{{/*
Minimal RBAC so the ARC self-hosted runner pod can read specific secrets in
this namespace at workflow runtime without a GitHub secret and without kubectl.

prod-unleash-ops.yml reads INIT_ADMIN_API_TOKENS from `unleash-secrets`, and
prod-synthetic-admin.yml reads INTERNAL_PROVISION_SECRET from `fuzefront-secrets`
(added via unleash.ciRunner.extraSecretNames) — both via the k8s API using the
runner pod's mounted service account token. Without this Role + RoleBinding (or
with the target secret missing from resourceNames) the GET returns 403 and the
workflow fails.

The runner service account name is set by:
  unleash.ciRunner.serviceAccountName   (values.yaml, default: "arc-runner-sa")
  unleash.ciRunner.serviceAccountNamespace (default: release namespace)

serviceAccountName must be the SA the runner PODS run as — NOT the runner-set
name. FuzeInfra pins every scale set's pods to `arc-runner-sa` via
template.spec.serviceAccountName in its shared runner-scale-set-values.yaml, so
binding any other name (e.g. the old "fuzefront" default) grants the Role to a
SA no pod uses and the token read 403s (FuzeInfra#1219). If the runner is
deployed in a different namespace, override serviceAccountNamespace in
values-prod.yaml (prod: "arc-runners").
*/}}
{{- if .Values.unleash.ciRunner.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unleash-runner-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # unleash.secretName (the admin token for prod-unleash-ops.yml) plus any
    # ciRunner.extraSecretNames — e.g. fuzefront-secrets, which
    # prod-synthetic-admin.yml reads for INTERNAL_PROVISION_SECRET. Named
    # explicitly (never a blanket secrets:get) to keep the grant least-privilege.
    resourceNames:
      - {{ .Values.unleash.secretName | quote }}
      {{- range .Values.unleash.ciRunner.extraSecretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unleash-runner-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.unleash.ciRunner.serviceAccountName }}
    namespace: {{ .Values.unleash.ciRunner.serviceAccountNamespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: unleash-runner-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# Read-only diagnostic access so the in-cluster runner can explain why a workload
# is unhealthy (sl-cluster-diag.yml inspects selection-list-service). get/list on
# pods (+ logs), deployments/replicasets, jobs and events in THIS namespace only —
# no secrets, no write verbs, no cluster scope. TEMPORARY: remove together with
# sl-cluster-diag.yml once the selection-list deploy is confirmed healthy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unleash-runner-diag-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
  annotations:
    # Apply as a PreSync hook at weight -6 — BEFORE every service-db-bootstrap
    # Job (weight -4/-5). If a bootstrap PreSync is the very failure this
    # diagnostic exists to explain, a failed later-weight hook aborts the sync
    # phase, but this -6 resource has already been applied, so the runner keeps
    # its read access and the diagnostic can still run. before-hook-creation
    # (no hook-succeeded) so the Role persists after the hook phase.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unleash-runner-diag-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
  annotations:
    # Same PreSync wave as its Role (weight -6) so the binding is in place before
    # any bootstrap Job that could abort the sync phase.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ .Values.unleash.ciRunner.serviceAccountName }}
    namespace: {{ .Values.unleash.ciRunner.serviceAccountNamespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: unleash-runner-diag-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
