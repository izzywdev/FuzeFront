{{/*
Minimal RBAC for the selection-list-s2s-register Job.

The Job SA needs only create + patch on Secrets in the release namespace so it
can idempotently ensure Secret/<selectionListService.s2s.secretName> (default
selection-list-s2s). Identical in shape to billing-s2s-register-rbac.yaml, which
carries the long form of the reasoning (why `create` cannot be resourceName-
scoped, why PreSync, why a SEPARATE Secret from the sealed one). get/patch/update
are restricted to that single Secret name, so the SA cannot read or alter
selection-list-secrets, fuzefront-secrets, or anything else.
*/}}
{{- if and .Values.selectionListService.enabled .Values.selectionListService.s2s.register.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: selection-list-s2s-register
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: selection-list-s2s-register
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Kubernetes RBAC cannot restrict `create` by resourceName -- the object does
  # not exist at admission time, so there is no name to match. Allow create on
  # secrets in this namespace; the Job only ever creates the one below.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/patch/update are restricted to the single Secret this Job manages.
  # Deliberately NOT selection-list-secrets: that one is owned by the
  # sealed-secrets controller (deploy/contabo/sealed/selection-list-secrets.yaml
  # carries no `sealedsecrets.bitnami.com/patch` annotation, so the controller
  # REPLACES the Secret on every reconcile). Extra keys patched into it would survive until
  # the next reconcile and then silently vanish. A separate Secret object is the
  # only correct place for a credential this Job mints.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.selectionListService.s2s.secretName | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: selection-list-s2s-register
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: selection-list-s2s-register
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: selection-list-s2s-register
  apiGroup: rbac.authorization.k8s.io
{{- end }}
