{{- if .Values.chatService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzefront-chat-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat-service
spec:
  replicas: {{ .Values.chatService.replicas }}
  selector:
    matchLabels:
      app: fuzefront-chat-service
  template:
    metadata:
      labels:
        app: fuzefront-chat-service
        {{- include "fuzefront.labels" . | nindent 8 }}
    spec:
      containers:
        - name: chat-service
          image: "{{ .Values.chatService.image.repository }}:{{ .Values.chatService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.chatService.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.chatService.port | quote }}
            - name: LITELLM_URL
              value: {{ .Values.chatService.litellmUrl | quote }}
            - name: CHROMA_URL
              value: {{ .Values.chatService.chromaUrl | quote }}
            - name: BACKEND_URL
              value: {{ .Values.chatService.backendUrl | quote }}
            - name: PERMIT_PDP_URL
              value: {{ .Values.chatService.permitPdpUrl | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.chatService.kafka.brokers | quote }}
            - name: DB_HOST
              value: {{ .Values.fuzeinfra.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.fuzeinfra.postgres.port | quote }}
            # Dedicated DB (#499) — NOT database.name (the shared backend
            # fuzefront_platform). Provisioned by db-bootstrap-job.yaml via
            # EXTRA_DATABASES, owned by the same runtime role below.
            - name: DB_NAME
              value: {{ .Values.chatService.dbName | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: JWT_SECRET
            {{- /*
            ANTHROPIC_API_KEY / OPENAI_API_KEY are deliberately NOT mounted here.
            chat-service never calls a provider directly — src/llm/litellm.ts is
            the only LLM path and it speaks OpenAI protocol to FuzeInfra's
            gateway. Provider keys live on that gateway (sealed in
            fuzeinfra/litellm-secret), which is the entire point of running one:
            key custody, model routing and cost caps in a single place.
            The only credential this pod needs is LITELLM_MASTER_KEY, below.
            */ -}}
            {{- if .Values.secret.litellmMasterKey }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: LITELLM_MASTER_KEY
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.chatService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.chatService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.chatService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzefront-chat-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
spec:
  selector:
    app: fuzefront-chat-service
  ports:
    - port: {{ .Values.chatService.port }}
      targetPort: {{ .Values.chatService.port }}
{{- end }}
