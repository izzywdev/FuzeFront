{{- if .Values.configService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzefront-config-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-service
spec:
  replicas: {{ .Values.configService.replicas }}
  selector:
    matchLabels:
      app: fuzefront-config-service
  template:
    metadata:
      labels:
        app: fuzefront-config-service
        {{- include "fuzefront.labels" . | nindent 8 }}
    spec:
      {{- include "fuzefront.scheduling" (dict "svc" .Values.configService "root" .) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-service
          image: "{{ .Values.configService.image.repository }}:{{ .Values.configService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.configService.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.configService.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: config-service-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: config-service-secrets
                  key: JWT_SECRET
            - name: SECURITY_SERVICE_URL
              # fuzefront-security is the in-cluster Service name for security-service
              # (port 3002). See templates/security.yaml and
              # services/provisioning-service.yaml, which uses the same convention.
              # config-service's authorization is routed through this Service
              # (src/middleware/authz.ts) instead of an embedded Permit.io SDK.
              value: "http://fuzefront-security:{{ .Values.securityService.port }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.configService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.configService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.configService.resources | nindent 12 }}
{{- end }}
