{{- if .Values.permit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: fuzefront-permit-schema-sync
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: permit-schema-sync
  annotations:
    # Apply the authz schema to the Permit cloud control plane after the app is
    # installed/upgraded. Idempotent (get-or-create|update), safe to re-run.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fuzefront
        app.kubernetes.io/component: permit-schema-sync
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: permit-schema-sync
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["node", "dist/permit/sync-permit-schema.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: PERMIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: PERMIT_API_KEY
            # Schema sync targets the Permit cloud API, not the PDP, but the
            # config module requires the var to be present at import.
            - name: PERMIT_PDP_URL
              value: "http://fuzefront-permit-pdp:7000"
            # DATABASE ACCESS IS NOT OPTIONAL FOR THIS JOB.
            #
            # The sync reads every product's self-registered AuthZ policy from
            # `apps.policy` in the platform DB — that registry read IS the whole
            # mechanism by which a product's roles reach Permit without the product
            # knowing Permit exists. Without these vars the job fell back to SQLite
            # (NODE_ENV=production + USE_POSTGRES unset), found no `apps` table, hit
            # the fail-soft catch, and pushed the BASE SCHEMA ONLY — then exited 0.
            # Every self-registered product silently ended up with no roles, and the
            # deploy looked green. The job now also exits non-zero if this read
            # fails, so the misconfiguration cannot come back quietly.
            - name: USE_POSTGRES
              value: "true"
            - name: DB_HOST
              value: {{ .Values.fuzeinfra.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.fuzeinfra.postgres.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: DB_PASSWORD
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 250m, memory: 256Mi }
{{- end }}
