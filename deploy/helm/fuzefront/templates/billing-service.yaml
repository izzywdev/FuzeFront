{{- if .Values.billingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzefront-billing-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing-service
spec:
  replicas: {{ .Values.billingService.replicas }}
  selector:
    matchLabels:
      app: fuzefront-billing-service
  template:
    metadata:
      labels:
        app: fuzefront-billing-service
        {{- include "fuzefront.labels" . | nindent 8 }}
      annotations:
        {{- include "fuzefront.metricsAnnotations" (dict "port" .Values.billingService.port "root" .) | nindent 8 }}
    spec:
      {{- include "fuzefront.scheduling" (dict "svc" .Values.billingService "root" .) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: billing-service
          image: "{{ .Values.billingService.image.repository }}:{{ .Values.billingService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.billingService.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.billingService.port | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.billingService.kafka.brokers | quote }}
            - name: KAFKA_CLIENT_ID
              value: {{ .Values.billingService.kafka.clientId | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.billingService.kafka.groupId | quote }}
            - name: BILLING_METER_FLUSH_INTERVAL_SEC
              value: {{ .Values.billingService.meterFlushIntervalSec | quote }}
            # DB connection: billing-service connects with the least-privilege
            # billing_svc role (granted on schema `billing` + read on public).
            # DB_PASSWORD comes from the chart Secret; assembled into DATABASE_URL.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingService.secretName | default "billing-secrets" }}
                  key: BILLING_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.billingService.dbUser }}:$(DB_PASSWORD)@{{ .Values.fuzeinfra.postgres.host }}:{{ .Values.fuzeinfra.postgres.port }}/{{ .Values.database.name }}"
            # Always rendered when billing is enabled — the per-service billing-secrets
            # SealedSecret provides these at runtime (the pod stays pending until the
            # keys are sealed). No Helm-values gate (values are empty under SealedSecrets).
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingService.secretName | default "billing-secrets" }}
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingService.secretName | default "billing-secrets" }}
                  key: STRIPE_WEBHOOK_SECRET
            - name: BILLING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingService.secretName | default "billing-secrets" }}
                  key: BILLING_INTERNAL_TOKEN
            # billing-service's authorization sync is routed through FuzeFront's
            # own Security API (backend/security's
            # /api/v1/security/authz/subjects/{type}/{key}/attributes, via
            # @fuzefront/auth's createAuthzClient — see src/services/authz.ts)
            # rather than an embedded Permit.io SDK. Permit is now purely an
            # implementation detail behind backend/security's
            # AuthorizationProvider seam; billing-service knows nothing about
            # it and carries no PERMIT_API_KEY/PDP URL of its own. Step 3 of 3
            # in this migration — config-service (#679) and
            # selection-list-service (#699) came first.
            - name: SECURITY_SERVICE_URL
              # fuzefront-security is the in-cluster Service name for security-service
              # (port 3002). See templates/security.yaml and
              # services/config-service-deployment.yaml /
              # services/selection-list-service-deployment.yaml, which use the
              # same convention.
              value: "http://fuzefront-security:{{ .Values.securityService.port }}"
            # billing's syncPlanToPermit() runs from Stripe WEBHOOK handlers —
            # unlike config-service/selection-list-service, there is no
            # end-user request in flight to forward a bearer token from. It
            # authenticates as a machine (client_credentials) caller instead —
            # see docs/runbooks/s2s-client-credentials.md and
            # src/services/machineToken.ts. The Security API's
            # PATCH .../attributes route requires the machine caller to hold
            # the `authz:admin` scope (gated identically to grant/revoke),
            # provisioned via
            # `register-s2s-cli.js billing-service authz:admin` (in-cluster,
            # NOT part of this chart).
            - name: AUTHENTIK_TOKEN_URL
              value: "https://{{ .Values.authentik.host }}/application/o/s2s-billing-service/token/"
            # `optional: true` DELIBERATELY, and different from every other
            # key in billing-secrets: billing is LIVE in production
            # (billingService.enabled: true) and AUTHENTIK_CLIENT_ID/SECRET do
            # not exist in the sealed billing-secrets yet (the S2S
            # application has not been provisioned in Authentik — see the
            # PR this shipped in). Without `optional: true` this Deployment
            # would go CreateContainerConfigError on its NEXT rollout the
            # moment this chart syncs, breaking the live pod over a flag that
            # defaults OFF and a code path nothing calls yet
            # (fuzefront.billing.authz-enabled). Remove `optional: true` in
            # the SAME deploy window that seals the real values and flips the
            # flag on — not before.
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingService.secretName | default "billing-secrets" }}
                  key: AUTHENTIK_CLIENT_ID
                  optional: true
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingService.secretName | default "billing-secrets" }}
                  key: AUTHENTIK_CLIENT_SECRET
                  optional: true
            # Payment-path enablement — plain config, not secrets. Fail-closed:
            # an empty/unset productKeys allowlist rejects every checkout key.
            {{- with .Values.billingService.payment }}
            {{- if .productKeys }}
            - name: BILLING_PRODUCT_KEYS
              value: {{ .productKeys | quote }}
            {{- end }}
            {{- if .currencies }}
            - name: BILLING_PAYMENT_CURRENCIES
              value: {{ .currencies | quote }}
            {{- end }}
            {{- if .maxTotalCents }}
            - name: BILLING_PAYMENT_MAX_TOTAL_CENTS
              value: {{ .maxTotalCents | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.billingService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.billingService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.billingService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzefront-billing-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
spec:
  selector:
    app: fuzefront-billing-service
  ports:
    - port: {{ .Values.billingService.port }}
      targetPort: {{ .Values.billingService.port }}
{{- end }}
