{{- if .Values.notificationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzefront-notification-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
spec:
  replicas: {{ .Values.notificationService.replicas }}
  selector:
    matchLabels:
      app: fuzefront-notification-service
  template:
    metadata:
      labels:
        app: fuzefront-notification-service
        {{- include "fuzefront.labels" . | nindent 8 }}
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.notificationService.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.notificationService.port | quote }}
            - name: DB_HOST
              value: {{ .Values.fuzeinfra.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.fuzeinfra.postgres.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: DB_PASSWORD
            # Verifies the SAME platform JWT the browser already holds. The
            # service derives the recipient from it and never from the request.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: JWT_SECRET
            {{- if .Values.secret.notificationInternalToken }}
            # Gates /internal/publish (service-to-service fan-out). When unset
            # the service DISABLES that surface entirely rather than running it
            # unauthenticated — see middleware/auth.requireInternalToken.
            - name: NOTIFICATION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzefront.secretName" . }}
                  key: NOTIFICATION_INTERNAL_TOKEN
            {{- end }}
            - name: SSE_HEARTBEAT_MS
              value: {{ .Values.notificationService.sseHeartbeatMs | quote }}
            - name: MAX_STREAMS_PER_USER
              value: {{ .Values.notificationService.maxStreamsPerUser | quote }}
            - name: RATE_LIMIT_WINDOW_MS
              value: {{ .Values.notificationService.rateLimit.windowMs | quote }}
            - name: RATE_LIMIT_MAX
              value: {{ .Values.notificationService.rateLimit.max | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzefront-notification-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
spec:
  selector:
    app: fuzefront-notification-service
  ports:
    - port: {{ .Values.notificationService.port }}
      targetPort: {{ .Values.notificationService.port }}
{{- end }}
