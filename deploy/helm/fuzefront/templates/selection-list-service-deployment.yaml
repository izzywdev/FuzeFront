{{- if .Values.selectionListService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzefront-selection-list-service
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: selection-list-service
spec:
  replicas: {{ .Values.selectionListService.replicas }}
  selector:
    matchLabels:
      app: fuzefront-selection-list-service
  template:
    metadata:
      labels:
        app: fuzefront-selection-list-service
        {{- include "fuzefront.labels" . | nindent 8 }}
      annotations:
        {{- include "fuzefront.metricsAnnotations" (dict "port" .Values.selectionListService.port "root" .) | nindent 8 }}
    spec:
      {{- include "fuzefront.scheduling" (dict "svc" .Values.selectionListService "root" .) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: selection-list-service
          image: "{{ .Values.selectionListService.image.repository }}:{{ .Values.selectionListService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.selectionListService.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.selectionListService.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: selection-list-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: selection-list-secrets
                  key: JWT_SECRET
            - name: SECURITY_SERVICE_URL
              # fuzefront-security is the in-cluster Service name for security-service
              # (port 3002). See templates/security.yaml and
              # services/provisioning-service.yaml / config-service-deployment.yaml,
              # which use the same convention. selection-list-service's
              # authorization is now routed through this Service
              # (src/middleware/authz.ts) instead of an embedded Permit.io SDK --
              # PERMIT_API_KEY/permitPdpUrl are gone; this is not a secret, it is
              # just the internal DNS name of another Service in the same
              # namespace.
              value: "http://fuzefront-security:{{ .Values.securityService.port }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.selectionListService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.selectionListService.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.selectionListService.resources | nindent 12 }}
{{- end }}
