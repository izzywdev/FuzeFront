{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuzefront.secretName" . }}
  labels:
    {{- include "fuzefront.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  SESSION_SECRET: {{ .Values.secret.sessionSecret | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  {{- if and .Values.database.bootstrap.enabled (not .Values.database.bootstrap.superuser.secretName) }}
  # Consumed only by the db-bootstrap Job (default: read the superuser password
  # from this chart Secret). Omitted when bootstrap points at an external Secret.
  DB_SUPERUSER_PASSWORD: {{ .Values.secret.dbSuperuserPassword | quote }}
  {{- end }}
  PERMIT_API_KEY: {{ .Values.secret.permitApiKey | quote }}
  {{- if .Values.secret.internalProvisionSecret }}
  # Shared secret guarding POST /internal/provision (Plan B / consumed by Plan D).
  INTERNAL_PROVISION_SECRET: {{ .Values.secret.internalProvisionSecret | quote }}
  {{- end }}
  {{- if .Values.secret.consumerRegistrationSecret }}
  # Pre-shared Bearer token accepted by POST /api/v1/app-registry/apps and
  # POST /api/v1/app-registry/apps/:slug/activate for MFE self-registration.
  # The consumer-registration-seed Job copies this value into
  # Secret/fuzefront-registration in this namespace so consumer CIs can read,
  # seal, and commit it for their own namespace. Rotation: update the sealed
  # prod secret and re-run the seed Job (or let Helm upgrade trigger it).
  CONSUMER_REGISTRATION_SECRET: {{ .Values.secret.consumerRegistrationSecret | quote }}
  {{- end }}
  # `trim` on the authentik credentials: a stray trailing newline/space here is
  # invisible but fatal — AUTHENTIK_BOOTSTRAP_TOKEN is what the embedded outpost
  # uses for its API Authorization header, and Go's HTTP client rejects a header
  # value containing a control char ("invalid header field value"). These are
  # tokens/keys that never legitimately contain whitespace, so trimming is safe.
  # (The prod path uses secret.existingSecret — keep the SealedSecret clean too;
  # seal-secret.sh now scrubs whitespace at seal time.)
  AUTHENTIK_SECRET_KEY: {{ .Values.secret.authentikSecretKey | trim | quote }}
  AUTHENTIK_BOOTSTRAP_PASSWORD: {{ .Values.secret.authentikBootstrapPassword | quote }}
  AUTHENTIK_BOOTSTRAP_TOKEN: {{ .Values.secret.authentikBootstrapToken | trim | quote }}
  {{- if .Values.secret.authentikClientId }}
  AUTHENTIK_CLIENT_ID: {{ .Values.secret.authentikClientId | trim | quote }}
  {{- end }}
  {{- if .Values.secret.authentikClientSecret }}
  AUTHENTIK_CLIENT_SECRET: {{ .Values.secret.authentikClientSecret | trim | quote }}
  {{- end }}
  {{- if .Values.secret.sendgridApiKey }}
  SENDGRID_API_KEY: {{ .Values.secret.sendgridApiKey | quote }}
  {{- end }}
  {{- if .Values.secret.twilioAccountSid }}
  TWILIO_ACCOUNT_SID: {{ .Values.secret.twilioAccountSid | quote }}
  {{- end }}
  {{- if .Values.secret.twilioAuthToken }}
  TWILIO_AUTH_TOKEN: {{ .Values.secret.twilioAuthToken | quote }}
  {{- end }}
  {{- if .Values.secret.twilioVerifyServiceSid }}
  TWILIO_VERIFY_SERVICE_SID: {{ .Values.secret.twilioVerifyServiceSid | quote }}
  {{- end }}
  {{- if .Values.secret.smsAuthSecret }}
  SMS_AUTH_SECRET: {{ .Values.secret.smsAuthSecret | quote }}
  {{- end }}
  {{- if .Values.secret.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secret.googleClientId | quote }}
  {{- end }}
  {{- if .Values.secret.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secret.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.secret.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secret.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secret.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secret.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secret.litellmMasterKey }}
  LITELLM_MASTER_KEY: {{ .Values.secret.litellmMasterKey | quote }}
  {{- end }}
  {{- if .Values.secret.notificationInternalToken }}
  # Shared service token gating notification-service's /internal/publish
  # fan-out. Never issued to a browser, and the host-backend proxy refuses to
  # forward /internal/* at all. Leaving this unset is SAFE: the service disables
  # the publish surface rather than running it unauthenticated.
  NOTIFICATION_INTERNAL_TOKEN: {{ .Values.secret.notificationInternalToken | quote }}
  {{- end }}
  {{- if .Values.secret.featureFlagsClientToken }}
  # Scoped @fuzeone/feature-flags (Unleash) client token consumed by services
  # that evaluate family flags (e.g. applications-service / app-registry). Key
  # matches applicationsService.featureFlags.tokenSecretKey. In prod this comes
  # from the SealedSecret instead (see deploy/contabo/sealed/fuzefront-secrets.yaml).
  FEATURE_FLAGS_CLIENT_TOKEN: {{ .Values.secret.featureFlagsClientToken | quote }}
  {{- end }}
  {{- if .Values.secret.mendysDatasetsClientSecret }}
  # Authentik OIDC client secret for the mendys-datasets provider blueprint.
  # Read at blueprint-apply time via !Env [AUTHENTIK_MENDYS_DATASETS_CLIENT_SECRET].
  MENDYS_DATASETS_CLIENT_SECRET: {{ .Values.secret.mendysDatasetsClientSecret | trim | quote }}
  {{- end }}
  {{- if .Values.secret.mendysPlatformClientSecret }}
  # Authentik OIDC client secret for the mendys-platform provider blueprint.
  # Read at blueprint-apply time via !Env [AUTHENTIK_MENDYS_PLATFORM_CLIENT_SECRET].
  MENDYS_PLATFORM_CLIENT_SECRET: {{ .Values.secret.mendysPlatformClientSecret | trim | quote }}
  {{- end }}
  {{- if .Values.authentikMendys.enabled }}
  # ── MendysRobotics Authentik instance (isolated identity silo) ──────────────
  # templates/authentik-mendys.yaml mounts all four of these as NON-OPTIONAL
  # secretKeyRefs. If this block is missing while authentikMendys.enabled is
  # true, both pods fail with CreateContainerConfigError — so these keys and
  # that template must be added and removed together.
  #
  # These are per-instance credentials and MUST NOT be shared with the
  # FuzeFront instance: reusing AUTHENTIK_SECRET_KEY across two instances would
  # make sessions and tokens minted by one verifiable by the other, collapsing
  # the account boundary the separate instance exists to create.
  AUTHENTIK_MENDYS_SECRET_KEY: {{ .Values.secret.authentikMendysSecretKey | trim | quote }}
  AUTHENTIK_MENDYS_BOOTSTRAP_PASSWORD: {{ .Values.secret.authentikMendysBootstrapPassword | quote }}
  AUTHENTIK_MENDYS_BOOTSTRAP_TOKEN: {{ .Values.secret.authentikMendysBootstrapToken | trim | quote }}
  # Password for the `authentik_mendys_user` Postgres role. FuzeInfra's
  # `fuzeinfra-service-db-provision` Job (values entry `authentik-mendys`)
  # (re)syncs the role to this same value, read from the
  # `authentik-mendys-db-credentials` Secret sealed for the fuzeinfra
  # namespace — the two must match or the instance cannot connect.
  AUTHENTIK_MENDYS_DB_PASSWORD: {{ .Values.secret.authentikMendysDbPassword | trim | quote }}
  {{- end }}
{{- end }}
