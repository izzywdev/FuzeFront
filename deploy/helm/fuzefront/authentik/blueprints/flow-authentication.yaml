# Authentik Blueprint — FuzeFront dedicated authentication (sign-in) flow
#
# WHY THIS EXISTS — one fewer sequential hop on server-side password sign-in.
#
# The server-brokered password login (backend/security/src/services/
# authentikPassword.ts) drives Authentik's flow-executor hop by hop, and each hop
# is a SEQUENTIAL round-trip to Authentik (~1.3s each, per that module's own
# recorded measurements). The built-in `default-authentication-flow` uses
# SEPARATE identification and password stages, so a login costs TWO flow POSTs:
# submit the email, get a password challenge, submit the password. This flow
# collapses them into ONE combined identification+password stage — the
# identification stage's `password_stage` is set, so Authentik renders and
# validates the password on the SAME step and the executor advertises
# `password_fields: true`, which authentikPassword.ts already submits inline
# (see its `if (challenge.password_fields) body.password = password`). That
# removes one whole sequential round-trip from every server-side password login.
#
# BLAST RADIUS is deliberately limited to the server-side password path.
# security-service points ONLY that path here, via AUTHENTIK_AUTH_FLOW_SLUG
# (deploy/helm/fuzefront/templates/security.yaml + authentik.oidc.authFlowSlug in
# values-prod.yaml). The browser, admin, and Google/SSO logins keep using the
# untouched built-in `default-authentication-flow`.
#
# MFA IS PRESERVED, FAIL-CLOSED — do not remove the MFA binding below.
# The authenticator-validate stage (fuzefront-mfa-validate,
# not_configured_action=skip) is bound here exactly as it is on the built-in flow
# (flow-bindings-account-security.yaml). Non-MFA users skip it during server-side
# flow planning (no extra hop). MFA-enrolled users get an
# ak-stage-authenticator-validate challenge, which authentikPassword.ts does NOT
# drive — it throws UnsupportedFlowStageError and the user is pushed to the
# browser SSO path, the SAME fail-closed behavior as the built-in flow today.
# Omitting this binding would let an MFA-enrolled user finish sign-in through the
# server path WITHOUT a second factor — a silent MFA bypass. It must stay.
#
# Depends on (references resolve post-apply, so file order does not matter):
#   - Authentik built-ins: the `default-authentication-password` password stage
#     (reused as the inline password_stage) and the `authentik-built-in` source.
#   - stages-mfa.yaml → fuzefront-mfa-validate
version: 1
metadata:
  name: FuzeFront Authentication Flow
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ── Combined identification + password stage ─────────────────────────────────
  # `password_stage` is the fuse: with it set, Authentik renders the password
  # field on the identification step and validates it via the referenced password
  # stage, so the executor returns password_fields=true and the whole credential
  # is submitted in a single POST instead of two.
  - model: authentik_stages_identification.identificationstage
    state: present
    identifiers:
      name: fuzefront-auth-identification
    attrs:
      name: fuzefront-auth-identification
      user_fields:
        - username
        - email
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      case_insensitive_matching: true
      show_source_labels: false
      show_matched_user: false
      # Local username/email + password only on this server-side path; Google/SSO
      # stays on the browser flow. The built-in source is the local directory.
      sources:
        - !Find [authentik_core.source, [slug, authentik-built-in]]

  # ── User-login stage (mints the Authentik session the OIDC authorize hop then
  #    exchanges for a code) ─────────────────────────────────────────────────────
  - model: authentik_stages_user_login.userloginstage
    state: present
    identifiers:
      name: fuzefront-auth-login
    attrs:
      name: fuzefront-auth-login
      session_duration: "seconds=0"

  # ── The flow ─────────────────────────────────────────────────────────────────
  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: fuzefront-auth
    attrs:
      name: "FuzeFront Authentication"
      slug: fuzefront-auth
      title: "Sign in to FuzeFront"
      designation: authentication
      authentication: require_unauthenticated
      layout: stacked

  # ── Bindings ─────────────────────────────────────────────────────────────────
  # 10: combined identification + password
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, fuzefront-auth]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, fuzefront-auth-identification]]
    attrs:
      order: 10
      evaluate_on_plan: true
      re_evaluate_policies: false

  # 20: enforce-if-enrolled MFA — identical semantics to the built-in flow. Keeps
  # the server path fail-closed for MFA users (see header). Skipped for non-MFA
  # users, so it adds no hop on the common path.
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, fuzefront-auth]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, fuzefront-mfa-validate]]
    attrs:
      order: 20
      evaluate_on_plan: false
      re_evaluate_policies: true

  # 30: mint the session
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, fuzefront-auth]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, fuzefront-auth-login]]
    attrs:
      order: 30
      evaluate_on_plan: true
      re_evaluate_policies: false
