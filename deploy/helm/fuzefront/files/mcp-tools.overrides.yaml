# =============================================================================
# FuzeFront — MCP tool mutation overrides for the app-registry surface.
#
# Consumed by @fuzefront/mcp-gateway. The gateway derives `mutates` from the
# HTTP method (GET/HEAD/OPTIONS = read, everything else = write; DELETE is
# assumed irreversible) and only needs this file where the method alone gets it
# WRONG, or where the reason is worth pinning so a future contract change has to
# argue with it.
#
# `reversibility` is the distinction that matters at the call site:
#   reversible   — the caller can undo the effect with another operation in this
#                  SAME API (suspend what was activated, delete what was
#                  registered, PUT the previous document back).
#   irreversible — there is NO operation in the contract that undoes it. Final
#                  from the caller's side, even if an operator could repair it
#                  out-of-band.
#
# The gateway REFUSES TO START if an entry here declares something irreversible
# while also declaring it a read, or tries to relabel a non-query-shaped write
# as a read (packages/mcp-gateway/src/classify.ts, invariants 1–3). That is
# deliberate: a mis-declared irreversible tool is only discovered after
# something unrecoverable has already happened.
#
# NOTHING HERE CHANGES A DERIVED CLASSIFICATION. Every entry restates the value
# the gateway would have derived anyway, and adds the contract citation that
# justifies it. That is the intended use of this file for an API whose methods
# already tell the truth — it documents the reasoning without moving a tool
# between the read and write halves of the surface.
# =============================================================================

tools:
  # --- IRREVERSIBLE (1) ------------------------------------------------------

  # DELETE /apps/{slug}. The contract is explicit: "Permanently removes a
  # registered app." There is no undelete operation and no soft-delete state in
  # the lifecycle (`registered → activated → suspended` — see AppManifest), so a
  # deleted app can only be recreated by re-registering it from scratch, which
  # is a different record. Built-in apps are protected by the service itself
  # (403), but every consumer-registered app is destroyable here.
  #
  # This is the default for DELETE. It is restated because this is the ONE tool
  # on this surface an agent can call that cannot be walked back, and a future
  # contract that adds a restore path should have to delete this entry
  # deliberately rather than inherit a silent downgrade.
  deleteApp:
    mutates: true
    reversibility: irreversible
    reason: >-
      Permanently removes the registered app. The contract exposes no undelete
      and no soft-delete state, so the record cannot be recovered through this
      API

  # --- EXPLICITLY REVERSIBLE (documented, not merely defaulted) --------------

  # POST /apps — undone by deleteApp above. Worth pinning because "register"
  # reads as a one-way door and is not one.
  registerApp:
    mutates: true
    reversibility: reversible
    reason: >-
      Registers an app; DELETE /apps/{slug} removes it again

  # activate/suspend are a genuine reversible PAIR, and both are idempotent per
  # the contract (activating an already-activated app is a no-op 200). Suspend
  # retains the record — it hides the app from the menu, it does not delete it.
  activateApp:
    mutates: true
    reversibility: reversible
    reason: >-
      Transitions the app to `activated`; suspendApp returns it to `suspended`.
      Idempotent
  suspendApp:
    mutates: true
    reversibility: reversible
    reason: >-
      Hides the app from the menu and retains the record; activateApp restores
      it. Idempotent

  # PUT is a full replace on both of these, so the compensating action is
  # another PUT carrying the previous document — reversible only in the sense
  # that the API accepts the old value back, which is what `reversible` means
  # here. NOTE for putAppPolicy: the contract warns that "ACCEPTANCE IS NOT
  # PROPAGATION" — a 200 means stored and validated, not yet synced to the
  # policy provider. That is a latency property, not an irreversibility one.
  updateApp:
    mutates: true
    reversibility: reversible
    reason: >-
      Full replace of the app manifest; PUT the previous document to restore it
  putAppPolicy:
    mutates: true
    reversibility: reversible
    reason: >-
      Idempotent full replace of the app's own Permit resources/actions/roles;
      PUT the previous policy to restore it
  putAppBillingProfile:
    mutates: true
    reversibility: reversible
    reason: >-
      Full replace of the app's billing profile; PUT the previous profile to
      restore it

  # POST /apps/{slug}/heartbeat only advances `lastSeenAt` and emits
  # app.heartbeat. It is a write (it changes stored state, so it must not be
  # advertised as a read), but nothing about it is destructive: the next
  # heartbeat supersedes it.
  heartbeatApp:
    mutates: true
    reversibility: reversible
    reason: >-
      Advances lastSeenAt and emits app.heartbeat; superseded by the next
      heartbeat and destroys nothing
