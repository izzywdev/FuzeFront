events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    # Upstream definitions
    upstream frontend {
        server frontend:3000;
    }
    
    upstream backend {
        server backend:3001;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost fuzefront.com www.fuzefront.com;
        
        # Health check endpoint
        location /health {
            access_log off;
            # `default_type`, not `add_header Content-Type` -- add_header would
            # emit a SECOND Content-Type alongside the one nginx derives from
            # default_type, and any add_header here would make this location
            # discard the whole inherited add_header set (see /api/ below).
            default_type text/plain;
            return 200 "healthy\n";
        }
        
        # API routes
        location /api/ {
            proxy_pass http://backend/;
            # Hardcoded literal rather than the client-supplied host
            # variable, which is taken straight from the attacker-controlled
            # Host request header -- forwarding it enables host-header
            # injection / cache poisoning. `backend` is this proxy's upstream
            # name (what nginx would send by default); the website backend
            # never reads this header for any decision.
            proxy_set_header Host backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers.
            #
            # NOTE (nginx add_header inheritance): add_header is NOT additive
            # across scopes -- a location containing ANY add_header discards
            # every add_header inherited from the enclosing server/http block.
            # There are deliberately NO add_header directives at server or http
            # scope in this file, so nothing is being discarded today: this is
            # an edge reverse proxy and BOTH upstreams supply their own
            # security headers (the frontend container sets CSP /
            # X-Frame-Options / X-Content-Type-Options / X-XSS-Protection /
            # Referrer-Policy at http scope in fuzefront-website/frontend/
            # nginx.conf; the backend sets them via helmet), and add_header
            # never strips headers that came from upstream.
            # If you ever add a security header at server or http scope here,
            # you MUST also restate the full set inside this location and
            # inside the static-asset location below, or it will be silently
            # dropped for those responses.
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        
        # Frontend application
        location / {
            proxy_pass http://frontend/;
            # Hardcoded literal upstream name -- see /api/ above.
            proxy_set_header Host frontend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle client-side routing
            try_files $uri $uri/ @fallback;
        }
        
        # Fallback for React Router
        location @fallback {
            proxy_pass http://frontend;
            # Hardcoded literal upstream name -- see /api/ above.
            proxy_set_header Host frontend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://frontend;
            # Hardcoded literal upstream name -- see /api/ above.
            proxy_set_header Host frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # HTTPS server (for production with SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name fuzefront.com www.fuzefront.com;
    #     
    #     ssl_certificate /etc/nginx/ssl/fuzefront.com.crt;
    #     ssl_certificate_key /etc/nginx/ssl/fuzefront.com.key;
    #     
    #     # SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # Include same location blocks as HTTP server
    #     include /etc/nginx/conf.d/common-locations.conf;
    # }
}