worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/nginx_access.log main;
    
    # Set cache and temp directories to /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

    # WebSocket upgrade allow list (h2c-smuggling mitigation).
    #
    # Forwarding the raw client `Upgrade` header together with a hardcoded
    # `Connection: upgrade` lets a client negotiate HTTP/2-over-cleartext (h2c)
    # straight through this reverse proxy, which bypasses every proxy-level
    # access control (rate limits, path routing) for the life of that
    # connection. These maps forward ONLY the `websocket` token; every other
    # value -- notably `h2c` -- yields an empty Upgrade/Connection pair, which
    # nginx omits, so the request stays plain HTTP/1.1.
    #
    # `map` matching is case-insensitive, so the single `websocket` key also
    # covers `WebSocket`/`WEBSOCKET` (listing those separately would be a
    # duplicate-parameter error at startup).
    map $http_upgrade $ws_upgrade {
        default     "";
        websocket   "websocket";
    }
    map $http_upgrade $ws_connection {
        default     "";
        websocket   "upgrade";
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;

    server {
        listen 3000;
        listen [::]:3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Security
        server_tokens off;

        # Rate limiting
        limit_req zone=general burst=20 nodelay;

        # Health check endpoint for nginx
        location = /health {
            access_log off;
            # `default_type`, not `add_header Content-Type`: add_header would
            # emit a SECOND Content-Type, and -- because add_header is not
            # additive across scopes -- would make this location discard every
            # security header inherited from the http block above.
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Backend health check proxy
        location = /api/health {
            limit_req zone=api burst=10 nodelay;
            
            # `backend:3001` is a HARDCODED literal (not attacker- or
            # request-influenced). The indirection through a variable is
            # REQUIRED so nginx re-resolves the service DNS name per request
            # via the `resolver` directive above, instead of caching the IP
            # once at startup and going stale when the backend restarts.
            # This is the accepted shape recorded in .semgrepignore for the
            # generic dynamic-proxy-host / missing-internal nginx rules; the
            # location is a deliberately public health path, so `internal;`
            # cannot be added without breaking it.
            set $backend "backend:3001";
            proxy_pass http://$backend/health;
            proxy_http_version 1.1;
            # Hardcoded literal rather than the client-supplied host
            # variable, which comes straight from the attacker-controlled Host
            # request header -- forwarding it enables host-header injection /
            # cache poisoning. The backend never reads this header at all.
            proxy_set_header Host backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30;
        }

        # API proxy to backend with dynamic DNS resolution
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            
            # Hardcoded literal behind a variable so nginx re-resolves the
            # service DNS per request -- see /api/health above for the full
            # rationale and the .semgrepignore reference.
            set $backend "backend:3001";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            # Allow-listed upgrade: `websocket` only, never `h2c`. See the
            # $ws_upgrade / $ws_connection maps in the http block above.
            proxy_set_header Upgrade $ws_upgrade;
            proxy_set_header Connection $ws_connection;
            # Hardcoded literal rather than the client-supplied host
            # variable -- see /api/health above.
            proxy_set_header Host backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $ws_upgrade;
            proxy_read_timeout 86400;
        }

        # Static files with caching
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;

            # nginx `add_header` is NOT additive across scopes: a location
            # containing ANY add_header discards every add_header inherited
            # from the enclosing server/http block. Because this location sets
            # Cache-Control, the http-scope security header set above has to be
            # restated here verbatim or these responses ship with no CSP, no
            # X-Frame-Options and no X-Content-Type-Options.
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;
        }

        # Main application
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;

                # nginx `add_header` is NOT additive across scopes: a location
                # containing ANY add_header discards every add_header inherited
                # from the enclosing server/http block. Because this location sets
                # Cache-Control, the http-scope security header set above has to be
                # restated here verbatim or these responses ship with no CSP, no
                # X-Frame-Options and no X-Content-Type-Options.
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;
            }
        }

        # Security - deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}