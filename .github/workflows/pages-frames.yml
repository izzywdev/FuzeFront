name: pages-frames

# Publishes design/frames/** and services/*/openapi.yaml to GitHub Pages.
# Design frames: https://izzywdev.github.io/FuzeFront/
# API docs:      https://izzywdev.github.io/FuzeFront/api/
#
# Both indexes are DERIVED — never hand-maintained lists:
#   design/frames/*/ → build-frames-site.mjs
#   services/*/openapi.yaml → build-api-docs.mjs

on:
  push:
    branches: [master]
    paths:
      - 'design/frames/**'
      - 'services/**/openapi.yaml'
      - 'scripts/build-frames-site.mjs'
      - 'scripts/build-api-docs.mjs'
      - '.github/workflows/pages-frames.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; Pages allows one at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (repo hardening standard — a mutable
      # tag can be silently repointed by the action owner; see the trivy-action /
      # kics-github-action compromises).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24.x'

      - name: Build frames site (index derived from design/frames/*/)
        run: node scripts/build-frames-site.mjs --out _site

      - name: Build API docs (Swagger UI per services/*/openapi.yaml)
        run: node scripts/build-api-docs.mjs --out _site/api

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
