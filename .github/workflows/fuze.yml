# fuze:managed template=fuze.yml baseline=v1 digest=sha256:28aa760e265c4a24f9fd4d50855efaeb0ac4c86e4a8be001a051ebbc86a39968
name: Fuze

# THE CANONICAL `@fuze` ENTRYPOINT. Every onboarded repo gets this file, and this is the
# handler a human — or an automated workflow that posts a comment — reaches by mentioning
# `@fuze` on an issue, an issue comment, a PR review or a review comment.
#
# WHY THIS EXISTS AS A CANONICAL TEMPLATE AT ALL. `@fuze` was a real, working entrypoint in
# exactly ONE repo (izzywdev/FuzeInfra) and in no other, so `@fuze` in any other repo was a
# mention nothing answered. Community issue templates already seed `@fuze — please triage.`
# (community-templates/.github/ISSUE_TEMPLATE/*.md), and the baseline documents `@fuze` as
# the delegation handle, so 21 of 22 repos were pointed at a handler they did not have.
#
# WHAT WAS **NOT** COPIED HERE, AND WHY THAT IS THE WHOLE POINT.
# FuzeInfra's version of this file is CLUSTER-CAPABLE: it mounts the prod k3s kubeconfig
# secret, installs the cluster and IaC CLIs, and runs on FuzeInfra's in-cluster ARC pool so
# it can reach a ClusterIP-only gateway. Promoting THAT verbatim would have handed prod
# cluster credentials to every product repo in the family — a privilege escalation dressed
# as a sync — and would have pinned every repo's `@fuze` to a self-hosted pool only
# FuzeInfra has, where a job does not fail but QUEUES FOREVER (governance/ci-runners.md).
# So the capability is SPLIT:
#   * THIS file — the baseline entrypoint, no cluster credential of any kind, on the repo's
#     own runner. It is the only `@fuze` handler a product repo ever gets.
#   * `workflow-templates/fuze-cluster.yml` — the privileged variant, installed ONLY into a
#     repo whose `.fuze/manifest.json` declares `clusterOps.enabled: true` (today: FuzeInfra
#     alone, which owns the cluster), and inert even there until `vars.FUZE_CLUSTER_ENTRYPOINT`
#     is set. See that file's header and scripts/bootstrap/caps/workflows.py CONDITIONAL.
#
# The privileged identifiers — the kubeconfig secret name, the IaC CLI name, and the
# self-hosted pool label — are deliberately ABSENT FROM THIS FILE AS LITERAL TEXT, not merely
# unused. Grep the three of them across a non-opted-in repo's `.github/workflows/` and the
# `@fuze` entrypoint contributes zero hits; that is the check. Do not reintroduce those
# strings here, not even inside a comment: to an auditor's grep a prose mention is
# indistinguishable from a real reference, which is exactly how a checkable security property
# decays into an unverifiable claim. The strings live in `fuze-cluster.yml` and nowhere else.
#
# LLM CREDENTIAL — routed, never hardcoded. FuzeInfra's version sets
# `ANTHROPIC_BASE_URL: http://litellm.fuzeinfra.svc.cluster.local:4000` directly. That is
# correct for a pod inside the cluster and USELESS anywhere else: the name does not resolve
# from a GitHub-hosted runner, so a verbatim copy would have failed DNS on 21 repos. This
# template routes through `./.github/actions/fuze-code-action`, which resolves the endpoint
# via `./.github/actions/llm-endpoint` — a bounded-timeout probe of the in-cluster gateway
# that falls back to a direct vendor key when the gateway is unreachable. That fallback is
# precisely what the FuzeInfra file lacks.
#
# HONEST LIMIT OF THAT ROUTING, stated here so nobody reads more resilience into it than
# exists: with no `task-prompt` this is MENTION MODE, and fuze-code-action DELIBERATELY
# disables rungs 2 and 3 there (codex-action and run-gemini-cli have no GitHub event
# context, so a rung that "succeeds" at seeing nothing is a manufactured green). The
# openai/gemini keys are passed below for shape-parity with the other call sites and are
# genuinely inert on this path. In mention mode there is exactly ONE rung, and if the
# Anthropic-or-LiteLLM leg has no working credential, this workflow fails — it does not
# quietly answer from somewhere else.
#
# THE TRIGGER TOKEN, AND WHY THIS IS NOT A CUTOVER. Gate 1 below matches the literal string
# `@fuze`. Before this template existed, NO repo but FuzeInfra matched that token — every
# other repo's only handler was `claude.yml`, gated on `@claude` — so a comment saying only
# `@fuze` triggered nothing at all, in 21 of 22 repos, silently. That is the gap this file
# closes, and it is why the documentation change and the workflow change must land together:
# documenting `@fuze` in a repo that has not yet received THIS FILE points people at a token
# no workflow listens for, which is strictly worse than the status quo.
#
# `@claude` KEEPS WORKING, and deliberately not by being matched here. Every repo already
# carries `claude.yml`, which matches `@claude` and routes through the SAME
# fuze-code-action/llm-endpoint path this file uses — so existing issue threads and muscle
# memory continue to work untouched, and no open issue is stranded. Adding `@claude` to Gate 1
# would NOT be a kindness: both handlers would then answer the same `@claude` mention and two
# agents would act on one thread. The two gates are deliberately DISJOINT. A comment that
# mentions both tokens does run both handlers — write one or the other.
#
# `@fuze` is the family's default handle and the one every doc, agent and skill now names
# (governance/routing.md, CLAUDE.baseline.md §9). `@claude`/`@codex`/`@gemini` remain
# human-typed escape hatches for when you deliberately want a named provider.
#
# SECURITY — trusted authors only. Gate 2 restricts triggering to OWNER/MEMBER/COLLABORATOR.
# This handler holds a repo-write token and an agent that will push branches with it; an
# untrusted commenter must never be able to drive that. The gate is kept here even though
# this variant holds no cluster credential, because "no cluster credential" is not the same
# as "harmless".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  fuze:
    # DEDUP: at most one run per issue/PR at a time (latest wins). cancel-in-progress
    # collapses near-simultaneous duplicates — an issue opened WITH labels emits both
    # `issues.opened` and `issues.labeled`, and without this both would start an agent.
    concurrency:
      group: fuze-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # Gate 1: `@fuze` is actually mentioned (or the issue is labeled/assigned `fuze`).
    # Gate 2 (SECURITY): trusted collaborator — see the header.
    # Gate 3 (LOOP-BREAKER): the `fuze-loop-guard` sentinel. The failure notice this
    #   workflow posts below itself contains `@fuze`, and would otherwise re-trigger the
    #   workflow forever. DO NOT remove the sentinel from that comment body.
    # Gate 4 (PRIVILEGE SPLIT): stand down in a repo that has activated the cluster-capable
    #   entrypoint, so `fuze.yml` and `fuze-cluster.yml` can never both answer the same
    #   mention. Unset/absent — every repo except an activated FuzeInfra — means THIS
    #   handler runs, which is the fail-safe direction: the default is the UNPRIVILEGED one.
    if: |
      vars.FUZE_CLUSTER_ENTRYPOINT != 'true' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@fuze') &&
          !contains(github.event.comment.body, 'fuze-loop-guard') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@fuze') &&
          !contains(github.event.comment.body, 'fuze-loop-guard') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@fuze') &&
          !contains(github.event.review.body, 'fuze-loop-guard') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          (contains(github.event.issue.body, '@fuze') || contains(github.event.issue.title, '@fuze')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'fuze' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'assigned' &&
          github.event.assignee.login == 'fuze' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          # SECURITY — this checkout is the TRUSTED source the preserve step below copies
          # from, so it must never be PR-author content. `actions/checkout` defaults to
          # GITHUB_REF, and GITHUB_REF is NOT the same thing on every trigger this workflow
          # listens to ("Events that trigger workflows", GITHUB_SHA/GITHUB_REF table):
          #
          #   issue_comment               -> Default branch
          #   issues                      -> Default branch
          #   pull_request_review         -> PR merge branch refs/pull/N/merge
          #   pull_request_review_comment -> PR merge branch refs/pull/N/merge
          #
          # On the two review triggers the default checkout therefore ALREADY contains the PR
          # author's `.github/actions`, so the preserve/restore pair below would archive the
          # attacker's tree out and restore it right back — a no-op mitigation on exactly the
          # paths it was written for, with FUZEONEAGENT_TOKEN and the LLM credentials in scope.
          # Pinning the ref makes the preserved tree trusted on every trigger; the PR-head
          # checkout below still fetches $HEAD_SHA explicitly, so only the action DEFINITIONS
          # are pinned and the agent still works against the real PR content.
          ref: ${{ github.event.repository.default_branch }}

      # SECURITY — pin the EXECUTED action code to this TRUSTED checkout, before the next
      # step replaces the working tree with a PR head that can be a fork's. `uses:
      # ./.github/actions/...` below resolves against whatever is on disk at that point, not
      # against any ref or pin in this file — so without this step, a fork PR that edits
      # fuze-code-action/llm-endpoint/fuze-push-identity executes its OWN version the moment a
      # trusted collaborator comments `@fuze` on it, with this job's FUZEONEAGENT_TOKEN (and,
      # via claude.yml, LITELLM_FUZE_KEY/ANTHROPIC_API_KEY/CLAUDE_CODE_OAUTH_TOKEN/OPENAI_API_KEY/
      # GEMINI_API_KEY too) in scope. That is a credential-exfiltration path a comment alone
      # can trigger — Gate 2 above authenticates the COMMENTER, never the PR HEAD's content.
      # Copying the whole `.github/actions/` tree out of the repo now, then restoring it
      # verbatim after the PR-head checkout below, means the step that runs `uses: ./...`
      # always executes what THIS commit (the trusted trigger ref) shipped, regardless of
      # what the PR head contains. Everything else about the PR head — its code, its
      # task-prompt context — is still the real thing; only the action DEFINITIONS are pinned.
      - name: Preserve trusted local actions (before any PR-head checkout)
        run: cp -a .github/actions "${RUNNER_TEMP}/trusted-fuze-actions"

      - name: Checkout PR branch (when triggered from a PR)
        if: |
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        # Every `github` context value reaches the shell through env:, never through
        # `${{ }}` inside run:. A branch name is attacker-controlled and git permits `;`,
        # `|`, `$`, `"` and backticks in a ref, so an interpolated head.ref executes on the
        # runner with the job's token in scope — the documented GitHub Actions script
        # injection. actionlint flags it as `expression`, semgrep as run-shell-injection.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq .head.sha)
            HEAD_REF=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq .head.ref)
          else
            HEAD_SHA="$PR_HEAD_SHA"
            HEAD_REF="$PR_HEAD_REF"
          fi
          git fetch origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
          echo "Checked out PR branch: $HEAD_REF @ $HEAD_SHA"

      # SECURITY — restore the TRUSTED action code over whatever the just-checked-out PR head
      # (possibly a fork) put at these paths. Same `if:` as the checkout above: a no-op copy
      # when that step didn't run. See "Preserve trusted local actions" for the threat.
      - name: Restore trusted local actions (never execute PR-head-controlled action code)
        if: |
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        run: |
          rm -rf .github/actions
          cp -a "${RUNNER_TEMP}/trusted-fuze-actions" .github/actions

      # CODER IDENTITY (docs/identity-and-roles.md). The coder is the org-wide `fuze-agent`
      # GitHub App — a durable App identity, NOT the retired `fuzeoneagent` user account
      # (suspended by GitHub 2026-10-14). Mint a short-lived App installation token and use it
      # as the coding/commit/push credential, stamping the git author as the App's bot — the
      # repo-local `git config` here persists into the fuze-code-action composite steps in this
      # same job — so commits this run pushes are attributed to `fuze-agent[bot]`, not the admin
      # `izzywdev`; author ≠ reviewer is preserved (the App bot authors, izzywdev/FuzeApprover
      # reviews). When the App secrets are absent the resolve step falls back to GITHUB_TOKEN
      # with a ::warning::, byte-for-byte default-safe so an un-provisioned repo degrades rather
      # than breaks. Signing note: an App-token `git push` is NOT signed — `required_signatures`
      # on the default branch is satisfied by the server-signed squash-merge, exactly as before.
      # fuze:secret-sourcing FUZE_AGENT_APP_ID=fleet — provision-secrets.yml (FLEET_SOURCED); durable coder identity
      # fuze:secret-sourcing FUZE_AGENT_APP_PRIVATE_KEY=fleet — provision-secrets.yml (FLEET_SOURCED); durable coder identity
      # fuze:secret-sourcing FUZEONEAGENT_TOKEN=fleet — provision-secrets.yml (FLEET_SOURCED); least-privilege coder (probed fallback)
      - name: Mint fuze-agent App token (coder identity)
        id: coder_app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FUZE_AGENT_APP_ID }}
          private-key: ${{ secrets.FUZE_AGENT_APP_PRIVATE_KEY }}
      - name: Resolve coding identity (fuze-agent App; GITHUB_TOKEN fallback)
        id: coder
        env:
          APP_TOKEN: ${{ steps.coder_app.outputs.token }}
          CODER_TOKEN: ${{ secrets.FUZEONEAGENT_TOKEN }}
          GH_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Coder ladder: fuze-agent App (durable primary coder) -> fuzeoneagent (probed:
          # used only if GitHub accepts the token right now) -> GITHUB_TOKEN (default). A token
          # that is SET is not a token that WORKS — a suspended/revoked account still leaves the
          # secret populated — so the fuzeoneagent rung is probed before use.
          if [ -n "${APP_TOKEN:-}" ]; then
            tok="$APP_TOKEN"
            who="fuze-agent[bot] (fuze-agent App installation token — durable coder)"
            git config user.name "fuze-agent[bot]"
            git config user.email "fuze-agent[bot]@users.noreply.github.com"
            bot_name="fuze-agent[bot]"; bot_id="321521006"
          else
            coder_ok=false
            if [ -n "${CODER_TOKEN:-}" ]; then
              probe=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                -H "Authorization: Bearer ${CODER_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user" 2>/dev/null || true)
              if [ "${probe:-}" = "200" ]; then
                coder_ok=true
              else
                echo "::warning title=coder-identity::FUZEONEAGENT_TOKEN is set but GitHub rejected it (HTTP ${probe:-none}; the account may be suspended or the token revoked). Falling back to the default GITHUB_TOKEN identity. Replace or remove the secret to clear this warning."
              fi
            fi
            if [ "$coder_ok" = "true" ]; then
              tok="$CODER_TOKEN"
              who="fuzeoneagent (FUZEONEAGENT_TOKEN — least-privilege coder, probed fallback)"
              git config user.name "fuzeoneagent"
              git config user.email "330369996+fuzeoneagent@users.noreply.github.com"
              bot_name="fuzeoneagent"; bot_id="330369996"
            else
              bot_name="claude[bot]"; bot_id="41898282"   # claude-code-action's own defaults
              tok="$GH_DEFAULT"
              who="GITHUB_TOKEN (default — fuze-agent App secrets unset; FUZEONEAGENT_TOKEN unset or rejected)"
              echo "::warning title=coder-identity::Neither the fuze-agent App secrets (FUZE_AGENT_APP_ID / FUZE_AGENT_APP_PRIVATE_KEY) nor a working FUZEONEAGENT_TOKEN resolved — @fuze codes/commits/pushes under the default GITHUB_TOKEN identity, exactly as before. Set the fuze-agent App secrets to author as the durable coder identity (docs/identity-and-roles.md)."
            fi
          fi
          echo "::add-mask::$tok"
          {
            echo "token=$tok"
            echo "bot-name=$bot_name"
            echo "bot-id=$bot_id"
          } >> "$GITHUB_OUTPUT"
          echo "Coding identity: $who"

      - name: Run Fuze
        id: fuze
        # continue-on-error so the detect + alert steps below run and OWN the job's final
        # status. Without it the action fails the job outright and the requester is never
        # told on their own thread — the failure is only visible to whoever opens the run
        # log, which in practice is nobody.
        continue-on-error: true
        uses: ./.github/actions/fuze-code-action
        with:
          # Coder credential: fuze-agent App token when provisioned, else GITHUB_TOKEN (see the
          # Resolve coding identity step — default-safe when the App secrets are unset).
          github-token: ${{ steps.coder.outputs.token }}
          # Commit author. Must be passed here: claude-code-action overwrites `git config`.
          bot-name: ${{ steps.coder.outputs.bot-name }}
          bot-id: ${{ steps.coder.outputs.bot-id }}
          # WHERE THE GATEWAY IS, as a repo variable rather than a hardcoded literal.
          #
          # The default is the in-cluster service DNS name, which resolves only from a pod in
          # the cluster. On the GitHub-hosted runner this job uses, the probe simply fails and
          # llm-endpoint falls back to the direct vendor key — degraded but working, and the
          # reason this template does not hardcode the base URL the way FuzeInfra's did.
          #
          # THE GATEWAY *IS* PUBLICLY REACHABLE at `litellm.prod.fuzefront.com`
          # (helm/litellm/values-contabo.yaml enables the ingress), behind Cloudflare Access.
          # Routing a hosted runner through it now works end to end, because BOTH prerequisites
          # that used to block it have landed:
          #   1. a Cloudflare Access SERVICE TOKEN exists — FuzeInfra terraform
          #      `cloudflare_zero_trust_access_service_token.litellm_ci`, bound to the
          #      `litellm_service` Access app by the `litellm_service_ci_token` policy, whose
          #      `non_identity` decision (FuzeInfra #1039) makes the service-token path return
          #      200 non-interactively from CI;
          #   2. ./.github/actions/llm-endpoint accepts `cf-access-client-id` /
          #      `cf-access-client-secret`, masks the secret (`::add-mask::`) on entry, uses
          #      them on its readiness probe, and returns them ONLY through its pre-masked
          #      `custom-headers` output — the SAME masked-output channel as `auth-token`,
          #      never printed, logged, or written to a file. fuze-code-action sets that
          #      output as ANTHROPIC_CUSTOM_HEADERS on the claude rung so the model requests
          #      carry the same CF-Access headers and clear Access too (the probe passing is
          #      not enough on its own).
          # TO TURN IT ON, provision THREE secrets and change nothing else:
          # `CF_ACCESS_CLIENT_ID`, `CF_ACCESS_CLIENT_SECRET` (from `terraform output`, a
          # local-terminal step — never a PR/chat/log) and `LITELLM_CI_KEY` (the capped virtual
          # key). You DO NOT repoint `FUZE_LITELLM_BASE_URL` at the public host: ./llm-endpoint
          # keeps the in-cluster DNS name as its Tier-1 probe (which a hosted runner misses) and
          # then probes the public gateway as Tier-2 automatically, using those three secrets,
          # BEFORE the runner-local fallback. With any of the three UNSET the Tier-2 probe is
          # skipped entirely, so leaving them unset keeps the exact prior behaviour (in-cluster
          # probe → runner-local/vendor fallback) — there is no "looks deliberate but 302s"
          # foot-gun anymore, because the public URL is not activated by a base-URL flip.
          litellm-base-url: ${{ vars.FUZE_LITELLM_BASE_URL || 'http://litellm.fuzeinfra.svc.cluster.local:4000' }}
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # Tier-2 public-gateway key. Its presence in this file is also what makes
          # provision-secrets.yml source LITELLM_CI_KEY onto the repo (the survey keys off the
          # `secrets.` reference intersected with FLEET_SOURCED). ./llm-endpoint uses it ONLY
          # against the public host and only alongside the CF-Access creds above.
          litellm-ci-key: ${{ secrets.LITELLM_CI_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Inert on this path — see MENTION MODE in the header. Passed for shape-parity
          # with the fleet's other fuze-code-action call sites, NOT as a claimed fallback.
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          show-full-output: true
          # allowed_bots — REQUIRED here, and not for the reason it is required in
          # governance-nightly.yml. That one is a cron, whose actor is the scheduler
          # identity. This one is mention-triggered, and a mention can legitimately be
          # posted BY a workflow: the family's CI-failure triage, Argo out-of-sync autofix,
          # nightly-integration and crit-alert workflows all comment `@fuze` to hand work
          # over. The actor on that `issue_comment` event is the bot that posted it, and
          # claude-code-action's human-actor check aborts the rung ~1s in, BEFORE any model
          # call, with "Workflow initiated by non-human actor: <login>. Add bot to
          # allowed_bots list or use '*' to allow all bots." — a failure that looks in a
          # skimmed log exactly like a provider outage.
          #
          # Deliberately a NAMED list, never `*`. Under `*` any bot-authored event — every
          # repo here runs dependabot — could start an agent run holding the resolved LLM
          # credential and repo write. `fuzeone-bot` is the fleet's scheduler/automation
          # identity; `github-actions` covers a comment posted by a workflow using the
          # default token; `fuze-agent` is the App identity agent PRs are opened under
          # (governance/identity-and-attribution.md). Gate 2 above still independently
          # requires the commenter to be OWNER/MEMBER/COLLABORATOR, so this list widens
          # only the actor-type check, never the trust check.
          allowed-bots: "fuzeone-bot,github-actions,fuze-agent"
          # Without these, every mutating tool call (git push, gh pr/issue create, file
          # edits) sits behind an interactive approval gate that nothing can clear in
          # headless CI and is silently DENIED — the agent reads the repo, reports success,
          # and changes nothing. Measured across the fleet on exactly this defect
          # (governance-nightly.yml's header records the numbers).
          additional-permissions: |
            Bash
            Write
            Edit
            MultiEdit
            Task
            TodoWrite
          claude-args: >-
            --permission-mode bypassPermissions
            --max-turns 60
            --append-system-prompt "EXPERT-FIRST: begin every task by invoking this repo's <repo>-expert subagent (via Task) to load its architecture/deploy/gotcha context before planning or coding; the expert is named in .fuze/manifest.json under `expert`. Follow governance/routing.md for ownership: refuse work that belongs to another agent and name the correct owner. This runner holds NO cluster credential and NO prod access — never attempt cluster or infrastructure-as-code commands here (they are not installed and there is no credential for them); infra changes are delegated to FuzeInfra via a `@fuze` issue (CLAUDE.baseline.md 1), and cluster READS are self-service via FuzeInfra's cluster-query workflow. End issue replies with DONE: or BLOCKED: so cross-repo monitors can key off it. CROSS-REPO HAND-OFF: if a delegated issue's REMAINING work belongs to another repo, do NOT leave it open here — open (or comment on) an issue in that repo mentioning its `@fuze` with full context and a STATE block, post a closing note here, and CLOSE this issue."

      # DETECT: did the responder actually fail? Two signals — the composite action's own
      # step outcome, and its `conclusion=failure` output (a run can report a failing
      # conclusion WITHOUT failing the step).
      #
      # THE REASON TEXT MUST NOT PRE-BLAME THE LLM KEYS. fuze-code-action classifies a rung
      # that never produced an execution log — claude-code-action aborting at its OWN GitHub
      # permission precheck (the coding-identity token's account suspended or lacking repo
      # access; GitHub answers that check with "Sorry. Your account was suspended"), or a
      # missing credential — as `availability`, the SAME class as a real credit/quota outage.
      # The old text asserted "check LITELLM_FUZE_KEY and ANTHROPIC_API_KEY" on EVERY
      # availability failure, sending readers to vendor billing for what was in fact a
      # token/permission problem (izzywdev/FuzeSDLC#456: both Anthropic rungs died at the
      # permission precheck, never reached a model call, yet the notice blamed the LLM keys).
      # So: key off the `availability` output, name the ACTUAL candidate causes in priority
      # order, point at the per-rung step logs that carry the exact error, and ALWAYS state
      # whether the subscription OAuth rung (1a) ran — so "was CLAUDE_CODE_OAUTH_TOKEN even
      # tried?" is answered in the notice itself, not left to a log dig.
      - name: Detect Fuze failure
        id: detect
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.fuze.outcome }}
          MODE: ${{ steps.fuze.outputs.mode }}
          CONCLUSION: ${{ steps.fuze.outputs.conclusion }}
          AVAILABILITY: ${{ steps.fuze.outputs.availability }}
          SUBSCRIPTION_RUNG: ${{ steps.fuze.outputs.subscription-rung }}
        run: |
          set -uo pipefail
          failed=false; reason=""
          case "${SUBSCRIPTION_RUNG:-}" in
            ran)              sub="subscription OAuth rung (1a) WAS attempted" ;;
            skipped-no-token) sub="subscription OAuth rung (1a) was SKIPPED (CLAUDE_CODE_OAUTH_TOKEN unset) so the metered Anthropic/LiteLLM rung was the only path left (it too may have been skipped if no metered credential resolved — check its step log)" ;;
            *)                sub="subscription OAuth rung (1a) status unknown (${SUBSCRIPTION_RUNG:-unset})" ;;
          esac
          if [ "${STEP_OUTCOME:-}" = "failure" ] || [ "${CONCLUSION:-}" = "failure" ]; then
            failed=true
            if [ "${AVAILABILITY:-}" = "true" ]; then
              reason="fuze-code-action reported an AVAILABILITY failure (mode=${MODE:-?}); ${sub}. 'Availability' does NOT by itself prove an LLM credit/key outage — a rung that aborts at claude-code-action's GitHub permission precheck (coding-identity token's account suspended or lacking repo access) produces no execution log and is classified identically. READ the 'Rung 1a'/'Rung 1' step logs in the run for the exact error before assuming credits. Candidate causes, in priority order: (1) the coding identity (fuze-agent App installation token, else GITHUB_TOKEN) could not be minted or lacks repo access; (2) an expired/revoked CLAUDE_CODE_OAUTH_TOKEN; (3) exhausted ANTHROPIC_API_KEY / LITELLM_FUZE_KEY credit."
            elif [ "${AVAILABILITY:-}" = "false" ]; then
              reason="fuze-code-action failed with a TASK failure (mode=${MODE:-?}) — a real error from the work itself, not a provider-availability problem; ${sub}. See the run log."
            else
              reason="fuze-code-action failed WITHOUT reporting an availability classification (mode=${MODE:-?}) — it likely failed before its classify step ran (action could not initialize, e.g. a bad input or a missing local action), so this is neither a confirmed task failure nor a confirmed provider outage; ${sub}. Read the run log's first failing step."
            fi
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<GHA_EOF"
            echo "${reason}"
            echo "GHA_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$failed" = "true" ]; then
            echo "::error::@fuze responder failed: $reason"
          else
            echo "@fuze responder completed without an error signal (mode=${MODE:-?})"
          fi

      # ALERT: a failed responder tells the requester on their own thread, and pings
      # Telegram where that is configured. Without this the requester waits on a reply that
      # is never coming, which is indistinguishable from the agent still thinking.
      - name: Alert on Fuze failure
        if: always() && steps.detect.outputs.failed == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          REASON: ${{ steps.detect.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -n "${TOKEN:-}" ]; then
            TEXT=$(printf '@fuze responder FAILED\nRepo: %s\nIssue/PR: #%s\nBy: %s\nReason: %s\nRun: %s' \
              "$REPO" "${ISSUE:-?}" "$ACTOR" "$REASON" "$RUN_URL")
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT:-}" \
              --data-urlencode "text=${TEXT}" \
              --data "disable_web_page_preview=true" >/dev/null \
              && echo "telegram alert sent" || echo "::warning::telegram send failed"
          else
            echo "::notice::TELEGRAM_BOT_TOKEN unset — skipping Telegram alert"
          fi
          # LOOP-BREAKER: this comment mentions `@fuze` and would otherwise re-trigger this
          # workflow. The hidden `fuze-loop-guard` sentinel is what Gate 3 keys off to
          # ignore it — DO NOT remove it.
          if [ -n "${ISSUE:-}" ]; then
            {
              printf '<!-- fuze-loop-guard: automated failure notice — this comment must NOT re-trigger the Fuze workflow -->\n'
              printf '### Fuze responder did not run to completion\n\n'
              printf 'The responder errored before finishing your request, so **no changes were made and no branch was created**.\n\n'
              printf -- '- **Reason:** %s\n' "$REASON"
              printf -- '- **Run log:** %s\n\n' "$RUN_URL"
              printf 'This notice is automated and will **not** retry on its own. Re-trigger by posting a new comment mentioning @fuze once the cause is fixed.\n'
            } > "${RUNNER_TEMP}/fuze-fail.md"
            gh issue comment "$ISSUE" --repo "$REPO" --body-file "${RUNNER_TEMP}/fuze-fail.md" \
              && echo "posted failure notice to #$ISSUE" || echo "::warning::could not comment on #$ISSUE"
          fi

      # Reflect the failure in the job status AFTER alerting had a chance to run.
      - name: Fail job if Fuze failed
        if: always() && steps.detect.outputs.failed == 'true'
        env:
          REASON: ${{ steps.detect.outputs.reason }}
        run: |
          echo "::error::Marking job failed — @fuze responder did not complete: ${REASON}"
          exit 1
