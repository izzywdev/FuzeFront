name: "prod: Permit ABAC policy setup"

# Sets up Permit.io ABAC resources, condition sets, and policies for plan-tier
# access control. Run ONCE before enabling fuzefront.billing.authz-enabled.
#
# Run order after merge:
#   1. This workflow  (dry-run first, then apply)
#   2. prod-billing-stripe-sync (mode=apply) — syncs plan_tier attributes
#   3. prod-unleash-ops (flags=authz-enabled) — flips the gate ON
#
# All secrets are read from k8s at runtime via the runner SA token.
# No GitHub repo secrets required.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (default) or apply'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      environment:
        description: 'Permit environment key'
        required: false
        default: 'production'
        type: string

jobs:
  permit-policy-setup:
    name: 'Permit ABAC policy setup (${{ inputs.mode }})'
    runs-on: fuzefront
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Read Permit API key from k8s
        id: read-permit-secret
        run: |
          set -euo pipefail
          _SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          _K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

          _SECRET=$(curl -sf --cacert "$_K8S_CA" \
            -H "Authorization: Bearer $_SA_TOKEN" \
            "https://kubernetes.default.svc/api/v1/namespaces/fuzefront/secrets/fuzefront-secrets")

          PERMIT_API_KEY=$(echo "$_SECRET" | python3 -c "
import sys,json,base64
d=json.load(sys.stdin)
v=d.get('data',{}).get('PERMIT_API_KEY')
print(base64.b64decode(v).decode().strip() if v else '')
" 2>/dev/null || echo "")
          if [ -z "$PERMIT_API_KEY" ]; then
            echo "::error::PERMIT_API_KEY not found in k8s secret fuzefront-secrets/fuzefront"
            exit 1
          fi
          echo "::add-mask::$PERMIT_API_KEY"
          echo "PERMIT_API_KEY=$PERMIT_API_KEY" >> "$GITHUB_ENV"

          PERMIT_PROJECT=$(echo "$_SECRET" | python3 -c "
import sys,json,base64
d=json.load(sys.stdin)
v=d.get('data',{}).get('PERMIT_PROJECT')
print(base64.b64decode(v).decode().strip() if v else '')
" 2>/dev/null || echo "")
          PERMIT_PROJECT="${PERMIT_PROJECT:-fuzefront}"
          echo "PERMIT_PROJECT=$PERMIT_PROJECT" >> "$GITHUB_ENV"

      - name: Run policy setup (${{ inputs.mode }})
        working-directory: services/billing-service
        env:
          PERMIT_API_KEY: ${{ env.PERMIT_API_KEY }}
          PERMIT_PROJECT: ${{ env.PERMIT_PROJECT }}
          PERMIT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "apply" ]; then
            ARGS="--apply"
          fi
          node scripts/setup-permit-policies.mjs $ARGS
