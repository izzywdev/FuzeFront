name: gate-frames-external

# Enforces the navigable-frames extraction decision (2026-08-10, see
# docs/planning/design-first-ui-pipeline.md's extraction addendum): design/frames/**
# in this repo is frozen to the feature set that existed at extraction time
# (design/frames/_LEGACY_FEATURES.json). New features author frames against
# izzywdev/FuzeX's design-frames-service (REST/MCP/A2A) instead of a new
# design/frames/<feature>/ directory here.
#
# Standing invariant, not a diff-based check — see scripts/check-frames-external.mjs.

on:
  pull_request:
    paths:
      - 'design/frames/**'
      - 'scripts/check-frames-external.mjs'
      - '.github/workflows/gate-frames-external.yml'

permissions:
  contents: read

concurrency:
  group: gate-frames-external-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frames-external:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (repo hardening standard — a mutable
      # tag can be silently repointed by the action owner).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24.x'

      - name: Verify design/frames/ only contains the frozen legacy feature set
        run: node scripts/check-frames-external.mjs
