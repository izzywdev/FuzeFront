name: gate-openapi-conformance

# The OpenAPI spec is the FROZEN CONTRACT, and this gate measures the code
# against it. It never regenerates the spec from code — a spec derived from its
# implementation agrees with that implementation by construction and therefore
# cannot detect that the implementation drifted. That pipeline silently converts
# a contract into documentation.
#
# Nothing else in this repo closes this seam. Type-check, lint, unit tests and
# `helm template | kubeconform` are each individually happy with a service that
# implements an endpoint the contract never declared, or that quietly stopped
# implementing one a consumer generated a client for. gate-route-ownership
# checks WHICH SERVICE serves a path; this checks WHETHER THE PATH WAS AGREED.
#
# NO `paths:` FILTER on pull_request, and that is load-bearing rather than an
# oversight — the same rule workspace-deps-check.yml and gate-sealed-keys.yml
# already state: filter INSIDE a job, never on the trigger, for anything the
# ruleset requires.
#
# A path-filtered workflow does not run at all on a PR that touches none of its
# paths, so the check run is never CREATED — and a required context that is never
# created leaves the PR permanently at "Expected — waiting for status to be
# reported", with no red to look at and nothing to re-run. That deadlock was
# measured on four sampled PRs on 2026-08-23. It is therefore impossible to
# REQUIRE a path-filtered check, and this one was not required, which is how
# config-service shipped `GET /v1/config/history` and
# `POST /v1/config/secrets/reveal` declared-but-unimplemented: any client
# generated from that contract 404s. See docs/runbooks/widen-required-checks.md.
#
# Nothing is filtered inside the job either, because there is nothing to filter:
# `gate_openapi_conformance.py --repo .` measures a WHOLE-REPO invariant — every
# service against its own contract — not a diff. The old filter was a runner-time
# optimisation on a job that is a pip install and a Python script. It bought
# seconds and cost enforceability.
#
# The trigger did have one thing right, kept here in spirit: the seam has two
# sides. A spec-only trigger would miss a route added in code; a code-only
# trigger would miss a path deleted from the contract. Running unconditionally
# covers both by construction.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'services/*/openapi.yaml'
      - 'services/*/src/**'
      - 'governance/openapi-conformance-allowlist.txt'
      - 'scripts/gate_openapi_conformance.py'

permissions:
  contents: read

jobs:
  openapi-conformance:
    name: shipped code matches the frozen contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The gate's own tests run FIRST and are weighted toward asserting that it
      # FAILS on a violation. "It passed on the current tree" is not evidence a
      # gate works — `sys.exit(0)` passes on the current tree too. If the self
      # tests are red, the run below proves nothing and must not be trusted.
      - name: Self-test the gate before trusting it
        run: python -m unittest discover -s scripts/__tests__ -p 'test_gate_openapi_conformance.py' -v

      - name: Check every service against its contract
        run: python scripts/gate_openapi_conformance.py --repo .
