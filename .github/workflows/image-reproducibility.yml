name: Image reproducibility

# FFRNT-254. Two jobs, and they answer different questions.
#
# `lockfile-discipline` is static and cheap: does every Dockerfile install from
# the lockfile, and does every root-context image copy the FULL workspace
# manifest set? npm hoists against all manifests, so a subset produces a
# different tree than the lockfile describes and drops packages SILENTLY —
# `npm install` still exits 0 and the container crashes at boot days later.
# express-rate-limit and @izzywdev/fuzefront-identity have both gone missing
# from images exactly this way.
#
# `build-images` is the expensive one, and it exists because static checks
# cannot prove an image runs. release.yml builds these same files on push to
# master, and master is DEPLOY-ON-PUSH — so without a pre-merge build, a broken
# Dockerfile is discovered by production. It runs only when something that can
# affect an image build changes.
#
# That matrix was hand-maintained against release.yml and silently drifted to
# covering 8 of 18 released images. The gap WIDENED with each new service —
# config-service shipped uncovered and crash-looped in prod (#768), and
# devportal-service/devportal-frontend were added uncovered afterwards. The
# entries are back in sync, and check-image-build-coverage.mjs now fails the
# build when release.yml pushes an image this matrix does not build, so the
# next service cannot repeat it.
on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/package-lock.json'
      - '**/package.json'
      - 'scripts/check-dockerfile-lockfile.mjs'
      - 'scripts/check-image-build-coverage.mjs'
      - '.github/workflows/image-reproducibility.yml'
      # The coverage guard below diffs THIS matrix against release.yml, so a PR
      # that adds an image there must run it — otherwise the one check that
      # catches a new uncovered image never fires on the PR that adds it.
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  lockfile-discipline:
    name: Dockerfiles install from the lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Check Dockerfile lockfile discipline
        run: node scripts/check-dockerfile-lockfile.mjs
      - name: Check every released image is built pre-merge
        run: node scripts/check-image-build-coverage.mjs

  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: lockfile-discipline
    strategy:
      # Build every image rather than stopping at the first failure — knowing
      # which images are broken is the whole point of the job.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: .
            file: frontend/Dockerfile
          - name: security-service
            context: .
            file: backend/security/Dockerfile
          - name: applications-service
            context: .
            file: backend/applications/Dockerfile
          - name: billing-service
            context: .
            file: services/billing-service/Dockerfile
          - name: chat-service
            context: .
            file: services/chat-service/Dockerfile
          - name: notification-service
            context: .
            file: services/notification-service/Dockerfile
          - name: clock-app
            context: clock-app
            file: clock-app/Dockerfile
          - name: email-service
            context: .
            file: services/email-service/Dockerfile
          - name: sms-service
            context: .
            file: services/sms-service/Dockerfile
          - name: provisioning-service
            context: .
            file: services/provisioning-service/Dockerfile
          - name: selection-list-service
            context: .
            file: services/selection-list-service/Dockerfile
          - name: config-service
            context: .
            file: services/config-service/Dockerfile
          - name: devportal-service
            context: .
            file: services/devportal-service/Dockerfile
          # Self-contained Dockerfiles — context is the subtree, not the repo
          # root. Mirrors how release.yml builds each of these; a root context
          # here would not reproduce what actually ships.
          - name: payment-service
            # context `.`, NOT the subtree: #1075 gave payment-service a
            # `file:../../packages/service-auth` dependency, so its Dockerfile
            # COPYs packages/security/ and packages/service-auth/ from the repo
            # root. release.yml moved to `context: .` for the same reason; a
            # subtree context here fails on "package.json not found".
            context: .
            file: services/payment-service/Dockerfile
          - name: fuzefront-website-frontend
            context: fuzefront-website/frontend
            file: fuzefront-website/frontend/Dockerfile
          - name: fuzefront-website-backend
            context: fuzefront-website/backend
            file: fuzefront-website/backend/Dockerfile
          - name: devportal-frontend
            context: devportal-frontend
            file: devportal-frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
