name: Seal Twilio + SMS secrets

# Dispatching service that seals the keys phone-2FA / sms-service needs into the
# existing `fuzefront-secrets` SealedSecret, WITHOUT any plaintext ever appearing
# in chat, a PR diff, or a build log (kubeseal --merge-into preserves every other
# key).
#
# WHO PROVIDES WHAT — the governance split (deploy/contabo/SEAL_PROD_SECRETS.md):
#   - The Twilio values are EXTERNAL vendor credentials, read here from GitHub
#     *repo secrets* the OWNER sets — never held by an agent, never pasted
#     anywhere. Auth uses a Twilio API Key (SK… SID + secret), NOT the account
#     Auth Token. Set them once (Settings → Secrets and variables → Actions):
#         TWILIO_ACCOUNT_SID        (starts AC…)
#         TWILIO_API_KEY_SID        (starts SK…)
#         TWILIO_API_KEY_SECRET
#         TWILIO_VERIFY_SERVICE_SID (starts VA…)
#   - SMS_AUTH_SECRET is NOT a vendor value — it is an internal shared Bearer token
#     between Authentik's SMS stage and sms-service. This workflow MINTS it
#     (openssl rand -hex 32) and seals it, so both sides read the same value from
#     fuzefront-secrets. It is only minted when absent (or when rotate_sms_auth).
#
# These are exactly the secretKeyRefs sms-service.yaml mounts:
# TWILIO_ACCOUNT_SID / TWILIO_API_KEY_SID / TWILIO_API_KEY_SECRET /
# TWILIO_VERIFY_SERVICE_SID / SMS_AUTH_SECRET.
#
# This seal step is SAFE to run before go-live: adding the keys does NOT start any
# pod — smsService.enabled is still false, so nothing renders. Enabling SMS is a
# SEPARATE GitOps commit in a deploy window (flip smsService.enabled: true), kept
# apart so the secret is provably present before the Deployment ever renders.
#
# NO cluster access is used, and NO live network fetch of the sealed-secrets
# controller cert either. This workflow used to fetch that PUBLIC cert live over
# HTTPS from CERT_URL — but that URL sits behind Cloudflare Access, which answers
# an unauthenticated CI request with an HTML login page, not a PEM (the same
# fragility FuzeInfra's own scripts/seal-secret.sh already hit and fixed). It now
# seals OFFLINE via scripts/seal-secret.sh against the cert committed at
# deploy/sealed-secrets/sealing-cert.pem (added in #870 for seal-consumer-secret.yml;
# reused here, not re-committed), with a guard step that fails loudly if that cert
# is missing or expired rather than silently sealing something the live controller
# can't decrypt. The commit to `master` goes through the same RELEASE_BUMP_SSH_KEY
# deploy key release.yml uses, because the "Protect Master" ruleset rejects a plain
# GITHUB_TOKEN push (Changes must be made through a pull request); the DeployKey is
# a bypass actor on that rule.

on:
  workflow_dispatch:
    inputs:
      rotate_sms_auth:
        description: "Re-mint SMS_AUTH_SECRET even if already sealed (rotation; needs Authentik + sms-service restart)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      dry_run:
        description: "Print the sealed diff to the log without committing"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: seal-sms-secrets
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The sealed-secrets controller's PUBLIC certificate, committed in-repo (added
  # in #870; force-added past the blanket *.pem gitignore rule since it's public
  # key material). No live URL, no cluster access, no kubeconfig.
  SEALING_CERT: deploy/sealed-secrets/sealing-cert.pem

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail LOUD and EARLY if any Twilio value is missing. Unlike an internally
      # minted secret, these cannot be generated — sealing an empty value would
      # seal a placeholder, and sms-service would CrashLoop on the first Verify
      # call (or the pod would wedge in CreateContainerConfigError). Better to
      # stop here with a clear message than to commit a broken secret.
      - name: Require Twilio credentials to be set
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
        run: |
          missing=""
          [ -z "$TWILIO_ACCOUNT_SID" ]        && missing="$missing TWILIO_ACCOUNT_SID"
          [ -z "$TWILIO_API_KEY_SID" ]        && missing="$missing TWILIO_API_KEY_SID"
          [ -z "$TWILIO_API_KEY_SECRET" ]     && missing="$missing TWILIO_API_KEY_SECRET"
          [ -z "$TWILIO_VERIFY_SERVICE_SID" ] && missing="$missing TWILIO_VERIFY_SERVICE_SID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub repo secret(s):${missing}. Set them under" \
                 "Settings → Secrets and variables → Actions, then re-run this workflow." >&2
            exit 1
          fi
          # Light shape check (a wrong-shaped value is almost always a paste error).
          case "$TWILIO_ACCOUNT_SID" in AC*) :;; *) echo "::warning::TWILIO_ACCOUNT_SID does not start with 'AC' — double-check it.";; esac
          case "$TWILIO_API_KEY_SID"  in SK*) :;; *) echo "::warning::TWILIO_API_KEY_SID does not start with 'SK' — double-check it.";; esac
          case "$TWILIO_VERIFY_SERVICE_SID" in VA*) :;; *) echo "::warning::TWILIO_VERIFY_SERVICE_SID does not start with 'VA' — double-check it.";; esac
          echo "::notice::All Twilio secrets are present."

      # A stale/missing cert would otherwise fail silently at pod start (the live
      # controller can't decrypt a SealedSecret sealed against an old key), which
      # is the worst place to discover it — fail loudly here instead.
      - name: Verify sealing cert is present and current
        run: |
          set -euo pipefail
          CERT="$SEALING_CERT"
          REFRESH_HELP="Refresh it (only needed after a sealed-secrets controller key rotation — not a routine step) from an environment with cluster access: kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --fetch-cert > \$CERT, then commit with 'git add -f \$CERT' (it is public key material — safe to publish — but matched by the repo's blanket *.pem gitignore rule, so force-add is expected)."

          if [ ! -f "$CERT" ]; then
            echo "::error::Missing $CERT. Sealing needs the sealed-secrets controller's PUBLIC certificate committed in-repo — this job uses ZERO cluster access and ZERO live network fetch. $REFRESH_HELP"
            exit 1
          fi

          if ! openssl x509 -in "$CERT" -noout -checkend 0 >/dev/null 2>&1; then
            END="$(openssl x509 -in "$CERT" -noout -enddate 2>/dev/null | cut -d= -f2)"
            echo "::error::$CERT has EXPIRED (notAfter: ${END:-unknown}). Sealing against a stale cert silently produces a SealedSecret the live controller cannot decrypt — it would fail at pod start, not here. Failing loudly now instead. $REFRESH_HELP"
            exit 1
          fi

          FPR="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          END="$(openssl x509 -in "$CERT" -noout -enddate 2>/dev/null | cut -d= -f2)"
          echo "::notice::Sealing cert OK — SHA256 fingerprint ${FPR}, expires ${END}"

      - name: Install kubeseal
        run: |
          KSVER=0.27.3
          curl -sSL \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KSVER}/kubeseal-${KSVER}-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeseal
          kubeseal --version

      - name: Seal Twilio + SMS_AUTH_SECRET (merge into fuzefront-secrets)
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          ROTATE_SMS_AUTH: ${{ inputs.rotate_sms_auth }}
        run: |
          set -euo pipefail
          MANIFEST=deploy/contabo/sealed/fuzefront-secrets.yaml
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT

          # Never echo values. Whitespace-trim each (paste artefacts are common);
          # scripts/seal-secret.sh base64s KEY=@file inputs itself.
          printf '%s' "$TWILIO_ACCOUNT_SID"        | tr -d '[:space:]' > "$d/TWILIO_ACCOUNT_SID"
          printf '%s' "$TWILIO_API_KEY_SID"        | tr -d '[:space:]' > "$d/TWILIO_API_KEY_SID"
          printf '%s' "$TWILIO_API_KEY_SECRET"     | tr -d '[:space:]' > "$d/TWILIO_API_KEY_SECRET"
          printf '%s' "$TWILIO_VERIFY_SERVICE_SID" | tr -d '[:space:]' > "$d/TWILIO_VERIFY_SERVICE_SID"

          # SMS_AUTH_SECRET: mint only if absent, or if rotation was explicitly
          # requested. Re-minting rotates the shared token, so it must be opt-in —
          # Authentik and sms-service both restart to pick up a rotated value.
          declare -a PAIRS=(
            "TWILIO_ACCOUNT_SID=@$d/TWILIO_ACCOUNT_SID"
            "TWILIO_API_KEY_SID=@$d/TWILIO_API_KEY_SID"
            "TWILIO_API_KEY_SECRET=@$d/TWILIO_API_KEY_SECRET"
            "TWILIO_VERIFY_SERVICE_SID=@$d/TWILIO_VERIFY_SERVICE_SID"
          )
          if grep -q 'SMS_AUTH_SECRET' "$MANIFEST" && [ "$ROTATE_SMS_AUTH" != "true" ]; then
            echo "::notice::SMS_AUTH_SECRET already sealed — leaving it untouched (pass rotate_sms_auth=true to rotate)."
          else
            openssl rand -hex 32 | tr -d '\n' > "$d/SMS_AUTH_SECRET"
            PAIRS+=("SMS_AUTH_SECRET=@$d/SMS_AUTH_SECRET")
            echo "::notice::SMS_AUTH_SECRET will be minted and sealed."
          fi

          # Offline, encrypt-only seal via FuzeInfra's canonical script: needs only
          # the committed public cert, never a kubeconfig, kubectl, or a live cert
          # fetch. --merge-into (inside the script) preserves every other key
          # already in $MANIFEST.
          bash scripts/seal-secret.sh fuzefront/fuzefront-secrets \
            "${PAIRS[@]}" \
            --cert "$SEALING_CERT" \
            --out "$MANIFEST"

          echo "::notice::Sealed Twilio (+ SMS_AUTH_SECRET if applicable) and merged into $MANIFEST."

      - name: Show diff (dry run)
        if: inputs.dry_run == 'true'
        run: git --no-pager diff deploy/contabo/sealed/fuzefront-secrets.yaml

      - name: Commit sealed secret
        if: inputs.dry_run == 'false'
        env:
          SSH_KEY: ${{ secrets.RELEASE_BUMP_SSH_KEY }}
        run: |
          set -euo pipefail
          if git diff --quiet deploy/contabo/sealed/fuzefront-secrets.yaml; then
            echo "::notice::No change to commit (keys already sealed with these values)."
            exit 0
          fi
          # Push via the RELEASE_BUMP_SSH_KEY deploy key — a bypass actor on the
          # "Protect Master" ruleset, the same mechanism release.yml's GitOps bump
          # uses. A plain GITHUB_TOKEN push 409s ("must be made through a PR").
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_bump
          chmod 600 ~/.ssh/release_bump
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/release_bump -o IdentitiesOnly=yes"
          git config user.name  "fuzefront-release"
          git config user.email "release-bump@users.noreply.github.com"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git add deploy/contabo/sealed/fuzefront-secrets.yaml
          git commit -m "secrets(prod): seal Twilio + SMS_AUTH_SECRET for phone 2FA"
          git push origin HEAD:master
          echo "::notice::Committed to master — ArgoCD syncs fuzefront-secrets within ~60s."

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Seal Twilio + SMS secrets"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Dry run — sealed YAML NOT committed (see the diff step)."
            else
              echo "- Sealed the keys into \`fuzefront-secrets\` and committed to master."
              echo "- The keys are now present but INERT: \`smsService.enabled\` is still false."
              echo "- **Next (separate, deploy-window commit):** flip \`smsService.enabled: true\` in \`values-prod.yaml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
