name: Prod federation probe

# Answers, against the LIVE host, the one question no other check in this repo
# asks: for each registered remote, would the browser actually get a working
# module? prod-smoke.yml polls a health endpoint, post-prod-e2e.yml drives
# flows, and e2e.yml checks federated assets only against a locally built
# preview — so a remote that 404s in production had no detector.
#
# It is deliberately UNAUTHENTICATED: it probes the static asset paths, not
# GET /api/apps (which requires a token and is scoped by org membership and
# visibility, so it could not enumerate every app anyway).
#
# runs-on: ubuntu-latest, NOT the fuzefront ARC pool. This is a diagnostic that
# has to be runnable exactly when the self-hosted pool is saturated — which is
# when a prod incident is most likely to be under investigation.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Host origin to probe'
        required: false
        default: 'https://app.fuzefront.com'
      slugs:
        description: 'Comma-separated app slugs to probe (blank = the curated default below)'
        required: false
        default: ''
  pull_request:
    # Path-scoped on purpose: this runs against LIVE production, so it must not
    # fire on every PR. It fires when the probe ITSELF changes, so a change to
    # the instrument is validated by using it — the alternative is shipping a
    # detector whose first real execution is after it merges.
    paths:
      - 'scripts/probe-prod-federation.mjs'
      - 'scripts/check-federated-assets.mjs'
      - '.github/workflows/prod-federation-probe.yml'
  schedule:
    # Daily. A remote can stop loading without any commit here — a product repo
    # redeploys, an ingress changes, a chart bumps an image. Catching that needs
    # a clock, not a PR.
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  probe:
    name: probe federated remotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Probe every federated remote
        env:
          BASE_URL: ${{ inputs.base_url || 'https://app.fuzefront.com' }}
          SLUGS_OVERRIDE: ${{ inputs.slugs }}
        run: |
          set -uo pipefail

          # ONE definition of the roster, not two. It used to be pasted into both
          # the workflow_dispatch input default and this env fallback, so the two
          # could drift apart silently and a dispatched run and a scheduled run
          # would probe different sets.
          #
          # Curated rather than read from scripts/expected-portal-apps.json: that
          # roster deliberately carries no integration type, and probing an iframe
          # app for a remoteEntry fabricates a failure. fuzehub and fuzeplan
          # register as iframe and are excluded for exactly that reason.
          #
          # `slug` probes the two same-origin layouts (/apps/<slug>/remoteEntry.js
          # and /apps/<slug>/assets/remoteEntry.js) and reports which answered.
          # `slug=<absolute url>` probes the entry a manifest declares verbatim.
          #
          # `keys` needs the second form because its slug and its serve path
          # differ: izzywdev/FuzeKeys registration/manifest.json declares
          # "slug": "keys" with remoteEntry "/apps/fuzekeys/remoteEntry.js", so
          # probing /apps/keys/ would fabricate a 404. That is a legitimate case
          # of CLAUDE.md's rule that the slug and the serve path are independent.
          #
          # This entry previously read
          # `keys=https://keys.prod.fuzefront.com/apps/fuzekeys/remoteEntry.js`,
          # justified by a comment claiming fuzekeys "hosts its remote
          # off-origin". The manifest says otherwise -- the declared entry is a
          # RELATIVE path, which the host resolves against its own origin
          # (frontend/src/utils/loadFederatedApp.ts). That absolute URL answered
          # 404 and the probe reported `keys` as broken on every run while the
          # authenticated census reported it PASS. A probe that fabricates a
          # failure is as harmful as one that hides a real one.
          DEFAULT_SLUGS="finance,fuzequality,fuzeagent,fuzebi,call,clock,contact,deploy,executive,keys=${BASE_URL%/}/apps/fuzekeys/remoteEntry.js,market,fuzemerchandize,picker,sales,service,fuzesocial,fuzex"

          SLUGS="${SLUGS_OVERRIDE:-$DEFAULT_SLUGS}"
          echo "probing: $SLUGS"
          node scripts/probe-prod-federation.mjs --base "$BASE_URL" --slugs "$SLUGS"
