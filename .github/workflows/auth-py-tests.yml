name: fuzefront-auth (Python) tests

# The publish workflow runs these only on a release tag, i.e. AFTER merge. This
# job runs them on every PR that touches the package, so a regression in a
# fail-closed verifier is caught before it can be tagged.

on:
  pull_request:
    paths:
      - 'packages/auth-py/**'
      - '.github/workflows/auth-py-tests.yml'
  push:
    branches: [master]
    paths:
      - 'packages/auth-py/**'

permissions:
  contents: read

concurrency:
  group: auth-py-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: '${{ matrix.python-version }}' }
      - name: Install and test
        working-directory: packages/auth-py
        run: |
          pip install -q -e '.[dev]'
          pytest -q
