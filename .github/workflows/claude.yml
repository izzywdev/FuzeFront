name: Claude

# Lets maintainers delegate work to Claude by mentioning @claude in an issue,
# issue comment, PR, or review comment. Claude reads the thread + repo and
# responds / pushes a claude/** branch. The companion `claude-auto-pr.yml`
# workflow then opens a draft PR from that branch (issue -> PR autonomy).
#
# LLM credential: routed through .github/actions/llm-endpoint (LiteLLM in-cluster
# with automatic fallback to a direct vendor). Requires repo secret LITELLM_FUZE_KEY
# and/or ANTHROPIC_API_KEY (at least one). See that action for the design.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v5
        with:
          fetch-depth: 1

      - name: Resolve LLM endpoint (LiteLLM in-cluster, vendor fallback)
        id: llm
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Claude
        uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d  # v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.llm.outputs.base-url }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.llm.outputs.auth-token }}
        with:
          anthropic_api_key: ${{ steps.llm.outputs.auth-token }}
          show_full_output: true
          settings: ${{ secrets.PENPOT_MCP_URL != '' && format('{{"mcpServers":{{"penpot":{{"type":"sse","url":"{0}"}}}}}}', secrets.PENPOT_MCP_URL) || '{}' }}
