name: DS Agent Runner

# Reusable agent runner — called by ds-propagate.yml via workflow_dispatch.
# GITHUB_TOKEN dispatching workflow_dispatch DOES fire the target workflow,
# unlike issue/push events. This is the fully-automated, no-PAT path.
#
# LLM credential: routed through .github/actions/llm-endpoint (LiteLLM in-cluster
# with automatic fallback to a direct vendor). Requires repo secret LITELLM_FUZE_KEY
# and/or ANTHROPIC_API_KEY (at least one).
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Full prompt for the Claude agent'
        required: true
      branch_hint:
        description: 'Suggested branch name for the agent to use'
        required: false
        default: ''

jobs:
  run-claude-agent:
    name: Run Claude agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve LLM endpoint (LiteLLM in-cluster, vendor fallback)
        id: llm
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Claude Code Action
        uses: ./.github/actions/fuze-code-action
        with:
          # RUNG 1a: subscription OAuth, tried BEFORE the metered LiteLLM/API-key
          # path. Omitting it does not fail loudly -- the rung is skipped by name
          # and the chain silently falls through to per-token billing, which is
          # what every run here was doing until 2026-09-16.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ steps.llm.outputs.auth-token }}
          task-prompt: ${{ inputs.prompt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
