name: Post-prod E2E (live smoke)

# Runs the READ-ONLY post-production Playwright smoke
# (frontend/e2e/post-prod/live-smoke.spec.ts) against the LIVE platform.
# Black-box over the public ingress — no cluster credentials needed.
#
# Triggered manually (workflow_dispatch), typically right after a release
# rollout, to verify: shell serves, /login is Authentik+Google-only (no local
# form), OIDC handoff works, and Module-Federation apps load for an
# authenticated session.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://app.fuzefront.com'
      run_authn_boundary:
        description: 'Also run the AuthN provider-boundary smoke (expected-fail until the AuthN deploy lands)'
        type: boolean
        required: false
        default: false
      connectors_only:
        description: 'Collect only connector UX evidence (one attempt); full post-deploy suite remains the default'
        type: boolean
        required: false
        default: false

  # Called as a reusable workflow by prod-post-deploy.yml after each release
  workflow_call:
    inputs:
      connectors_only:
        type: boolean
        required: false
        default: false
      base_url:
        description: 'Target base URL'
        type: string
        required: false
        default: 'https://app.fuzefront.com'
      run_authn_boundary:
        description: 'Also run the AuthN provider-boundary smoke'
        type: boolean
        required: false
        default: false
    secrets:
      POST_PROD_EMAIL:
        required: false
      POST_PROD_PASSWORD:
        required: false
      INTERNAL_PROVISION_SECRET:
        required: false
      # Dedicated master-admin synthetic for the Portals directory
      # list-contents assertion (portals-directory-smoke.spec.ts test 2).
      # Absent → that test self-skips as missing coverage; the nav-render
      # test still runs on the regular synthetic.
      POST_PROD_ADMIN_EMAIL:
        required: false
      POST_PROD_ADMIN_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: post-prod-e2e
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Playwright live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run post-prod smoke
        env:
          CONNECTORS_ONLY: ${{ inputs.connectors_only || false }}
          POST_PROD_BASE_URL: ${{ inputs.base_url || 'https://app.fuzefront.com' }}
          # Synthetic account for the authenticated journey (API login path).
          # Falls back to the seeded admin creds inside the spec when unset.
          POST_PROD_EMAIL: ${{ secrets.POST_PROD_EMAIL }}
          POST_PROD_PASSWORD: ${{ secrets.POST_PROD_PASSWORD }}
          # Internal provision secret — required only for the credential-drift self-heal
          # path in test 7. When POST_PROD_PASSWORD no longer matches the identity account
          # (e.g. the secret was rotated), the spec calls
          # POST /api/v1/security/admin/reset-password (tenant-aware, routes through the
          # security service's accountApi) to reset it, then retries sign-in.
          # Without this secret the spec fails with a clear diagnostic instead of
          # silently looping on 401.
          INTERNAL_PROVISION_SECRET: ${{ secrets.INTERNAL_PROVISION_SECRET }}
          # Master-admin synthetic — gates the Portals directory list-contents
          # assertion; when unset that one test self-skips as missing coverage.
          POST_PROD_ADMIN_EMAIL: ${{ secrets.POST_PROD_ADMIN_EMAIL }}
          POST_PROD_ADMIN_PASSWORD: ${{ secrets.POST_PROD_ADMIN_PASSWORD }}
        run: |
          cd frontend
          if [[ "$CONNECTORS_ONLY" == 'true' ]]; then
            npx playwright test --config playwright.post-prod.config.ts connectors-catalog-smoke.spec.ts --retries=0
          else
            npx playwright test --config playwright.post-prod.config.ts --grep-invert "@authn-pending-deploy"
          fi

      # AuthN provider-boundary smoke (contract PR #243). Runs only when
      # explicitly requested; until the AuthN deploy lands these tests self-skip
      # (gated on /api/v1/security/methods == 200), and `continue-on-error`
      # keeps a pre-deploy run from turning the job red. After the deploy,
      # dispatch with run_authn_boundary=true to make it the AuthN gate.
      - name: Run AuthN boundary smoke (pending-deploy allowed to fail)
        if: ${{ inputs.run_authn_boundary }}
        continue-on-error: true
        env:
          POST_PROD_BASE_URL: ${{ inputs.base_url || 'https://app.fuzefront.com' }}
        run: cd frontend && npx playwright test --config playwright.post-prod.config.ts --grep "@authn-pending-deploy"

      # Preserve evidence before optional export tooling: a slow package mirror
      # or cancelled transcode must not discard the actual browser result.
      - name: Upload raw report before video conversion
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-prod-playwright-raw
          path: |
            frontend/playwright-report-post-prod/
            frontend/test-results-post-prod/
          retention-days: 14

      - name: Export connector UX video at 3 fps
        if: always()
        timeout-minutes: 3
        run: |
          if find frontend/test-results-post-prod -path '*connectors-catalog-smoke*' -name '*.webm' -print -quit | grep -q .; then
            if ! command -v ffmpeg >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            while IFS= read -r -d '' video; do
              ffmpeg -nostdin -y -i "$video" -vf fps=3 -an -c:v libx264 -pix_fmt yuv420p "${video%.webm}-3fps.mp4"
            done < <(find frontend/test-results-post-prod -path '*connectors-catalog-smoke*' -name '*.webm' -print0)
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-prod-playwright-report
          path: |
            frontend/playwright-report-post-prod/
            frontend/test-results-post-prod/
          retention-days: 14

      # Give the FuzeQuality journey one deterministic filename. Playwright's
      # generated directory includes project/retry suffixes and the broader
      # suite records other videos, so uploading **/video.webm would make this
      # artifact ambiguous to an operator.
      - name: Stage FuzeQuality production video
        # Connector-only dispatches intentionally do not run the FuzeQuality
        # journey, so they must not require its evidence. Full runs still fail
        # closed below when the journey did not produce a recording.
        if: ${{ always() && !inputs.connectors_only }}
        shell: bash
        run: |
          mkdir -p frontend/post-prod-evidence
          mapfile -d '' videos < <(find frontend/test-results-post-prod -type f -path '*fuzequality-portal-smoke*' -name 'video.webm' -print0 | sort -z)
          if (( ${#videos[@]} == 0 )); then
            echo '::error::FuzeQuality production journey did not produce a Playwright video'
            exit 1
          fi
          cp "${videos[-1]}" frontend/post-prod-evidence/fuzequality-portal-smoke.webm

      # Keep the successful FuzeQuality browser recording easy to find instead
      # of burying it in the HTML report. This is evidence for /app/fuzequality.
      - name: Upload FuzeQuality post-production video
        if: ${{ always() && !inputs.connectors_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzequality-post-prod-playwright-video
          path: frontend/post-prod-evidence/fuzequality-portal-smoke.webm
          if-no-files-found: error
          retention-days: 30

      # FuzeX is a tenant-scoped design workspace.  Publish its recording
      # separately so the release evidence can be reviewed without searching
      # through the combined post-prod report.
      - name: Upload FuzeX post-production video
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzex-post-prod-playwright-video
          path: frontend/test-results-post-prod/**/fuzex-workspace-smoke-*/video.webm
          if-no-files-found: warn
          retention-days: 30
