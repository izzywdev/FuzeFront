name: gate-route-ownership

# Every API path must be implemented by the service the ingress actually routes
# it to.
#
# The ingress splits /api across services by LONGEST-PREFIX match — `/api/apps`
# to fuzefront-applications, the remaining `/api` to fuzefront-backend. A route
# can therefore be fully implemented, unit-tested, and green in CI while being a
# 404 in every deployed environment, because it was mounted on a service that
# does not own its path prefix. That is exactly what happened to the app
# installation endpoints, and nothing in CI could see it: type-check, lint, unit
# tests and `helm template | kubeconform` are each individually happy. The defect
# lives in the SEAM between the chart and the code.
#
# NO `paths:` FILTER on pull_request, and that is load-bearing rather than an
# oversight — the same rule workspace-deps-check.yml and gate-sealed-keys.yml
# already state: filter INSIDE a job, never on the trigger, for anything the
# ruleset requires.
#
# A path-filtered workflow does not run at all on a PR that touches none of its
# paths, so the check run is never CREATED — and a required context that is never
# created leaves the PR permanently at "Expected — waiting for status to be
# reported", with no red to look at and nothing to re-run (measured on four
# sampled PRs, 2026-08-23). A check that cannot be required is a check that
# cannot stop a merge, and master here is deploy-on-push. See
# docs/runbooks/widen-required-checks.md.
#
# Nothing is filtered inside the job either: `check-route-ownership.mjs` renders
# the chart and measures a WHOLE-REPO invariant — every contract route against
# the service the ingress actually routes it to — not a diff. It is a node script
# over a `helm template`, so running it unconditionally costs seconds.
#
# The trigger did have one thing right, kept here in spirit: the seam has two
# sides. A chart-only trigger would miss a router moving between services; a
# code-only trigger would miss an ingress rule being re-pointed. Running
# unconditionally covers both by construction.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'deploy/helm/fuzefront/**'
      - 'deploy/route-ownership.json'
      - 'backend/**'
      - 'scripts/check-route-ownership.mjs'

permissions:
  contents: read

jobs:
  route-ownership:
    name: API paths are served by the service that implements them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      # The gate's own logic — longest-prefix resolution, ingress parsing, and
      # the mount check — verified against a fixture, including a case asserting
      # it FAILS on the original regression. A gate never shown to fail on the
      # bug it was written for is not evidence of anything.
      - name: Unit-test the gate itself
        run: node --test scripts/__tests__/check-route-ownership.test.mjs

      - name: Check route ownership against the rendered chart
        run: node scripts/check-route-ownership.mjs
