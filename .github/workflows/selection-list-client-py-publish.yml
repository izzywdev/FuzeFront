name: Publish fuzefront-selection-list-client to PyPI

# Triggered when a tag matching the pattern below is pushed. Calls the shared
# python-publish.yml reusable workflow with the correct inputs.
#
# Versioning: bump the version in pyproject.toml, commit to master, then tag:
#
#   git tag selection-list-client-py/v1.0.1
#   git push origin selection-list-client-py/v1.0.1
#
# The verify step in python-publish.yml installs the package from PyPI and
# imports it, proving the upload succeeded (FFRNT-264).
#
# NOTE: PyPI trusted publishing requires a one-time setup in the PyPI web UI:
#   Repository: izzywdev/FuzeFront
#   Workflow:   python-publish.yml
#   Environment: pypi
# This is a human action that cannot be automated.

on:
  push:
    tags:
      - "selection-list-client-py/v*"

jobs:
  publish:
    uses: ./.github/workflows/python-publish.yml
    with:
      package-dir: packages/selection-list-client-py
      package-name: fuzefront-selection-list-client
      python-version: "3.12"
