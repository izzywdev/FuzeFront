name: Mobile Android post-production acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - name: Test acceptance checker
        run: node --test scripts/check-mobile-postprod.test.mjs
      - name: Verify first-wave APKs and standalone origins
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
        run: node scripts/check-mobile-postprod.mjs --report=mobile-postprod-report.json
      - name: Attach full per-product report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-postprod-report
          path: mobile-postprod-report.json
          if-no-files-found: ignore
