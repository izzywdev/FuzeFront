# Publish the auth-ui package to GitHub Packages under the @izzywdev scope.
#
# GitHub Packages requires the npm scope to match the repository owner, so the
# canonical @fuzeone/auth-ui name cannot publish until the org transfer
# completes (see packages-publish.yml, which stays the long-term path and no-ops
# until then). Consuming apps need auth-ui TODAY, so this workflow publishes the
# same build under an owner-scoped alias name:
#
#   @fuzeone/auth-ui -> @izzywdev/fuzefront-auth-ui
#
# Consumers install via an npm alias so their imports keep the canonical name:
#
#   "@fuzeone/auth-ui": "npm:@izzywdev/fuzefront-auth-ui@^0.1.0"
#
# Once the org transfer lands and packages-publish.yml activates, consumers drop
# the alias and this workflow is deleted. Publishing is idempotent: a version that
# already exists in the registry is skipped, not overwritten. No git push / tag is
# made, so master's required_signatures protection is never involved.
name: Publish auth-ui (alias scope)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/auth-ui/**'

concurrency:
  group: auth-ui-packages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'izzywdev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@izzywdev'

      # Install the whole workspace so auth-ui's @fuzeone/* deps
      # (design-system, security-client) resolve from SOURCE via workspace
      # symlinks. A per-package `npm install --workspaces=false` instead tries to
      # fetch @fuzeone/design-system@1.0.0 from the registry, which 404s — it
      # has never been published (the reason these alias workflows exist).
      - name: Install workspace (links @fuzeone/* from source)
        run: npm ci --no-audit --no-fund

      # Build the in-repo dependencies first (auth-ui imports their built output
      # / types), then auth-ui itself — all via workspace-scoped scripts.
      - name: Build design-system, security-client, then auth-ui
        run: |
          npm run build -w @fuzeone/design-system
          npm run build -w @fuzeone/security-client
          npm run build -w @fuzeone/auth-ui

      - name: Publish @izzywdev/fuzefront-auth-ui
        working-directory: packages/auth-ui
        env:
          # Both names: setup-node's .npmrc uses NODE_AUTH_TOKEN, while the
          # repo-root .npmrc (pulled into scope by the root `npm ci`) references
          # ${GITHUB_TOKEN}. Set both so whichever wins precedence, auth resolves.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pin an explicit .npmrc in the package dir as the closest (winning)
          # config, so registry+auth are deterministic regardless of ambient files.
          cat > .npmrc <<'NPMRC'
          @izzywdev:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          VERSION=$(npm pkg get version | tr -d '"')
          npm pkg set name=@izzywdev/fuzefront-auth-ui
          if npm view "@izzywdev/fuzefront-auth-ui@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@izzywdev/fuzefront-auth-ui@${VERSION} already published — skipping."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
