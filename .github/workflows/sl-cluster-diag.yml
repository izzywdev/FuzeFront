name: sl-cluster-diag

# READ-ONLY in-cluster diagnostic for selection-list-service (FF-EPIC-17 go-live).
# Runs on the in-cluster `fuzefront` ARC runner and reads the k8s API with the
# runner pod's mounted service account (same pattern as prod-unleash-ops) — so it
# needs NO FUZEINFRA_DISPATCH_TOKEN (which is currently expired) and no kubectl.
#
# It only GETs pods / deployment / job / events / pod logs in the `fuzefront`
# namespace to explain why the service is returning 503 ("no available server").
# It reads NO Secrets and never prints secret values. Safe to run any time.
#
# Auto-runs once when this file lands on master (push path filter) and is also
# dispatchable. Delete it once the deploy is healthy.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sl-cluster-diag.yml'

permissions:
  contents: read

concurrency:
  group: sl-cluster-diag
  cancel-in-progress: false

jobs:
  diag:
    name: Inspect selection-list-service (read-only)
    runs-on: fuzefront
    timeout-minutes: 5
    steps:
      - name: Query the k8s API via the runner service account
        env:
          NS: fuzefront
          APP: fuzefront-selection-list-service
          JOB: fuzefront-svcdb-selection-list-service
        run: |
          set -euo pipefail
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN=$(cat "$SA/token")
          CA="$SA/ca.crt"
          API=https://kubernetes.default.svc
          k() { curl -sS --cacert "$CA" -H "Authorization: Bearer $TOKEN" "$API$1"; }

          echo "::group::Deployment status"
          { k "/apis/apps/v1/namespaces/$NS/deployments/$APP" || true; } | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("could not parse deployment:", e); sys.exit(0)
          if d.get("kind") == "Status":
              print("deployment GET ->", d.get("status"), d.get("reason"), d.get("message")); sys.exit(0)
          s = d.get("status", {})
          print("spec.replicas :", d.get("spec", {}).get("replicas"))
          print("available     :", s.get("availableReplicas"))
          print("ready         :", s.get("readyReplicas"))
          print("updated       :", s.get("updatedReplicas"))
          print("unavailable   :", s.get("unavailableReplicas"))
          for c in s.get("conditions", []):
              print("cond:", c.get("type"), c.get("status"), "|", c.get("reason"), "|", c.get("message"))
          '
          echo "::endgroup::"

          echo "::group::Pods"
          PODS_JSON=$(k "/api/v1/namespaces/$NS/pods?labelSelector=app%3D$APP" || true)
          echo "$PODS_JSON" | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("could not parse pods response:", e); sys.exit(0)
          if d.get("kind") == "Status":
              print("pods LIST -> API error:", d.get("status"), d.get("code"), d.get("reason"), "|", d.get("message"))
              print("(NOT an empty pod list — the query itself failed; e.g. 403 means the runner RBAC lacks pod read)")
              sys.exit(0)
          items = d.get("items", [])
          print("pod count:", len(items))
          for p in items:
              m = p.get("metadata", {}); st = p.get("status", {})
              print("---", m.get("name"), "| phase:", st.get("phase"))
              for c in st.get("conditions", []):
                  print("   cond:", c.get("type"), c.get("status"), c.get("reason") or "", (c.get("message") or "")[:200])
              for cs in st.get("containerStatuses", []) or []:
                  state = cs.get("state", {})
                  last = cs.get("lastState", {})
                  print("   container:", cs.get("name"), "ready:", cs.get("ready"), "restarts:", cs.get("restartCount"))
                  for label, blk in (("state", state), ("lastState", last)):
                      for kind, v in blk.items():
                          reason = v.get("reason")
                          exit_code = v.get("exitCode")
                          msg = (v.get("message") or "")[:300]
                          print("     %s.%s: reason=%s exitCode=%s msg=%s" % (label, kind, reason, exit_code, msg))
          '
          echo "::endgroup::"

          echo "::group::Bootstrap Job (DB role/db provisioner, pre-sync hook)"
          { k "/apis/batch/v1/namespaces/$NS/jobs/$JOB" || true; } | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("could not parse job response:", e); sys.exit(0)
          if d.get("kind") == "Status":
              print("job GET ->", d.get("status"), d.get("reason"), d.get("message")); sys.exit(0)
          s = d.get("status", {})
          print("active:", s.get("active"), "succeeded:", s.get("succeeded"), "failed:", s.get("failed"))
          for c in s.get("conditions", []):
              print("cond:", c.get("type"), c.get("status"), "|", c.get("reason"), "|", c.get("message"))
          '
          echo "::endgroup::"

          echo "::group::Recent events mentioning selection-list"
          { k "/api/v1/namespaces/$NS/events" || true; } | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("could not parse events response:", e); sys.exit(0)
          if d.get("kind") == "Status":
              print("events LIST -> API error:", d.get("status"), d.get("code"), d.get("reason"), "|", d.get("message")); sys.exit(0)
          evs = d.get("items", [])
          def key(e):
              return e.get("lastTimestamp") or e.get("eventTime") or ""
          evs = [e for e in evs if "selection-list" in json.dumps(e.get("involvedObject", {})).lower()]
          for e in sorted(evs, key=key)[-40:]:
              io = e.get("involvedObject", {})
              print(key(e), e.get("type"), e.get("reason"), "|", io.get("kind"), io.get("name"), "|", (e.get("message") or "")[:300])
          print("(matched events:", len(evs), ")")
          '
          echo "::endgroup::"

          echo "::group::Pod logs (current + previous, tail 80)"
          FIRST_POD=$(echo "$PODS_JSON" | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          items = d.get("items", []) if d.get("kind") != "Status" else []
          print(items[0]["metadata"]["name"] if items else "")
          ')
          if [ -n "$FIRST_POD" ]; then
            echo "--- pod: $FIRST_POD (current) ---"
            k "/api/v1/namespaces/$NS/pods/$FIRST_POD/log?container=selection-list-service&tailLines=80" || echo "(no current log)"
            echo "--- pod: $FIRST_POD (previous, if crashlooped) ---"
            k "/api/v1/namespaces/$NS/pods/$FIRST_POD/log?container=selection-list-service&previous=true&tailLines=80" || echo "(no previous log)"
          else
            echo "(no pod name resolved — see the Pods section above: either an API error/403 was reported, or the list is genuinely empty, meaning the sync never created the pod / the pre-sync Job blocks it)"
          fi
          echo "::endgroup::"
