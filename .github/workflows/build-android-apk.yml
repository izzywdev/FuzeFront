name: Build Android APK (TWA)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android version code (integer, e.g. 2)'
        required: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    name: Build & sign TWA APK
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Validate mobile and standalone contract
        run: node scripts/check-mobile-release.mjs

      - name: Set up Android SDK
        # android-actions/setup-android@v4.0.1 fails: sdkmanager no longer provides
        # the deprecated 'tools' package. ubuntu-latest ships cmdline-tools already;
        # accept licences and install only what bubblewrap needs.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap to skip interactive JDK/SDK prompts
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" \
            > ~/.bubblewrap/config.json

      - name: Restore keystore from secret
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 is required for release builds" >&2; exit 1; }
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/product-release.keystore

      - name: Create ephemeral keystore for test build
        if: env.RELEASE_BUILD != 'true'
        run: |
          mkdir -p android/keystore
          ALIAS=$(node -p "require('./android/twa-manifest.json').signingKey.alias")
          keytool -genkeypair -noprompt \
            -keystore android/keystore/product-release.keystore \
            -storepass android -keypass android -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=CI Test Build, OU=FuzeOne, O=FuzeFront, C=IL"

      - name: Set version code from input or run number
        id: version
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          CODE="${INPUT_VERSION_CODE:-$RUN_NUMBER}"
          [[ "$CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version code must be a positive integer" >&2; exit 1; }
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION_NAME="${BASE_VERSION}+build.${CODE}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # Patch appVersionCode in the manifest — pass code via env so the
          # node script never interpolates untrusted data directly in the script.
          VERSION_CODE="$CODE" VERSION_NAME="$VERSION_NAME" node -e "
            const fs = require('fs');
            const code = process.env.VERSION_CODE;
            const m = JSON.parse(fs.readFileSync('android/twa-manifest.json','utf8'));
            m.appVersionCode = parseInt(code, 10);
            m.appVersion = process.env.VERSION_NAME;
            m.signingKey.path = './keystore/product-release.keystore';
            fs.writeFileSync('android/twa-manifest.json', JSON.stringify(m, null, 2));
          "
          echo "product=$(node -p "require('./android/twa-manifest.json').name")" >> "$GITHUB_OUTPUT"
          echo "slug=$(node -p "require('./android/twa-manifest.json').packageId.replace(/[^a-z0-9]+/gi, '-').toLowerCase()")" >> "$GITHUB_OUTPUT"
          echo "host=$(node -p "require('./android/twa-manifest.json').host")" >> "$GITHUB_OUTPUT"
          echo "alias=$(node -p "require('./android/twa-manifest.json').signingKey.alias")" >> "$GITHUB_OUTPUT"

      - name: Scaffold Android project from TWA manifest
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [[ "$RELEASE_BUILD" != "true" ]]; then
            export KEYSTORE_STORE_PASSWORD=android
            export KEYSTORE_KEY_PASSWORD=android
          fi
          # Patch passwords from secrets and redirect icon URLs to a local HTTP server.
          # bubblewrap downloads icons during project generation; the prod URL may not be
          # live yet, so we serve the committed icons from frontend/public locally instead.
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.signingKey.storePassword = process.env.KEYSTORE_STORE_PASSWORD || '';
            m.signingKey.keyPassword   = process.env.KEYSTORE_KEY_PASSWORD || '';
            m.iconUrl           = 'http://localhost:8080/icons/pwa-512x512.png';
            m.maskableIconUrl   = 'http://localhost:8080/icons/pwa-maskable-512x512.png';
            m.monochromeIconUrl = 'http://localhost:8080/icons/pwa-512x512.png';
            m.webManifestUrl    = 'http://localhost:8080/manifest.webmanifest';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "
          # Serve frontend/public so bubblewrap can fetch icons and the web manifest
          python3 -m http.server 8080 --directory ../frontend/public &
          HTTP_PID=$!
          sleep 1
          # bubblewrap update reads twa-manifest.json and scaffolds the Android Gradle project
          bubblewrap update --skipPwaValidation --skipVersionUpgrade
          kill $HTTP_PID || true

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          # Gradle signing via key.properties doesn't apply (bubblewrap template quirk).
          # Build the unsigned APK then sign it explicitly with apksigner.
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Sign and verify release APK
        if: env.RELEASE_BUILD == 'true'
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_STORE_PASSWORD is required" >&2; exit 1; }
          test -n "$KEYSTORE_KEY_PASSWORD" || { echo "ANDROID_KEYSTORE_KEY_PASSWORD is required" >&2; exit 1; }

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$APKSIGNER" sign \
            --ks ./keystore/product-release.keystore \
            --ks-pass "pass:${KEYSTORE_STORE_PASSWORD}" \
            --key-pass "pass:${KEYSTORE_KEY_PASSWORD}" \
            --ks-key-alias "${{ steps.version.outputs.alias }}" \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: Locate signed APK
        id: apk
        working-directory: android
        run: |
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            APK=$(find . -path "*/release/app-release.apk" | head -1)
          else
            APK=$(find . -path "*/debug/app-debug.apk" | head -1)
          fi
          test -n "$APK" || { echo "Expected APK was not produced" >&2; exit 1; }
          DEST="${{ steps.version.outputs.slug }}-android-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$DEST"
          echo "path=android/$DEST" >> "$GITHUB_OUTPUT"
          echo "Found: $DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.version.outputs.slug }}-android-v${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release with APK
        if: env.RELEASE_BUILD == 'true'
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: android-v${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.product }} Android v${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.product }} Android APK (TWA)

            Trusted Web Activity wrapping **https://${{ steps.version.outputs.host }}**.

            ### Install
            1. Download the attached `.apk`
            2. On your Android phone: **Settings → Apps → Install unknown apps** → allow your browser/Files app
            3. Open the downloaded APK and tap **Install**
            4. Launch **${{ steps.version.outputs.product }}** from your home screen

            The app opens Chrome in standalone mode (no browser chrome) — backed by your live prod cluster.

            ### Requirements
            - Android 5.0+ (API 21+)
            - Chrome 72+ installed on device
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          overwrite_files: true
