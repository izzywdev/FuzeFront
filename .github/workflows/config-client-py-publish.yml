name: Publish fuzefront-config-client (Python)

# Builds the wheel + sdist for packages/config-client-py and attaches them to
# a GitHub Release, so Python microservices in other family repos can install
# a PINNED artifact rather than tracking a branch.
#
# Mirrors identity-py-publish.yml exactly (see that file's comment for the
# "why a Release asset and not a registry" rationale): GitHub Packages has no
# PyPI-compatible registry, and this is a private/proprietary family package
# so public PyPI is out. A Release asset is the one private-by-default
# artifact store the family already authenticates against (the same
# GITHUB_TOKEN that serves npm.pkg.github.com).
#
# Consumers install either:
#   pip install https://github.com/izzywdev/FuzeFront/releases/download/config-client-py-vX.Y.Z/fuzefront_config_client-X.Y.Z-py3-none-any.whl
#   pip install "git+https://github.com/izzywdev/FuzeFront.git@config-client-py-vX.Y.Z#subdirectory=packages/config-client-py"
# The first is preferred -- it is a pinned immutable artifact and needs no git.

on:
  push:
    tags: ['config-client-py-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match pyproject.toml)'
        required: true

permissions:
  contents: write # create the Release + upload assets

concurrency:
  group: config-client-py-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Verify the tag matches pyproject version
        # A tag that disagrees with pyproject produces a wheel whose filename
        # and metadata contradict the release it is attached to -- the kind
        # of mismatch that is only discovered by a consumer, months later.
        #
        # `inputs.version` and `github.*` reach the shell through env, NEVER
        # through ${{ }} interpolation in `run:`. A dispatch input is
        # arbitrary attacker-supplied text; interpolated directly it is a
        # command-injection sink, and this job holds `contents: write` and
        # publishes an artifact consumers install -- the worst possible place
        # to have one.
        #
        # Also emits `version` (the bare X.Y.Z, no 'config-client-py-v'
        # prefix) as a step output, so the Release body below can build the
        # correct wheel filename -- the wheel is
        # `fuzefront_config_client-X.Y.Z-py3-none-any.whl`, NOT
        # `...-config-client-py-vX.Y.Z-...`.
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd packages/config-client-py
          PY_VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VER="$INPUT_VERSION"
          else
            TAG_VER="${REF_NAME#config-client-py-v}"
          fi
          echo "pyproject=$PY_VER  tag=$TAG_VER"
          [ "$PY_VER" = "$TAG_VER" ] || { echo "::error::pyproject version $PY_VER != tag $TAG_VER"; exit 1; }
          echo "version=$PY_VER" >> "$GITHUB_OUTPUT"

      - name: Test before publishing
        # The package is dependency-free, so the suite needs no services.
        # There is no excuse for shipping it untested.
        run: |
          cd packages/config-client-py
          pip install -q -e '.[dev]'
          pytest -q

      - name: Build wheel + sdist
        run: |
          cd packages/config-client-py
          pip install -q build
          python -m build

      - name: Verify dist contents
        # A green build step is not evidence that anything was produced --
        # confirm the wheel actually exists before attaching it to a Release.
        run: |
          cd packages/config-client-py
          ls -lh dist/
          if [ -z "$(ls dist/*.whl 2>/dev/null)" ]; then
            echo "::error::No wheel found in dist/ -- build failed silently."
            exit 1
          fi

      - name: Attach to the Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7  # v2
        with:
          files: packages/config-client-py/dist/*
          tag_name: ${{ github.ref_name }}
          name: fuzefront-config-client ${{ github.ref_name }}
          body: |
            Python client for the FuzeFront config-service -- namespaced,
            hierarchical key/value configuration with typed key metadata and
            provenance-carrying resolution.

            Contract: `services/config-service/openapi.yaml`
            Node peer: `@fuzefront/config-client`

            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fuzefront_config_client-${{ steps.version.outputs.version }}-py3-none-any.whl
            ```
          fail_on_unmatched_files: true
