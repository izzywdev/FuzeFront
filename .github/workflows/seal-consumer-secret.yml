name: Seal CONSUMER_REGISTRATION_SECRET

# Generates and seals a CONSUMER_REGISTRATION_SECRET value into
# deploy/contabo/sealed/fuzefront-secrets.yaml and commits it.
#
# Run ONCE after first cluster setup (or to rotate the secret).
#
# NO cluster credential is used. Sealing is asymmetric and encrypt-only:
# kubeseal only ever needs the sealed-secrets controller's PUBLIC certificate,
# never a kubeconfig or decrypt key. This workflow used to fetch that cert live
# via `kubeseal --fetch-cert` against KUBE_CONFIG — the only place that secret
# was used — which is an unnecessary cluster credential for a CI job. It now
# seals OFFLINE via scripts/seal-secret.sh against the cert committed at
# deploy/sealed-secrets/sealing-cert.pem, mirroring FuzeInfra's own
# scripts/seal-secret.sh convention (rotate-sealed-secret.yml uses the same
# script/cert). The KUBE_CONFIG repo secret itself is left in place — nothing
# else in this repo's workflows reads it — for the rare occasion the cert
# needs refreshing after a controller key rotation (see the guard step below).
#
# Safety: sealing merges only the CONSUMER_REGISTRATION_SECRET key into the
# existing SealedSecret — every other key (DB_PASSWORD, JWT_SECRET, etc.)
# is preserved. A wrong ciphertext for ONE key does not take down the whole
# Secret: sealed-secrets decrypts each key independently.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print sealed YAML to log without committing"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already sealed
        id: check
        run: |
          if grep -q 'CONSUMER_REGISTRATION_SECRET' deploy/contabo/sealed/fuzefront-secrets.yaml 2>/dev/null; then
            echo "already_sealed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CONSUMER_REGISTRATION_SECRET already present in fuzefront-secrets.yaml — skipping"
          else
            echo "already_sealed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify sealing cert is present and current
        if: steps.check.outputs.already_sealed == 'false'
        run: |
          set -euo pipefail
          CERT=deploy/sealed-secrets/sealing-cert.pem
          REFRESH_HELP="Refresh it (only needed after a sealed-secrets controller key rotation — not a routine step) from an environment with cluster access: kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --fetch-cert > \$CERT, then commit with 'git add -f \$CERT' (it is public key material — safe to publish — but matched by the repo's blanket *.pem gitignore rule, so force-add is expected)."

          if [ ! -f "$CERT" ]; then
            echo "::error::Missing $CERT. Sealing needs the sealed-secrets controller's PUBLIC certificate committed in-repo — this job uses ZERO cluster access. $REFRESH_HELP"
            exit 1
          fi

          if ! openssl x509 -in "$CERT" -noout -checkend 0 >/dev/null 2>&1; then
            END="$(openssl x509 -in "$CERT" -noout -enddate 2>/dev/null | cut -d= -f2)"
            echo "::error::$CERT has EXPIRED (notAfter: ${END:-unknown}). Sealing against a stale cert silently produces a SealedSecret the live controller cannot decrypt — it would fail at pod start, not here. Failing loudly now instead. $REFRESH_HELP"
            exit 1
          fi

          FPR="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          END="$(openssl x509 -in "$CERT" -noout -enddate 2>/dev/null | cut -d= -f2)"
          echo "::notice::Sealing cert OK — SHA256 fingerprint ${FPR}, expires ${END}"

      - name: Install kubeseal
        if: steps.check.outputs.already_sealed == 'false'
        run: |
          KSVER=0.27.3
          curl -sSL \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KSVER}/kubeseal-${KSVER}-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeseal
          kubeseal --version

      - name: Generate and seal secret
        if: steps.check.outputs.already_sealed == 'false'
        id: seal
        run: |
          set -euo pipefail
          umask 077
          TMP="$(mktemp)"; trap 'rm -f "$TMP"' EXIT
          openssl rand -hex 32 | tr -d '[:space:]' > "$TMP"

          # Offline, encrypt-only seal via FuzeInfra's canonical script: needs
          # only the committed public cert, never a kubeconfig or kubectl.
          # --merge-into (inside the script) preserves every other key already
          # in the manifest.
          bash scripts/seal-secret.sh fuzefront/fuzefront-secrets \
            "CONSUMER_REGISTRATION_SECRET=@${TMP}" \
            --cert deploy/sealed-secrets/sealing-cert.pem \
            --out deploy/contabo/sealed/fuzefront-secrets.yaml

          echo "::notice::CONSUMER_REGISTRATION_SECRET sealed and merged"

      - name: Show diff (dry run)
        if: steps.check.outputs.already_sealed == 'false' && inputs.dry_run == 'true'
        run: |
          git diff deploy/contabo/sealed/fuzefront-secrets.yaml

      - name: Commit sealed secret
        if: steps.check.outputs.already_sealed == 'false' && inputs.dry_run == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/contabo/sealed/fuzefront-secrets.yaml
          git commit -m "feat(secrets): seal consumer-registration-secret for app-registry auth"
          git push origin HEAD:master
          echo "::notice::Committed to master — ArgoCD will sync within ~60s"

      - name: Summary
        env:
          ALREADY_SEALED: ${{ steps.check.outputs.already_sealed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "## Result" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ALREADY_SEALED" = "true" ]; then
            echo "- Already present — no action taken" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "- Dry run — sealed YAML NOT committed (see diff in step output)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Sealed and committed to master" >> "$GITHUB_STEP_SUMMARY"
            echo "- ArgoCD syncs fuzefront-secrets within ~60s" >> "$GITHUB_STEP_SUMMARY"
            echo "- Once the pod restarts with CONSUMER_REGISTRATION_SECRET set, FuzeHub can self-register" >> "$GITHUB_STEP_SUMMARY"
          fi
