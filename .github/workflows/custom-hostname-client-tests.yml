name: Custom hostname client tests

# Tests @fuzefront/custom-hostname-client against FuzeInfra's REAL stub provider
# rather than a mock of it.
#
# The stub is the same FastAPI service that runs in production with
# PROVIDER=stub: it returns Cloudflare-shaped records and walks the real
# four-state lifecycle on a timer. Running the suite against it means our
# polling loop, error branching, and status projection are verified by the
# actual contract implementation — a hand-rolled mock would happily agree with
# a wrong assumption about the contract.
#
# It also functions as a drift detector: the spec at
# services/custom-hostname-api/openapi.yaml is a commit-pinned vendored copy
# (UPSTREAM.json), so if FuzeInfra changes the service without us bumping the
# pin, these tests fail against the newer stub.

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'custom-hostname-client/**'
      - 'services/custom-hostname-api/**'
      - '.github/workflows/custom-hostname-client-tests.yml'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Client tests vs FuzeInfra stub
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout FuzeFront
        uses: actions/checkout@v4

      - name: Read pinned FuzeInfra commit
        id: pin
        run: |
          COMMIT=$(jq -r .commit services/custom-hostname-api/UPSTREAM.json)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Pinned FuzeInfra commit: $COMMIT"

      - name: Checkout FuzeInfra at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: izzywdev/FuzeInfra
          ref: ${{ steps.pin.outputs.commit }}
          path: .fuzeinfra-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the vendored spec drifted from the pin
        run: |
          # The whole point of vendoring is that upstream cannot reshape our
          # client silently. If these differ, someone edited the vendored copy
          # by hand instead of bumping the pin.
          diff -u .fuzeinfra-src/services/custom-hostname-api/openapi.yaml \
                  services/custom-hostname-api/openapi.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start the stub provider
        working-directory: .fuzeinfra-src/services/custom-hostname-api
        env:
          PROVIDER: stub
          # No cluster in CI, so the API cannot materialize an Ingress. With
          # routing disabled the service treats routing as satisfied, so the
          # lifecycle still reaches active=true.
          ROUTING_ENABLED: 'false'
          ROUTE_PROFILES: '- {name: fuzefront, namespace: fuzefront, service: fuzefront-frontend, port: 80, tokenEnv: T}'
          T: local-dev-token
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8099 --log-level warning > /tmp/stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/readyz > /dev/null; then
              echo "stub ready"; exit 0
            fi
            sleep 1
          done
          echo "stub failed to become ready"; cat /tmp/stub.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies (workspace root)
        # Install from the workspace ROOT, matching backend-tests.yml: root
        # `overrides` (e.g. the @types/express v4 pin) only apply from there,
        # and custom-hostname-client is a workspace member.
        run: npm ci

      - name: Regenerate types and fail on drift
        working-directory: custom-hostname-client
        run: |
          # src/schema.ts is generated, never hand-edited. If regenerating it
          # produces a diff, the committed types are stale.
          npm run gen:types
          git diff --exit-code -- src/schema.ts

      - name: Lint the contract
        run: npm run lint:contract -w custom-hostname-client

      - name: Type-check
        run: npm run type-check -w custom-hostname-client

      - name: Test
        env:
          CUSTOM_HOSTNAME_STUB_URL: http://127.0.0.1:8099
          CUSTOM_HOSTNAME_STUB_TOKEN: local-dev-token
          # Integration tests skip themselves when the stub is unreachable so a
          # bare checkout still runs the unit suite. In CI the stub IS up, so
          # require them to actually run.
          CUSTOM_HOSTNAME_STUB_REQUIRED: '1'
        run: npm test -w custom-hostname-client

      - name: Stub logs
        if: failure()
        run: cat /tmp/stub.log || true
