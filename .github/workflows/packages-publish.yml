name: Publish packages (GitHub Packages, private)

# On merge to master, version-bump and publish the reusable @fuzeone/* packages
# to GitHub Packages (private/restricted). Lerna with conventional commits detects
# which packages changed since their last release tag, computes the semver bump
# from commit messages (feat->minor, fix->patch, BREAKING CHANGE->major), and
# publishes only those. Private packages (apps + deployed services) are skipped.
#
# WHY THIS WORKFLOW IS CURRENTLY INERT — read before "fixing" it:
#
# GitHub Packages requires an npm scope to match the account that OWNS the repo.
# This repo is owned by the personal account **izzywdev**. The guard used to test
# for a `fuzefront` org, which does not exist and never will, so the job could
# never fire and not one @fuzefront/* package has ever been published.
#
# The org that DOES exist is **FuzeOne** (created 2026-07-21, currently zero
# packages), so the canonical publisher now targets `FuzeOne` / `@fuzeone`.
# It stays a deliberate no-op until the repos are transferred into the FuzeOne
# org — a human action, not an automated one. The moment ownership moves, this
# guard matches and the workflow starts publishing @fuzeone/* with no further
# change. Until then, the ONLY things that publish anything are the five interim
# alias publishers (chat-/auth-ui-/design-system-/security-packages-publish.yml
# and sdk-publish.yml), which ship @izzywdev/fuzefront-* under the personal
# scope. Do not disable those.
#
# github.repository_owner reports the owner's login verbatim ('FuzeOne'); GitHub
# Actions string == is case-insensitive, so this matches 'fuzeone' too.
on:
  push:
    branches: [master]

concurrency:
  group: packages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'FuzeOne'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push lerna version commits + tags
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lerna needs full history for change detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@fuzeone'

      - name: Install
        run: npm ci || npm install

      - name: Build packages (topological, if a build script exists)
        run: npx lerna run build --if-present

      - name: Configure git identity
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Version + publish changed packages
        # --conventional-commits: bump + changelog + tag from commit messages
        # --no-private: skip "private": true packages (apps, deployed services)
        # --yes: non-interactive; [skip ci] avoids retriggering CI on the bump commit
        run: >-
          npx lerna publish --conventional-commits --no-private --yes
          --message "chore(release): publish %s [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
