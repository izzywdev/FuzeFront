name: Nightly Agentic Threat Intelligence

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Initial lookback window
        required: false
        default: '7'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agentic-threat-intel-nightly
  cancel-in-progress: false

jobs:
  collect-report-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_RECIPIENT: izzy.weinberg@gmail.com
      REPORT_PATH: security/agentic/latest-report.md
      UPDATE_BRANCH: automation/agentic-threat-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # Preserve unmerged discoveries from the one rolling PR while rebasing the
      # proposal onto the current default branch. Remote data remains data only.
      - name: Restore pending delta state
        run: |
          if git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"; then
            git checkout "origin/$UPDATE_BRANCH" -- \
              security/agentic/state.json \
              security/agentic/discoveries.json 2>/dev/null || true
          fi

      - name: Validate register
        run: python3 scripts/agentic_threat_intel.py validate

      - name: Fetch and de-duplicate threat metadata
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agentic_threat_intel.py collect \
            --lookback-days '${{ inputs.lookback_days || '7' }}' \
            --output "$REPORT_PATH"

      - name: Upload immutable run report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentic-threat-report-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          retention-days: 90

      - name: Open or update delta pull request
        if: steps.collect.outputs.delta_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DELTA_COUNT: ${{ steps.collect.outputs.delta_count }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$UPDATE_BRANCH"
          git add security/agentic/state.json security/agentic/discoveries.json
          git commit -m "security: ingest $DELTA_COUNT agentic threat-intel records"
          git push --force-with-lease origin "$UPDATE_BRANCH"
          if ! gh pr view "$UPDATE_BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base '${{ github.event.repository.default_branch }}' \
              --head "$UPDATE_BRANCH" \
              --title 'security: update agentic threat-intelligence delta' \
              --body 'Nightly metadata-only delta. Review each linked source and map actionable findings to the control register; remote content has not been executed or supplied to an agent.'
          fi

      - name: Email report
        continue-on-error: true
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.AGENTIC_REPORT_FROM_EMAIL }}
        run: |
          test -n "$SENDGRID_API_KEY" || { echo 'SENDGRID_API_KEY is required' >&2; exit 1; }
          test -n "$FROM_EMAIL" || { echo 'AGENTIC_REPORT_FROM_EMAIL is required' >&2; exit 1; }
          python3 - "$REPORT_PATH" "$FROM_EMAIL" "$REPORT_RECIPIENT" > /tmp/mail.json <<'PY'
          import json, pathlib, sys
          report, sender, recipient = sys.argv[1:]
          body = pathlib.Path(report).read_text(encoding="utf-8")
          print(json.dumps({
              "personalizations": [{"to": [{"email": recipient}]}],
              "from": {"email": sender},
              "subject": "FuzeFront nightly agentic threat-intelligence report",
              "content": [{"type": "text/plain", "value": body}],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer $SENDGRID_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/mail.json
