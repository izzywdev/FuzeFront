name: Prod Unleash ops (enable feature flags)

# Applies pending feature-flag enablement to the production Unleash instance
# via its admin API. Mirrors the prod-authentik-ops.yml pattern.
#
# The workflow runs on the `fuzefront` self-hosted in-cluster runner so it can
# reach http://fuzefront-unleash.fuzefront.svc.cluster.local:4242 without
# needing CF-Access authentication (the admin UI host is Access-gated; the
# in-cluster service is not).
#
# The admin token is read directly from the cluster at runtime via the k8s API
# (curl + the runner pod's mounted service account token) — no GitHub secret or
# kubectl required. The runner's service account has read access to the
# `unleash-secrets` Secret in the `fuzefront` namespace.
#
# Trigger via GitHub Actions → "Run workflow".
# The `flags` input controls which pre-defined flag set to apply.

on:
  workflow_dispatch:
    inputs:
      flags:
        description: |
          Which flag set to apply:
            billing-portal      — fuzefront.billing.invoice-history (100%)
            portals-directory   — fuzefront.platform.portals-directory + multi-tenant-portals (100%)
            portal-console      — fuzefront.identity.portal-scoped-users + fuzefront.apps.portal-catalog + fuzefront.billing.reseller-connect (100%)
            org-context-gating  — fuzefront.apps.org-context-disabled (100%), fuzefront.apps.org-context-hidden (OFF)
            selection-lists     — fuzefront.selection-lists.service (staged ramp via `rollout`; rollback via `action: disable`)
            app-builder         — CREATE ONLY (never enables): fuzefront.apps.build-with-agent + creator-ownership + marketplace-publishing, left OFF
            selection-lists-shared — CREATE ONLY (never enables): fuzefront.selection-lists.shared-lists, left OFF
        required: true
        default: billing-portal
        type: choice
        options:
          - billing-portal
          - portals-directory
          - portal-console
          - org-context-gating
          - selection-lists
          - app-builder
          - selection-lists-shared
      rollout:
        description: 'selection-lists ONLY — flexibleRollout percentage 1-100 (staged ramp 10 -> 25 -> 50 -> 100). Ignored by other sets.'
        required: false
        default: '10'
      action:
        description: 'selection-lists ONLY — enable (env on + strategy at `rollout`%) or disable (env off = fast rollback, strategy kept). Ignored by other sets.'
        required: false
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read

jobs:
  apply-flags:
    name: Apply Unleash flags (${{ inputs.flags }})
    runs-on: fuzefront
    timeout-minutes: 5
    steps:
      - name: Apply flags
        env:
          FLAGS_SET: ${{ inputs.flags }}
          ROLLOUT: ${{ inputs.rollout }}
          ACTION: ${{ inputs.action }}
          UNLEASH: http://fuzefront-unleash.fuzefront.svc.cluster.local:4242
          PROJECT: default
          ENVIRONMENT: production
        run: |
          set -euo pipefail

          # Read the admin token via the k8s API using the runner pod's mounted
          # service account (no kubectl required — ARC runners lack it).
          _SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
          _K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          _SECRET_JSON=$(curl -sf --cacert "$_K8S_CA" \
            -H "Authorization: Bearer $_SA_TOKEN" \
            "https://kubernetes.default.svc/api/v1/namespaces/fuzefront/secrets/unleash-secrets" \
            2>/dev/null || true)
          TOKEN=$(echo "$_SECRET_JSON" | python3 -c "
          import sys, json, base64
          try:
            d = json.load(sys.stdin)
            print(base64.b64decode(d['data']['INIT_ADMIN_API_TOKENS']).decode().strip())
          except Exception:
            sys.exit(0)
          " 2>/dev/null || true)
          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=prod-unleash-ops::Could not read INIT_ADMIN_API_TOKENS from unleash-secrets."
            exit 1
          fi

          # Idempotent helper: creates the flag if absent (409 = already exists),
          # enables the production environment, and upserts a 100% flexibleRollout
          # strategy (skips adding a duplicate if one already exists).
          enable_ga() {
            local FLAG="$1" DESC="$2"
            echo "=== $FLAG ==="

            # 1. Create (idempotent — 409 is fine)
            STATUS=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$FLAG\",\"type\":\"release\",\"description\":\"$DESC\"}")
            if echo "$STATUS" | grep -qE '^(201|409)$'; then
              echo "  create: ok ($STATUS)"
            else
              echo "  create: FAILED ($STATUS)"; cat /tmp/resp.json; return 1
            fi

            # 2. Enable the production environment
            curl -sfX POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/on" \
              -H "Authorization: $TOKEN" \
              && echo "  environment on: ok"

            # 3. Add 100% flexibleRollout only if one does not already exist.
            #    (Re-POSTing creates a duplicate strategy; PATCH the existing one instead.)
            curl -sf \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
              -H "Authorization: $TOKEN" -o /tmp/strats.json 2>/dev/null || true
            EXISTING=$(python3 -c "
          import sys,json
          try:
            strats = json.load(open('/tmp/strats.json'))
          except Exception:
            strats = []
          fr = [s for s in strats if s.get('name')=='flexibleRollout'
                and s.get('parameters',{}).get('rollout')=='100']
          print('exists' if fr else 'missing')
          " 2>/dev/null || echo "missing")

            if [ "$EXISTING" = "exists" ]; then
              echo "  100% strategy: already present, skipping"
            else
              curl -sfX POST \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
                -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
                -d "{\"name\":\"flexibleRollout\",\"parameters\":{\"rollout\":\"100\",\"stickiness\":\"default\",\"groupId\":\"$FLAG\"}}" \
                && echo "  100% strategy added: ok"
            fi
            echo ""
          }

          # ── Billing portal flags ───────────────────────────────────────────
          apply_billing() {
            enable_ga "fuzefront.billing.invoice-history" \
              "Release flag. Gates the Invoices tab in the billing portal (PR #1044). GA per billing portal deploy 2026-09-14. Owner: platform team. Removal: once invoice history is GA for >= 2 sprints."
          }

          # ── Portals Directory flags ────────────────────────────────────────
          apply_portals_directory() {
            enable_ga "fuzefront.platform.portals-directory" \
              "Release flag. Gates the Portals nav item (SidePanel) + the GET /api/v1/admin/portals master-admin directory. GA per owner decision 2026-09-20 (izzy). Owner: feature-flags-engineer. Removal: once the Portals Directory is GA and the OFF path is unused."
            enable_ga "fuzefront.platform.multi-tenant-portals" \
              "Release flag. Gates portal-context resolution (resolvePortalContext) + per-portal branding (PortalBrandingProvider). GA per owner decision 2026-09-20 (izzy). Owner: feature-flags-engineer. Removal: once multi-tenant portals are GA."
          }

          # ── Portal admin console + billing flags ───────────────────────────
          apply_portal_console() {
            enable_ga "fuzefront.identity.portal-scoped-users" \
              "Release flag. Gates the per-portal admin console Users tab (PortalAdminConsoleFlow / UsersTab / InviteUserDialog, /portal/admin). GA per owner decision 2026-10-04 (izzy). Owner: platform team. Removal: once the per-portal console is GA."
            enable_ga "fuzefront.apps.portal-catalog" \
              "Release flag. Gates the per-portal admin console Catalog tab (CatalogTab, /portal/admin). GA per owner decision 2026-10-04 (izzy). Owner: platform team. Removal: once the per-portal catalog is GA."
            enable_ga "fuzefront.billing.reseller-connect" \
              "Release flag. Gates the portal reseller Stripe-connect billing surface (PortalBillingFlow, /portal/admin/billing). GA per owner decision 2026-10-04 (izzy). Owner: feature-flags-engineer. Real entitlement stays in Permit. Removal: once reseller billing is GA."
          }

          # ── Org context gating flags ───────────────────────────────────────
          apply_org_context_gating() {
            enable_ga "fuzefront.apps.org-context-disabled" \
              "Release flag. Gates showing org-context required apps as disabled in non-org personal context. Default ON in prod. Owner: frontend-engineer."

            local FLAG="fuzefront.apps.org-context-hidden"
            local DESC="Release flag. Gates completely hiding org-context required apps in non-org context. Default OFF in prod. Owner: frontend-engineer."
            echo "=== $FLAG (Created, OFF in prod) ==="
            curl -sS -o /tmp/resp_hidden.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$FLAG\",\"type\":\"release\",\"description\":\"$DESC\"}" || true

            curl -sfX POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/off" \
              -H "Authorization: $TOKEN" || true
          }

          # ── Selection Lists (staged ramp / rollback) ───────────────────────
          # Release flag, default OFF. Unlike the GA-only sets above this takes a
          # percentage so it can be ramped 10 -> 25 -> 50 -> 100, and `disable`
          # turns the environment off (strategy kept, so re-enable is clean).
          # Inputs arrive via env (never inlined into the script) and are
          # validated before use.
          apply_selection_lists() {
            local FLAG="fuzefront.selection-lists.service"
            local DESC="Release flag, default OFF. Gates ALL selection-list UI (shell nav + /settings/selection-lists routes) and the selection-list-service API (404 when OFF). Owner: platform team (feature-flags-engineer admin). Removal: when GA at 100% of orgs and stable; delete the flag, the SidePanel/App.tsx guards and services/selection-list-service/src/flags.ts gate."
            if [ "$ACTION" = "disable" ]; then
              curl -sfX POST \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/off" \
                -H "Authorization: $TOKEN" \
                && echo "  $FLAG environment OFF (rollback; strategy kept)"
              return 0
            fi
            case "$ROLLOUT" in ''|*[!0-9]*) echo "::error::rollout must be an integer 1-100"; return 1 ;; esac
            if [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then echo "::error::rollout must be 1-100"; return 1; fi
            echo "=== $FLAG -> ${ROLLOUT}% ($ENVIRONMENT) ==="
            local CREATE_BODY
            CREATE_BODY=$(FLAG="$FLAG" DESC="$DESC" python3 -c 'import json,os;print(json.dumps({"name":os.environ["FLAG"],"type":"release","description":os.environ["DESC"]}))')
            STATUS=$(curl -sS -o /tmp/resp_sl.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$CREATE_BODY")
            echo "$STATUS" | grep -qE '^(201|409)$' || { echo "  create: FAILED ($STATUS)"; cat /tmp/resp_sl.json; return 1; }
            curl -sfX POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/on" \
              -H "Authorization: $TOKEN" && echo "  environment on: ok"
            curl -sf \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
              -H "Authorization: $TOKEN" -o /tmp/strats_sl.json 2>/dev/null || echo '[]' > /tmp/strats_sl.json
            SID=$(python3 -c "
          import json
          try:
            xs=[s for s in json.load(open('/tmp/strats_sl.json')) if s.get('name')=='flexibleRollout']
            print(xs[0]['id'] if xs else '')
          except Exception:
            print('')
          ")
            local BODY
            if [ -n "$SID" ]; then
              BODY=$(FLAG="$FLAG" ROLLOUT="$ROLLOUT" python3 -c 'import json,os;print(json.dumps({"parameters":{"rollout":os.environ["ROLLOUT"],"stickiness":"default","groupId":os.environ["FLAG"]}}))')
              curl -sfX PUT \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies/$SID" \
                -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY" \
                && echo "  strategy patched -> ${ROLLOUT}%"
            else
              BODY=$(FLAG="$FLAG" ROLLOUT="$ROLLOUT" python3 -c 'import json,os;print(json.dumps({"name":"flexibleRollout","parameters":{"rollout":os.environ["ROLLOUT"],"stickiness":"default","groupId":os.environ["FLAG"]}}))')
              curl -sfX POST \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
                -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY" \
                && echo "  strategy added -> ${ROLLOUT}%"
            fi
          }

          # ── App builder / creator ownership / marketplace (CREATE ONLY) ─────
          # Release flags, default OFF (packages/feature-flags/flag-registry.yaml).
          # This set ONLY creates the flags so they exist in Unleash and can be
          # targeted; it deliberately never turns the environment on, never adds a
          # strategy, and never calls `off` — so re-running it can't undo a later
          # deliberate enablement. Enable via the unleash-flag-enable procedure.
          create_only() {
            local FLAG="$1" DESC="$2" BODY STATUS
            echo "=== $FLAG (create only, stays OFF) ==="
            BODY=$(FLAG="$FLAG" DESC="$DESC" python3 -c 'import json,os;print(json.dumps({"name":os.environ["FLAG"],"type":"release","description":os.environ["DESC"]}))')
            STATUS=$(curl -sS -o /tmp/resp_co.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY")
            if echo "$STATUS" | grep -qE '^(201|409)$'; then
              echo "  create: ok ($STATUS)"
            else
              echo "  create: FAILED ($STATUS)"; cat /tmp/resp_co.json; return 1
            fi
          }
          apply_app_builder() {
            create_only "fuzefront.apps.build-with-agent" \
              "Release flag, default OFF. Gates the build-session API (/api/v1/app-registry/build-sessions*) and the Build your application card on the Applications page. Owner: backend-engineer. Removal: once rolled out to 100% and stable for 30 days."
            create_only "fuzefront.apps.creator-ownership" \
              "Release flag, default OFF. Gates writing apps.created_by_user_id, the Permit App#creator grant, and createdBy/creator on App DTOs. Real authority stays in Permit and the org role. Owner: backend-engineer. Removal: once rolled out and the Permit tenant-removal check is verified."
            create_only "fuzefront.apps.marketplace-publishing" \
              "Release flag, default OFF. Gates the marketplace publication-request endpoints (submit/approve/reject/get) and the Publish to marketplace UI. Owner: backend-engineer. Removal: once the marketplace flow is rolled out and stable."
          }

          # ── Selection lists: shared/common lists + forks (CREATE ONLY) ─────
          # Release flag, default OFF (SL9; packages/feature-flags/flag-registry.yaml).
          # Same create-only contract as app-builder above: it never enables the
          # environment, never adds a strategy and never calls `off`.
          apply_selection_lists_shared() {
            create_only "fuzefront.selection-lists.shared-lists" \
              "Release flag, default OFF. Gates shared/common selection lists (visibility, shared read, include_shared, fork, resolve redirect, list.forked/visibility.changed events, seed-list visibility) in selection-list-service. Real authorization stays in Permit. Owner: izzywdev. Removal: ON for all orgs for 30 days with no fork/shared-read incident; delete the flag, FLAG_KEYS entry, isSharedListsEnabled() and the off-path branches."
          }

          # ── Dispatch ──────────────────────────────────────────────────────
          case "$FLAGS_SET" in
            billing-portal)      apply_billing ;;
            portals-directory)   apply_portals_directory ;;
            portal-console)      apply_portal_console ;;
            org-context-gating)  apply_org_context_gating ;;
            selection-lists)     apply_selection_lists ;;
            app-builder)         apply_app_builder ;;
            selection-lists-shared) apply_selection_lists_shared ;;
            *)                   echo "::error::Unknown flags set: $FLAGS_SET"; exit 1 ;;
          esac

          echo "All requested flags applied."

      - name: Verify
        if: always()
        env:
          UNLEASH: http://fuzefront-unleash.fuzefront.svc.cluster.local:4242
          PROJECT: default
          ENVIRONMENT: production
          FLAGS_SET: ${{ inputs.flags }}
        run: |
          _SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
          _K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          _SECRET_JSON=$(curl -sf --cacert "$_K8S_CA" \
            -H "Authorization: Bearer $_SA_TOKEN" \
            "https://kubernetes.default.svc/api/v1/namespaces/fuzefront/secrets/unleash-secrets" \
            2>/dev/null || true)
          TOKEN=$(echo "$_SECRET_JSON" | python3 -c "
          import sys, json, base64
          try:
            d = json.load(sys.stdin)
            print(base64.b64decode(d['data']['INIT_ADMIN_API_TOKENS']).decode().strip())
          except Exception:
            sys.exit(0)
          " 2>/dev/null || true)
          if [ -z "${TOKEN:-}" ]; then exit 0; fi

          echo "=== Verification ==="
          check_flag() {
            local FLAG="$1"
            curl -sf \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT" \
              -H "Authorization: $TOKEN" -o /tmp/flag_state.json 2>/dev/null || true
            ENABLED=$(python3 -c "
          import json
          try:
            d=json.load(open('/tmp/flag_state.json'))
            print('ON' if d.get('enabled') else 'OFF')
          except Exception:
            print('ERROR')
          " 2>/dev/null || echo "ERROR")
            echo "  $FLAG: $ENABLED"
          }

          case "$FLAGS_SET" in
            billing-portal)
              check_flag "fuzefront.billing.invoice-history" ;;
            portals-directory)
              check_flag "fuzefront.platform.portals-directory"
              check_flag "fuzefront.platform.multi-tenant-portals" ;;
            portal-console)
              check_flag "fuzefront.identity.portal-scoped-users"
              check_flag "fuzefront.apps.portal-catalog"
              check_flag "fuzefront.billing.reseller-connect" ;;
            org-context-gating)
              check_flag "fuzefront.apps.org-context-disabled"
              check_flag "fuzefront.apps.org-context-hidden" ;;
            selection-lists)
              check_flag "fuzefront.selection-lists.service" ;;
            app-builder)
              check_flag "fuzefront.apps.build-with-agent"
              check_flag "fuzefront.apps.creator-ownership"
              check_flag "fuzefront.apps.marketplace-publishing" ;;
            selection-lists-shared)
              check_flag "fuzefront.selection-lists.shared-lists" ;;
          esac
