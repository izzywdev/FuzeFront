name: Prod Unleash ops (enable feature flags)

# Applies pending feature-flag enablement to the production Unleash instance
# via its admin API. Mirrors the prod-authentik-ops.yml pattern.
#
# The workflow runs on the `fuzefront` self-hosted in-cluster runner so it can
# reach http://fuzefront-unleash.fuzefront.svc.cluster.local:4242 without
# needing CF-Access authentication (the admin UI host is Access-gated; the
# in-cluster service is not).
#
# The admin token is read directly from the cluster at runtime via the k8s API
# (curl + the runner pod's mounted service account token) — no GitHub secret or
# kubectl required. The runner's service account has read access to the
# `unleash-secrets` Secret in the `fuzefront` namespace.
#
# Trigger via GitHub Actions → "Run workflow".
# The `flags` input controls which pre-defined flag set to apply.

on:
  workflow_dispatch:
    inputs:
      flags:
        description: |
          Which flag set to apply:
            billing-portal      — fuzefront.billing.invoice-history (100%)
            portals-directory   — fuzefront.platform.portals-directory + multi-tenant-portals (100%)
            portal-console      — fuzefront.identity.portal-scoped-users + fuzefront.apps.portal-catalog + fuzefront.billing.reseller-connect (100%)
            org-context-gating  — fuzefront.apps.org-context-disabled (100%) + fuzefront.apps.org-context-hidden (100%; owner decision 2026-10-19: HIDE org apps in personal context)
            selection-lists     — fuzefront.selection-lists.service (staged ramp via `rollout`; rollback via `action: disable`)
            app-builder         — CREATE ONLY (never enables): fuzefront.apps.build-with-agent + creator-ownership + marketplace-publishing, left OFF
            authz-enabled       — fuzefront.billing.authz-enabled (100%) — run AFTER prod-billing-s2s-provision succeeds
            root-membership     — fuzefront.identity.root-membership (100%): new signups take the root-membership path instead of a personal org (FF-EPIC-17-S1/S2; the S2 backfill is #1095, deployed)
            selection-lists-create — CREATE ONLY (never enables): fuzefront.selection-lists.service + seed-defaults + shared-lists, left OFF
            devportal           — fuzefront.devportal.enabled (100%): gates developers.fuzefront.com sign-in; GA per owner decision 2026-10-18
            config-management   — fuzefront.config.management-console + .key-catalog + .secrets-audit (100%): Configuration Management Console UI (EPIC-19). Web-exposed; requires the catalog-registering build (#1571) deployed.
            account-security    — fuzefront.account-security.hub (100%): the Account Security hub UI (profile menu → Settings: password, MFA, devices/sessions, connected accounts). Web-exposed; consumes the existing security-service APIs.
            all-flags           — owner-directed bulk GA: 28 flags to 100% = 26 release flags (incl. the 3 config-management flags) + 2 ops-kill-switches (created as type=kill-switch; ON = healthy). Excludes per-org / env-driven / unverified flags (billing authz-enabled + plan-flag-sync, selection-lists.shared-lists, auth.experience, billing plan-tier permission flags).
        required: true
        default: billing-portal
        type: choice
        options:
          - billing-portal
          - portals-directory
          - portal-console
          - org-context-gating
          - selection-lists
          - app-builder
          - authz-enabled
          - root-membership
          - selection-lists-create
          - devportal
          - billing-plan-flag-sync
          - config-management
          - account-security
          - all-flags
      rollout:
        description: 'selection-lists ONLY — flexibleRollout percentage 1-100 (staged ramp 10 -> 25 -> 50 -> 100). Ignored by other sets.'
        required: false
        default: '10'
      action:
        description: 'selection-lists ONLY — enable (env on + strategy at `rollout`%) or disable (env off = fast rollback, strategy kept). Ignored by other sets.'
        required: false
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read

jobs:
  apply-flags:
    name: Apply Unleash flags (${{ inputs.flags }})
    runs-on: fuzefront
    timeout-minutes: 5
    steps:
      - name: Apply flags
        env:
          FLAGS_SET: ${{ inputs.flags }}
          ROLLOUT: ${{ inputs.rollout }}
          ACTION: ${{ inputs.action }}
          UNLEASH: http://fuzefront-unleash.fuzefront.svc.cluster.local:4242
          PROJECT: default
          ENVIRONMENT: production
        run: |
          set -euo pipefail

          # Read the admin token via the k8s API using the runner pod's mounted
          # service account (no kubectl required — ARC runners lack it).
          _SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
          _K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          _SECRET_JSON=$(curl -sf --cacert "$_K8S_CA" \
            -H "Authorization: Bearer $_SA_TOKEN" \
            "https://kubernetes.default.svc/api/v1/namespaces/fuzefront/secrets/unleash-secrets" \
            2>/dev/null || true)
          TOKEN=$(echo "$_SECRET_JSON" | python3 -c "
          import sys, json, base64
          try:
            d = json.load(sys.stdin)
            print(base64.b64decode(d['data']['INIT_ADMIN_API_TOKENS']).decode().strip())
          except Exception:
            sys.exit(0)
          " 2>/dev/null || true)
          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=prod-unleash-ops::Could not read INIT_ADMIN_API_TOKENS from unleash-secrets."
            exit 1
          fi

          # Idempotent helper: creates the flag if absent (409 = already exists),
          # enables the production environment, and upserts a 100% flexibleRollout
          # strategy (skips adding a duplicate if one already exists).
          enable_ga() {
            local FLAG="$1" DESC="$2" TYPE="${3:-release}"
            echo "=== $FLAG ($TYPE) ==="

            # 1. Create (idempotent — 409 is fine). TYPE defaults to release;
            #    pass kill-switch for ops kill-switches so a create (only taken
            #    when the flag is ABSENT) records the correct Unleash type.
            STATUS=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$FLAG\",\"type\":\"$TYPE\",\"description\":\"$DESC\"}")
            if echo "$STATUS" | grep -qE '^(201|409)$'; then
              echo "  create: ok ($STATUS)"
            else
              echo "  create: FAILED ($STATUS)"; cat /tmp/resp.json; return 1
            fi

            # 2. Enable the production environment (fail loudly — a 5xx/network
            #    error here must not be swallowed, or the flag reports success
            #    while staying OFF).
            if ! curl -sfX POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/on" \
              -H "Authorization: $TOKEN"; then
              echo "::error title=prod-unleash-ops::environment enable FAILED for $FLAG"; return 1
            fi
            echo "  environment on: ok"

            # 3. Add 100% flexibleRollout only if one does not already exist.
            #    (Re-POSTing creates a duplicate strategy; PATCH the existing one instead.)
            curl -sf \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
              -H "Authorization: $TOKEN" -o /tmp/strats.json 2>/dev/null || true
            EXISTING=$(python3 -c "
          import sys,json
          try:
            strats = json.load(open('/tmp/strats.json'))
          except Exception:
            strats = []
          fr = [s for s in strats if s.get('name')=='flexibleRollout'
                and s.get('parameters',{}).get('rollout')=='100']
          print('exists' if fr else 'missing')
          " 2>/dev/null || echo "missing")

            if [ "$EXISTING" = "exists" ]; then
              echo "  100% strategy: already present, skipping"
            else
              if ! curl -sfX POST \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
                -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
                -d "{\"name\":\"flexibleRollout\",\"parameters\":{\"rollout\":\"100\",\"stickiness\":\"default\",\"groupId\":\"$FLAG\"}}"; then
                echo "::error title=prod-unleash-ops::strategy add FAILED for $FLAG"; return 1
              fi
              echo "  100% strategy added: ok"
            fi
            echo ""
          }

          # ── Billing portal flags ───────────────────────────────────────────
          apply_billing() {
            enable_ga "fuzefront.billing.invoice-history" \
              "Release flag. Gates the Invoices tab in the billing portal (PR #1044). GA per billing portal deploy 2026-09-14. Owner: platform team. Removal: once invoice history is GA for >= 2 sprints."
          }

          # ── Billing plan-flag-sync (CREATE ONLY, dark deploy) ─────────────
          # Release flag, default OFF. Created so billing-service can gate the
          # Unleash Admin API flag-sync calls behind it. Flip to ON separately
          # after verifying UNLEASH_ADMIN_TOKEN is provisioned in billing-service
          # and the plan tiers are canonical in the DB (migration 005 has run).
          # Re-running this set on an already-created flag is safe (409 = ok).
          apply_billing_plan_flag_sync() {
            create_only "fuzefront.billing.plan-flag-sync-enabled" \
              "Release flag, default OFF. Gates whether billing-service's UnleashFlagSyncService calls the Unleash Admin API to maintain per-org plan-tier permission flags (fuzefront.billing.plan-{starter,growth,enterprise}) after a subscription change (FFRNT-364). Dark deploy — flip ON once UNLEASH_ADMIN_TOKEN is provisioned and migration 005 has run. Owner: feature-flags-engineer (billing). Removal criterion: after 2 sprints with no regression in per-org flag states; delete flag and dead OFF-path."
          }

          # ── Portals Directory flags ────────────────────────────────────────
          apply_portals_directory() {
            enable_ga "fuzefront.platform.portals-directory" \
              "Release flag. Gates the Portals nav item (SidePanel) + the GET /api/v1/admin/portals master-admin directory. GA per owner decision 2026-09-20 (izzy). Owner: feature-flags-engineer. Removal: once the Portals Directory is GA and the OFF path is unused."
            enable_ga "fuzefront.platform.multi-tenant-portals" \
              "Release flag. Gates portal-context resolution (resolvePortalContext) + per-portal branding (PortalBrandingProvider). GA per owner decision 2026-09-20 (izzy). Owner: feature-flags-engineer. Removal: once multi-tenant portals are GA."
          }

          # ── Portal admin console + billing flags ───────────────────────────
          apply_portal_console() {
            enable_ga "fuzefront.identity.portal-scoped-users" \
              "Release flag. Gates the per-portal admin console Users tab (PortalAdminConsoleFlow / UsersTab / InviteUserDialog, /portal/admin). GA per owner decision 2026-10-04 (izzy). Owner: platform team. Removal: once the per-portal console is GA."
            enable_ga "fuzefront.apps.portal-catalog" \
              "Release flag. Gates the per-portal admin console Catalog tab (CatalogTab, /portal/admin). GA per owner decision 2026-10-04 (izzy). Owner: platform team. Removal: once the per-portal catalog is GA."
            enable_ga "fuzefront.billing.reseller-connect" \
              "Release flag. Gates the portal reseller Stripe-connect billing surface (PortalBillingFlow, /portal/admin/billing). GA per owner decision 2026-10-04 (izzy). Owner: feature-flags-engineer. Real entitlement stays in Permit. Removal: once reseller billing is GA."
          }

          # ── Org context gating flags ───────────────────────────────────────
          apply_org_context_gating() {
            # Owner decision 2026-10-19: org-only apps are HIDDEN in personal
            # context, not shown-disabled. In frontend/src/components/SidePanel.tsx
            # org-context-hidden takes precedence over org-context-disabled (gated
            # apps return null before the disabled check), so enabling hidden is
            # the operative "hide" switch; disabled stays ON as its healthy default
            # (dead code for gated apps once hidden wins, harmless otherwise).
            enable_ga "fuzefront.apps.org-context-disabled" \
              "Release flag. Gates showing org-context required apps as disabled in non-org personal context. Default ON in prod. Owner: frontend-engineer."
            enable_ga "fuzefront.apps.org-context-hidden" \
              "Release flag. Completely hides org-context required apps in non-org personal context. ON in prod per owner decision 2026-10-19 (HIDE, not show-disabled); takes precedence over org-context-disabled in SidePanel.tsx. Owner: frontend-engineer."
          }

          # ── Selection Lists (staged ramp / rollback) ───────────────────────
          # Release flag, default OFF. Unlike the GA-only sets above this takes a
          # percentage so it can be ramped 10 -> 25 -> 50 -> 100, and `disable`
          # turns the environment off (strategy kept, so re-enable is clean).
          # Inputs arrive via env (never inlined into the script) and are
          # validated before use.
          apply_selection_lists() {
            local FLAG="fuzefront.selection-lists.service"
            local DESC="Release flag, default OFF. Gates ALL selection-list UI (shell nav + /settings/selection-lists routes) and the selection-list-service API (404 when OFF). Owner: platform team (feature-flags-engineer admin). Removal: when GA at 100% of orgs and stable; delete the flag, the SidePanel/App.tsx guards and services/selection-list-service/src/flags.ts gate."
            if [ "$ACTION" = "disable" ]; then
              curl -sfX POST \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/off" \
                -H "Authorization: $TOKEN" \
                && echo "  $FLAG environment OFF (rollback; strategy kept)"
              return 0
            fi
            case "$ROLLOUT" in ''|*[!0-9]*) echo "::error::rollout must be an integer 1-100"; return 1 ;; esac
            if [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then echo "::error::rollout must be 1-100"; return 1; fi
            echo "=== $FLAG -> ${ROLLOUT}% ($ENVIRONMENT) ==="
            local CREATE_BODY
            CREATE_BODY=$(FLAG="$FLAG" DESC="$DESC" python3 -c 'import json,os;print(json.dumps({"name":os.environ["FLAG"],"type":"release","description":os.environ["DESC"]}))')
            STATUS=$(curl -sS -o /tmp/resp_sl.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$CREATE_BODY")
            echo "$STATUS" | grep -qE '^(201|409)$' || { echo "  create: FAILED ($STATUS)"; cat /tmp/resp_sl.json; return 1; }
            curl -sfX POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/on" \
              -H "Authorization: $TOKEN" && echo "  environment on: ok"
            curl -sf \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
              -H "Authorization: $TOKEN" -o /tmp/strats_sl.json 2>/dev/null || echo '[]' > /tmp/strats_sl.json
            SID=$(python3 -c "
          import json
          try:
            xs=[s for s in json.load(open('/tmp/strats_sl.json')) if s.get('name')=='flexibleRollout']
            print(xs[0]['id'] if xs else '')
          except Exception:
            print('')
          ")
            local BODY
            if [ -n "$SID" ]; then
              BODY=$(FLAG="$FLAG" ROLLOUT="$ROLLOUT" python3 -c 'import json,os;print(json.dumps({"parameters":{"rollout":os.environ["ROLLOUT"],"stickiness":"default","groupId":os.environ["FLAG"]}}))')
              curl -sfX PUT \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies/$SID" \
                -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY" \
                && echo "  strategy patched -> ${ROLLOUT}%"
            else
              BODY=$(FLAG="$FLAG" ROLLOUT="$ROLLOUT" python3 -c 'import json,os;print(json.dumps({"name":"flexibleRollout","parameters":{"rollout":os.environ["ROLLOUT"],"stickiness":"default","groupId":os.environ["FLAG"]}}))')
              curl -sfX POST \
                "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT/strategies" \
                -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY" \
                && echo "  strategy added -> ${ROLLOUT}%"
            fi
          }

          # ── App builder / creator ownership / marketplace (CREATE ONLY) ─────
          # Release flags, default OFF (packages/feature-flags/flag-registry.yaml).
          # This set ONLY creates the flags so they exist in Unleash and can be
          # targeted; it deliberately never turns the environment on, never adds a
          # strategy, and never calls `off` — so re-running it can't undo a later
          # deliberate enablement. Enable via the unleash-flag-enable procedure.
          create_only() {
            local FLAG="$1" DESC="$2" BODY STATUS
            echo "=== $FLAG (create only, stays OFF) ==="
            BODY=$(FLAG="$FLAG" DESC="$DESC" python3 -c 'import json,os;print(json.dumps({"name":os.environ["FLAG"],"type":"release","description":os.environ["DESC"]}))')
            STATUS=$(curl -sS -o /tmp/resp_co.json -w '%{http_code}' -X POST \
              "$UNLEASH/api/admin/projects/$PROJECT/features" \
              -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY")
            if echo "$STATUS" | grep -qE '^(201|409)$'; then
              echo "  create: ok ($STATUS)"
            else
              echo "  create: FAILED ($STATUS)"; cat /tmp/resp_co.json; return 1
            fi
          }
          apply_app_builder() {
            create_only "fuzefront.apps.build-with-agent" \
              "Release flag, default OFF. Gates the build-session API (/api/v1/app-registry/build-sessions*) and the Build your application card on the Applications page. Owner: backend-engineer. Removal: once rolled out to 100% and stable for 30 days."
            create_only "fuzefront.apps.creator-ownership" \
              "Release flag, default OFF. Gates writing apps.created_by_user_id, the Permit App#creator grant, and createdBy/creator on App DTOs. Real authority stays in Permit and the org role. Owner: backend-engineer. Removal: once rolled out and the Permit tenant-removal check is verified."
            create_only "fuzefront.apps.marketplace-publishing" \
              "Release flag, default OFF. Gates the marketplace publication-request endpoints (submit/approve/reject/get) and the Publish to marketplace UI. Owner: backend-engineer. Removal: once the marketplace flow is rolled out and stable."
          }

          # ── Developer Portal ──────────────────────────────────────────────────
          apply_devportal() {
            enable_ga "fuzefront.devportal.enabled" \
              "Release flag. Gates developers.fuzefront.com sign-in (DevPortalFlow). GA per owner decision 2026-10-18 (izzy). Owner: feature-flags-engineer. Removal: once the devportal is GA and the OFF path is unused."
          }

          # ── Billing authz-enabled (run AFTER prod-billing-s2s-provision) ──────
          apply_authz_enabled() {
            enable_ga "fuzefront.billing.authz-enabled" \
              "Release flag. Gates PermitSyncService.syncPlanToPermit() in billing-service — syncs plan tier to the Security API on every subscription change. Run prod-billing-s2s-provision first to seal AUTHENTIK_CLIENT_ID/SECRET. GA when S2S credentials are verified in prod. Owner: platform team. Removal: once authz sync is GA and stable."
          }

          # ── Root membership (FF-EPIC-17-S1/S2) ─────────────────────────────
          # Backend release flag (web_exposed:false). ON = signup / auth
          # self-heal upserts a root organization_memberships(role='member')
          # row instead of creating a type='personal' org. Only changes NEW
          # signup behaviour; existing users were handled by the S2 backfill
          # (#1095 migrations 029/020, deployed). GA per owner decision
          # 2026-10-05 (izzy). Removal: drop the type='personal' branch once
          # 100% of signups take this path.
          apply_root_membership() {
            enable_ga "fuzefront.identity.root-membership" \
              "Release flag (FF-EPIC-17-S1/S2, backend). ON = signup/auth self-heal upserts a root membership(role=member) instead of a personal org. S2 backfill = #1095 (deployed). GA per owner decision 2026-10-05 (izzy). Owner: platform team. Removal: drop the type=personal provisioning branch once 100% of signups take the root-membership path."
          }

          # ── Configuration Management Console (EPIC-19) ─────────────────────
          # Three web-exposed release flags (packages/feature-flags: FLAG_KEYS +
          # WEB_EXPOSED_FLAGS, registered in #1571). ON at 100% surfaces the
          # top-level "Configuration" left-nav item + /config settings editor,
          # the /admin/config/catalog* catalog surface, and the
          # /admin/config/keys/:key/history secret+audit surface. Web-exposed, so
          # the browser only sees them once the catalog-registering build (#1571)
          # has deployed (frontend + backend rebuilt); enabling before that is
          # harmless (the key is absent from /api/flags, useFlag() reads its OFF
          # default). GA per owner decision 2026-10-19 (izzy). Owner:
          # feature-flags-engineer. Removal: console GA at 100% for 30 days.
          apply_config_management() {
            enable_ga "fuzefront.config.management-console" \
              "Release flag (EPIC-19, web-exposed). ON surfaces the top-level Configuration nav item + /config settings editor. Registered in #1571. GA per owner decision 2026-10-19 (izzy). Owner: feature-flags-engineer. Removal: console GA at 100% for 30 days."
            enable_ga "fuzefront.config.key-catalog" \
              "Release flag (EPIC-19, web-exposed). ON surfaces the /admin/config/catalog + /admin/config/catalog/:key admin surfaces. Registered in #1571. GA per owner decision 2026-10-19 (izzy). Owner: feature-flags-engineer. Removal: console GA at 100% for 30 days."
            enable_ga "fuzefront.config.secrets-audit" \
              "Release flag (EPIC-19, web-exposed). ON surfaces the /admin/config/keys/:key/history secret + audit-history surface. Registered in #1571. GA per owner decision 2026-10-19 (izzy). Owner: feature-flags-engineer. Removal: console GA at 100% for 30 days."
          }

          # ── Account Security hub (profile menu → Settings) ─────────────────
          # Web-exposed release flag gating the @fuzefront/account-security-ui
          # hub mounted at /account/security (the profile menu's Settings item):
          # password, MFA factors, devices/sessions, connected accounts. It
          # consumes the existing security-service APIs — no new service or authz
          # tier. GA per owner decision 2026-10-26 (izzy): expose the Settings UI.
          # Owner: feature-flags-engineer. Removal: once the hub is GA at 100%
          # for 30 days and the OFF placeholder path is removed.
          apply_account_security() {
            enable_ga "fuzefront.account-security.hub" \
              "Release flag (web-exposed). ON surfaces the Account Security hub at /account/security (profile menu → Settings): password, MFA, devices/sessions, connected accounts. Consumes existing security-service APIs. GA per owner decision 2026-10-26 (izzy). Owner: feature-flags-engineer. Removal: hub GA at 100% for 30 days."
          }

          # ── Selection Lists (CREATE ONLY) ───────────────────────────────────
          # Release flags, default OFF (packages/feature-flags/flag-registry.yaml).
          # Reuses create_only: creates the flags if absent (409 = already exists,
          # left exactly as-is), and never turns the environment on, never adds a
          # strategy, never calls `off` -- so re-running it can't undo or alter a
          # later deliberate enablement or an existing ramp of the master flag.
          # shared-lists (SL9) is created the same way: OFF, no strategy, never touched
          # again by this set. seed-defaults is evaluated with { orgId, app } and no userId, so when it
          # is enabled later use a per-org `orgId IN [org_...]` constraint (TypeID
          # form), not a percentage -- see the seeding-operations runbook.
          apply_selection_lists_create() {
            create_only "fuzefront.selection-lists.service" \
              "Release flag, default OFF. Gates ALL selection-list UI (shell nav + /settings/selection-lists routes) and the selection-list-service API (404 when OFF). Owner: platform team (feature-flags-engineer admin). Removal: when GA at 100% of orgs and stable for one release cycle; delete the flag, the SidePanel/App.tsx guards and services/selection-list-service/src/flags.ts gate."
            create_only "fuzefront.selection-lists.seed-defaults" \
              "Release flag, default OFF. Gates BOTH selection-list-service seeding consumers (identity.org.created seeding and the selection-lists.seed.requested handler) plus the reconciler/backfill; additionally requires fuzefront.selection-lists.service. Server-side only; fails closed. Evaluated with orgId (org_ TypeID) and no userId - target per org, not by percentage. Owner: izzywdev. Removal: seeding ON for all orgs for 30 consecutive days with zero selection-lists.seed.failed, reconciler backfill complete; delete the flag, FLAG_KEYS.SELECTION_LISTS_SEED_DEFAULTS and isSeedDefaultsEnabled() in one cleanup PR."
            create_only "fuzefront.selection-lists.shared-lists" \
              "Release flag, default OFF. Gates shared/common selection lists (list visibility, shared read, include_shared, fork, resolve redirect, list.forked/visibility.changed events, seed-list visibility) in selection-list-service and the UI common badge/fork flow; additionally requires fuzefront.selection-lists.service. Real authorization stays in Permit. Owner: izzywdev. Removal: ON for all orgs for 30 consecutive days with no fork / shared-read incident; delete the flag, FLAG_KEYS.SELECTION_LISTS_SHARED_LISTS, the WEB_EXPOSED_FLAGS entry, isSharedListsEnabled() and the off-path branches in one cleanup PR."
          }

          # ── ALL FLAGS — owner-directed bulk GA (2026-10-18) ────────────────
          # Enables EVERY known production flag to 100%, requested explicitly by
          # the owner with risks acknowledged. Notes:
          #  - ON is the SAFE/normal state for the two ops-kill-switches
          #    (apps.org-context-disabled, app-registry.kafka-events-kill-switch:
          #    ON = events emitted), so enabling keeps them healthy.
          #  - identity.prefixed-ids is safe to flip — the dual-accept window
          #    (configureIdentity legacyUuidTypes) is in place per the registry.
          #  - Side effects the owner accepted: incomplete app-builder surfaces
          #    (build-with-agent / creator-ownership / marketplace-publishing)
          #    activate; selection-lists.seed-defaults at 100% seeds default
          #    lists into every org. All are reversible via the env `off` path.
          # The 26 release flags (the two ops-kill-switches are handled
          # separately below so their create records type=kill-switch).
          # Swept in 2026-10-26 (owner: all flags ON in prod): the EPIC-19
          # Configuration Management Console trio (config.management-console /
          # key-catalog / secrets-audit) -- web-exposed release flags, already GA
          # per owner decision 2026-10-19, registered in #1571.
          # DELIBERATELY NOT in this set (held; see the PR that added the trio):
          #  - billing.authz-enabled / billing.plan-flag-sync-enabled: billing-service
          #    reads these from ENV (FUZEFRONT_BILLING_*), not Unleash, so an Unleash
          #    flip is inert; plan-flag-sync also needs UNLEASH_ADMIN_TOKEN wired.
          #  - selection-lists.shared-lists: docs/runbooks/selection-lists-rollout.md
          #    section 10 pre-enable audit + platform-org confirmation must pass first.
          #  - auth.experience: build-time VITE_FF_AUTH_EXPERIENCE, not Unleash.
          #  - billing.plan-*/sso-enabled/api-access/custom-domain/module-federation:
          #    per-org permission (entitlement) flags -- 100% would defeat tier gating.
          ALL_FLAGS_RELEASE="fuzefront.apps.org-context-hidden fuzefront.apps.build-with-agent fuzefront.apps.creator-ownership fuzefront.apps.marketplace-publishing fuzefront.authz.chat-agent-security-api fuzefront.account-security.hub fuzefront.billing.invoice-history fuzefront.platform.multi-tenant-portals fuzefront.platform.portal-domains fuzefront.platform.portals-directory fuzefront.platform.config-management fuzefront.app-registry.v1-registry-write fuzefront.apps.portal-catalog fuzefront.selection-lists.service fuzefront.selection-lists.seed-defaults fuzefront.identity.root-membership fuzefront.identity.personal-context fuzefront.identity.member-directory fuzefront.identity.prefixed-ids fuzefront.identity.employee-console fuzefront.devportal.enabled fuzefront.identity.portal-scoped-users fuzefront.billing.reseller-connect fuzefront.config.management-console fuzefront.config.key-catalog fuzefront.config.secrets-audit"
          apply_all_flags() {
            # Two ops-kill-switches first, created with type=kill-switch. ON is
            # their SAFE/normal state (org-context-disabled ON = normal gating;
            # kafka-events-kill-switch ON = app-registry events emitted), so
            # enabling them to 100% keeps them healthy.
            enable_ga "fuzefront.apps.org-context-disabled" \
              "Ops kill-switch. ON = normal org-context gating (SAFE/normal state). Bulk GA via all-flags set (owner-directed 2026-10-18)." \
              "kill-switch"
            enable_ga "fuzefront.app-registry.kafka-events-kill-switch" \
              "Ops kill-switch. ON = app-registry Kafka events emitted (SAFE/normal state). Bulk GA via all-flags set (owner-directed 2026-10-18)." \
              "kill-switch"
            for F in $ALL_FLAGS_RELEASE; do
              enable_ga "$F" "Bulk GA via all-flags set (owner-directed 2026-10-18): all production flags to 100%."
            done
          }

          # ── Dispatch ──────────────────────────────────────────────────────
          case "$FLAGS_SET" in
            billing-portal)           apply_billing ;;
            billing-plan-flag-sync)   apply_billing_plan_flag_sync ;;
            portals-directory)        apply_portals_directory ;;
            portal-console)      apply_portal_console ;;
            org-context-gating)  apply_org_context_gating ;;
            selection-lists)     apply_selection_lists ;;
            app-builder)         apply_app_builder ;;
            authz-enabled)       apply_authz_enabled ;;
            root-membership)     apply_root_membership ;;
            selection-lists-create) apply_selection_lists_create ;;
            devportal)           apply_devportal ;;
            config-management)   apply_config_management ;;
            account-security)    apply_account_security ;;
            all-flags)           apply_all_flags ;;
            *)                   echo "::error::Unknown flags set: $FLAGS_SET"; exit 1 ;;
          esac

          echo "All requested flags applied."

      - name: Verify
        if: always()
        env:
          UNLEASH: http://fuzefront-unleash.fuzefront.svc.cluster.local:4242
          PROJECT: default
          ENVIRONMENT: production
          FLAGS_SET: ${{ inputs.flags }}
        run: |
          _SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
          _K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          _SECRET_JSON=$(curl -sf --cacert "$_K8S_CA" \
            -H "Authorization: Bearer $_SA_TOKEN" \
            "https://kubernetes.default.svc/api/v1/namespaces/fuzefront/secrets/unleash-secrets" \
            2>/dev/null || true)
          TOKEN=$(echo "$_SECRET_JSON" | python3 -c "
          import sys, json, base64
          try:
            d = json.load(sys.stdin)
            print(base64.b64decode(d['data']['INIT_ADMIN_API_TOKENS']).decode().strip())
          except Exception:
            sys.exit(0)
          " 2>/dev/null || true)
          if [ -z "${TOKEN:-}" ]; then exit 0; fi

          echo "=== Verification ==="
          check_flag() {
            local FLAG="$1"
            # curl -f leaves a previous run's output file intact on an HTTP error, so a
            # flag that was never created would print the PRECEDING flag's state; remove
            # it first, and treat a failed fetch as UNREACHABLE rather than a misread.
            rm -f /tmp/flag_state.json
            if ! curl -sf \
              "$UNLEASH/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT" \
              -H "Authorization: $TOKEN" -o /tmp/flag_state.json 2>/dev/null; then
              echo "  $FLAG: UNREACHABLE (fetch failed)"; return 0
            fi
            ENABLED=$(python3 -c "
          import json
          try:
            d=json.load(open('/tmp/flag_state.json'))
            print('ON' if d.get('enabled') else 'OFF')
          except Exception:
            print('ERROR')
          " 2>/dev/null || echo "ERROR")
            echo "  $FLAG: $ENABLED"
          }

          case "$FLAGS_SET" in
            billing-portal)
              check_flag "fuzefront.billing.invoice-history" ;;
            portals-directory)
              check_flag "fuzefront.platform.portals-directory"
              check_flag "fuzefront.platform.multi-tenant-portals" ;;
            portal-console)
              check_flag "fuzefront.identity.portal-scoped-users"
              check_flag "fuzefront.apps.portal-catalog"
              check_flag "fuzefront.billing.reseller-connect" ;;
            org-context-gating)
              check_flag "fuzefront.apps.org-context-disabled"
              check_flag "fuzefront.apps.org-context-hidden" ;;
            selection-lists)
              check_flag "fuzefront.selection-lists.service" ;;
            app-builder)
              check_flag "fuzefront.apps.build-with-agent"
              check_flag "fuzefront.apps.creator-ownership"
              check_flag "fuzefront.apps.marketplace-publishing" ;;
            authz-enabled)
              check_flag "fuzefront.billing.authz-enabled" ;;
            root-membership)
              check_flag "fuzefront.identity.root-membership" ;;
            devportal)
              check_flag "fuzefront.devportal.enabled" ;;
            config-management)
              check_flag "fuzefront.config.management-console"
              check_flag "fuzefront.config.key-catalog"
              check_flag "fuzefront.config.secrets-audit" ;;
            account-security)
              check_flag "fuzefront.account-security.hub" ;;
            selection-lists-create)
              check_flag "fuzefront.selection-lists.service"
              check_flag "fuzefront.selection-lists.seed-defaults"
              check_flag "fuzefront.selection-lists.shared-lists"
              for F in fuzefront.selection-lists.service fuzefront.selection-lists.seed-defaults fuzefront.selection-lists.shared-lists; do
                rm -f /tmp/flag_meta.json
                curl -sf "$UNLEASH/api/admin/projects/$PROJECT/features/$F" \
                  -H "Authorization: $TOKEN" -o /tmp/flag_meta.json 2>/dev/null || true
                F="$F" python3 -c "
          import json, os
          try:
            d=json.load(open('/tmp/flag_meta.json'))
            print('  %s: type=%s' % (os.environ['F'], d.get('type')))
          except Exception:
            print('  %s: type=ERROR' % os.environ['F'])
          "
              done ;;
            all-flags)
              for F in fuzefront.apps.org-context-disabled fuzefront.apps.org-context-hidden fuzefront.apps.build-with-agent fuzefront.apps.creator-ownership fuzefront.apps.marketplace-publishing fuzefront.authz.chat-agent-security-api fuzefront.account-security.hub fuzefront.billing.invoice-history fuzefront.platform.multi-tenant-portals fuzefront.platform.portal-domains fuzefront.platform.portals-directory fuzefront.platform.config-management fuzefront.app-registry.v1-registry-write fuzefront.app-registry.kafka-events-kill-switch fuzefront.apps.portal-catalog fuzefront.selection-lists.service fuzefront.selection-lists.seed-defaults fuzefront.identity.root-membership fuzefront.identity.personal-context fuzefront.identity.member-directory fuzefront.identity.prefixed-ids fuzefront.identity.employee-console fuzefront.devportal.enabled fuzefront.identity.portal-scoped-users fuzefront.billing.reseller-connect fuzefront.config.management-console fuzefront.config.key-catalog fuzefront.config.secrets-audit; do
                check_flag "$F"
              done ;;
          esac
