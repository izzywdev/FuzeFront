# =============================================================================
# rotate-sealed-secret — self-service SealedSecret sealing/rotation (GitOps).
#
# Replicated from FuzeInfra's canonical workflow of the same name, which says of
# itself: "This is the family-standard template — replicate it per repo (like
# claude.yml / auto-merge.yml) and point --scope/--manifest at that repo's
# SealedSecret." FuzeInfra's copy checks out FuzeInfra and opens a PR against
# FuzeInfra, so it cannot write a manifest that lives here.
#
# Sealing is OFFLINE against the published PUBLIC cert — no cluster access, no
# kubeconfig, and the plaintext never touches disk or the log. Only the
# in-cluster controller holds the private key.
#
# TWO DELIBERATE DIVERGENCES FROM THE CANONICAL COPY
# --------------------------------------------------
#  1. No CI-suppression directive in the commit message. FuzeInfra's version puts
#     one there, which would mean `gate-sealed-keys` — the check that exists
#     precisely to catch a sealed key being dropped — never runs on the one kind
#     of commit it guards. A rotation is exactly when you want that gate.
#  2. No `auto-merge` label. `master` here is deploy-on-push, so merges belong in
#     an owner-opened deploy window (CLAUDE.md, hardening.deployOnPush).
#
# NOTE ON THE CERT FALLBACK: scripts/seal-secret.sh falls back to a committed
# public cert at deploy/sealed-secrets/sealing-cert.pem when the published URL is
# unreachable. That file NOW EXISTS in this repo (added so seal-consumer-secret.yml
# could drop its KUBE_CONFIG dependency), so this workflow also seals offline
# against it without ever touching the published URL or a cluster credential. If
# the sealed-secrets controller ever rotates its key, refresh the committed cert
# (`kubeseal --controller-namespace kube-system --controller-name
# sealed-secrets-controller --fetch-cert > deploy/sealed-secrets/sealing-cert.pem`
# from an environment with cluster access, then `git add -f` it — it's public key
# material, just caught by the repo's blanket *.pem gitignore rule).
# =============================================================================
name: rotate-sealed-secret

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "SealedSecret scope as ns/name (e.g. fuzefront/fuzefront-secrets)"
        required: true
      key:
        description: "Secret key to seal or rotate (e.g. CONFIG_DB_PASSWORD)"
        required: true
      manifest:
        description: "Repo-relative SealedSecret manifest to merge into (e.g. deploy/contabo/sealed/fuzefront-secrets.yaml)"
        required: true
      length:
        description: "Random byte length for the generated value (hex output is 2x this)"
        required: false
        default: "32"

# DELIBERATELY NO `value` INPUT. The canonical copy has one, and on a PUBLIC
# repository it is a credential-disclosure hazard: workflow_dispatch inputs are
# recorded and displayed with the run, so a secret typed into it is readable by
# anyone. Every value this workflow seals is generated here and never seen.
# A value that must MATCH something else (e.g. a shared JWT secret) should not be
# copied into a second Secret at all — read it from the Secret that already holds
# it via secretKeyRef.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rotate-${{ inputs.scope }}-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate inputs
        env:
          SCOPE: ${{ inputs.scope }}
          KEY: ${{ inputs.key }}
          MANIFEST: ${{ inputs.manifest }}
          LEN: ${{ inputs.length }}
        run: |
          set -euo pipefail
          # Inputs go through env, never interpolated into the shell — expression
          # interpolation in a run block is a command-injection seam.
          printf '%s' "$SCOPE" | grep -qE '^[a-z0-9-]+/[a-z0-9-]+$' || { echo "::error::scope must be ns/name"; exit 1; }
          # Secret keys are usually env-style names, but Kubernetes Secret keys
          # may also contain dots (the A2A card key is `jws.key`).
          printf '%s' "$KEY" | grep -qE '^[A-Za-z_][A-Za-z0-9_.-]*$' || { echo "::error::key must be a valid Kubernetes Secret key"; exit 1; }
          printf '%s' "$LEN" | grep -qE '^[0-9]{1,3}$' || { echo "::error::length must be a small integer"; exit 1; }
          case "$MANIFEST" in
            *..*|/*) echo "::error::manifest must be a repo-relative path"; exit 1 ;;
          esac
          [ -f "$MANIFEST" ] || { echo "::error::manifest not found: $MANIFEST"; exit 1; }

      - name: Install kubeseal
        run: |
          set -euo pipefail
          VER="0.27.1"
          curl -fsSL -o /tmp/ks.tgz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${VER}/kubeseal-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/ks.tgz -C /tmp kubeseal
          sudo install -m0755 /tmp/kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Generate + seal the new value (offline, public cert)
        env:
          KEY: ${{ inputs.key }}
          SCOPE: ${{ inputs.scope }}
          MANIFEST: ${{ inputs.manifest }}
          LEN: ${{ inputs.length }}
        run: |
          set -euo pipefail
          umask 077
          TMP="$(mktemp)"; trap 'rm -f "$TMP"' EXIT
          # A stray newline inside a credential is the classic failure this
          # primitive exists to prevent, hence the explicit whitespace scrub.
          openssl rand -hex "$LEN" | tr -d '[:space:]' > "$TMP"
          # KEY=@file, never KEY=VALUE — argv is visible to other processes.
          bash scripts/seal-secret.sh "$SCOPE" "${KEY}=@${TMP}" --out "$MANIFEST"

      - name: Confirm only ciphertext changed
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          # Cheap guard against a malformed merge writing something that is not a
          # SealedSecret. A sealed manifest must never contain a `data:` block —
          # that is the plaintext Secret shape.
          grep -q 'kind: SealedSecret' "$MANIFEST" || { echo "::error::$MANIFEST is no longer a SealedSecret"; exit 1; }
          if grep -qE '^\s*data:\s*$' "$MANIFEST"; then
            echo "::error::$MANIFEST contains a plaintext data: block — refusing to commit"; exit 1
          fi

      - name: Open the sealing PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          KEY: ${{ inputs.key }}
          SCOPE: ${{ inputs.scope }}
          MANIFEST: ${{ inputs.manifest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$MANIFEST"; then
            echo "::notice::no change to $MANIFEST — nothing to seal"; exit 0
          fi
          BRANCH="seal/${KEY}-${RUN_ID}"
          git config user.name "FuzeFront Secret Sealing"
          git config user.email "sealing@fuzefront"
          git checkout -b "$BRANCH"
          git add "$MANIFEST"
          {
            printf 'chore(secrets): seal %s in %s\n\n' "$KEY" "$SCOPE"
            printf 'Generated and sealed OFFLINE against the published public cert.\n'
            printf 'Only the encrypted ciphertext changed; the value was never logged,\n'
            printf 'never written to disk unencrypted, and is not recoverable from CI.\n'
          } > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt
          git push origin "$BRANCH"
          {
            printf '%s\n\n' "Automated SealedSecret sealing — no manual reseal, no cluster access."
            printf -- '- Key: `%s` · Scope: `%s` · Manifest: `%s`\n' "$KEY" "$SCOPE" "$MANIFEST"
            printf -- '- Value generated in-run and sealed **offline** against the published public cert. Only ciphertext is committed.\n'
            printf -- '- On merge, Argo syncs the SealedSecret and the controller decrypts it into the Secret.\n\n'
            printf '%s\n' "**Not labelled auto-merge:** \`master\` is deploy-on-push, so this merges in an owner-opened deploy window."
          } > /tmp/pr_body.md
          gh pr create --base master --head "$BRANCH" \
            --title "chore(secrets): seal ${KEY} in ${SCOPE}" \
            --body-file /tmp/pr_body.md
