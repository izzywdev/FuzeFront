name: Publish fuzefront-identity (Python)

# Builds the wheel + sdist for packages/identity-py and attaches them to a
# GitHub Release, so Python microservices in other family repos can install a
# PINNED artifact rather than tracking a branch.
#
# Why a Release asset and not a registry: GitHub Packages has no PyPI registry,
# and this is a private/proprietary family package so public PyPI is out. A
# Release asset is the one private-by-default artifact store the family already
# authenticates against (the same GITHUB_TOKEN that serves npm.pkg.github.com).
#
# Consumers install either:
#   pip install https://github.com/izzywdev/FuzeFront/releases/download/identity-py-vX.Y.Z/fuzefront_identity-X.Y.Z-py3-none-any.whl
#   pip install "git+https://github.com/izzywdev/FuzeFront.git@identity-py-vX.Y.Z#subdirectory=packages/identity-py"
# The first is preferred — it is a pinned immutable artifact and needs no git.

on:
  push:
    tags: ['identity-py-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match pyproject.toml)'
        required: true

permissions:
  contents: write # create the Release + upload assets

concurrency:
  group: identity-py-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Verify the tag matches pyproject version
        # A tag that disagrees with pyproject produces a wheel whose filename
        # and metadata contradict the release it is attached to — the kind of
        # mismatch that is only discovered by a consumer, months later.
        #
        # `inputs.version` and `github.*` reach the shell through env, NEVER
        # through ${{ }} interpolation in `run:`. A dispatch input is arbitrary
        # attacker-supplied text; interpolated directly it is a command-injection
        # sink, and this job holds `contents: write` and publishes an artifact
        # consumers install — the worst possible place to have one.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd packages/identity-py
          PY_VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VER="$INPUT_VERSION"
          else
            TAG_VER="${REF_NAME#identity-py-v}"
          fi
          echo "pyproject=$PY_VER  tag=$TAG_VER"
          [ "$PY_VER" = "$TAG_VER" ] || { echo "::error::pyproject version $PY_VER != tag $TAG_VER"; exit 1; }

      - name: Test before publishing
        # The package is dependency-free, so the suite needs no services. There
        # is no excuse for shipping it untested.
        run: |
          cd packages/identity-py
          pip install -q -e '.[dev]'
          pytest -q

      - name: Cross-language registry parity
        # A prefix that differs between the Python and TypeScript registries
        # means a reference minted by a Node service is rejected by a Python one.
        # Publishing a wheel that disagrees with the Node package would ship that
        # outage to every consumer.
        run: |
          pip install -q pyyaml
          python scripts/gate_identifier.py . --registry-parity

      - name: Build wheel + sdist
        run: |
          cd packages/identity-py
          pip install -q build
          python -m build

      - name: Attach to the Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7  # v2
        with:
          files: packages/identity-py/dist/*
          tag_name: ${{ github.ref_name }}
          name: fuzefront-identity ${{ github.ref_name }}
          body: |
            Python identity package for FuzeFront microservices —
            server-owned entity identifiers + graph-create ASGI middleware.

            Standard: `governance/identifier-standard.md`
            Node peer: `@izzywdev/fuzefront-identity`

            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fuzefront_identity-${{ github.ref_name }}-py3-none-any.whl
            ```
          fail_on_unmatched_files: true
