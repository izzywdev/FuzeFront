name: unleash-enable-flag

# Enable / ramp / roll back a single Unleash flag from CI. workflow_dispatch only —
# the credential lives here as a secret, so the flip does not need an operator with a
# live Cloudflare-Access session. Owned by feature-flags-engineer; secrets by devops.
on:
  workflow_dispatch:
    inputs:
      flag:
        description: 'Flag key, e.g. fuzefront.devportal.enabled'
        required: true
      rollout:
        description: 'flexibleRollout percentage (0-100). 0 = present-but-off.'
        required: true
        default: '100'
      environment:
        description: 'Unleash environment'
        required: true
        default: 'production'
      type:
        description: 'Flag type if it must be created (release|ops-kill-switch|experiment|permission). ops-kill-switch maps to Unleash kill-switch.'
        required: true
        default: 'release'
      description:
        description: 'Owner + decision + removal criterion (stored on the flag)'
        required: false
        default: ''
      action:
        description: 'enable (strategy upsert then env on) or disable (env off — fast rollback). Must be exactly "enable" or "disable".'
        required: true
        default: 'enable'

permissions:
  contents: read

concurrency:
  group: unleash-flag-${{ github.event.inputs.flag }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: fuzefront
    environment: unleash-production
    timeout-minutes: 5
    steps:
      - name: Preconditions
        env:
          UNLEASH_ADMIN_URL: ${{ secrets.UNLEASH_ADMIN_URL }}
          UNLEASH_ADMIN_TOKEN: ${{ secrets.UNLEASH_ADMIN_TOKEN }}
          FLAG: ${{ github.event.inputs.flag }}
          ROLLOUT: ${{ github.event.inputs.rollout }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          : "${UNLEASH_ADMIN_URL:?UNLEASH_ADMIN_URL secret is not set — devops must provision it}"
          : "${UNLEASH_ADMIN_TOKEN:?UNLEASH_ADMIN_TOKEN secret is not set — devops must provision it}"
          case "$ROLLOUT" in ''|*[!0-9]*) echo "rollout must be an integer 0-100"; exit 1;; esac
          [ "$ROLLOUT" -le 100 ] || { echo "rollout must be <= 100"; exit 1; }
          case "$ACTION" in enable|disable) : ;; *) echo "action must be exactly 'enable' or 'disable', got: $ACTION"; exit 1;; esac
          [[ "$FLAG" =~ ^[a-zA-Z0-9._-]+$ ]] || { echo "flag must match ^[a-zA-Z0-9._-]+$ (got: $FLAG)"; exit 1; }
          [[ "$ENVIRONMENT" =~ ^[a-zA-Z0-9._-]+$ ]] || { echo "environment must match ^[a-zA-Z0-9._-]+$ (got: $ENVIRONMENT)"; exit 1; }

      - name: Toggle flag
        env:
          UNLEASH_ADMIN_URL: ${{ secrets.UNLEASH_ADMIN_URL }}
          UNLEASH_ADMIN_TOKEN: ${{ secrets.UNLEASH_ADMIN_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FLAG: ${{ github.event.inputs.flag }}
          ROLLOUT: ${{ github.event.inputs.rollout }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          FTYPE: ${{ github.event.inputs.type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          ACTION: ${{ github.event.inputs.action }}
          PROJECT: default
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: $UNLEASH_ADMIN_TOKEN")
          # Attach a CF-Access service token only if provided.
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            AUTH+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          base="$UNLEASH_ADMIN_URL/api/admin/projects/$PROJECT/features/$FLAG/environments/$ENVIRONMENT"
          # Derive temp-file paths from FLAG+ENVIRONMENT so concurrent dispatches for
          # different flags on the same self-hosted runner cannot clobber each other.
          # FLAG and ENVIRONMENT were validated as ^[a-zA-Z0-9._-]+$ in Preconditions.
          T="/tmp/uf-${FLAG}-${ENVIRONMENT}"

          if [ "$ACTION" = "disable" ]; then
            # Capture HTTP status explicitly — curl -sf alone does not fail on 3xx
            # (e.g. a CF-Access login redirect), which would falsely report success.
            off_code=$(curl -sS -o "${T}-off.json" -w '%{http_code}' "${AUTH[@]}" -X POST "$base/off")
            case "$off_code" in 200|204) : ;; *) echo "disable failed ($off_code)"; cat "${T}-off.json"; exit 1;; esac
            echo "::notice::disabled $FLAG in $ENVIRONMENT (strategy left intact for clean re-enable)"
            exit 0
          fi

          # create-if-absent (tolerate 409). Build every JSON body with python3 — the
          # free-form $DESCRIPTION (and $FLAG) must never be spliced into JSON by hand,
          # or a quote character produces malformed JSON and a half-enabled flag.
          # Map the repo taxonomy type to Unleash wire types: ops-kill-switch → kill-switch.
          create_body=$(python3 -c 'import json,os;m={"ops-kill-switch":"kill-switch"};t=m.get(os.environ["FTYPE"],os.environ["FTYPE"]);print(json.dumps({"name":os.environ["FLAG"],"type":t,"description":os.environ["DESCRIPTION"]}))')
          code=$(curl -sS -o "${T}-c.json" -w '%{http_code}' -X POST \
            "$UNLEASH_ADMIN_URL/api/admin/projects/$PROJECT/features" \
            "${AUTH[@]}" -H 'Content-Type: application/json' -d "$create_body")
          case "$code" in 201|409) : ;; *) echo "create failed ($code)"; cat "${T}-c.json"; exit 1;; esac

          # Upsert the unsegmented flexibleRollout strategy BEFORE enabling the environment
          # so the correct rollout % is live the instant the environment turns on. An env-on
          # followed by a failed strategy upsert would leave the flag live at a stale %.
          # Select only unsegmented strategies to avoid ambiguity when a flag has both a
          # segment-targeted and an unsegmented ramp strategy; fail if multiple match.
          strategies_code=$(curl -sS -o "${T}-strats.json" -w '%{http_code}' "${AUTH[@]}" "$base/strategies")
          case "$strategies_code" in 200) : ;; *) echo "strategies GET failed ($strategies_code)"; cat "${T}-strats.json"; exit 1;; esac
          # Reject competing global (unsegmented, unconstrained) strategies of other types.
          # Unleash evaluates strategies with OR semantics: a "default" always-on strategy overrides
          # any flexibleRollout %, enabling all users regardless of the configured rollout.
          competing=$(T="$T" python3 -c 'import json,os;xs=[s["name"] for s in json.load(open(os.environ["T"]+"-strats.json")) if not s.get("segments") and not s.get("constraints") and s.get("name")!="flexibleRollout" and not s.get("disabled")];print(",".join(xs))')
          if [ -n "$competing" ]; then echo "competing global strategies detected: $competing — remove them in the Unleash UI first, then re-run"; exit 1; fi
          # Select only unsegmented, unconstrained flexibleRollout strategies to avoid
          # ambiguity and prevent accidentally widening a targeted pilot strategy.
          sid=$(T="$T" python3 -c 'import sys,json,os;a=[s for s in json.load(open(os.environ["T"]+"-strats.json")) if s.get("name")=="flexibleRollout" and not s.get("segments") and not s.get("constraints")];xs=([s for s in a if not s.get("disabled")] or a);sys.exit("ambiguous: multiple unsegmented unconstrained flexibleRollout strategies — resolve in Unleash UI first") if len(xs)>1 else None;print(xs[0]["id"] if xs else "")')
          post_body=$(python3 -c 'import json,os;print(json.dumps({"name":"flexibleRollout","parameters":{"rollout":os.environ["ROLLOUT"],"stickiness":"default","groupId":os.environ["FLAG"]}}))')
          if [ -n "$sid" ]; then
            # Preserve the full strategy object (variants, title, stickiness, groupId…) —
            # only update parameters.rollout and force disabled:false. Unleash PUT replaces
            # the whole strategy, so omitting a field (e.g. variants on an experiment) deletes
            # it. Strip response-only fields (id, featureName, createdAt, sortOrder) that the
            # PUT schema rejects with 400.
            patch_body=$(T="$T" python3 -c 'import json,os;d=json.load(open(os.environ["T"]+"-strats.json"));a=[s for s in d if s.get("name")=="flexibleRollout" and not s.get("segments") and not s.get("constraints")];xs=([s for s in a if not s.get("disabled")] or a);s=dict(xs[0]);[s.pop(k,None) for k in ["id","featureName","createdAt","sortOrder"]];s["parameters"]=dict(s.get("parameters",{}));s["parameters"]["rollout"]=os.environ["ROLLOUT"];s["disabled"]=False;print(json.dumps(s))')
            strat_code=$(curl -sS -o "${T}-strat_w.json" -w '%{http_code}' "${AUTH[@]}" -H 'Content-Type: application/json' -X PUT "$base/strategies/$sid" -d "$patch_body")
            case "$strat_code" in 200) : ;; *) echo "strategy PUT failed ($strat_code)"; cat "${T}-strat_w.json"; exit 1;; esac
          else
            strat_code=$(curl -sS -o "${T}-strat_w.json" -w '%{http_code}' "${AUTH[@]}" -H 'Content-Type: application/json' -X POST "$base/strategies" -d "$post_body")
            case "$strat_code" in 200|201) : ;; *) echo "strategy POST failed ($strat_code)"; cat "${T}-strat_w.json"; exit 1;; esac
          fi

          # Enable the environment only after the strategy is in the desired state.
          on_code=$(curl -sS -o "${T}-on.json" -w '%{http_code}' "${AUTH[@]}" -X POST "$base/on")
          case "$on_code" in 200|204) : ;; *) echo "environment enable failed ($on_code)"; cat "${T}-on.json"; exit 1;; esac
          echo "::notice::$FLAG set to ${ROLLOUT}% in $ENVIRONMENT"
