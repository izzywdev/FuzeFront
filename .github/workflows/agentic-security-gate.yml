name: Agentic Security Gate

on:
  pull_request:
    paths:
      - 'security/agentic/**'
      - 'scripts/agentic_threat_intel.py'
      - 'scripts/tests/test_agentic_threat_intel.py'
      - '.github/workflows/agentic-*.yml'
  push:
    branches: [master, main]
    paths:
      - 'security/agentic/**'
      - 'scripts/agentic_threat_intel.py'
      - 'scripts/tests/test_agentic_threat_intel.py'
      - '.github/workflows/agentic-*.yml'

permissions:
  contents: read

jobs:
  validate-register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate gate register
        run: python3 scripts/agentic_threat_intel.py validate
      - name: Test collector trust boundary
        run: python3 -m unittest scripts.tests.test_agentic_threat_intel
