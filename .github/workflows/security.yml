name: Security Scanning

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 2 * * 1' # Weekly scan on Mondays

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          category: '/language:${{matrix.language}}'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          # TruffleHog is AGPL-3.0, which allow-licenses above does not permit.
          # It has been in this workflow all along; it only became visible when
          # pinning changed its ref, because Dependency Review evaluates CHANGED
          # dependencies and a floating `@main` ref never changes.
          #
          # Exempted by name rather than adding AGPL-3.0 to allow-licenses,
          # because that list also governs the npm dependencies that ship inside
          # the product, where AGPL copyleft would be a real obligation.
          # TruffleHog is a scanner that runs in the pipeline and is never
          # conveyed with FuzeFront, so the obligation does not attach. Keeping
          # the distinction means the strict policy still protects what it was
          # written to protect.
          #
          # Format is package-url, per the action's README:
          #   pkg:githubactions/owner/repo[@version]
          # Version deliberately omitted so the exemption survives future pin
          # bumps rather than silently lapsing on the next SHA change.
          #
          # `snyk/actions/node` also appears in the log under "could not detect
          # a license", but that is NOT a failure: src/main.ts calls setFailed
          # only for `forbidden` and `unresolved` licenses, while `unlicensed`
          # is merely printed. Adding it would be an unverified multi-segment
          # purl bought for nothing.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            */package-lock.json

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install root dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Run security audit
        run: |
          # Function to run audit if package.json exists
          run_audit() {
            local dir="$1"
            if [ -f "$dir/package.json" ]; then
              echo "🔍 Auditing $dir"
              cd "$dir"
              # Install dependencies if package-lock.json exists
              if [ -f package-lock.json ]; then
                npm ci --production
              elif [ -f package.json ]; then
                npm install --production --package-lock-only
              fi
              npm audit --audit-level=high --production || echo "⚠️ Audit failed for $dir"
              cd - > /dev/null
            else
              echo "⏭️ Skipping $dir (no package.json)"
            fi
          }
          
          # Audit projects that exist
          run_audit "."
          run_audit "frontend"
          run_audit "backend" 
          run_audit "fuzefront-website/frontend"
          run_audit "fuzefront-website/backend"
          run_audit "sdk"
          run_audit "shared"

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # backend + frontend images build from the REPO ROOT context (they
      # consume @fuzefront/* workspaces outside their own dir) — mirror
      # release.yml's exact buildx config (context: . + file:) so the scanned
      # image is what actually ships. load: true keeps it in the local daemon
      # for Trivy.
      - name: Build backend image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: frontfuse/backend:latest
          cache-from: type=gha

      - name: Build frontend image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          build-args: |
            VITE_API_URL=
          tags: frontfuse/frontend:latest
          cache-from: type=gha,scope=frontend-root

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'frontfuse/backend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        env:
          TRIVY_TOKEN: ${{ secrets.TRIVY_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scanner
        uses: trufflesecurity/trufflehog@82df476e759c1448517fac6bfb3677685cdcd78a # main (pinned snapshot)
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        env:
          TRUFFLEHOG_TOKEN: ${{ secrets.TRUFFLEHOG_TOKEN }}

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file frontfuse-sbom.json
          npx @cyclonedx/cyclonedx-npm --output-format xml --output-file frontfuse-sbom.xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-files
          path: |
            frontfuse-sbom.json
            frontfuse-sbom.xml
          retention-days: 30

  # Add new external security tools integration
  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      # Snyk requires a SNYK_TOKEN org secret. When it is not provisioned the
      # scan cannot authenticate (SNYK-0005 / 401), so skip the scan steps
      # cleanly instead of hard-failing every PR. secrets.* is not available
      # in job-level `if`, so gate at step level.
      - name: Check for SNYK_TOKEN
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNYK_TOKEN secret not configured — skipping Snyk scan"
          fi

      - name: Checkout code
        if: steps.snyk-token.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        if: steps.snyk-token.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        if: steps.snyk-token.outputs.present == 'true'
        run: npm install

      - name: Run Snyk to check for vulnerabilities
        if: steps.snyk-token.outputs.present == 'true'
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master (pinned snapshot)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        if: always() && steps.snyk-token.outputs.present == 'true'
        with:
          sarif_file: snyk.sarif

  # Add monitoring and alerting
  security-monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    needs: [codeql-analysis, container-security, secret-scanning]
    if: always()

    steps:
      - name: Security summary
        run: |
          echo "🔐 Security Analysis Summary"
          echo "CodeQL: ${{ needs.codeql-analysis.result }}"
          echo "Container Security: ${{ needs.container-security.result }}"
          echo "Secret Scanning: ${{ needs.secret-scanning.result }}"

      - name: Notify security team
        if: failure()
        run: |
          echo "🚨 Security issues detected - notifications would be sent to security team"
          echo "Webhook URL: ${{ secrets.SECURITY_WEBHOOK_URL }}"
        env:
          SECURITY_WEBHOOK_URL: ${{ secrets.SECURITY_WEBHOOK_URL }}
