name: Helm validate

# Lint + schema-validate the FuzeFront Helm chart against both overlays on every
# PR that touches the chart. Mirrors FuzeInfra's helm-validate.yml: helm lint
# then `helm template | kubeconform --strict` (Kubernetes 1.29 schemas). Catches
# malformed templates and invalid resource specs before they reach Argo.
on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'deploy/scripts/**'
      - '.github/workflows/helm-validate.yml'

permissions:
  contents: read

jobs:
  helm-validate:
    name: Lint & kubeconform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        values: [values-local.yaml, values-prod.yaml]
    steps:
      # GitHub-hosted ubuntu-latest runners occasionally provision with an
      # uninitialised ca-certificates bundle (CAfile: none / CRLfile: none),
      # causing git SSL verification to fail during checkout (exit 128).
      # This guard installs the package only when the bundle is missing/empty
      # so it is a no-op on correctly configured runners. Must run BEFORE
      # actions/checkout — git needs certs to clone the repo.
      - name: Ensure CA certificates
        run: |
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            echo "::warning::ca-certificates bundle missing — installing (runner provisioning race)"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ca-certificates
            sudo update-ca-certificates
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint (${{ matrix.values }})
        run: |
          helm lint deploy/helm/fuzefront \
            -f deploy/helm/fuzefront/${{ matrix.values }} \
            --set secret.authentikClientSecret=ci-placeholder

      - name: helm template + kubeconform (${{ matrix.values }})
        run: |
          # Render with every optional workload enabled so kubeconform sees the
          # full surface. Placeholder secrets satisfy the OIDC render guard;
          # existingSecret="" forces the chart Secret to render too. permit is
          # also enabled so the PDP + schema-sync Job are validated. --output-dir
          # writes one file per template so we can exclude a single one below.
          rm -rf rendered
          helm template fuzefront deploy/helm/fuzefront \
            -f deploy/helm/fuzefront/${{ matrix.values }} \
            --set secret.existingSecret="" \
            --set secret.authentikClientSecret=ci-placeholder \
            --set securityService.enabled=true \
            --set applicationsService.enabled=true \
            --set emailService.enabled=true \
            --set smsService.enabled=true \
            --set provisioningService.enabled=true \
            --set permit.enabled=true \
            --set configService.enabled=true \
            --output-dir rendered

          # Strict: reject unknown fields. Skip CRDs cert-manager/sealed-secrets
          # owns (not in upstream k8s schemas). Helm hooks render as plain Jobs.
          # Middleware is a Traefik CRD instance — no upstream k8s schema exists.
          #
          # Exclude authentik-blueprints.yaml: that ConfigMap's `data` keys embed
          # multi-document Authentik blueprint YAML with custom tags (!Env/!Find)
          # and repeated top-level keys, which kubeconform's strict unmarshaller
          # mis-reads. It is opaque string data to Kubernetes — no schema applies.
          #
          # NB: kubeconform's -skip is last-one-wins (Go flag semantics), so the
          # skipped kinds MUST be a single comma-separated list, not repeated flags.
          kubeconform \
            -strict \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -skip CustomResourceDefinition,Middleware,SealedSecret \
            -ignore-filename-pattern 'authentik-blueprints' \
            -summary \
            rendered/fuzefront/templates/

      - name: Guard shell-launched containers can run their interpreter (${{ matrix.values }})
        run: |
          # REPLACES a narrower guard that asserted the seed Job's tag RESOLVED on
          # registry.k8s.io. That guard was green on 2026-08-20 while the Job could
          # not start at all: the image had been moved to `registry.k8s.io/kubectl`,
          # which is DISTROLESS, and the Job invokes `/bin/sh -c`. Every pod died at
          # runc init with `exec: "/bin/sh": no such file or directory`, printed
          # nothing, and blocked the whole registration handoff.
          #
          # The old guard asserted the PREVIOUS failure mode (a deleted bitnami tag,
          # FuzeFront#688) and had an explicit warn-and-skip for any image not on
          # registry.k8s.io -- so moving the image off that registry would have
          # silently disarmed it too. Resolving a manifest is not evidence the image
          # can execute the command the manifest gives it, so this runs the
          # interpreter. See deploy/scripts/check-job-interpreters.sh for the detail.
          #
          # Scope is now every shell-launched container in the rendered chart, not
          # just the seed Job. First-party ghcr.io/izzywdev/* images are reported and
          # skipped (pulling them needs auth; their bases are pinned by our
          # Dockerfiles). The script hard-errors rather than skipping if docker or
          # PyYAML is missing, and fails if the scan matches nothing.
          # Self-test FIRST, deliberately, mirroring gate-identifier: assert the
          # probe still FAILS on a known-distroless image before trusting it to
          # pass on ours. A gate observed only passing proves nothing -- the guard
          # this replaces was green for the entire life of the bug it should have
          # caught.
          set -euo pipefail
          ./deploy/scripts/check-job-interpreters.sh --self-test
          ./deploy/scripts/check-job-interpreters.sh rendered/fuzefront/templates

      - name: Guard NetworkPolicy port values (${{ matrix.values }})
        run: |
          # kubeconform validates SHAPE (NetworkPolicyPort.port is IntOrString) but
          # not RANGE — a missing values.yaml default renders as `port: 0`, which is
          # a syntactically valid integer, so kubeconform stays green while the live
          # API server rejects it at admission time (ports must be 1-65535). That
          # gap is exactly how FuzeInfra#501 shipped: a `| int` cast silently
          # coerced an undefined value to 0 to satisfy kubeconform's oneOf schema,
          # and every subsequent Argo sync of the whole application failed for days
          # before anyone noticed. This step catches numeric out-of-range ports
          # (0 or >65535) directly in the rendered manifest, with no cluster
          # needed. Named ports (e.g. `port: http`, referencing a container port
          # name) are valid and deliberately left unchecked.
          fail=0
          for f in rendered/fuzefront/templates/*.yaml; do
            grep -q '^kind: NetworkPolicy$' "$f" || continue
            while IFS= read -r line; do
              val="${line#*: }"
              if [[ "$val" =~ ^[0-9]+$ ]] && { [ "$val" -lt 1 ] || [ "$val" -gt 65535 ]; }; then
                echo "::error file=$f::NetworkPolicy has invalid port value '$val' (must be 1-65535, got via a rendered default of 0 or similar) — see FuzeInfra#501"
                fail=1
              fi
            done < <(grep -E '^\s*port:\s*' "$f")
          done
          exit $fail

      - name: Guard Authentik public Ingress paths (${{ matrix.values }})
        run: |
          # Same class of gap as the NetworkPolicy port guard above: kubeconform
          # validates SHAPE against the Kubernetes API schema, not the CONTROLLER's
          # actual matching semantics. Production runs Traefik, whose Kubernetes
          # Ingress provider implements `pathType: Prefix` as a plain STRING prefix
          # (its PathPrefix matcher) rather than the spec's element-wise segment
          # match. That gap let `- /application` (no trailing slash) in
          # fuzefront.authentikPublicPaths string-prefix-match `/applications`,
          # routing Authentik's application-list surface to the public internet —
          # live, unnoticed, for an unknown period. helm lint and kubeconform both
          # stayed green throughout.
          #
          # Self-test FIRST: prove the probe still fails on the exact regression
          # (a bare "/application" that matches "/applications") before trusting it
          # to pass on this chart's actual rendered output. A check only ever
          # observed passing is not evidence of anything.
          set -euo pipefail
          ./deploy/scripts/check-authentik-public-paths.sh --self-test
          ./deploy/scripts/check-authentik-public-paths.sh rendered/fuzefront/templates
