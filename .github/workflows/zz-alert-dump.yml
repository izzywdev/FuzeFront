name: zz alert dump
on:
  push:
    branches: [claude/trusting-ritchie-ecep0e]
permissions:
  security-events: read
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trusting-ritchie-ecep0e
      - name: Dump open code-scanning alerts to a data ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" --paginate > raw.json
          mkdir -p .alertdump
          jq '[.[] | {
                number, state,
                rule_id: .rule.id,
                severity: .rule.security_severity_level,
                rule_severity: .rule.severity,
                tags: .rule.tags,
                desc: .rule.description,
                tool: .tool.name,
                path: .most_recent_instance.location.path,
                start_line: .most_recent_instance.location.start_line,
                end_line: .most_recent_instance.location.end_line,
                message: .most_recent_instance.message.text,
                created_at, updated_at,
                url: .html_url
              }]' raw.json > .alertdump/alerts.json
          echo "TOTAL: $(jq 'length' .alertdump/alerts.json)"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B alertdump-data
          git add -f .alertdump/alerts.json
          git commit -q -m "chore: code-scanning alert snapshot"
          git push -f origin alertdump-data
