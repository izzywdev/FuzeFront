name: Seal Stripe + payment secrets

# Dispatching service that seals the two keys payment-service needs into the
# `payment-secrets` SealedSecret, WITHOUT any plaintext ever appearing in chat, a
# PR diff, or a build log (kubeseal --merge-into preserves every other key). This
# is the payment-service analog of seal-sms-secrets.yml — same offline mechanics.
#
# WHO PROVIDES WHAT — the governance split (deploy/contabo/SEAL_PROD_SECRETS.md):
#   - STRIPE_SECRET_KEY is an EXTERNAL vendor credential, read here from a GitHub
#     *repo secret* the OWNER sets — never held by an agent, never pasted anywhere.
#     Set it once (Settings → Secrets and variables → Actions):
#         STRIPE_SECRET_KEY   (Stripe Dashboard → Developers → API keys → Secret
#                              key; sk_live_… in prod, or sk_test_… for test mode)
#   - PAYMENT_INTERNAL_TOKEN is NOT a vendor value — it is the internal shared
#     Bearer token that gates payment-service's internal endpoint. This workflow
#     MINTS it (openssl rand -hex 32) and seals it. It is only minted when absent
#     (or when rotate_internal_token=true); a caller of that endpoint must use the
#     same value.
#
# These are exactly the secretKeyRefs payment-service.yaml mounts:
# STRIPE_SECRET_KEY / PAYMENT_INTERNAL_TOKEN — both from `payment-secrets` (the
# default when paymentService.secretName is ""). Unlike billing-service, payment
# needs NO webhook secret, NO publishable key, and NO Stripe price IDs — those
# live in billing-service's own `billing-secrets`.
#
# This seal step is SAFE to run before go-live: adding the keys does NOT start any
# pod — paymentService.enabled is still false, so nothing renders. Enabling payment
# is a SEPARATE GitOps commit in a deploy window (flip paymentService.enabled:
# true), kept apart so the secret is provably present before the Deployment ever
# renders.
#
# NO cluster access is used, and NO live network fetch of the sealed-secrets
# controller cert either — it seals OFFLINE via scripts/seal-secret.sh against the
# cert committed at deploy/sealed-secrets/sealing-cert.pem (added in #870), with a
# guard step that fails loudly if that cert is missing or expired rather than
# silently sealing something the live controller can't decrypt. The commit to
# `master` goes through the same RELEASE_BUMP_SSH_KEY deploy key release.yml uses,
# because the "Protect Master" ruleset rejects a plain GITHUB_TOKEN push (Changes
# must be made through a pull request); the DeployKey is a bypass actor on that rule.

on:
  workflow_dispatch:
    inputs:
      rotate_internal_token:
        description: "Re-mint PAYMENT_INTERNAL_TOKEN even if already sealed (rotation; the caller of payment-service's internal endpoint must be updated to match)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      dry_run:
        description: "Print the sealed diff to the log without committing"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: seal-payment-secrets
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The sealed-secrets controller's PUBLIC certificate, committed in-repo (added
  # in #870; force-added past the blanket *.pem gitignore rule since it's public
  # key material). No live URL, no cluster access, no kubeconfig.
  SEALING_CERT: deploy/sealed-secrets/sealing-cert.pem

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail LOUD and EARLY if the Stripe key is missing. Unlike the internally
      # minted token, it cannot be generated — sealing an empty value would seal a
      # placeholder, and payment-service would silently fail every Stripe call
      # (the ref is optional:true, so the pod does NOT crash — it just can't take
      # payments, which is worse to discover in prod). Better to stop here.
      - name: Require Stripe secret key to be set
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::Missing GitHub repo secret STRIPE_SECRET_KEY. Set it under" \
                 "Settings → Secrets and variables → Actions (Stripe Dashboard →" \
                 "Developers → API keys → Secret key), then re-run this workflow." >&2
            exit 1
          fi
          # Light shape check (a wrong-shaped value is almost always a paste error).
          case "$STRIPE_SECRET_KEY" in
            sk_live_*|sk_test_*|rk_live_*|rk_test_*) : ;;
            *) echo "::warning::STRIPE_SECRET_KEY does not start with sk_live_/sk_test_ (or a restricted rk_ key) — double-check it." ;;
          esac
          echo "::notice::STRIPE_SECRET_KEY is present."

      # A stale/missing cert would otherwise fail silently at pod start (the live
      # controller can't decrypt a SealedSecret sealed against an old key), which
      # is the worst place to discover it — fail loudly here instead.
      - name: Verify sealing cert is present and current
        run: |
          set -euo pipefail
          CERT="$SEALING_CERT"
          REFRESH_HELP="Refresh it (only needed after a sealed-secrets controller key rotation — not a routine step) from an environment with cluster access: kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --fetch-cert > \$CERT, then commit with 'git add -f \$CERT' (it is public key material — safe to publish — but matched by the repo's blanket *.pem gitignore rule, so force-add is expected)."

          if [ ! -f "$CERT" ]; then
            echo "::error::Missing $CERT. Sealing needs the sealed-secrets controller's PUBLIC certificate committed in-repo — this job uses ZERO cluster access and ZERO live network fetch. $REFRESH_HELP"
            exit 1
          fi

          if ! openssl x509 -in "$CERT" -noout -checkend 0 >/dev/null 2>&1; then
            END="$(openssl x509 -in "$CERT" -noout -enddate 2>/dev/null | cut -d= -f2)"
            echo "::error::$CERT has EXPIRED (notAfter: ${END:-unknown}). Sealing against a stale cert silently produces a SealedSecret the live controller cannot decrypt — it would fail at pod start, not here. Failing loudly now instead. $REFRESH_HELP"
            exit 1
          fi

          FPR="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)"
          END="$(openssl x509 -in "$CERT" -noout -enddate 2>/dev/null | cut -d= -f2)"
          echo "::notice::Sealing cert OK — SHA256 fingerprint ${FPR}, expires ${END}"

      - name: Install kubeseal
        run: |
          KSVER=0.27.3
          curl -sSL \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KSVER}/kubeseal-${KSVER}-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeseal
          kubeseal --version

      - name: Seal Stripe + PAYMENT_INTERNAL_TOKEN (merge into payment-secrets)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ROTATE_INTERNAL_TOKEN: ${{ inputs.rotate_internal_token }}
        run: |
          set -euo pipefail
          MANIFEST=deploy/contabo/sealed/payment-secrets.yaml
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT

          # Never echo values. Whitespace-trim (paste artefacts are common);
          # scripts/seal-secret.sh base64s KEY=@file inputs itself.
          printf '%s' "$STRIPE_SECRET_KEY" | tr -d '[:space:]' > "$d/STRIPE_SECRET_KEY"

          declare -a PAIRS=( "STRIPE_SECRET_KEY=@$d/STRIPE_SECRET_KEY" )

          # PAYMENT_INTERNAL_TOKEN: mint only if absent, or if rotation was
          # explicitly requested. Re-minting rotates the shared token, so it is
          # opt-in — a caller of payment-service's internal endpoint must be
          # updated to the new value.
          if grep -q 'PAYMENT_INTERNAL_TOKEN' "$MANIFEST" && [ "$ROTATE_INTERNAL_TOKEN" != "true" ]; then
            echo "::notice::PAYMENT_INTERNAL_TOKEN already sealed — leaving it untouched (pass rotate_internal_token=true to rotate)."
          else
            openssl rand -hex 32 | tr -d '\n' > "$d/PAYMENT_INTERNAL_TOKEN"
            PAIRS+=("PAYMENT_INTERNAL_TOKEN=@$d/PAYMENT_INTERNAL_TOKEN")
            echo "::notice::PAYMENT_INTERNAL_TOKEN will be minted and sealed."
          fi

          # Offline, encrypt-only seal via FuzeInfra's canonical script: needs only
          # the committed public cert, never a kubeconfig, kubectl, or a live cert
          # fetch. --out on an existing manifest merges (kubeseal --merge-into),
          # preserving every other key already in $MANIFEST.
          bash scripts/seal-secret.sh fuzefront/payment-secrets \
            "${PAIRS[@]}" \
            --cert "$SEALING_CERT" \
            --out "$MANIFEST"

          echo "::notice::Sealed STRIPE_SECRET_KEY (+ PAYMENT_INTERNAL_TOKEN if applicable) and merged into $MANIFEST."

      - name: Show diff (dry run)
        if: inputs.dry_run == 'true'
        run: git --no-pager diff deploy/contabo/sealed/payment-secrets.yaml

      - name: Commit sealed secret
        if: inputs.dry_run == 'false'
        env:
          SSH_KEY: ${{ secrets.RELEASE_BUMP_SSH_KEY }}
        run: |
          set -euo pipefail
          if git diff --quiet deploy/contabo/sealed/payment-secrets.yaml; then
            echo "::notice::No change to commit (keys already sealed with these values)."
            exit 0
          fi
          # Push via the RELEASE_BUMP_SSH_KEY deploy key — a bypass actor on the
          # "Protect Master" ruleset, the same mechanism release.yml's GitOps bump
          # uses. A plain GITHUB_TOKEN push 409s ("must be made through a PR").
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_bump
          chmod 600 ~/.ssh/release_bump
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/release_bump -o IdentitiesOnly=yes"
          git config user.name  "fuzefront-release"
          git config user.email "release-bump@users.noreply.github.com"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git add deploy/contabo/sealed/payment-secrets.yaml
          git commit -m "secrets(prod): seal Stripe + PAYMENT_INTERNAL_TOKEN for payment-service"
          git push origin HEAD:master
          echo "::notice::Committed to master — ArgoCD syncs payment-secrets within ~60s."

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Seal Stripe + payment secrets"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Dry run — sealed YAML NOT committed (see the diff step)."
            else
              echo "- Sealed the keys into \`payment-secrets\` and committed to master."
              echo "- The keys are now present but INERT: \`paymentService.enabled\` is still false."
              echo "- **Next (separate, deploy-window commit):** flip \`paymentService.enabled: true\` in \`values-prod.yaml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
