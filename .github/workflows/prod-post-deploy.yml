name: Post-deploy verification

# Runs after a release has shipped: waits for ArgoCD to sync, polls the public
# health endpoint (prod-smoke.yml), separately polls chat-service's health
# through the same public ingress, then runs the read-only post-prod Playwright
# smoke (post-prod-e2e.yml). A failure there triggers claude-autofix-post-prod.yml.
#
# CHAT-SERVICE HEALTH — why this exists
# --------------------------------------
# Before this, NOTHING in the post-deploy path checked chat-service. It has its
# own history of silently failing to deploy: #499 the migrate Job crash-looped
# against the shared backend DB (fixed in #508 with a dedicated fuzefront_chat
# database), and before that #432/#442 the image wasn't even in the release
# matrix. A chart change that reintroduces any of those would ship green here
# and only be discovered by a human noticing the widget is broken.
#
# GET /chat-api/health is UNAUTHENTICATED (services/chat-service/src/app.ts) and
# proxied same-origin by nginx (frontend/nginx.conf `location /chat-api/`), so
# polling it black-box over the public ingress needs no cluster credentials —
# identical shape to the existing /api/health check, just a different path and
# upstream service. A 200 here proves the pod exists, isn't crash-looping, the
# Service resolves, and the ingress chain is wired — it does NOT prove the
# LiteLLM gateway path works (that needs an authenticated /chat/stream call,
# which post-prod-e2e's live-smoke could add later); this is deliberately the
# same-weight signal as the existing backend health check, not a full chat e2e.
#
# WHY THIS IS DISPATCHED AND NOT `workflow_run`
# ---------------------------------------------
# This workflow previously triggered on `workflow_run` of "Release (images +
# GitOps bump)". That never fired ONCE: the workflow is registered and
# `state: active`, its name matcher is byte-exact against release.yml's `name:`,
# it has lived on the default branch since 2026-07-27, and release.yml has
# completed successfully many times since — yet the run count was ZERO. The
# post-prod E2E it exists to run therefore never ran automatically.
#
# Rather than keep guessing at GitHub's workflow_run semantics, release.yml now
# ends with an explicit `gh workflow run prod-post-deploy.yml`. workflow_dispatch
# is documented as EXEMPT from the GITHUB_TOKEN recursion guard (the same
# property auto-merge.yml already relies on to dispatch release.yml), and it is
# immune to the `[skip ci]` token that killed prod-smoke's push trigger. An
# explicit dispatch is observable and debuggable; a silent event that never
# arrives is neither.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'The released commit SHA (for traceability in the run log)'
        required: false
        default: ''
      reason:
        description: 'Why this verification run was started'
        required: false
        default: 'manual post-deploy verification'
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://app.fuzefront.com'
  workflow_call:
    inputs:
      release_sha:
        description: 'The released commit SHA (for traceability in the run log)'
        required: false
        type: string
        default: ''
      reason:
        description: 'Why this verification run was started'
        required: false
        type: string
        default: 'automated post-deploy verification'
      base_url:
        description: 'Target base URL'
        required: false
        type: string
        default: 'https://app.fuzefront.com'
    secrets:
      POST_PROD_EMAIL:
        required: false
      POST_PROD_PASSWORD:
        required: false
      INTERNAL_PROVISION_SECRET:
        required: false
      POST_PROD_ADMIN_EMAIL:
        required: false
      POST_PROD_ADMIN_PASSWORD:
        required: false

permissions:
  contents: read

# Do NOT cancel in progress: a verification run that is cancelled by the next
# release leaves the earlier deploy unverified, which is the exact failure this
# workflow exists to prevent.
concurrency:
  group: prod-post-deploy
  cancel-in-progress: false

jobs:
  announce:
    name: What is being verified
    runs-on: ubuntu-latest
    steps:
      - name: Log the target
        env:
          SHA: ${{ inputs.release_sha }}
          REASON: ${{ inputs.reason }}
          BASE: ${{ inputs.base_url }}
        run: |
          echo "Verifying release: ${SHA:-<unspecified>}"
          echo "Reason:            ${REASON}"
          echo "Base URL:          ${BASE}"

  # Waits for the Argo rollout, then black-box polls /api/health.
  health:
    name: Health
    needs: announce
    uses: ./.github/workflows/prod-smoke.yml
    with:
      # workflow_dispatch supplies the default, so this is never empty.
      url: ${{ inputs.base_url }}/api/health
      # Argo's detection + rollout is slower than a bare ingress check, so wait
      # longer here than prod-smoke's manual default.
      wait_seconds: 360

  # Separate poll for chat-service, same shape as `health` above but a
  # different upstream/path. Runs after `health` (Argo has already rolled out
  # by then) so wait_seconds: 0 — no reason to sleep twice. Deliberately NOT a
  # dependency of `e2e` below: a chat-service regression must not suppress the
  # auth/UI journey check, which covers unrelated ground.
  chat-health:
    name: Chat service health
    needs: health
    uses: ./.github/workflows/prod-smoke.yml
    with:
      url: ${{ inputs.base_url }}/chat-api/health
      wait_seconds: 0

  # Only worth running the browser journey once the API is actually answering.
  e2e:
    name: Live smoke
    needs: health
    uses: ./.github/workflows/post-prod-e2e.yml
    with:
      base_url: ${{ inputs.base_url || 'https://app.fuzefront.com' }}
      run_authn_boundary: false
    secrets:
      POST_PROD_EMAIL: ${{ secrets.POST_PROD_EMAIL }}
      POST_PROD_PASSWORD: ${{ secrets.POST_PROD_PASSWORD }}
      INTERNAL_PROVISION_SECRET: ${{ secrets.INTERNAL_PROVISION_SECRET }}
      POST_PROD_ADMIN_EMAIL: ${{ secrets.POST_PROD_ADMIN_EMAIL }}
      POST_PROD_ADMIN_PASSWORD: ${{ secrets.POST_PROD_ADMIN_PASSWORD }}

  # The public marketing site (fuzefront-website) has its own deploy image and
  # its own release-time contrast/nav regressions (see
  # fuzefront-website/frontend/e2e/contrast.spec.ts) — unrelated to the MF
  # shell's health, so it runs in parallel with `e2e` rather than gating on it.
  fuzefront-website-e2e:
    name: fuzefront-website live smoke
    needs: health
    uses: ./.github/workflows/fuzefront-website-post-prod-e2e.yml
    with:
      base_url: 'https://fuzefront.com'

  # Live canonical-host probe: asserts that fuzefront.com presents ONE brand.
  #
  # THE DEFECT THIS EXISTS FOR. `www.fuzefront.com` was an unproxied CNAME to
  # the CloudFront distribution d27hi5funhy3o7.cloudfront.net, serving a static
  # FuzeHub landing page, while the apex served the FuzeOne family site. One
  # domain, two brands, no redirect between them. Nothing in this repo could
  # see it: `www` never reached the cluster, so every rendered-manifest check,
  # every helm lint and the whole website e2e suite (which targets the apex)
  # stayed green throughout. Same shape as the Authentik boundary probe below
  # — only a black-box request to the ACTUAL edge can catch it.
  #
  # WHY THIS MAY BE RED, AND WHY THAT IS CORRECT. The fix has two halves.
  # FuzeFront owns one: the website Ingress now claims www.fuzefront.com
  # (values-prod.yaml `websiteFrontend.aliasHosts`) and the site's nginx 301s
  # it to the apex. FuzeInfra owns the other: Cloudflare DNS is its Terraform
  # plane and this repo holds no credential for it, so the record cannot be
  # repointed from here. Until FuzeInfra moves `www.fuzefront.com` to the
  # tunnel (proxied CNAME + tunnel ingress rule -> traefik.kube-system:80,
  # exactly as app.fuzefront.com is wired), CloudFront keeps answering and this
  # job FAILS. That is deliberate: a red light on every deploy is the honest
  # representation of a live brand split, and it goes green by itself the
  # moment the record moves. Do not soften it to a warning — a check that
  # cannot fail is the thing governance/vacuous-check-policy.json forbids.
  #
  # Not gated on `health`: it probes the website edge, not the app shell, and a
  # sick app must not hide a brand split.
  www-canonical-host:
    name: www redirects to the canonical apex
    needs: announce
    runs-on: ubuntu-latest
    # The poll below runs for at most 10 minutes; past that it is a hung
    # runner, not a slow edge (gate-workflow-policy [missing-timeout]).
    timeout-minutes: 15
    steps:
      - name: www.fuzefront.com must 301 to https://fuzefront.com
        run: |
          set -euo pipefail

          # WHY THIS POLLS RATHER THAN PROBING ONCE.
          #
          # Measured, in run 36419988393: this job started 15 SECONDS into the
          # workflow and failed immediately. It is `needs: announce`, so it does
          # not wait for anything — while the redirect it asserts ships INSIDE
          # the website-frontend image, which Argo has to pull and roll out
          # after release.yml commits the GitOps tag bump. A single-shot probe
          # fired 15s after dispatch therefore cannot pass on a healthy deploy;
          # it races the rollout and loses every time. The `health` job next to
          # it already knows this and sleeps 360s before polling.
          #
          # The fix is NOT to gate this behind `health`. This probes the public
          # website edge, and `health` polls the app shell's /api/health — a
          # sick app shell must not be able to suppress a brand-split alarm on
          # the marketing domain. So it stays independent and waits on its own.
          #
          # It polls to a deadline instead of sleeping a fixed 360s so a
          # already-correct edge (the ordinary case, when no website image
          # changed) reports in one request instead of idling six minutes.
          #
          # This does NOT soften the check: after the deadline it still fails
          # LOUD with the last state it saw. A slow rollout delays the verdict;
          # it never converts a red into a green.
          # It polls to a deadline instead of sleeping a fixed 360s so an
          # already-correct edge (the ordinary case, when no website image
          # changed) reports in seconds instead of idling six minutes.
          #
          # This does NOT soften the check: after the deadline it still fails
          # LOUD with the last state it saw. A slow rollout delays the verdict;
          # it never converts a red into a green.
          DEADLINE=$(( SECONDS + 600 ))
          INTERVAL=20
          # Consecutive clean probes required before declaring success. See
          # WHY STABILITY below.
          STABLE_REQUIRED=3
          CONFIRM_INTERVAL=5

          # WHY ONE CURL PER RESPONSE.
          #
          # websiteFrontend runs replicas: 1 under the default RollingUpdate
          # strategy, so maxSurge brings a SECOND pod up and the Service
          # round-robins across old and new for the length of the rollout —
          # exactly the window this job polls through. Asking for the status in
          # one request and the Location in another therefore lets the two
          # describe DIFFERENT responses: a healthy rollout whose status curl
          # hit the new pod and whose Location curl hit the old one would fail
          # on a mismatched pair that never existed in any single response.
          # `-w` emits both from the one request instead.
          #
          # WHY STABILITY.
          #
          # For the same reason, a single clean probe is not proof the rollout
          # finished — during a STALLED mixed rollout each request has its own
          # chance of landing on the new pod, so one lucky pass would be a
          # false green on precisely the brand-split this job exists to catch.
          # Requiring STABLE_REQUIRED consecutive clean probes makes that luck
          # exponentially unlikely while costing a fully-rolled edge only a few
          # seconds, since every pod answers identically once the rollout ends.
          probe() {
            # --location is deliberately ABSENT. Following the redirect would
            # make a page that merely *renders* the apex indistinguishable
            # from a real canonicalization; this asserts the redirect itself.
            read -r code loc <<<"$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
              --max-time 30 https://www.fuzefront.com/ || echo '000 ')"
            # The query string and path must survive, or every deep link to www
            # lands on the homepage instead of the page that was asked for.
            read -r deep_code deep <<<"$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
              --max-time 30 'https://www.fuzefront.com/pricing?plan=team' || echo '000 ')"
          }

          # The COMPLETE contract. The loop waits on all of it, not on the
          # status alone, so no part of the assertion can be satisfied by a
          # different pod than the rest.
          contract_holds() {
            [ "$code" = "301" ] || return 1
            case "$loc" in https://fuzefront.com|https://fuzefront.com/*) ;; *) return 1 ;; esac
            [ "$deep" = "https://fuzefront.com/pricing?plan=team" ] || return 1
            return 0
          }

          stable=0
          probe
          while [ "$stable" -lt "$STABLE_REQUIRED" ] && [ "$SECONDS" -lt "$DEADLINE" ]; do
            if contract_holds; then
              stable=$(( stable + 1 ))
              [ "$stable" -ge "$STABLE_REQUIRED" ] && break
              echo "clean probe ${stable}/${STABLE_REQUIRED} — confirming the rollout is settled"
              sleep "$CONFIRM_INTERVAL"
            else
              stable=0
              echo "waiting for the rollout — root ${code} '${loc:-<none>}', deep '${deep:-<none>}' ($(( DEADLINE - SECONDS ))s left)"
              sleep "$INTERVAL"
            fi
            probe
          done

          echo "status:   ${code}"
          echo "location: ${loc:-<none>}"
          echo "deep:     ${deep:-<none>}"

          if [ "$code" != "301" ]; then
            echo "::error::www.fuzefront.com answered ${code} for 10 minutes, expected 301. It is serving content of its own instead of redirecting to the canonical apex — one domain must not present two brands. Check, in order: (1) is the running website-frontend image newer than the commit that added the redirect to fuzefront-website/frontend/nginx.conf — if Argo has not rolled the GitOps tag bump, nothing on the edge can be right yet; (2) does www still resolve to CloudFront, meaning FuzeInfra's DNS half was reverted (see websiteFrontend.aliasHosts in deploy/helm/fuzefront/values-prod.yaml and docs/runbooks/fuzefront-com-canonical-host.md)."
            exit 1
          fi

          case "$loc" in
            https://fuzefront.com|https://fuzefront.com/*)
              echo "www.fuzefront.com -> ${loc} (canonical)" ;;
            *)
              echo "::error::www.fuzefront.com redirects to '${loc}', which is not the canonical apex https://fuzefront.com."
              exit 1 ;;
          esac

          if [ "$deep" != "https://fuzefront.com/pricing?plan=team" ]; then
            echo "::error::Deep-link redirect dropped the path or query: got '${deep}', expected 'https://fuzefront.com/pricing?plan=team'."
            exit 1
          fi

          if [ "$stable" -lt "$STABLE_REQUIRED" ]; then
            echo "::error::www.fuzefront.com never answered the complete redirect contract ${STABLE_REQUIRED} times in a row within 10 minutes. The last probe passed, so the edge is answering correctly only intermittently — a rolling update that has not converged, or a Service still routing to a pod on the old image."
            exit 1
          fi
          echo "deep link preserved: ${deep}"
          echo "contract stable across ${STABLE_REQUIRED} consecutive probes"
          echo "deep link preserved: ${deep}"

  # Live boundary probe: asserts Authentik's admin/API/application-list surface
  # is NOT reachable on the public edge. Deliberately SEPARATE from the static
  # `gate-authentik-public-paths` check in helm-validate.yml — that guard
  # models Traefik's rendered-manifest routing; this one proves it on the
  # ACTUAL edge, which is the only thing that would have caught the live
  # incident this exists to prevent a recurrence of (app.fuzefront.com's
  # public /applications route, live for an unknown period while every
  # rendered-manifest check stayed green). No cluster credentials needed —
  # pure black-box HTTP, same shape as the `health` job above. A failure here
  # is a live security exposure: it must be LOUD (the job fails outright),
  # never a silent skip.
  authentik-security-boundary:
    name: Authentik public boundary
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the comparator
        run: ./deploy/scripts/check-authentik-live-boundary.sh --self-test
      - name: Probe forbidden Authentik paths on the public edge
        env:
          APP_ORIGIN: ${{ inputs.base_url || 'https://app.fuzefront.com' }}
        run: |
          auth_origin="https://auth.fuzefront.com"
          ./deploy/scripts/check-authentik-live-boundary.sh "$APP_ORIGIN" "$auth_origin"
