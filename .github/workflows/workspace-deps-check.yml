name: Workspace deps

# Fail fast when a consumer references an in-repo package by a registry spec
# instead of resolving it from source. This is the PR #65 break: frontend listed
# "@fuzefront/identity-ui": "^0.1.0" for a package that lives in this repo but was
# not a resolvable workspace, so `npm ci` 404'd against the registry. The check is
# dependency-free and needs no install, so it gates every PR cheaply. See the
# fuzefront-ui-package skill, non-negotiable #7.
#
# NO `paths:` FILTER, and that is load-bearing rather than an oversight. This context
# is REQUIRED on master. A path-filtered workflow does not run at all on a PR that
# touches none of its paths, so the check run is never CREATED — and a required
# context that is never created leaves the PR permanently at "Expected — waiting for
# status to be reported", with no red to look at and nothing to re-run. Measured
# 2026-08-23: it reported on none of four sampled PR heads, so every Helm-only,
# docs-only or workflow-only PR was unmergeable for that reason alone.
#
# The check is dependency-free and scans 49 manifests in under a second, so running
# it unconditionally costs nothing. gate-sealed-keys in this repo already states the
# same rule for the same reason ("Runs on every PR (no path filter) so it is safe to
# add to the branch ruleset's required checks"); filter INSIDE a job, never on the
# trigger, for anything the ruleset requires.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  workspace-deps:
    name: In-repo packages resolve from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      # The range comparator is hand-rolled (no `npm ci` here, so no `semver`), which
      # makes it the part of this gate most able to be quietly wrong. Test it before
      # trusting it — a green gate backed by a broken comparator is worse than no gate.
      - name: Unit-test the range comparator
        run: node --test scripts/__tests__/check-workspace-deps.test.mjs

      - name: Check workspace dependency wiring
        run: node scripts/check-workspace-deps.mjs
