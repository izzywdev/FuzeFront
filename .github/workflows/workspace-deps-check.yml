name: Workspace deps

# Fail fast when a consumer references an in-repo package by a registry spec
# instead of resolving it from source. This is the PR #65 break: frontend listed
# "@fuzefront/identity-ui": "^0.1.0" for a package that lives in this repo but was
# not a resolvable workspace, so `npm ci` 404'd against the registry. The check is
# dependency-free and needs no install, so it gates every PR cheaply. See the
# fuzefront-ui-package skill, non-negotiable #7.
#
# NO path filter, deliberately. This is a REQUIRED status check
# (governance/ruleset.json), and the script validates the WHOLE repo's
# workspace wiring at HEAD, not a diff — it is not scoped to files a given PR
# touched. A `paths:` filter here means GitHub never creates a check run for
# a PR that doesn't touch a listed path, so the required check sits at
# "Expected — waiting for status to be reported" forever and blocks merge
# indefinitely (found via FuzeFront#792, a Helm-only PR that touches no
# package.json). Every other required `gate-*` workflow in this repo runs
# unconditionally for exactly this reason; this one was the one exception.
on:
  pull_request:

permissions:
  contents: read

jobs:
  workspace-deps:
    name: In-repo packages resolve from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - name: Check workspace dependency wiring
        run: node scripts/check-workspace-deps.mjs
