name: Release (images + GitOps bump)

# On merge to master that touches the platform: build backend/frontend, push to
# GHCR tagged with the commit SHA, then bump the tags in values-prod.yaml and
# commit. Argo CD sees the git change and rolls out the new images.
on:
  # Manual trigger: auto-merged PRs push to master under GITHUB_TOKEN, and GitHub
  # does NOT start push-triggered workflows for GITHUB_TOKEN pushes — so this
  # workflow otherwise never runs after an auto-merge and images never build.
  # Dispatch this after a deploy-window merge to build + bump the image tags.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual build (e.g. deploy security-service after an auto-merged PR)'
        required: false
        default: 'manual release'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'frontend/**'
      # Workspace packages are COMPILED INTO the images (the backend/applications
      # images build @fuzefront/feature-flags; the frontend bundles the UI
      # packages from source via vite aliases). Without this, a change confined
      # to packages/** merges green and ships nothing — the images keep the old
      # code, which is exactly how a "merged" fix can fail to reach production.
      - 'packages/**'
      - 'services/email-service/**'
      - 'services/sms-service/**'
      - 'services/provisioning-service/**'
      - 'services/billing-service/**'
      # Added in the same change that discovered the gap: #432 added the
      # "Build & push chat-service" step below, but never added chat-service's
      # own path here, so a change confined to services/chat-service/** (not
      # touching packages/**, deploy/helm/fuzefront/**, or this file) would
      # merge green and NEVER trigger a release — the exact same silent-ship
      # failure mode the packages/** comment above describes, just for a
      # different path. This was live for every commit between #432 and now.
      - 'services/chat-service/**'
      # notification-service/** and payment-service/** were both missing here,
      # the same silent-ship gap the chat-service comment above describes: a
      # change confined to one of those service dirs would merge green and never
      # trigger a release, so the image would keep the old code (or, for the
      # never-built payment-service, stay absent entirely).
      - 'services/notification-service/**'
      - 'services/payment-service/**'
      - 'services/selection-list-service/**'
      - 'clock-app/**'
      - 'deploy/helm/fuzefront/**'
      - '.github/workflows/release.yml'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the tag bump
      packages: write # push to GHCR
      actions: write # dispatch prod-post-deploy.yml (see the final step)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-backend:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            # Empty => the frontend uses window.location.origin (same-origin /api).
            # Robust across hosts: works on app.prod.fuzefront.com now and on
            # app.fuzefront.com after the 301 fast-follow, with no cross-origin/mixed
            # -content risk under the Cloudflare TLS edge. (api.ts: VITE_API_URL || origin)
            VITE_API_URL=
          tags: |
            ghcr.io/izzywdev/fuzefront-frontend:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-frontend:latest
          # Dedicated scope: the frontend build context changed from ./frontend to
          # repo root, so the old shared gha cache snapshot (where nginx.conf sat at
          # the context root, not frontend/) no longer matches and buildkit errors
          # with "frontend/nginx.conf: not found". A fresh scope busts that.
          cache-from: type=gha,scope=frontend-root
          cache-to: type=gha,mode=max,scope=frontend-root

      - name: Build and push email-service
        id: email_image
        # Ancillary services are disabled in prod (only billing is enabled). They
        # must NEVER block the core backend+frontend deploy — a failed build here
        # is non-fatal; the bump+deploy still proceeds.
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/email-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-email-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-email-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sms-service
        id: sms_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/sms-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-sms-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-sms-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push provisioning-service
        id: provisioning_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/provisioning-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-provisioning-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-provisioning-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push billing-service
        id: billing_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/billing-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-billing-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-billing-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push payment-service
        # Self-contained Dockerfile (no @fuzefront/shared dep) => context is
        # services/payment-service/, like clock-app — NOT the repo root the
        # workspace services use. Scaffold gateway, disabled in prod; this build
        # only makes the image EXIST so paymentService.image.tag can be bumped
        # off "" and a future go-live is a values flip, not a missing image.
        id: payment_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/payment-service
          file: services/payment-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-payment-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-payment-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push security-service
        id: security_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/security/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-security-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-security-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push applications-service
        id: applications_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/applications/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-applications-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-applications-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push chat-service
        # Root build context: the Dockerfile runs `npm ci --workspace=
        # services/chat-service`, so it needs the root package.json/lockfile and
        # shared/ — not just services/chat-service/.
        #
        # continue-on-error matches the other auxiliary services (a broken
        # chat build must not block backend/frontend from shipping), but that
        # alone would let the bump step below pin a tag for an image that was
        # never pushed. The `id` here is what lets the bump gate on the real
        # outcome — see "Bump image tags" (review finding).
        id: chat_image
        continue-on-error: true
        # SHA-pinned (Semgrep github-actions-mutable-action-tag). Same SHA the
        # already-pinned steps in security.yml use; every other docker/build-push-action
        # step in this file is now pinned to the same SHA too.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/chat-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-chat-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-chat-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push notification-service
        # Root build context: the Dockerfile runs `npm ci --workspace=
        # services/notification-service`, so it needs the root package.json and
        # lockfile — not just services/notification-service/.
        #
        # continue-on-error matches the other auxiliary services, and the `id`
        # is what lets the bump step below gate on the real outcome instead of
        # pinning a tag for an image that was never pushed.
        id: notification_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-notification-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push selection-list-service
        # Root build context: the Dockerfile runs `npm ci --workspace=
        # services/selection-list-service`, so it needs the root package.json and
        # lockfile — not just services/selection-list-service/.
        #
        # Ships dark (selectionListService.enabled: false) by default; continue-on-error
        # matches the other auxiliary services. The `id` lets the bump step gate on
        # the real outcome so no tag is pinned for an image that was never pushed
        # (the pattern that froze billing-service at a stale SHA — see #539).
        id: selection_list_image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/selection-list-service/Dockerfile
          push: true
          tags: |
            ghcr.io/izzywdev/fuzefront-selection-list-service:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-selection-list-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push clock-app (built-in MF remote)
        id: clock_image
        # Built-in reference Module-Federation remote, served same-origin at
        # app.fuzefront.com/apps/clock/. Self-contained Dockerfile => context is clock-app/.
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: clock-app
          file: clock-app/Dockerfile
          push: true
          build-args: |
            VITE_HUB_API_URL=https://app.fuzefront.com
            VITE_PUBLIC_URL=https://app.fuzefront.com
          tags: |
            ghcr.io/izzywdev/fuzefront-clock-app:${{ steps.tag.outputs.sha }}
            ghcr.io/izzywdev/fuzefront-clock-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tags in values-prod.yaml (GitOps)
        # The "Protect Master" ruleset has a pull_request rule, so neither a
        # plain `git push` with GITHUB_TOKEN nor a contents-API commit can land
        # on master (the API PUT 409s with "Changes must be made through a pull
        # request" — that killed every release once the rule appeared; GitHub
        # also refuses to add the github-actions app as a ruleset bypass actor
        # on a user-owned repo). The write path is therefore a DEPLOY KEY:
        # "Protect Master" has a DeployKey bypass_actor, and the private half
        # lives in the RELEASE_BUMP_SSH_KEY secret (public half: deploy key
        # "release-bump"). If this step starts failing with a rule violation,
        # the DeployKey bypass entry or the deploy key was removed — restore
        # them rather than weakening the ruleset's PR rule for humans.
        # NOTE: deploy-key pushes are unsigned; if required_signatures is ever
        # (re-)enabled on master this needs a signing setup or a bot identity.
        env:
          SSH_KEY: ${{ secrets.RELEASE_BUMP_SSH_KEY }}
          FILE: deploy/helm/fuzefront/values-prod.yaml
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          # EVERY auxiliary build step above is continue-on-error, so ANY of
          # their images may be missing even though this step runs. Bump a tag
          # only when that image actually got pushed — otherwise values-prod
          # pins a tag that does not exist, Argo applies a Deployment whose pods
          # can never pull, the old ReplicaSet keeps serving, and the release
          # still reports success. That is exactly what happened at 44d9a5a0192b:
          # the applications-service build failed, its tag was bumped anyway, and
          # the new ReplicaSet sat in ImagePullBackOff for 12h through 3,174 pull
          # attempts while the release was green. See #539 / FuzeInfra#501.
          #
          # This guard used to cover ONLY chat-service and notification-service.
          # The other seven were assumed "always built" — but continue-on-error
          # means none of them is. backend and frontend are the only genuinely
          # unconditional images (no continue-on-error: a failure there fails the
          # job), which is why EXPECTED starts at 2 and everything else is gated.
          ok() { [ "$1" = "success" ] && echo 1 || echo 0; }
          EMAIL_OK=$(ok "${{ steps.email_image.outcome }}")
          SMS_OK=$(ok "${{ steps.sms_image.outcome }}")
          PROV_OK=$(ok "${{ steps.provisioning_image.outcome }}")
          BILLING_OK=$(ok "${{ steps.billing_image.outcome }}")
          SECURITY_OK=$(ok "${{ steps.security_image.outcome }}")
          APPS_OK=$(ok "${{ steps.applications_image.outcome }}")
          CLOCK_OK=$(ok "${{ steps.clock_image.outcome }}")
          CHAT_OK=$(ok "${{ steps.chat_image.outcome }}")
          NOTIF_OK=$(ok "${{ steps.notification_image.outcome }}")
          PAYMENT_OK=$(ok "${{ steps.payment_image.outcome }}")
          SELECTION_LIST_OK=$(ok "${{ steps.selection_list_image.outcome }}")
          EXPECTED=$((2 + EMAIL_OK + SMS_OK + PROV_OK + BILLING_OK + SECURITY_OK + APPS_OK + CLOCK_OK + CHAT_OK + NOTIF_OK + PAYMENT_OK + SELECTION_LIST_OK))
          echo "built: email=${EMAIL_OK} sms=${SMS_OK} provisioning=${PROV_OK} billing=${BILLING_OK} security=${SECURITY_OK} applications=${APPS_OK} clock=${CLOCK_OK} chat=${CHAT_OK} notification=${NOTIF_OK} payment=${PAYMENT_OK} selection_list=${SELECTION_LIST_OK}"
          echo "expecting ${EXPECTED} tag rewrites (backend + frontend are always built)"
          if [ "${APPS_OK}${SECURITY_OK}${EMAIL_OK}${BILLING_OK}" != "1111" ]; then
            echo "::warning::one or more auxiliary images failed to build; their values-prod tags are left pinned to the last good release"
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_bump
          chmod 600 ~/.ssh/release_bump
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/release_bump -o IdentitiesOnly=yes"
          git config user.name  "fuzefront-release"
          git config user.email "release-bump@users.noreply.github.com"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          # Read-modify-write against CURRENT master, not this job's (stale)
          # checkout: the builds above take minutes and other commits land
          # meanwhile. A non-fast-forward race (someone pushes between our
          # fetch and push) just retries with a fresh fetch.
          for attempt in 1 2 3; do
          git fetch origin master
          git checkout --detach --force FETCH_HEAD
          cp "$FILE" /tmp/vp-current.yaml
          # Bump ONLY the core-app image tags built by this workflow. A blanket
          # `tag:` sed would also stomp deliberately-pinned services and the
          # EXTERNAL images (authentik, unleash) whose tags are managed by hand.
          # The tag: line must be the line IMMEDIATELY after the repository:
          # line (true for every block in values-prod.yaml). Scoping `hot` to a
          # single following line means a block that drops its tag: can never
          # leak the bump onto a later, unrelated tag: (review finding).
          # The \r? in the repository anchor tolerates CRLF line endings: a bot
          # commit once rewrote the whole file as CRLF, the $-anchored match got
          # 0 hits, and the count guard below killed every release until a human
          # manually restored LF. Rewritten tag lines preserve the line's
          # original ending so a CRLF file round-trips without a spurious
          # whole-file diff.
          awk -v sha="$SHA" -v chat="$CHAT_OK" -v notif="$NOTIF_OK" \
              -v email="$EMAIL_OK" -v sms="$SMS_OK" -v prov="$PROV_OK" \
              -v billing="$BILLING_OK" -v security="$SECURITY_OK" \
              -v apps="$APPS_OK" -v clock="$CLOCK_OK" -v payment="$PAYMENT_OK" \
              -v selection_list="$SELECTION_LIST_OK" '
            hot {
              hot=0
              if ($0 ~ /^[[:space:]]*tag:/) {
                match($0, /^[[:space:]]*/)
                print substr($0, 1, RLENGTH) "tag: " sha ($0 ~ /\r$/ ? "\r" : "")
                n++
                next
              }
            }
            /repository: ghcr\.io\/izzywdev\/fuzefront-backend\r?$/ { hot=1 }
            /repository: ghcr\.io\/izzywdev\/fuzefront-frontend\r?$/ { hot=1 }
            security == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-security-service\r?$/ { hot=1 }
            apps == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-applications-service\r?$/ { hot=1 }
            clock == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-clock-app\r?$/ { hot=1 }
            email == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-email-service\r?$/ { hot=1 }
            sms == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-sms-service\r?$/ { hot=1 }
            billing == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-billing-service\r?$/ { hot=1 }
            prov == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-provisioning-service\r?$/ { hot=1 }
            chat == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-chat-service\r?$/ { hot=1 }
            notif == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-notification-service\r?$/ { hot=1 }
            payment == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-payment-service\r?$/ { hot=1 }
            selection_list == 1 && /repository: ghcr\.io\/izzywdev\/fuzefront-selection-list-service\r?$/ { hot=1 }
            { print }
            END { print n+0 > "/tmp/bump-count" }
          ' /tmp/vp-current.yaml > /tmp/vp-new.yaml
          # Guard against silent no-ops: if the file layout drifts (quoted
          # values, reordered keys, renamed registry path) the awk matches
          # nothing and we would otherwise "succeed" while deploying stale
          # tags (review finding). Exactly EXPECTED core-app tags must be
          # rewritten: 9 always-built images, plus chat-service and
          # notification-service only when their continue-on-error builds
          # actually succeeded.
          #
          # billing-service and provisioning-service were added to this list
          # late: both were BUILT on every release and pinned in values-prod,
          # but had no anchor here, so their tags were never rewritten —
          # billing froze at 6135e6b5ed77 (2026-06-30) while enabled: true in
          # prod, and provisioning sat at tag "" having never been deployed.
          # Same defect as the email/sms one recorded above, third occurrence.
          # The lesson keeps repeating because the count guard cannot detect a
          # MISSING anchor (fewer anchors == fewer rewrites == "pass"); it only
          # catches layout drift. If you add a build step, you MUST add the
          # anchor and bump this number by hand.
          # The anchor list MUST cover every image this workflow BUILDS. It
          # previously listed only 5 while the build steps produced 7: the
          # email-service and sms-service images were built and pushed on every
          # release but their values-prod.yaml tags were never rewritten. The
          # count guard did not catch it (5 anchors == 5 rewrites == "pass"),
          # so it failed silently: email-service froze at a stale SHA and
          # sms-service kept tag "" — i.e. it was NEVER deployed at all. If you
          # add a build step above, add its anchor here AND bump this number.
          COUNT=$(cat /tmp/bump-count)
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::expected ${EXPECTED} core-app tag rewrites in ${FILE}, got ${COUNT} — file layout changed; update the bump step"
            exit 1
          fi
          if cmp -s /tmp/vp-current.yaml /tmp/vp-new.yaml; then
            echo "values-prod.yaml already at ${SHA} — nothing to bump"
            exit 0
          fi
          cp /tmp/vp-new.yaml "$FILE"
          git commit -m "release: fuzefront images ${SHA} [skip ci]" -- "$FILE"
          if git push origin HEAD:master; then
            echo "Bumped via commit $(git rev-parse HEAD)"
            exit 0
          fi
          echo "push rejected (attempt ${attempt}) — refetching master and retrying"
          done
          echo "::error::could not push the tag bump after 3 attempts (master moving too fast, or the DeployKey bypass/deploy key was removed)"
          exit 1

      # -----------------------------------------------------------------------
      # Kick off post-deploy verification.
      #
      # This is a `gh workflow run` dispatch and NOT a `workflow_run` trigger,
      # because the event-driven alternatives are both proven dead here:
      #
      #   * prod-smoke.yml triggered on `push` to values-prod.yaml, gated
      #     `if: startsWith(head_commit.message, 'release:')`. The tag-bump
      #     commit above writes "[skip ci]" into that very message (it must —
      #     otherwise the bump push re-triggers this workflow forever), and
      #     GitHub suppresses push-triggered workflows for those commits. The
      #     two conditions are mutually exclusive, so prod-smoke last actually
      #     executed on 2026-06-30; every run since is `skipped`.
      #
      #   * prod-post-deploy.yml triggered on `workflow_run` of this workflow.
      #     It is registered and `state: active`, its name matcher is exact,
      #     and this workflow has completed successfully many times since it
      #     landed — yet it has ZERO runs, ever.
      #
      # workflow_dispatch is explicitly EXEMPT from the GITHUB_TOKEN recursion
      # guard (the same reasoning auto-merge.yml relies on for dispatching this
      # workflow), and is immune to the CI-suppression token. Dispatching is the
      # one path that survives both.
      #
      # `if: success()` — never claim a deploy is verified when the build or the
      # GitOps bump failed. Non-blocking: a dispatch failure must not fail the
      # release that already shipped, but it IS surfaced as a warning.
      - name: Dispatch post-deploy verification
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if gh workflow run prod-post-deploy.yml --ref master \
               -f release_sha="${SHA}" \
               -f reason="auto-dispatch after release of ${SHA}"; then
            echo "Post-deploy verification dispatched for ${SHA}"
          else
            echo "::warning::could not dispatch prod-post-deploy.yml — the release SHIPPED but is UNVERIFIED. Run it by hand against master."
          fi
