name: fuzefront-events (Python) tests

# The publish workflow runs these only on a release tag, i.e. AFTER merge. This
# job runs them on every PR that touches the package, so a drift from the Node
# Kafka contract (topics / registered schemas) or a regression in the outbox /
# relay logic is caught before it can be tagged. The contract-parity suite reads
# shared/src/kafka/{types,registry}.ts directly, so it needs the full checkout,
# not just packages/events-py/**.

on:
  pull_request:
    paths:
      - 'packages/events-py/**'
      - 'shared/src/kafka/**'
      - '.github/workflows/events-py-tests.yml'
  push:
    branches: [master]
    paths:
      - 'packages/events-py/**'
      - 'shared/src/kafka/**'

permissions:
  contents: read

concurrency:
  group: events-py-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '${{ matrix.python-version }}' }
      - name: Install and test
        working-directory: packages/events-py
        run: |
          pip install -q -e '.[dev]'
          pytest -q
