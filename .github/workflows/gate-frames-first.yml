name: gate-frames-first

# No feature UI ships before its design is approved.
#
# CLAUDE.md ("Design-first gate") has described this gate as un-skippable governance
# for months, but no workflow implemented it — so the one rule the design-first
# pipeline called mandatory was the only part of it that could actually be skipped.
# The sibling gates police frames that EXIST (gate-frames-stamped checks the stamp is
# current, gate-ds-conformance checks the tokens), and nothing at all policed UI
# shipped with no frames.
#
# The mapping from a changed UI path to a feature is DECLARED, not inferred: a feature
# manifest states `implementation.paths` (feature-level, and per flow in
# build.flows[].implementation.paths). Slugs do not line up with directories —
# devices-sessions and mfa-management both build into packages/account-security-ui —
# so a filename heuristic would fire at random and be trivially bypassable. Declared
# coverage is a reviewable fact, sits inside the stamped manifest, and is approved
# along with the design.
#
# Approval resolves PER FLOW (CLAUDE.md: "one ready flow never waits on an unready
# sibling"), so a file passes if at least one flow claiming it is approved.
#
# RAMP: `uncovered.mode` in governance/frames-first-policy.json is "warn" today,
# because 0 of 18 manifests declare implementation.paths and failing on uncovered
# paths would block every UI PR in flight (verified: it would have failed #585 and
# #591, both of which legitimately shipped). A file that IS claimed by an unapproved
# flow fails regardless of the ramp — that verdict is not rampable.
#
# Triggers on both sides of the seam. A UI-only trigger would miss an approval being
# revoked or a manifest narrowing its claim; a frames-only trigger would miss the UI
# change itself. Either alone reproduces the blind spot.

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'packages/*-ui/**'
      - 'design/frames/**'
      - 'governance/frames-first-policy.json'
      - 'scripts/check-frames-first.mjs'
      - 'scripts/__tests__/check-frames-first.test.mjs'
      - '.github/workflows/gate-frames-first.yml'

permissions:
  contents: read

concurrency:
  group: gate-frames-first-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frames-first:
    name: Feature UI has approved design frames
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (repo hardening standard — a mutable
      # tag can be silently repointed by the action owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate diffs against the merge base

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      # The gate's own logic — glob matching, per-flow resolution and the coverage
      # index — verified against fixtures, including a case asserting it BLOCKS when
      # frames exist but the flow is unapproved. A gate never shown to fail on the
      # thing it was written for is not evidence of anything.
      - name: Unit-test the gate itself
        run: node --test scripts/__tests__/check-frames-first.test.mjs

      # `github` context data is untrusted (a branch name can carry arbitrary
      # characters), so it goes through an intermediate env var and is quoted —
      # interpolating ${{ ... }} straight into `run:` is a shell-injection path
      # into the runner. Flagged by Semgrep's run-shell-injection rule on the
      # first revision of this workflow.
      - name: Check feature UI against approved design frames
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/check-frames-first.mjs --base "origin/$BASE_REF"
