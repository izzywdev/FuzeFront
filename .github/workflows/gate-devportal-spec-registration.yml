name: gate-devportal-spec-registration

# A spec that exists on disk is not a spec that's PUBLISHED, and a service
# that runs an HTTP server is not documented just because gate-openapi-
# conformance has nothing to compare it against. This gate closes the two
# ways a service's contract never reaches developers.fuzefront.com:
#
#   R1  a services/<name>/ directory runs its own HTTP server but ships no
#       openapi.yaml — invisible to gate-openapi-conformance AND the catalog.
#   R2  an openapi.yaml exists but scripts/collect-devportal-specs.mjs's
#       SOURCES array never mentions it — a real, current contract the
#       catalog never shows, because that pairing is hand-maintained and
#       nothing enforced it before this gate (see that script's own header).
#
# See scripts/gate_devportal_spec_registration.py for the full rationale.
#
# NO `paths:` FILTER on pull_request, matching gate-openapi-conformance.yml's
# own precedent and for the same reason (see that workflow's comment, and
# docs/runbooks/widen-required-checks.md): a path-filtered required check
# that never runs on a given PR leaves it permanently stuck at "Expected —
# waiting for status to be reported". This measures a whole-repo invariant,
# not a diff, so there is nothing to filter on anyway.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'services/*/openapi.yaml'
      - 'packages/*/openapi.yaml'
      - 'services/*/src/**'
      - 'scripts/collect-devportal-specs.mjs'
      - 'governance/devportal-spec-exempt.txt'
      - 'scripts/gate_devportal_spec_registration.py'

permissions:
  contents: read

jobs:
  devportal-spec-registration:
    name: every published API reaches the devportal catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The gate's own tests run FIRST and are weighted toward asserting that
      # it FAILS on a violation. "It passed on the current tree" is not
      # evidence a gate works — sys.exit(0) passes on the current tree too.
      - name: Self-test the gate before trusting it
        run: python -m unittest discover -s scripts/__tests__ -p 'test_gate_devportal_spec_registration.py' -v

      - name: Check every service is registered for the devportal catalog
        run: python scripts/gate_devportal_spec_registration.py .
