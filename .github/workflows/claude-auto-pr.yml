name: Stranded-branch detector (agent branches)

# WHAT THIS CAN AND CANNOT DO — read before trusting it.
#
# CORRECTION (2026-08-26). Everything below the next paragraph described a repo
# where `can_approve_pull_request_reviews` was false. It was flipped to TRUE on
# 2026-08-23 (see CLAUDE.md, branch lifecycle), so the create path this file
# called "best-effort, fails today" now SUCCEEDS. The header went stale in the
# most dangerous direction: it told readers this workflow does nothing, while it
# was in fact opening PRs.
#
# And the PRs it opened could not merge. GitHub does not trigger workflow runs
# from events raised by GITHUB_TOKEN, so a PR created with it gets no
# pull_request runs — no gates, no auto-merge job. With the auto-merge label
# attached, the result is a PR that looks handled and is permanently blocked on
# checks that will never start. #815, #817 and #818 each sat at exactly one
# check until someone closed and reopened them by hand. That is strictly worse
# than the stranded branch this workflow exists to surface.
#
# Fixed by creating the PR with GH_RELEASE_PAT (an ordinary user event, which
# does trigger CI) and failing loudly if only GITHUB_TOKEN is available. See the
# comment on the create step.
#
# Historical note, kept because it explains the original design: the setting was
# deliberately OFF because GitHub bundles create-PR and approve-PR into one
# toggle, and `master` here is deploy-on-push, so enabling it gave workflows a
# self-approval path to production. That tradeoff was re-decided on 2026-08-23 —
# the gate set is now the production guard rather than the human review step.
#
# It was previously named "Auto-PR" and claimed to close the autonomy gap. It did
# not: every green run was the early-exit path ("PR already open") because the
# agent had already opened its own PR. It only ever ran its create path when
# genuinely needed — and failed. A check that passes when its work is already
# done by someone else, and fails only when actually asked to work, is not
# evidence of anything.
#
# THEREFORE: opening the PR is the AGENT'S job, not CI's (see CLAUDE.md, branch
# lifecycle). This workflow's real and only job is to make a stranded branch —
# commits pushed, no PR, e.g. the session died first — LOUD instead of silent, so
# it gets salvaged rather than reaped by governance-nightly a week later.
#
# It attempts `gh pr create` first. That path is now LIVE (see the correction at
# the top) — the permission was granted and a PAT is wired in, so this opens a
# real, CI-triggering PR. It still does not depend on it: if creation fails the
# stranded-branch reporting below runs exactly as before.
#
# Watches every agent-created prefix:
#   claude/**            — anthropics/claude-code-action (claude.yml, cloud sessions)
#   claude-auto-fix-ci-* — claude-ci-autofix.yml → izzywdev/AITools
#   ds-propagate/**      — ds-propagate.yml multi-agent runs (3 per DS push)
#   nightly-autofix-*    — nightly-integration.yml autofix job
#
# Happy path: agent opens a non-draft PR + auto-merge label → auto-merge.yml runs
# `gh pr merge --auto --squash --delete-branch` → CI passes → GitHub merges.
on:
  push:
    branches:
      - 'claude/**'
      - 'claude-auto-fix-ci-*'
      - 'claude-auto-fix-ci-*/**'
      - 'ds-propagate/**'
      - 'nightly-autofix-*'
      - 'nightly-autofix-*/**'

permissions:
  contents: read
  pull-requests: write
  issues: write   # required for gh label create (repo-level labels API)

# One waiter per branch. The step below sits in a grace window for up to five
# minutes, and an agent that pushes three times in a row would otherwise stack
# three overlapping waiters all asking the same question. Only the newest push
# reflects the branch's current state, so cancel the older ones.
concurrency:
  group: stranded-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v5
        with:
          fetch-depth: 0

      - name: Ensure auto-merge label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "auto-merge" --color "#0052cc" --description "Enable squash auto-merge once CI passes" --force 2>/dev/null || true

      # GH_RELEASE_PAT, not GITHUB_TOKEN, and the distinction is load-bearing.
      # GitHub refuses to trigger workflow runs from events raised by
      # GITHUB_TOKEN (its recursion guard). A PR opened with GITHUB_TOKEN
      # therefore gets NO pull_request workflow runs at all — no gates, no
      # auto-merge job, nothing. Combined with the auto-merge label applied
      # below, that produced PRs which look handled and can never merge,
      # because branch protection is waiting on checks that will never start.
      # Observed on #815, #817 and #818, each of which sat at exactly one
      # check (this job) until a human closed and reopened them by hand.
      #
      # A PAT-raised event is an ordinary user event and triggers CI normally.
      # GH_RELEASE_PAT is already present in this repo and is validated nightly
      # by fleet-pat-health.yml. If it is ever unset the fallback below keeps
      # the old behaviour rather than failing the job, and the create step says
      # loudly which token it used, because "PR exists" is not the same as
      # "PR can merge".
      - name: Detect stranded branch (and best-effort open a PR)
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_TOKEN_IS_PAT: ${{ secrets.GH_RELEASE_PAT != '' }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # ---------------------------------------------------------------------
          # "Is this branch still work in need of a PR?" — asked in THREE places
          # below (up front, inside the grace loop, and after it closes), because
          # the answer can change during the five minutes we wait.
          #
          # Until 2026-08-27 the only question asked was "is there an OPEN PR?",
          # and that is not the same question. Two happy-path endings both look
          # like "no open PR" and both produced a red X plus a summary telling a
          # human to salvage work that was already safely merged:
          #
          #   1. THE BRANCH IS GONE. auto-merge.yml runs `gh pr merge --auto
          #      --squash --delete-branch`, so a successful merge deletes the
          #      branch — and a push-triggered run of THIS workflow can still be
          #      sitting in its grace window when that happens. Observed live on
          #      #834: `gh pr create` came back "Head sha can't be blank, Base sha
          #      can't be blank, No commits between master and
          #      claude/issue-238-themed-signin-consumer, Head ref must be a
          #      branch" — four symptoms of one cause, a head ref that no longer
          #      exists — and the job then waited the full 300s and failed.
          #
          #      The pre-existing `git rev-list origin/BASE..origin/BRANCH` guard
          #      does NOT cover this: it reads remote-tracking refs frozen at
          #      checkout time, so a branch deleted after checkout still looks
          #      present and (because the merge was a SQUASH, giving master a new
          #      commit rather than these commits) still looks ahead of base.
          #
          #   2. ITS PR MERGED. Same race, branch retained. `--state open` finds
          #      nothing and the merged PR goes unseen.
          #
          # A closed-but-NOT-merged PR is deliberately not an exit: the branch has
          # commits, nobody is going to merge them, and that is exactly what this
          # detector is for.
          #
          # This matters more than an ordinary false positive. The whole design
          # note above ("A detector that cries wolf on the happy path gets
          # ignored, which is the actual failure mode worth engineering against")
          # is the reason the 300s grace window exists at all. Failing on a branch
          # that merged SUCCESSFULLY is the same bug the grace window was added to
          # fix, arriving from the other end of the PR's life.
          resolved() {
            # Branch deleted server-side (404) — merged-and-deleted, or reaped.
            if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
              echo "Branch $BRANCH no longer exists on the remote — its PR merged with --delete-branch, or it was reaped. Nothing to strand."
              return 0
            fi
            open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$open_pr" ]; then
              echo "PR #$open_pr is open for $BRANCH — the agent did its job. Nothing to do."
              return 0
            fi
            merged_pr=$(gh pr list --head "$BRANCH" --state merged --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$merged_pr" ]; then
              echo "PR #$merged_pr for $BRANCH is already MERGED — the work landed. Nothing to strand."
              return 0
            fi
            return 1
          }

          if resolved; then exit 0; fi

          # A branch with no commits ahead of base is not stranded — it is empty.
          if ! git rev-list --count "origin/${BASE}..origin/${BRANCH}" | grep -qvE '^0$'; then
            echo "No commits on $BRANCH ahead of $BASE — nothing to strand, no PR needed."
            exit 0
          fi

          # Commits exist with no PR. Create it.
          if gh pr create --base "$BASE" --head "$BRANCH" --fill --label "auto-merge" 2>/tmp/pr-err; then
            num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ "$PR_TOKEN_IS_PAT" = "true" ]; then
              echo "Opened PR #${num:-?} for $BRANCH using GH_RELEASE_PAT — CI will trigger normally."
              exit 0
            fi
            # Created with GITHUB_TOKEN: the PR exists but no pull_request
            # workflows will ever run on it, so auto-merge can never be
            # satisfied. Say so and fail — a silently unmergeable PR is worse
            # than a stranded branch, because it looks handled.
            echo "::error title=PR opened but CI will not run::Opened PR #${num:-?} for $BRANCH with GITHUB_TOKEN because GH_RELEASE_PAT is unset. GitHub does not trigger workflow runs from GITHUB_TOKEN events, so this PR has NO gates and auto-merge cannot complete."
            echo ""
            echo "To fix the PR: close and reopen it as a user (this raises a"
            echo "pull_request.reopened event that does trigger CI):"
            echo "  gh pr close ${num:-<n>} && gh pr reopen ${num:-<n>}"
            echo ""
            echo "To fix the cause: set the GH_RELEASE_PAT repo secret (classic PAT, repo scope)."
            exit 1
          fi

          # WAIT before declaring the branch stranded. The agent is REQUIRED to open its
          # own PR, so the normal, correct sequence races this job: the push starts the
          # workflow, and the agent opens its PR seconds to minutes later.
          #
          # A single immediate re-check used to sit here and was not enough — it ran
          # within ~5s of the push and lost the race every time. Measured on three
          # consecutive PRs (#563, #571, #583): the job ran 11:51:13-11:51:19 while the
          # PR appeared at 11:51:38, so the re-check was ~20s early. Every one of those
          # was a red X that cleared on a manual re-run, i.e. a false positive that
          # fired precisely BECAUSE the process was followed correctly.
          #
          # So poll instead of peeking once. A live agent gets its PR seen; an agent
          # that died still fails, just $GRACE_SECONDS later. That delay costs nothing
          # real — this job is seconds of runner time, `governance-nightly` is the
          # backstop for anything missed, and a stranded branch is not an emergency
          # measured in minutes. A detector that cries wolf on the happy path gets
          # ignored, which is the actual failure mode worth engineering against.
          GRACE_SECONDS=300
          INTERVAL=20
          waited=0
          while [ "$waited" -lt "$GRACE_SECONDS" ]; do
            # Re-ask the FULL question, not just "is a PR open?" — the branch can
            # be merged and deleted out from under us mid-window (see `resolved`).
            if resolved; then
              echo "  (resolved after ${waited}s)"
              exit 0
            fi
            sleep "$INTERVAL"
            waited=$((waited + INTERVAL))
            echo "No PR for $BRANCH yet (waited ${waited}s of ${GRACE_SECONDS}s) — still within the agent's grace window."
          done

          # Final check after the window closes, so a PR opened — or a merge
          # completed — during the last interval is not missed.
          if resolved; then
            echo "  (resolved just as the grace window closed)"
            exit 0
          fi

          # Genuinely stranded. Report the ACTUAL remedy, not the raw API error —
          # a stranded branch is an agent that pushed and died before opening its
          # PR, and a human/orchestrator salvaging it needs to know that, not to go
          # hunting for a permissions bug that is an intentional security choice.
          cat /tmp/pr-err
          {
            echo "### ⚠️ Stranded agent branch: \`$BRANCH\`"
            echo ""
            echo "It has commits but **no pull request**, and CI cannot open one for it"
            echo "(Actions lacks create-PR permission here **by design** — the toggle that"
            echo "grants it would also let workflows approve PRs into a deploy-on-push"
            echo "\`$BASE\`)."
            echo ""
            echo "**The agent that pushed this branch was supposed to open its own PR and"
            echo "did not** — most likely it died mid-run. No PR appeared in the"
            echo "${GRACE_SECONDS}s after the push, so this is not the usual push-then-open"
            echo "race. The work is safe on the remote but invisible, and"
            echo "\`governance-nightly\` will reap the branch if it stays that way."
            echo ""
            echo "**To salvage:** \`gh pr create --base $BASE --head $BRANCH --fill --label auto-merge\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Stranded branch $BRANCH — commits pushed but no PR, and CI cannot open one. See the job summary to salvage."
          exit 1
