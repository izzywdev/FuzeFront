name: Auto Merge PR

on:
  pull_request:
    # `closed` is required for the dispatch-release job below — it is the only
    # event that tells us a PR actually merged.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    # Skip on `closed`: the PR is already merged/abandoned by then, and
    # `gh pr merge --auto` against it just errors.
    if: github.event.pull_request.draft == false && github.event.action != 'closed'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable auto-merge
        if: github.event.pull_request.user.login == github.repository_owner || contains(github.event.pull_request.labels.*.name, 'auto-merge')
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Merging is not deploying. `release.yml` builds the images and bumps the
  # values-prod tags that Argo rolls out — but its `push: branches: [master]`
  # trigger does NOT fire after a merge here, for TWO independent reasons:
  #
  #   1. Auto-merge pushes to master under GITHUB_TOKEN, and GitHub deliberately
  #      does not start push-triggered workflows for GITHUB_TOKEN pushes (its
  #      recursion guard). release.yml's own header documents this.
  #   2. A squash merge concatenates EVERY commit message in the PR, and GitHub
  #      scans the whole message — not just the subject. One WIP commit using
  #      the CI-suppression token (or merely quoting it in prose) poisons the
  #      squash commit and suppresses the push trigger for everyone.
  #
  # Either alone yields a PR that merges green and ships nothing — the failure
  # mode that left the flag client unbuilt in prod after PR #400. workflow_dispatch
  # is explicitly EXEMPT from the GITHUB_TOKEN recursion guard, and is immune to
  # the suppression token, so dispatching is the one path that survives both.
  # ---------------------------------------------------------------------------
  dispatch-release:
    name: Dispatch release after merge
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    permissions:
      contents: read
      pull-requests: read
      actions: write # required to call workflow_dispatch

    steps:
      # Needed by the publish dispatch below, which asks
      # scripts/publish-packages.mjs what is publishable instead of carrying a
      # hand-maintained copy of the answer. Checked out at the MERGE commit, so
      # a workspace added by this very PR is already visible. `npm ci` is
      # deliberately not run: `--list-dirs` only reads package.json files and
      # uses node builtins, so the preinstalled node is enough.
      - name: Checkout the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Dispatch release if the merge touched deployable paths
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          # Mirror of release.yml's `push.paths`. Keep the two in sync — a path
          # here that release.yml ignores just wastes a build; a path release.yml
          # watches but this omits means that change silently never deploys.
          #
          # STILL A MIRROR, DELIBERATELY — unlike the publish pattern below,
          # which is now derived. This one answers a different question ("what is
          # an IMAGE INPUT"), and its source of truth is release.yml's
          # `on.push.paths`, which GitHub requires to be static YAML: it cannot
          # be computed, so collapsing this means parsing that workflow's YAML at
          # runtime — and `on:` is a documented YAML-1.1 parsing hazard (it reads
          # as the boolean `true` in some parsers). Getting that subtly wrong
          # fails toward "no deployable paths", i.e. silently not shipping to
          # prod, which is worse than the drift it would fix. Doing it properly
          # means a checked-in paths manifest that release.yml's `paths:` is
          # GENERATED from, plus a CI gate asserting the generated block matches
          # — a separate change with its own verification.
          #
          # It HAD drifted, in exactly that direction. release.yml watches
          # services/chat-service, notification-service, payment-service,
          # selection-list-service and config-service — each added there with its
          # own comment about the silent-ship gap it was closing — and none of
          # them were ever added here, so an auto-merged change confined to one of
          # those dirs hit "No deployable paths" and never built. Re-synced, plus
          # the two new root workspaces (api-client/, sdk/) release.yml now
          # watches because the root-installing Dockerfiles COPY their manifests.
          PATTERN='^(backend/|shared/|frontend/|packages/|api-client/|sdk/|services/email-service/|services/sms-service/|services/provisioning-service/|services/billing-service/|services/chat-service/|services/notification-service/|services/payment-service/|services/selection-list-service/|services/config-service/|clock-app/|deploy/helm/fuzefront/|\.github/workflows/release\.yml)'

          if ! gh pr diff "$PR" --name-only | grep -qE "$PATTERN"; then
            echo "No deployable paths in PR #$PR — no release needed."
            exit 0
          fi

          # Idempotence: a human (non-GITHUB_TOKEN) merge with a clean squash
          # message DOES fire the push trigger. Don't queue a second identical
          # build on top of it — release.yml serializes on `concurrency: release`,
          # so a duplicate would just delay the next real one.
          sleep 30
          if [ -n "$SHA" ] && gh run list --workflow=release.yml --limit 20 \
               --json headSha -q '.[].headSha' | grep -q "^${SHA}$"; then
            echo "Release already running/ran for ${SHA} (push trigger fired) — not dispatching."
            exit 0
          fi

          echo "Dispatching release.yml for merged PR #$PR (${SHA:-unknown sha})"
          gh workflow run release.yml --ref master \
            -f reason="auto-dispatch after merge of PR #$PR (push trigger suppressed by GITHUB_TOKEN merge and/or a CI-suppression token in the squash message)"

      - name: Dispatch package publish after merge
        # packages-publish.yml is `on: push: branches: [master]`, so it is
        # EXACTLY the "any OTHER push-triggered workflow" the warning below
        # names: an auto-merge pushes under GITHUB_TOKEN, the recursion guard
        # suppresses push triggers, and the publish silently never runs. Fixing
        # its owner guard (it was gated on an account that does not exist, so it
        # had never published anything) is necessary but not sufficient — without
        # this dispatch the packages still ship nowhere.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          # Publishable workspaces only — a docs- or CI-only merge has nothing to
          # publish, and publish-packages.mjs skips versions already in the
          # registry anyway, so a spurious dispatch is wasteful rather than
          # harmful.
          #
          # THIS USED TO BE A HAND-MAINTAINED REGEX — A SECOND SOURCE OF TRUTH FOR
          # "WHAT IS PUBLISHABLE" — AND IT HAD ALREADY DRIFTED TWICE. It was
          # missing `api-client/`, `sdk/` and `config-client/`, all publishable
          # workspaces, and the consequence is the silent failure this whole job
          # exists to prevent: an auto-merge pushes under GITHUB_TOKEN, the
          # recursion guard suppresses packages-publish.yml's push trigger, this
          # step decides there is "nothing to publish", and the PR merges green
          # having shipped nothing.
          #
          # It is now DERIVED from the real source. `--list-dirs` prints the
          # workspace directory of every publishable package, computed by the
          # same `publishable()` the publish step itself uses. Adding a workspace
          # can no longer fail to reach this list, because there is no longer a
          # list to update.
          #
          # The literals that remain are not workspaces: they are the publish
          # machinery itself, a change to which can change what publishes.
          dirs=$(node scripts/publish-packages.mjs --list-dirs)
          if [ -z "$dirs" ]; then
            # Empty means the script broke or the workspaces array emptied —
            # either way, silently concluding "nothing to publish" is the exact
            # failure being designed out. Fail loudly instead.
            echo "::error::publish-packages.mjs --list-dirs produced no publishable workspaces"
            exit 1
          fi
          # Escape regex metacharacters, anchor each dir as a path prefix.
          alt=$(printf '%s\n' "$dirs" | sed -e 's/[][\.^$*+?(){}|]/\\&/g' -e 's|$|/|' | paste -sd'|' -)
          PATTERN="^(${alt}|package\.json|package-lock\.json|\.github/workflows/packages-publish\.yml|scripts/publish-packages\.mjs)"
          echo "Publishable-path pattern: $PATTERN"

          if ! gh pr diff "$PR" --name-only | grep -qE "$PATTERN"; then
            echo "No publishable paths in PR #$PR — nothing to publish."
            exit 0
          fi

          # Same idempotence guard as the release dispatch: a human merge with a
          # clean squash message DOES fire the push trigger, and publishing twice
          # would just race itself.
          if [ -n "$SHA" ] && gh run list --workflow=packages-publish.yml --limit 20 \
               --json headSha -q '.[].headSha' | grep -q "^${SHA}$"; then
            echo "Publish already running/ran for ${SHA} (push trigger fired) — not dispatching."
            exit 0
          fi

          echo "Dispatching packages-publish.yml for merged PR #$PR (${SHA:-unknown sha})"
          gh workflow run packages-publish.yml --ref master

      - name: Warn if the squash message carries a CI-suppression token
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [ -n "${SHA:-}" ] || exit 0
          MSG=$(gh api "repos/${{ github.repository }}/commits/${SHA}" -q '.commit.message' || echo '')
          # Split the token so this very check cannot suppress workflows on itself.
          if printf '%s' "$MSG" | grep -qiE "\[(skip[ -]ci|ci[ -]skip)\]"; then
            echo "::warning::Squash commit ${SHA} contains a CI-suppression token inherited from a PR commit message. Push-triggered workflows on master were suppressed for it; the release was dispatched explicitly, but any OTHER push-triggered workflow silently did not run. Keep that token out of commit subjects on PRs that will be squashed."
          fi
