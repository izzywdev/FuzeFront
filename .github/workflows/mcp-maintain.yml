name: MCP Maintain

# Keeps this repo's Model Context Protocol (MCP) surface current, as part of CI. The
# sibling of a2a-maintain.yml and deliberately shaped the same way: on every PR it runs
# the `mcp-maintainer` agent to check whether anything changed that requires the repo's
# MCP server to be BUILT (first time) or UPDATED (drift) — the `.fuze/manifest.json`
# mcp block, the server under `mcp/`, its tools.json, and protocol-version currency.
# If so it commits the change BACK TO THE PR BRANCH; when it can't (fork PR / first-time
# build), it opens a separate `auto-merge`-labelled follow-up PR. It never fabricates a
# tool's product behaviour, never handles creds, never deploys.
#
# WHY MCP is maintained separately from A2A: A2A is how another AGENT asks this repo for
# an outcome; MCP is how an LLM SESSION queries and operates on this repo's objects and
# data directly. Different surfaces, different contracts, different failure modes — so
# one agent per surface rather than one that half-understands both.
#
# LLM credential: resolved by .github/actions/llm-endpoint — it probes the in-cluster
# LiteLLM gateway (a VIRTUAL key, not a provider key: the family routes agent calls
# through the gateway so no repo is bound to one vendor and a key can be revoked
# centrally) and falls back to a directly-configured vendor when the gateway is not
# reachable from this runner. Requires LITELLM_FUZE_KEY and/or ANTHROPIC_API_KEY — at
# least one, either one. See that action for why the fallback exists on purpose.
#
# CONTRACT, and it changed. It used to be "no key -> SKIPS (never red)", which made a
# check that passes by not running. The rule now keys off the MANIFEST:
#
#   mcp.enabled not declared  -> skip. There is no surface; that is the truth.
#   mcp.enabled true, NO usable credential (neither LiteLLM nor the configured
#                               fallback vendor) -> FAIL. A declared surface nobody
#                               can maintain.
#   mcp.enabled true, a usable credential (LiteLLM OR fallback) -> run.

on:
  pull_request:

permissions:
  contents: write          # commit the reconciled MCP surface back to the PR branch
  pull-requests: write     # open a follow-up PR when a push-back isn't possible
  id-token: write          # claude-code-action fetches an OIDC token (required)
  actions: read

concurrency:
  group: mcp-maintain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs on a HOSTED runner and always reports. Split out from the maintainer for the
  # same reason as a2a-maintain.yml's preflight: a job on a self-hosted pool that is
  # not serving QUEUES FOREVER with no red X, no log and no timeout — measured
  # 2026-08-23, 175 jobs queued on `fuzesdlc` with zero running for 36 hours
  # (FuzeInfra#623). A misconfiguration that produces no signal at all is worse than
  # one that produces a red, so the check that must never be silent runs where it
  # cannot be silenced. Since the llm-endpoint fallback landed, the maintainer job
  # below no longer NEEDS in-cluster reachability either, so this split is now purely
  # about signal placement, not runner placement.
  preflight:
    name: mcp-maintain preflight
    runs-on: fuzefront
    timeout-minutes: 5
    outputs:
      declared: ${{ steps.check.outputs.declared }}
      needs-llm: ${{ steps.drift.outputs.needs-llm }}
      credential_available: ${{ steps.set_cred.outputs.credential_available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Is mcp-maintain declared?
        id: check
        shell: bash
        run: |
          set -uo pipefail
          declared=$(python3 -c "import json;print(str((json.load(open('.fuze/manifest.json')).get('mcp') or {}).get('enabled', False)).lower())" 2>/dev/null || echo false)
          echo "declared=$declared" >> "$GITHUB_OUTPUT"

          if [ "$declared" != "true" ]; then
            echo "::notice title=mcp-maintain::.fuze/manifest.json does not declare mcp.enabled — nothing to maintain. Skipping is correct here: there is no surface."
          fi

      # Only invoke the LLM agent when MCP-relevant files actually changed. The helm
      # template and gateway spec already exist and are correct; the agent only needs to
      # run when something that can cause drift was touched.
      - name: Detect MCP surface drift
        id: drift
        if: steps.check.outputs.declared == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          MCP_PATTERN='^(\.fuze/manifest\.json$|deploy/helm/fuzefront/templates/mcp-gateway\.yaml$|deploy/helm/fuzefront/files/|services/app-registry-service/openapi\.yaml$|packages/mcp-gateway/|mcp/)'
          changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --paginate --jq '.[].filename' 2>/dev/null || true)
          if echo "$changed" | grep -qE "$MCP_PATTERN"; then
            echo "needs-llm=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=mcp-maintain::MCP-relevant files changed — will run maintainer agent."
          else
            echo "needs-llm=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=mcp-maintain::No MCP-relevant files changed — surface cannot have drifted, skipping LLM agent."
          fi

      # Declared AND drift detected. From here, having NO usable credential —
      # neither a LiteLLM virtual key nor the configured fallback vendor's key — is a
      # MISCONFIGURATION, not an environmental gap, and it fails. The action's own
      # ::error:: names the exact remedy, so this job does not duplicate it.
      #
      # This workflow used to skip when the key was absent, under a "no key -> skip,
      # never red" contract. That contract is the vacuous-gate pattern this repo has
      # spent a sweep removing: it made a check that passes by not running, so a repo
      # declaring an A2A/MCP surface could go indefinitely with that surface
      # unmaintained while the check sat green. `gate-authz` ended in `|| true` and
      # `gate-identifier` shipped an opt-in flag nobody set; both reached the same
      # place — a check that cannot fail. Note this is deliberately NOT relaxed into
      # "LiteLLM unreachable -> skip": unreachable is a FALLBACK trigger, and only the
      # total absence of any usable credential is red.
      #
      # Skipping stays correct for the undeclared case above, and for PRs where no
      # MCP-relevant files changed (drift cannot have occurred without touching those
      # files, so no credential is needed and no agent should run).
      #
      # A non-empty-but-exhausted/invalid key is treated the same as absent: if the
      # probe fails, credential_available=false and the maintainer job is skipped
      # (warning, not error). A genuinely absent credential and an exhausted one are
      # indistinguishable from outside the vault; both mean the run cannot proceed.
      - name: Resolve LLM endpoint — proves a usable credential exists
        id: cred
        if: steps.check.outputs.declared == 'true' && steps.drift.outputs.needs-llm == 'true'
        continue-on-error: true
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Set credential_available output
        id: set_cred
        if: steps.check.outputs.declared == 'true' && steps.drift.outputs.needs-llm == 'true'
        run: |
          if [ "${{ steps.cred.outcome }}" = "success" ]; then
            echo "credential_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "credential_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=mcp-maintain::No usable LLM credential found (all provider rungs exhausted or keys invalid) — mcp-maintain is SKIPPED, not failed. This is environmental: fix LITELLM_FUZE_KEY or a fallback vendor key to re-enable maintenance."
          fi

  mcp-maintain:
    needs: preflight
    # A clock, per gate-workflow-policy: this job drives an LLM agent that can push
    # commits, so a wedged rung must die on a timer rather than pin a runner slot
    # until a human drains the pool. 30 minutes is well above any observed run.
    timeout-minutes: 30
    # Loop guard: never run on our own maintenance branches.
    # Two conditions, one key (a duplicate `if:` is a YAML syntax error, not an AND):
    #   - preflight said the surface is declared. When it is not, there is nothing to
    #     maintain and the maintainer must not run at all.
    #   - not our own follow-up branch, or the maintainer re-triggers on its own push.
    if: >-
      needs.preflight.outputs.declared == 'true' &&
      !startsWith(github.event.pull_request.head.ref, 'mcp-maintain/')
    runs-on: fuzefront
    steps:
      # Early exit when no MCP-relevant files changed. The job must still run (so the
      # required check context is written as success, not skipped) but there is nothing
      # for the LLM agent to do — all subsequent steps are guarded by this output.
      - name: Gate — skip if no MCP drift possible or credentials unavailable
        id: gate
        env:
          NEEDS_LLM: ${{ needs.preflight.outputs.needs-llm }}
          CRED_AVAILABLE: ${{ needs.preflight.outputs.credential_available }}
        run: |
          if [ "${NEEDS_LLM:-true}" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MCP-relevant files changed — surface is in sync by construction. Skipping LLM maintainer."
          elif [ "${CRED_AVAILABLE}" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No usable LLM credential — mcp-maintain skipped (not failed). Fix LITELLM_FUZE_KEY or a fallback vendor key to re-enable."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head (writable, same-repo only)
        if: steps.gate.outputs.run == 'true'
        # Pinned to a full commit SHA, not a mutable tag: a tag can be silently
        # repointed by the action owner (cf. the trivy-action / kics-github-action
        # compromises). This workflow has `contents: write` on the PR branch, so a
        # repointed checkout would run attacker code with push access.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      # Replaces the old in-line gateway liveliness check, which treated an
      # unreachable LiteLLM as fatal and demanded a self-hosted in-cluster runner.
      # Unreachable is a FALLBACK TRIGGER, not an error: recovering the cluster may
      # itself require an agent run, so the agent path must not depend on the cluster
      # being up. preflight already proved a usable credential exists, so this
      # resolution cannot legitimately fail here.
      - name: Resolve LLM endpoint (LiteLLM in-cluster, vendor fallback)
        id: llm
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Skip on last-commit marker
        id: marker
        if: steps.gate.outputs.run == 'true'
        run: |
          if git log -1 --pretty=%B | grep -q '\[skip mcp\]'; then
            echo "::notice::last commit marked [skip mcp] — skipping to avoid a self-trigger loop."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mcp-maintainer
        id: maintainer
        if: steps.gate.outputs.run == 'true' && steps.marker.outputs.run == 'true'
        uses: ./.github/actions/fuze-code-action
        with:
          # RUNG 1a: subscription OAuth, tried BEFORE the metered LiteLLM/API-key
          # path. Omitting it does not fail loudly -- the rung is skipped by name
          # and the chain silently falls through to per-token billing, which is
          # what every run here was doing until 2026-09-16.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Same shape as gate-code-review in harden-gate.yml: the CLI reads
          # ANTHROPIC_AUTH_TOKEN, some SDK paths still read ANTHROPIC_API_KEY, so
          # both carry the resolved credential — whichever endpoint won the probe.
          anthropic-api-key: ${{ steps.llm.outputs.auth-token }}
          # allowed_bots: scoped to `claude`, deliberately NOT `*`.
          #
          # The gate exists because claude-code-action hard-fails a Bot actor:
          #   "Workflow initiated by non-human actor: claude (type: Bot).
          #    Add bot to allowed_bots list or use '*' to allow all bots."
          # Nearly every PR here is pushed by the `claude` bot (governance-sync's
          # commit-back flips the triggering actor User -> Bot), so the gate fired on
          # almost all of them -- and it fires LATE, after the prompt is printed and
          # "Trigger result: true", so a skimmed log looks like the maintainer ran.
          #
          # `*` allows EVERY bot, and this repo runs dependabot (.github/dependabot.yml,
          # package-ecosystem: github-actions). Under `*`, a dependabot PR -- whose body
          # carries upstream release notes this repo does not author -- can start an
          # agent run holding the resolved LLM credential and repo write. That is the exact
          # arbitrary-bot-drives-an-agent case the actor gate is for, so widening it to
          # `*` defeats the gate rather than configuring it.
          #
          # `claude` is a LOGIN allowlist matched against the actor with `[bot]` stripped
          # -- not a vendor or product name. This family's other bot is `fuzeone-bot`,
          # which triggers only scheduled workflows (governance-nightly, nightly-*), none
          # of which call this action; adding it here would grant an unused permission.
          #
          # The fork case stays closed independently: the trigger is `pull_request` (not
          # `pull_request_target`), so a fork PR gets no secrets at all — neither
          # LITELLM_FUZE_KEY nor ANTHROPIC_API_KEY — so llm-endpoint resolves nothing,
          # preflight fails closed, and this job never starts.
          allowed-bots: "claude"
          task-prompt: |
            You are the **mcp-maintainer** for this repo (follow `.claude/agents/mcp-maintainer.md`
            exactly — same scope, boundaries, and done-contract). This is an automated CI run on
            PR #${{ github.event.pull_request.number }} (head `${{ github.event.pull_request.head.ref }}`).

            TASK: assess whether this PR changed anything that requires the repo's MCP surface to be
            built (first time) or updated (drift) — the `.fuze/manifest.json` `mcp` block, the
            server(s) under `mcp/` named in `servers[]`, the `mcp/tools.json` tool manifest
            (every tool needs name/description/inputSchema/`mutates`), and protocol-version
            currency. If the surface is already in sync, DO NOTHING and say so.

            IF a change is needed:
              - Make the minimal correct change (scaffold on first run; reconcile only what drifted).
              - COMMIT IT BACK TO THIS PR BRANCH: `chore(mcp-maintain): <what> [skip mcp]` and push to
                `${{ github.event.pull_request.head.ref }}`. The trailing `[skip mcp]` is REQUIRED so you
                do not re-trigger yourself.
              - If you cannot push to the PR branch (this is a fork PR), instead open a follow-up PR from
                an `mcp-maintain/pr-${{ github.event.pull_request.number }}` branch, add the `auto-merge`
                label, and comment the link on this PR.

            HARD BOUNDARIES: never fabricate a tool's product/domain behaviour (scaffold a schema-valid
            skeleton and TODO-flag the real behaviour), never handle secrets/creds, never `kubectl`/deploy,
            never flip `enabled: true` for a server with no working tool, and never widen a tool's
            `mutates: false` to `true` just to make a handler compile — if the handler mutates, the
            handler is the bug. Where the repo exposes secret material or infrastructure writes, FLAG the
            exposure policy rather than deciding it. Verify any server you touch actually starts and
            lists its tools.

            End with the done-contract line from your agent def
            (`MCP SURFACE: <in-sync|scaffolded|reconciled>` + what landed + `NEEDS PRODUCT/OPERATOR:` if any).
          claude-args: '--allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep,WebFetch"'
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}

      # PROMOTED FROM a2a-maintain.yml, unchanged in substance. The wrapper prints only
      # `is_error:true` and swallows WHY: this workflow had no surfacing at all, so a failing
      # `Run mcp-maintainer` produced a red check that said nothing actionable, and by the time
      # anyone looked the job logs had aged out to a 404. Pull the result record out of the
      # execution log, put the actual error text in the log and the run summary, and keep the
      # whole log as an artifact — so the next failure is diagnosable from the run page instead
      # of by re-deriving it from first principles.
      #
      # `execution-file` is fuze-code-action passing through claude-code-action's own
      # `execution_file`; it is empty for any run that did not reach (or get a log out of)
      # the claude rung, which is exactly the "unknown" case the verdict corroborates on.
      - name: Surface the real result
        id: result
        if: always() && steps.maintainer.outcome != 'skipped'
        env:
          EXEC_FILE: ${{ steps.maintainer.outputs.execution-file }}
        run: |
          set -uo pipefail
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "no execution file produced by the action"
            echo "is_error=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          res=$(jq -rs '[.[] | .. | objects | select(.type? == "result")] | last' "$EXEC_FILE" 2>/dev/null || echo "null")
          echo "--- claude result record ---"; echo "$res"
          is_error=$(printf '%s' "$res" | jq -r '.is_error // false' 2>/dev/null || echo unknown)
          # `.result`/`.error` carry the human-readable failure when the SDK sets one.
          msg=$(printf '%s' "$res" | jq -r '(.error // .result // "") | tostring' 2>/dev/null || true)
          echo "is_error=$is_error" >> "$GITHUB_OUTPUT"
          # Random per-run delimiter rather than a literal `EOF`. $msg is arbitrary
          # agent-generated text this workflow does not control, and $GITHUB_OUTPUT's
          # heredoc form breaks if the body contains a line matching the delimiter
          # verbatim — the same reason fuze-code-action's own `finish` step randomises its
          # delimiter.
          DELIM="MCP_EOF_$(date +%s%N)_$$"
          {
            echo "msg<<${DELIM}"
            echo "${msg:-<no message in result record>}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload agent execution log
        # The execution-file guard is load-bearing, not defensive. On a provider
        # availability/credit outage fuze-code-action produces NO execution file, so
        # `path` renders EMPTY -- and upload-artifact fails an empty `path` input with
        # "Input required and not supplied: path", which fails the JOB. That re-reds
        # the very PR the credit-outage exception in the verdict step below has just
        # deliberately passed (it exits 0 and prints its ::notice::), so the exception
        # ported from #1046 was being silently defeated one step later.
        # `if-no-files-found: ignore` does NOT cover this: it handles a path that
        # matches nothing, not a path input that is empty.
        if: always() && steps.maintainer.outcome == 'failure' && steps.maintainer.outputs.execution-file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mcp-maintain-execution-log
          path: ${{ steps.maintainer.outputs.execution-file }}
          if-no-files-found: ignore
          retention-days: 7

      # THE VERDICT. A real agent failure is RED with the surfaced message; a success is green —
      # but a success that left no execution log says so out loud rather than claiming more than
      # it verified. That distinction is the anti-vacuity rule this repo already applied when it
      # removed `gate-authz`'s `|| true` and `gate-identifier`'s opt-in flag: a check that cannot
      # fail, or a green that overstates what it checked, is worse than no check.
      - name: Verdict
        if: always() && steps.marker.outputs.run == 'true'
        env:
          MAINTAINER_OUTCOME: ${{ steps.maintainer.outcome }}
          MAINTAINER_CONCLUSION: ${{ steps.maintainer.outputs.conclusion }}
          MAINTAINER_AVAILABILITY: ${{ steps.maintainer.outputs.availability }}
          RESULT_IS_ERROR: ${{ steps.result.outputs.is_error }}
          RESULT_MSG: ${{ steps.result.outputs.msg }}
        run: |
          set -uo pipefail
          # THE OWNER'S CREDIT-OUTAGE EXCEPTION, ported from fuze-code-review.yml (#1046).
          # classify.sh exit 1 = availability. Without consuming it this verdict cannot tell a
          # vendor credit/quota outage from a real task failure, and reds the PR on both --
          # which is exactly what #1046 fixed for fuze-code-review after a provider outage
          # failed it on every open PR in this repo while the same check on FuzeSDLC#360
          # passed with a notice, minutes apart. That fix wired the signal into
          # fuze-code-review only; these maintainer workflows were left on the old behaviour.
          #
          # This MUST be checked before the failure branch below: on an outage the action's
          # outcome IS `failure`. And it must NOT swallow a real task failure -- availability
          # is false there, so it falls through and still reds. That pair is the load-bearing
          # property #1046 pinned with `task_failure_without_availability_still_abstains`.
          if [ "${MAINTAINER_AVAILABILITY:-}" = "true" ]; then
            echo "::notice::mcp-maintainer skipped on a provider availability/credit outage -- passing per the owner's exception. The MCP surface was NOT checked for drift here. Re-run once a provider recovers."
            {
              echo "### ⚪ mcp-maintainer skipped -- provider availability/credit outage"
              echo ""
              echo "This is NOT a defect in this PR and NOT an approval of the MCP surface;"
              echo "the run could not reach a provider. Re-run once one recovers."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${MAINTAINER_OUTCOME:-}" = "failure" ] || [ "${RESULT_IS_ERROR:-}" = "true" ]; then
            echo "::error::mcp-maintainer did not complete: ${RESULT_MSG:-no error message surfaced}"
            {
              echo "### ❌ mcp-maintainer failed"
              echo ""
              echo '```'
              echo "${RESULT_MSG:-no error message surfaced}"
              echo '```'
              echo ""
              echo "Full execution log is attached as the \`mcp-maintain-execution-log\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # fuze-code-action's third state. `neutral` means a rung RAN and declined to do any
          # work (it emits its own ::warning:: saying so and exits 0). It is not a failure and
          # must not be reported as one — but it is also not a run that maintained anything,
          # so it does not get the clean "completed" line either.
          if [ "${MAINTAINER_CONCLUSION:-}" = "neutral" ]; then
            echo "::notice::mcp-maintainer performed no work on this commit (conclusion=neutral — the rung declined; see the fuze-code-action warning above). The MCP surface was NOT checked for drift here."
            echo "### ⚪ mcp-maintainer declined — no work performed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ANTI-VACUITY. The action reported success. If it also left no execution log there is
          # no result record to corroborate that, so say so rather than printing a clean
          # "completed" the run has not actually earned. Still green — the action's own outcome
          # is real evidence — but a green that overstates what it verified is how a broken
          # surface hides.
          if [ "${RESULT_IS_ERROR:-}" = "unknown" ]; then
            echo "::notice::mcp-maintainer reported success, but produced no execution log — completion could not be corroborated from a result record."
            {
              echo "### ✅ mcp-maintainer completed (unverified)"
              echo ""
              echo "The action exited successfully but wrote no execution log, so there is no result record to confirm what it did."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mcp-maintainer completed."
