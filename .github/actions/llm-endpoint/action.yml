name: 'Resolve LLM endpoint (LiteLLM + multi-vendor fallback chain)'
description: >-
  SINGLE POINT OF CHANGE for every workflow that calls claude-code-action (or
  the Claude Code CLI directly). Probes the in-cluster LiteLLM gateway with a
  bounded-timeout readiness check; if it answers, routes through it — the
  anthropic/openai/gemini mapping lives in LiteLLM's config, not here, so this
  is the genuinely vendor-agnostic path.
  .
  Readiness alone is not enough. A passing /health/readiness proves a proxy is
  UP; it does not prove the resolved credential AUTHENTICATES, nor that the
  endpoint will actually SERVE inference. So before returning success this
  action runs one minimal, bounded, AUTHENTICATED serve probe against the
  resolved endpoint — the very request shape claude-code-action itself sends
  (Anthropic-shape `POST /v1/messages`, `max_tokens: 1`). A definitive 401/403
  fails FAST in the fast preflight with an actionable message, instead of a
  present-but-invalid key sailing through and dying inside the full agent job
  (issue #405). A readiness-OK endpoint that refuses real traffic
  (connection-refused / 5xx) is NOT committed to and degrades to the fallback
  chain, so a flapping pod can no longer trap the run on a dead path with no
  degradation route (issue #298 Gap B).
  .
  If it does not answer (cluster down, or the caller is a GitHub-hosted
  runner that can never route to a cluster-internal DNS name — both are the
  SAME case from here), this action starts a SECOND, runner-local LiteLLM
  (`docker run`, not a job-level `services:` container — that structurally
  cannot take a mounted config) configured with every vendor key that is
  actually present, in the order given by `fallback-chain`. LiteLLM's own
  `router_settings.fallbacks` then walks that chain — this action does not
  hand-roll retry/fallback logic, LiteLLM already does it correctly and a
  second implementation would drift from the first.
  .
  Critically, the fallback triggers on LiteLLM's QUOTA / rate-limit / auth
  error classes (429 insufficient_quota, RateLimitError, AuthenticationError)
  — not merely on a transport/connection failure. A vendor that is simply out
  of credit answers with a perfectly successful HTTP connection and a quota
  error body; a chain that only reacts to connection failure would sit on
  that exhausted vendor and fail, which is exactly the incident this repo
  already shipped once.
  .
  THE FALLBACK EXISTS ON PURPOSE, NOT AS A CONVENIENCE: recovering the
  cluster may itself require an agent run (e.g. governance-nightly diagnosing
  why LiteLLM is down), so the fallback path must not itself depend on the
  cluster being up. A design where every agent run needs LiteLLM is a design
  that cannot repair LiteLLM.
  .
  Every run emits an `::notice::` naming the mode AND the primed serving
  vendor — a degraded run must never be silently indistinguishable from a
  good one. Never prints a key: vendor keys are only ever written to a
  mode-600 `--env-file` consumed by `docker run`, and any diagnostic log
  output is passed through a redaction filter that replaces every known
  secret value with `***` before being echoed. The resolved credential only
  ever leaves this action as a masked output, consumed the same way
  `secrets.*` already flows through this repo's workflows (`with:` / `env:`
  on the very next step).

inputs:
  litellm-base-url:
    description: 'In-cluster LiteLLM base URL (Anthropic-shape endpoint).'
    required: false
    default: 'http://litellm.fuzeinfra.svc.cluster.local:4000'
  litellm-key:
    description: >-
      LiteLLM virtual key. Callers pass `secrets.LITELLM_FUZE_KEY` — mint one
      with FuzeInfra `scripts/mint-litellm-fuze-key.sh`.
    required: false
    default: ''
  cf-access-client-id:
    description: >-
      Cloudflare Access service-token client id. When `litellm-base-url` is the
      PUBLIC gateway host (`litellm.<prod>`), it sits behind Cloudflare Access,
      so a GitHub-hosted runner reaches it ONLY by presenting a service token as
      the `CF-Access-Client-Id` / `CF-Access-Client-Secret` request headers.
      Empty (the default) sends no CF-Access headers — correct for the
      in-cluster service-DNS default, which is not behind Access. Callers pass
      `secrets.CF_ACCESS_CLIENT_ID`. The token is FuzeInfra terraform
      `cloudflare_zero_trust_access_service_token.litellm_ci`, bound to the
      `litellm_service` Access app by the `litellm_service_ci_token` policy.
    required: false
    default: ''
  cf-access-client-secret:
    description: >-
      Cloudflare Access service-token client secret, paired with
      `cf-access-client-id`. Callers pass `secrets.CF_ACCESS_CLIENT_SECRET`.
      Masked on entry; only ever leaves this action inside the pre-masked
      `custom-headers` output, never echoed.
    required: false
    default: ''
  public-litellm-base-url:
    description: >-
      PUBLIC LiteLLM gateway URL, probed as a SECOND tier when the in-cluster
      `litellm-base-url` is unreachable (the normal case on a GitHub-hosted
      runner, which cannot resolve the cluster-internal DNS name). It is the
      SAME gateway, exposed through a Cloudflare-Access-protected ingress at
      `litellm.<prod>`. This tier is attempted ONLY when BOTH cf-access creds AND
      `litellm-ci-key` are also supplied — with any of them empty the public tier
      is skipped and the action falls straight through to the runner-local
      fallback, i.e. the exact prior behaviour. The default IS the prod host, so a
      repo opts in purely by provisioning the three secrets (it does not also have
      to set this input); set it to empty to disable the tier outright. On a
      self-hosted in-cluster runner the in-cluster probe wins first, so this tier
      is a no-op there.
    required: false
    default: 'https://litellm.prod.fuzefront.com'
  litellm-ci-key:
    description: >-
      Capped LiteLLM virtual key presented as the bearer token when routing
      through the PUBLIC gateway (`public-litellm-base-url`). DELIBERATELY a
      distinct, lower-privilege key from `litellm-key` (the in-cluster
      `LITELLM_FUZE_KEY`): it travels the public internet on every hosted-runner
      job, so it is minted with a tight budget/model cap and rotated
      independently of the in-cluster key. Callers pass `secrets.LITELLM_CI_KEY`
      (minted by FuzeInfra `scripts/mint-litellm-ci-key.sh`). Masked on entry;
      only ever leaves this action as the pre-masked `auth-token` output.
    required: false
    default: ''
  probe-timeout-seconds:
    description: >-
      Bounded timeout for the LiteLLM readiness probe. Kept short deliberately
      — a hung probe on every job that calls this action would be its own new
      failure mode, worse than the one this action exists to route around.
    required: false
    default: '3'
  serve-probe-timeout-seconds:
    description: >-
      Bounded timeout for the AUTHENTICATED serve probe (the real
      `POST /v1/messages` inference call this action makes against the resolved
      endpoint before returning success — issues #405 / #298 Gap B). Longer
      than the readiness probe because it is a genuine round-trip through the
      model gateway, but still bounded so a hung endpoint fails the fast
      preflight instead of the slow agent job.
    required: false
    default: '10'
  fallback-chain:
    description: >-
      Ordered, comma-separated vendor fallback chain: any of
      anthropic,openai,gemini. Callers pass `vars.FUZE_LLM_FALLBACK_CHAIN`
      (org/repo variable); defaults to `anthropic,openai,gemini`. Only
      vendors whose key input is actually non-empty participate — a missing
      key means that vendor is skipped (logged by name only), not that the
      run fails. The run fails closed only if NONE of the chain's vendors
      have a configured key.
    required: false
    default: 'anthropic,openai,gemini'
  fallback-anthropic-key:
    description: 'Direct Anthropic API key. Callers pass secrets.ANTHROPIC_API_KEY.'
    required: false
    default: ''
  fallback-openai-key:
    description: 'Direct OpenAI API key. Callers pass secrets.OPENAI_API_KEY.'
    required: false
    default: ''
  fallback-gemini-key:
    description: 'Direct Gemini API key. Callers pass secrets.GEMINI_API_KEY.'
    required: false
    default: ''
  fallback-anthropic-model:
    description: 'LiteLLM model id used for the anthropic leg of the runner-local fallback chain.'
    required: false
    default: 'anthropic/claude-sonnet-4-5-20250929'
  fallback-openai-model:
    description: 'LiteLLM model id used for the openai leg of the runner-local fallback chain.'
    required: false
    default: 'openai/gpt-4o'
  fallback-gemini-model:
    description: 'LiteLLM model id used for the gemini leg of the runner-local fallback chain.'
    required: false
    default: 'gemini/gemini-2.0-flash'
  local-litellm-image:
    description: >-
      Pinned LiteLLM proxy image used for the runner-local fallback instance.
      Pinned (not `:main-latest`) for reproducibility; bump deliberately.
    required: false
    default: 'ghcr.io/berriai/litellm:main-v1.65.4-stable'
  local-litellm-port:
    description: 'Host port the runner-local LiteLLM proxy listens on.'
    required: false
    default: '4000'
  local-litellm-startup-timeout-seconds:
    description: >-
      Bounded wait for the runner-local LiteLLM container to report
      /health/readiness after `docker run`. Measured startup cost is real —
      see the composite action's PR body for the observed number — but must
      stay bounded so a wedged container fails the job instead of hanging it.
    required: false
    default: '45'

outputs:
  mode:
    description: 'litellm | litellm-public | fallback-anthropic | fallback-local-litellm'
    value: ${{ steps.resolve.outputs.mode }}
  vendor:
    description: >-
      litellm (opaque mapping, owned by the in-cluster LiteLLM config) | the
      primed head-of-chain vendor name (anthropic | openai | gemini) when
      mode=fallback-local-litellm. LiteLLM may still advance past this vendor
      per-request on a quota/rate-limit/auth error from IT — this output
      names what was primed at resolve time, not a guarantee of what serves
      every single request in the job.
    value: ${{ steps.resolve.outputs.vendor }}
  base-url:
    description: 'ANTHROPIC_BASE_URL to set. Always a valid, non-empty URL.'
    value: ${{ steps.resolve.outputs.base-url }}
  auth-token:
    description: >-
      Resolved credential, pre-masked. Feed to `anthropic_api_key:` /
      ANTHROPIC_AUTH_TOKEN on the very next step; never echo it.
    value: ${{ steps.resolve.outputs.auth-token }}
  custom-headers:
    description: >-
      ANTHROPIC_CUSTOM_HEADERS value (newline-separated `Name: Value`) the
      caller MUST set on the claude-code-action step so its OWN model requests
      carry the SAME Cloudflare Access service-token headers this action's
      readiness probe used — otherwise Access 302s those requests to a login
      page even though the probe passed. Non-empty on `mode=litellm` or
      `mode=litellm-public` when CF-Access creds were supplied (the
      public-gateway-behind-Access case); empty on every fallback path (direct
      Anthropic / runner-local LiteLLM), which needs no CF headers. Pre-masked;
      never echoed.
    value: ${{ steps.resolve.outputs.custom-headers }}

runs:
  using: composite
  steps:
    - name: Probe LiteLLM readiness, resolve endpoint + credential
      id: resolve
      shell: bash
      env:
        LITELLM_BASE_URL: ${{ inputs.litellm-base-url }}
        LITELLM_KEY: ${{ inputs.litellm-key }}
        CF_ACCESS_CLIENT_ID: ${{ inputs.cf-access-client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf-access-client-secret }}
        PUBLIC_LITELLM_BASE_URL: ${{ inputs.public-litellm-base-url }}
        LITELLM_CI_KEY: ${{ inputs.litellm-ci-key }}
        PROBE_TIMEOUT: ${{ inputs.probe-timeout-seconds }}
        SERVE_PROBE_TIMEOUT: ${{ inputs.serve-probe-timeout-seconds }}
        FALLBACK_CHAIN: ${{ inputs.fallback-chain }}
        FALLBACK_ANTHROPIC_KEY: ${{ inputs.fallback-anthropic-key }}
        FALLBACK_OPENAI_KEY: ${{ inputs.fallback-openai-key }}
        FALLBACK_GEMINI_KEY: ${{ inputs.fallback-gemini-key }}
        FALLBACK_ANTHROPIC_MODEL: ${{ inputs.fallback-anthropic-model }}
        FALLBACK_OPENAI_MODEL: ${{ inputs.fallback-openai-model }}
        FALLBACK_GEMINI_MODEL: ${{ inputs.fallback-gemini-model }}
        LOCAL_LITELLM_IMAGE: ${{ inputs.local-litellm-image }}
        LOCAL_LITELLM_PORT: ${{ inputs.local-litellm-port }}
        LOCAL_LITELLM_STARTUP_TIMEOUT: ${{ inputs.local-litellm-startup-timeout-seconds }}
      run: |
        set -uo pipefail

        # Mask every configured vendor key immediately, before any branch can
        # possibly echo one — belt-and-braces on top of the redaction filter
        # used for docker logs below.
        for k in "$FALLBACK_ANTHROPIC_KEY" "$FALLBACK_OPENAI_KEY" "$FALLBACK_GEMINI_KEY"; do
          [ -n "$k" ] && echo "::add-mask::$k"
        done

        # The CF-Access service-token SECRET is a credential — mask it before any
        # branch can echo it, same as the vendor keys above. The client id is
        # not itself sensitive, so it is left unmasked (masking a value that ends
        # up in a header the probe URL does not carry only produces noisy `***`).
        [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ] && echo "::add-mask::$CF_ACCESS_CLIENT_SECRET"

        # The public-gateway CI key is a bearer credential — mask it on entry too,
        # same belt-and-braces as the vendor keys and the CF-Access secret above,
        # before any branch below can echo it.
        [ -n "${LITELLM_CI_KEY:-}" ] && echo "::add-mask::$LITELLM_CI_KEY"

        # Build the CF-Access header set ONCE, reused in two places: as `curl -H`
        # args on the readiness probe below, and as the ANTHROPIC_CUSTOM_HEADERS
        # value emitted on the litellm path so claude-code-action's OWN requests
        # carry them too. BOTH id and secret must be present — a half-pair sends
        # nothing rather than a malformed header. When the target is the
        # in-cluster DNS name (no Access in front) these are simply empty.
        CF_CURL_ARGS=()
        CF_CUSTOM_HEADERS=""
        if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
          CF_CURL_ARGS=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          # Newline-separated `Name: Value` — the exact ANTHROPIC_CUSTOM_HEADERS
          # format Claude Code parses (v2.1.227+).
          CF_CUSTOM_HEADERS=$'CF-Access-Client-Id: '"${CF_ACCESS_CLIENT_ID}"$'\nCF-Access-Client-Secret: '"${CF_ACCESS_CLIENT_SECRET}"
        fi

        # ---- Authenticated serve-ability probe (issues #405 and #298 Gap B) ---
        # A passing /health/readiness proves a proxy is UP, not that the resolved
        # credential AUTHENTICATES or that the endpoint will actually SERVE
        # inference.
        #   #405: a present-but-invalid ANTHROPIC_API_KEY passes the non-empty
        #         check on the direct path (no LiteLLM in front to catch a 401),
        #         then dies inside the full agent job with "Invalid API key".
        #   #298 Gap B: an in-cluster LiteLLM answered readiness while refusing
        #         real traffic ("Unable to connect to API (ConnectionRefused)"),
        #         yet the action had already committed to mode=litellm with no
        #         degradation path.
        # Both are closed by one minimal, bounded, AUTHENTICATED request against
        # the resolved endpoint BEFORE returning success — the exact request
        # shape claude-code-action itself sends (Anthropic-shape POST
        # /v1/messages, max_tokens:1), so this probes the real serve path, not a
        # proxy-liveness side channel. The response body is discarded
        # (-o /dev/null): it can carry a provider error blob, and per the fleet
        # secrets rule nothing from a provider response is echoed. Only the
        # numeric HTTP status is read, into SERVE_RESULT:
        #   ok            — answered at the application layer AND accepted the
        #                   credential: any 2xx, or a 4xx that is NOT 401/403
        #                   (e.g. a 400/404 on the throwaway probe model still
        #                   proves auth passed and the serve path is live). Route.
        #   auth-rejected — HTTP 401/403: credential present but REJECTED. The
        #                   #405 case; fail fast in preflight (direct paths).
        #   unreachable   — no HTTP status (curl prints 000 on connection
        #                   refused/reset/timeout) or an HTTP 5xx: readiness
        #                   lied, the serve path is down. The #298 Gap B case;
        #                   do not commit — degrade / fall through.
        # PROBE_CF_ARGS is set by each caller: the CF-Access headers for the
        # public-gateway litellm probe, empty ("${arr[@]}" -> zero words under
        # bash 5.x set -u, same as CF_CURL_ARGS above) for the direct/local paths.
        SERVE_PROBE_CODE=""
        SERVE_RESULT=""
        PROBE_CF_ARGS=()
        serve_probe() {
          local base="${1%/}" token="$2"
          SERVE_PROBE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time "${SERVE_PROBE_TIMEOUT:-10}" \
            -X POST "${base}/v1/messages" \
            "${PROBE_CF_ARGS[@]}" \
            -H "x-api-key: ${token}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"fuze-llm-endpoint-probe","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}' \
            2>/dev/null || true)"
          case "$SERVE_PROBE_CODE" in
            401|403)    SERVE_RESULT="auth-rejected" ;;
            5??|000|"") SERVE_RESULT="unreachable" ;;
            *)          SERVE_RESULT="ok" ;;
          esac
        }

        reachable=false
        if [ -n "${LITELLM_BASE_URL:-}" ]; then
          # A REAL READINESS PATH, NOT A TCP CONNECT. /health/readiness is
          # LiteLLM's own "can this proxy actually accept traffic" endpoint —
          # unauthenticated by design (safe low-detail payload), distinct from
          # /health/liveliness which only proves the process didn't crash.
          # Bounded timeout: a hung probe on every job that consumes this
          # action would be a new failure mode, worse than the one routed
          # around here.
          # CF_CURL_ARGS is empty on the in-cluster path; the runner's bash is
          # 5.x, where "${arr[@]}" on an empty array under `set -u` expands to
          # zero words (the 4.4+ fix), so this stays a bare probe there and gains
          # the two CF-Access headers only when a service token was supplied.
          if curl -fsS --max-time "${PROBE_TIMEOUT:-3}" -o /dev/null \
               "${CF_CURL_ARGS[@]}" \
               "${LITELLM_BASE_URL%/}/health/readiness" 2>/dev/null; then
            reachable=true
          fi
        fi

        litellm_serve_failed=false
        if [ "$reachable" = true ] && [ -n "${LITELLM_KEY:-}" ]; then
          # Readiness passed — but confirm the gateway will actually SERVE
          # inference with this key before committing to it (issue #298 Gap B).
          # A pod that answers /health/readiness while refusing real traffic
          # must NOT trap the run on mode=litellm with no degradation path; if
          # the authenticated serve probe fails, fall through to the runner-local
          # fallback chain (built from the direct vendor keys) instead.
          PROBE_CF_ARGS=("${CF_CURL_ARGS[@]}")
          serve_probe "${LITELLM_BASE_URL}" "${LITELLM_KEY}"
          if [ "$SERVE_RESULT" = "ok" ]; then
            echo "::notice title=llm-endpoint::mode=litellm vendor=litellm — routing through in-cluster LiteLLM (${LITELLM_BASE_URL}); readiness AND an authenticated serve probe (HTTP ${SERVE_PROBE_CODE}) both passed. Vendor mapping is opaque here by design; it lives in LiteLLM's config, not this workflow."
            {
              echo "mode=litellm"
              echo "vendor=litellm"
              echo "base-url=${LITELLM_BASE_URL}"
              echo "auth-token=${LITELLM_KEY}"
            } >> "$GITHUB_OUTPUT"
            # Emit the CF-Access headers (if any) as a MULTILINE output so the
            # caller can set ANTHROPIC_CUSTOM_HEADERS on the claude-code-action
            # step. Empty when no CF creds were supplied (e.g. the in-cluster
            # path) — an empty value is harmless as an env var. Only this
            # (litellm) branch emits it; the fallback branches reach a direct
            # api.anthropic.com or a runner-local proxy, neither behind CF Access.
            {
              echo "custom-headers<<FUZE_CH_EOF"
              printf '%s\n' "${CF_CUSTOM_HEADERS}"
              echo "FUZE_CH_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          litellm_serve_failed=true
          echo "::warning title=llm-endpoint::in-cluster LiteLLM (${LITELLM_BASE_URL}) passed /health/readiness but the authenticated serve probe did NOT (result=${SERVE_RESULT}, HTTP ${SERVE_PROBE_CODE}) — readiness is a false positive for serve-ability here (issue #298 Gap B). NOT committing to mode=litellm; falling through to the runner-local fallback chain so this run still has a degradation path."
        fi

        # ---- Tier 2: PUBLIC LiteLLM gateway (the GitHub-hosted-runner path) ----
        # The in-cluster service DNS above resolves only from a pod in the
        # cluster, so a GitHub-hosted runner never routes to it and the Tier-1
        # probe just failed. The SAME gateway is ALSO exposed publicly at
        # ${PUBLIC_LITELLM_BASE_URL} behind Cloudflare Access; a hosted runner
        # reaches it by presenting the CI service token (CF-Access-Client-Id /
        # -Secret) plus a capped virtual key (LITELLM_CI_KEY). Attempted BEFORE
        # the runner-local container because routing through the real gateway
        # keeps LiteLLM's opaque vendor mapping and needs no docker on the runner
        # — the runner-local chain stays the last resort it was built to be.
        #
        # Fail-CLOSED to prior behaviour: this whole tier is skipped unless the
        # public URL AND both CF-Access creds AND the CI key are all present, so a
        # repo that has provisioned none of them behaves exactly as before
        # (Tier-1 miss -> runner-local).
        if [ -n "${PUBLIC_LITELLM_BASE_URL:-}" ] \
           && [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ] \
           && [ -n "${LITELLM_CI_KEY:-}" ]; then
          # Require a literal 200, not merely "curl connected". Behind CF Access an
          # unauthenticated or wrong-token request gets a 302 to the Access login
          # page, which `curl` without -L reports as a SUCCESSFUL transfer — so a
          # bare `curl -f` would treat a login redirect as "gateway ready" and then
          # point model traffic at an HTML login page. Capturing %{http_code} and
          # demanding 200 means only a request the service token actually cleared
          # (and that LiteLLM answered ready for) routes here; a 302/403 falls
          # through to the runner-local chain.
          pub_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                        --max-time "${PROBE_TIMEOUT:-3}" \
                        "${CF_CURL_ARGS[@]}" \
                        "${PUBLIC_LITELLM_BASE_URL%/}/health/readiness" 2>/dev/null || true)"
          if [ "$pub_code" = "200" ]; then
            echo "::notice title=llm-endpoint::mode=litellm-public vendor=litellm — routing through the PUBLIC LiteLLM gateway (${PUBLIC_LITELLM_BASE_URL}) with the CI service token (CF Access cleared, /health/readiness 200). Vendor mapping stays opaque here by design; it lives in LiteLLM's config, not this workflow. This is a first-class routed path, NOT a degraded one."
            {
              echo "mode=litellm-public"
              echo "vendor=litellm"
              echo "base-url=${PUBLIC_LITELLM_BASE_URL}"
              echo "auth-token=${LITELLM_CI_KEY}"
            } >> "$GITHUB_OUTPUT"
            # The public gateway IS behind CF Access, so the caller's OWN model
            # requests must carry the same service-token headers or Access 302s
            # them — emit them exactly as the in-cluster branch does.
            {
              echo "custom-headers<<FUZE_CH_EOF"
              printf '%s\n' "${CF_CUSTOM_HEADERS}"
              echo "FUZE_CH_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice title=llm-endpoint::public LiteLLM gateway did not return 200 (HTTP ${pub_code:-000} from ${PUBLIC_LITELLM_BASE_URL%/}/health/readiness within ${PROBE_TIMEOUT:-3}s) — CF-Access token rejected or gateway not ready. Continuing to the runner-local fallback chain."
        elif [ -n "${PUBLIC_LITELLM_BASE_URL:-}" ]; then
          # Public URL set but the creds to use it are not all present. Name WHICH
          # class is missing (never a value) so a half-provisioned setup is
          # diagnosable from the log without leaking anything.
          declare -a PUB_MISSING=()
          [ -z "${CF_ACCESS_CLIENT_ID:-}" ]     && PUB_MISSING+=("CF_ACCESS_CLIENT_ID")
          [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ] && PUB_MISSING+=("CF_ACCESS_CLIENT_SECRET")
          [ -z "${LITELLM_CI_KEY:-}" ]          && PUB_MISSING+=("LITELLM_CI_KEY")
          echo "::notice title=llm-endpoint::public LiteLLM gateway (${PUBLIC_LITELLM_BASE_URL}) NOT attempted — missing secret(s): [${PUB_MISSING[*]}] (names only, never values). Provision them to route hosted-runner CI through the gateway; leaving them unset keeps the runner-local fallback."
        fi

        if [ "$reachable" = false ]; then
          echo "::notice title=llm-endpoint::LiteLLM unreachable from this runner (probed ${LITELLM_BASE_URL:-<unset>}/health/readiness, ${PROBE_TIMEOUT:-3}s timeout) — starting a runner-local LiteLLM fallback chain. Expected on ubuntu-latest (no route to the cluster-internal DNS name) and this IS the deliberate bootstrap path: recovering the cluster may itself need an agent run, so the fallback must not depend on the cluster being up."
        elif [ "$litellm_serve_failed" = true ]; then
          echo "::notice title=llm-endpoint::in-cluster LiteLLM answered readiness but failed the authenticated serve probe (see warning above, issue #298 Gap B) — starting a runner-local LiteLLM fallback chain."
        else
          echo "::notice title=llm-endpoint::LiteLLM reachable but no litellm-key provided (LITELLM_FUZE_KEY secret unset) — starting a runner-local LiteLLM fallback chain."
        fi

        # ---- Build the ordered, key-filtered vendor chain --------------------
        # "Only vendors whose keys are present participate." A missing key
        # means skip that vendor, logged by NAME ONLY, never its key — and
        # never fail the run for it alone.
        declare -a CHAIN_VENDORS=()
        declare -a AVAILABLE=()
        declare -a SKIPPED=()
        IFS=',' read -ra CHAIN_VENDORS <<< "${FALLBACK_CHAIN:-anthropic,openai,gemini}"
        for raw in "${CHAIN_VENDORS[@]}"; do
          v="$(echo "$raw" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [ -z "$v" ] && continue
          case "$v" in
            anthropic) key="$FALLBACK_ANTHROPIC_KEY" ;;
            openai)    key="$FALLBACK_OPENAI_KEY" ;;
            gemini)    key="$FALLBACK_GEMINI_KEY" ;;
            *)
              echo "::error title=llm-endpoint::Unknown vendor '${v}' in fallback-chain — expected anthropic|openai|gemini."
              exit 1
              ;;
          esac
          if [ -n "$key" ]; then
            AVAILABLE+=("$v")
          else
            SKIPPED+=("$v")
          fi
        done

        echo "::notice title=llm-endpoint::fallback-chain requested=[${FALLBACK_CHAIN}] available=[${AVAILABLE[*]:-none}] skipped-no-key=[${SKIPPED[*]:-none}] (vendor names only — never keys)."

        if [ "${#AVAILABLE[@]}" -eq 0 ]; then
          echo "::error title=llm-endpoint::fallback-chain=[${FALLBACK_CHAIN}] but NO vendor in it has a configured key (checked: ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY secrets) — nothing to fall back to. This is the fail-closed preflight working as intended: set at least one secret, or mint LITELLM_FUZE_KEY and fix in-cluster LiteLLM reachability instead."
          exit 1
        fi

        # ---- A single-vendor chain does not need a container --------------
        # A runner-local LiteLLM whose model_list has ONE entry and whose
        # router_settings has no `fallbacks:` provides nothing a direct vendor
        # call does not — it only adds a docker dependency the runner may not
        # have. Anthropic is the one vendor claude-code-action can be pointed at
        # directly (it speaks the Anthropic API shape); openai/gemini still need
        # LiteLLM as the translating shim, so they do not take this path.
        if [ "${#AVAILABLE[@]}" -eq 1 ] && [ "${AVAILABLE[0]}" = "anthropic" ]; then
          echo "::notice title=llm-endpoint::mode=fallback-anthropic vendor=anthropic — chain resolved to a single vendor (skipped-no-key=[${SKIPPED[*]:-none}]), so this routes DIRECT to api.anthropic.com instead of starting a runner-local LiteLLM. A one-entry LiteLLM has no fallbacks to walk; the container would be pure overhead and a second thing that can fail."
          echo "::add-mask::${FALLBACK_ANTHROPIC_KEY}"
          # Confirm the key AUTHENTICATES before returning success (issue #405).
          # The non-empty check above proves only that a string is present; on
          # this direct path there is no LiteLLM in front to catch a 401 and roll
          # over, so a present-but-invalid key would otherwise sail through
          # preflight and die on the first model call inside the full agent job.
          PROBE_CF_ARGS=()
          serve_probe "https://api.anthropic.com" "${FALLBACK_ANTHROPIC_KEY}"
          if [ "$SERVE_RESULT" = "auth-rejected" ]; then
            echo "::error title=llm-endpoint::ANTHROPIC_API_KEY is present but REJECTED by api.anthropic.com (HTTP ${SERVE_PROBE_CODE}) — rotate/replace the secret. Failing in the fast preflight (issue #405) instead of burning a full agent run that would die on its first model call with 'Invalid API key'."
            exit 1
          fi
          if [ "$SERVE_RESULT" != "ok" ]; then
            echo "::warning title=llm-endpoint::authenticated serve probe to api.anthropic.com was inconclusive (result=${SERVE_RESULT}, HTTP ${SERVE_PROBE_CODE}) — could NOT reach it to confirm the key, and this is NOT a definitive 401/403. Proceeding on the direct-Anthropic path rather than turning a transient network blip into a new preflight failure mode; a persistently bad key will still surface downstream."
          fi
          {
            echo "mode=fallback-anthropic"
            echo "vendor=anthropic"
            echo "base-url=https://api.anthropic.com"
            echo "auth-token=${FALLBACK_ANTHROPIC_KEY}"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ---- Write vendor keys to a mode-600 env-file, never the command line -
        WORKDIR="${RUNNER_TEMP:-/tmp}/llm-endpoint-fallback"
        mkdir -p "$WORKDIR"
        ENV_FILE="${WORKDIR}/vendor.env"
        : > "$ENV_FILE"
        chmod 600 "$ENV_FILE"
        LOCAL_MASTER_KEY="fuze-local-$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        echo "::add-mask::${LOCAL_MASTER_KEY}"
        {
          [ -n "$FALLBACK_ANTHROPIC_KEY" ] && echo "ANTHROPIC_API_KEY=${FALLBACK_ANTHROPIC_KEY}"
          [ -n "$FALLBACK_OPENAI_KEY" ]    && echo "OPENAI_API_KEY=${FALLBACK_OPENAI_KEY}"
          [ -n "$FALLBACK_GEMINI_KEY" ]    && echo "GEMINI_API_KEY=${FALLBACK_GEMINI_KEY}"
          echo "LITELLM_LOCAL_MASTER_KEY=${LOCAL_MASTER_KEY}"
        } >> "$ENV_FILE"

        # ---- Generate LiteLLM config.yaml -------------------------------------
        # One model_list entry per AVAILABLE vendor, model_name == vendor name.
        # router_settings.fallbacks walks AVAILABLE in order, head -> rest.
        # Trigger classes are explicit: RateLimitError covers 429 AND
        # insufficient_quota (litellm maps both to RateLimitError), and
        # AuthenticationError covers an exhausted/revoked key returning
        # 401/403 — the two classes that matter for "we ran out of credits",
        # not just "the vendor is unreachable".
        CONFIG_FILE="${WORKDIR}/config.yaml"
        {
          echo "model_list:"
          for v in "${AVAILABLE[@]}"; do
            case "$v" in
              anthropic) model="$FALLBACK_ANTHROPIC_MODEL"; keyref='os.environ/ANTHROPIC_API_KEY' ;;
              openai)    model="$FALLBACK_OPENAI_MODEL";    keyref='os.environ/OPENAI_API_KEY' ;;
              gemini)    model="$FALLBACK_GEMINI_MODEL";    keyref='os.environ/GEMINI_API_KEY' ;;
            esac
            # Remember the head vendor's route for the "*" catch-all below.
            [ -z "${head_model:-}" ] && head_model="$model" && head_keyref="$keyref"
            echo "  - model_name: ${v}"
            echo "    litellm_params:"
            echo "      model: ${model}"
            echo "      api_key: \"${keyref}\""
          done
          # CATCH-ALL. The vendor-named entries above are only reachable by a
          # caller that knows to ask for "anthropic". claude-code-action does
          # NOT: it sends its own model name (e.g. claude-opus-4-8), which
          # matches nothing here, so LiteLLM answers
          #     400 {'error': 'completion: Invalid model name passed in
          #                    model=claude-opus-4-8'}
          # and the rung writes that string as its assistant text, reports NO
          # conclusion, and still exits 0. Downstream that is indistinguishable
          # from "the model declined to work", so fuze-code-review abstained and
          # went red on every PR that took the runner-local path -- while the
          # job's own message blamed the workflow-self-modification guard, which
          # was not involved (observed on FuzeInfra#823, a one-file Helm change).
          #
          # "*" routes any unrecognized model name to the HEAD vendor, so the
          # chain works without every caller having to pass --model.
          echo "  - model_name: \"*\""
          echo "    litellm_params:"
          echo "      model: ${head_model}"
          echo "      api_key: \"${head_keyref}\""
          echo ""
          echo "router_settings:"
          echo "  num_retries: 0"
          echo "  allowed_fails: 0"
          echo "  retry_policy:"
          echo "    RateLimitErrorRetries: 0"
          echo "    AuthenticationErrorRetries: 0"
          echo "    TimeoutErrorRetries: 0"
          echo "    ContentPolicyViolationErrorRetries: 0"
          if [ "${#AVAILABLE[@]}" -gt 1 ]; then
            head="${AVAILABLE[0]}"
            rest="${AVAILABLE[*]:1}"
            rest_yaml="${rest// /\", \"}"
            echo "  fallbacks:"
            echo "    - ${head}: [\"${rest_yaml}\"]"
            # The catch-all must roll over too, otherwise a caller that does not
            # name a vendor (claude-code-action) gets a single-vendor chain and
            # an exhausted head key fails the run instead of advancing.
            echo "    - \"*\": [\"${rest_yaml}\"]"
          fi
          echo ""
          echo "general_settings:"
          echo "  master_key: os.environ/LITELLM_LOCAL_MASTER_KEY"
        } > "$CONFIG_FILE"

        # ---- Start the runner-local LiteLLM proxy -----------------------------
        # `docker run`, deliberately not a job-level `services:` container —
        # `services:` cannot take a mounted config file. `--rm` since the
        # runner is torn down after the job anyway; no persistence needed.
        PORT="${LOCAL_LITELLM_PORT:-4000}"
        t_start=$(date +%s)
        # Redact any known secret value out of anything we might print below —
        # belt-and-braces on top of ::add-mask:: and the env-file-not-argv choice.
        redact() {
          local out="$1"
          for s in "$FALLBACK_ANTHROPIC_KEY" "$FALLBACK_OPENAI_KEY" "$FALLBACK_GEMINI_KEY" "$LOCAL_MASTER_KEY"; do
            [ -n "$s" ] && out="${out//$s/***}"
          done
          printf '%s\n' "$out"
        }

        # `if cmd; then ... else rc=$?; fi`, NOT `cmd; rc=$?`. The runner invokes
        # `shell: bash` steps with `-e` already on and `set -uo pipefail` above
        # does not turn it off, so a bare failing `docker run` aborts the step
        # before rc is ever assigned — the diagnostic below then never prints.
        # That is exactly what happened in the field: the step died with a bare
        # "Process completed with exit code 125" and no docker-run.log, leaving
        # the actual cause invisible. A tested context is the one place errexit
        # is defined not to apply.
        if docker run -d --rm \
          --name fuze-llm-fallback \
          -p "127.0.0.1:${PORT}:4000" \
          --env-file "$ENV_FILE" \
          -v "${CONFIG_FILE}:/app/config.yaml:ro" \
          "${LOCAL_LITELLM_IMAGE}" \
          --config /app/config.yaml --port 4000 --host 0.0.0.0 \
          > "${WORKDIR}/docker-run.log" 2>&1; then
          run_rc=0
        else
          run_rc=$?
        fi

        # Degrade to the direct-Anthropic leg rather than killing the chain when
        # the container cannot start (no docker daemon on the runner, image pull
        # blocked, port already bound). This is a REAL working path — the one
        # this action used before the multi-vendor chain existed — not a mask:
        # what is lost is LiteLLM's automatic mid-run advance to the next
        # vendor, and the warning says so, so a degraded run stays
        # distinguishable from a good one. If anthropic is not in the chain
        # there is no Anthropic-shape path at all, and it fails.
        degrade_to_anthropic() {
          local why="$1"
          for v in "${AVAILABLE[@]}"; do
            if [ "$v" = "anthropic" ]; then
              echo "::warning title=llm-endpoint::${why} — DEGRADING to mode=fallback-anthropic (direct api.anthropic.com). The chain [${AVAILABLE[*]}] is NOT active for this run: without LiteLLM there is no automatic advance past anthropic on a quota/rate-limit/auth error, so an exhausted anthropic key now fails the run instead of rolling over."
              echo "::add-mask::${FALLBACK_ANTHROPIC_KEY}"
              # This degraded leg ALSO has no LiteLLM in front to catch a 401, so
              # apply the same auth-validity gate as the single-vendor direct
              # path (issue #405): verify the key authenticates before handing it
              # back as a resolved credential.
              PROBE_CF_ARGS=()
              serve_probe "https://api.anthropic.com" "${FALLBACK_ANTHROPIC_KEY}"
              if [ "$SERVE_RESULT" = "auth-rejected" ]; then
                echo "::error title=llm-endpoint::degrade target api.anthropic.com REJECTED ANTHROPIC_API_KEY (HTTP ${SERVE_PROBE_CODE}) — the key is present but invalid; rotate it. Failing in preflight (issue #405) rather than emitting a credential that cannot authenticate."
                exit 1
              fi
              {
                echo "mode=fallback-anthropic"
                echo "vendor=anthropic"
                echo "base-url=https://api.anthropic.com"
                echo "auth-token=${FALLBACK_ANTHROPIC_KEY}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error title=llm-endpoint::${why} — and anthropic is not in the available chain [${AVAILABLE[*]}], so there is no Anthropic-shape endpoint to degrade to (claude-code-action speaks that shape only; openai/gemini reach it exclusively through LiteLLM). Failing closed."
          exit 1
        }

        if [ $run_rc -ne 0 ]; then
          echo "::error title=llm-endpoint::docker run failed to start the runner-local LiteLLM fallback container (rc=${run_rc}). Log (redacted):"
          while IFS= read -r line; do redact "$line"; done < "${WORKDIR}/docker-run.log"
          degrade_to_anthropic "runner-local LiteLLM could not be started (docker rc=${run_rc})"
        fi

        ready=false
        for _ in $(seq 1 "${LOCAL_LITELLM_STARTUP_TIMEOUT:-45}"); do
          if curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${PORT}/health/readiness" 2>/dev/null; then
            ready=true
            break
          fi
          sleep 1
        done
        t_end=$(date +%s)
        elapsed=$((t_end - t_start))

        if [ "$ready" != true ]; then
          echo "::error title=llm-endpoint::runner-local LiteLLM fallback container did not become ready within ${LOCAL_LITELLM_STARTUP_TIMEOUT:-45}s (waited ${elapsed}s). Container logs (redacted):"
          docker logs fuze-llm-fallback 2>&1 | while IFS= read -r line; do redact "$line"; done
          docker rm -f fuze-llm-fallback >/dev/null 2>&1 || true
          degrade_to_anthropic "runner-local LiteLLM did not become ready within ${LOCAL_LITELLM_STARTUP_TIMEOUT:-45}s"
        fi

        primary_vendor="${AVAILABLE[0]}"
        # Readiness of the freshly-started local proxy is necessary but not
        # sufficient (issue #298 Gap B, applied to the local leg too): confirm it
        # will serve an authenticated inference call before returning it. This
        # request also walks LiteLLM's own router_settings.fallbacks, so a bad
        # head-vendor key rolls over to the next configured vendor within the
        # probe itself; only if the WHOLE chain refuses does the probe fail. On
        # failure, degrade to the direct-Anthropic leg (which auth-probes in
        # turn) rather than hand back a proxy that merely answers readiness.
        PROBE_CF_ARGS=()
        serve_probe "http://127.0.0.1:${PORT}" "${LOCAL_MASTER_KEY}"
        if [ "$SERVE_RESULT" != "ok" ]; then
          echo "::warning title=llm-endpoint::runner-local LiteLLM became ready but its authenticated serve probe did NOT pass (result=${SERVE_RESULT}, HTTP ${SERVE_PROBE_CODE}) — the chain [${AVAILABLE[*]}] refused a real inference call."
          docker rm -f fuze-llm-fallback >/dev/null 2>&1 || true
          degrade_to_anthropic "runner-local LiteLLM answered readiness but failed the authenticated serve probe (result=${SERVE_RESULT}, HTTP ${SERVE_PROBE_CODE})"
        fi
        echo "::notice title=llm-endpoint::mode=fallback-local-litellm vendor=${primary_vendor} — runner-local LiteLLM (chain=[${AVAILABLE[*]}], skipped-no-key=[${SKIPPED[*]:-none}]) became ready in ${elapsed}s and passed an authenticated serve probe (HTTP ${SERVE_PROBE_CODE}). LiteLLM's own router_settings.fallbacks will auto-advance past ${primary_vendor} on a quota/rate-limit/auth error without another workflow run."
        {
          echo "mode=fallback-local-litellm"
          echo "vendor=${primary_vendor}"
          echo "base-url=http://127.0.0.1:${PORT}"
          echo "auth-token=${LOCAL_MASTER_KEY}"
        } >> "$GITHUB_OUTPUT"
