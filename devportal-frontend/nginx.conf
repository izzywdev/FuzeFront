worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/nginx_access.log main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # Docker/k8s DNS resolver
    resolver 127.0.0.11 valid=10s;

    server {
        listen 3000;
        listen [::]:3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;

        server_tokens off;

        limit_req zone=general burst=20 nodelay;

        # Health check endpoint for nginx itself (k8s probe).
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Same-origin API base (CLAUDE.md: never a cross-origin API host).
        # Strips the /api/ prefix: devportal-service itself serves /auth/*,
        # /v1/* and /docs at its own root — so the Authentik redirect_uri
        # registered as https://developers.fuzefront.com/api/auth/oidc/callback
        # resolves to devportal-service's GET /auth/oidc/callback.
        #
        # This location is deliberately reachable directly by external client
        # requests (the browser calling /api/v1/catalog etc.) — it is a public
        # API gateway path, not an X-Accel-Redirect target, so `internal;`
        # cannot be added here (Semgrep generic.nginx.security.missing-internal
        # flags every proxy_pass location generically; that directive would
        # 404 every legitimate external API call this location exists to
        # serve). Same accepted shape as fuzefront-website/frontend/nginx.conf's
        # own /api/ location.
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            # devportal-service:3013 is a HARDCODED literal (not attacker- or
            # request-influenced) — the `set $var` + variable `proxy_pass` is
            # required so nginx re-resolves the k8s Service DNS name per
            # request via the `resolver` directive above, instead of caching
            # the IP once at nginx startup and going stale on pod restarts.
            # Same pattern as fuzefront-website/frontend/nginx.conf's
            # `set $backend` — Semgrep's dynamic-proxy-host rule cannot see
            # that this specific value never varies.
            set $devportal_backend "devportal-service:3013";
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
            proxy_pass http://$devportal_backend/;
            proxy_http_version 1.1;
            # Hardcoded rather than $host/$http_host (Semgrep request-host-used):
            # the Ingress in front of this pod only routes requests whose Host
            # already matches developers.fuzefront.com, so this is never
            # attacker-influenced in practice — but forwarding a client-supplied
            # Host verbatim is still worth avoiding on principle, and
            # devportal-service never reads this header for any decision.
            proxy_set_header Host developers.fuzefront.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Client-side routed SPA
        location / {
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
