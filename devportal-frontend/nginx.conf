worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/nginx_access.log main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    server {
        listen 3000;
        listen [::]:3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;

        server_tokens off;

        limit_req zone=general burst=20 nodelay;

        # Health check endpoint for nginx itself (k8s probe).
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Same-origin API base (CLAUDE.md: never a cross-origin API host).
        # Strips the /api/ prefix: devportal-service itself serves /auth/*,
        # /v1/* and /docs at its own root — so the Authentik redirect_uri
        # registered as https://developers.fuzefront.com/api/auth/oidc/callback
        # resolves to devportal-service's GET /auth/oidc/callback.
        #
        # This location is deliberately reachable directly by external client
        # requests (the browser calling /api/v1/catalog etc.) — it is a public
        # API gateway path, not an internal-redirect target, so it cannot be
        # marked internal-only. See .semgrepignore for why this file is
        # excluded from the generic nginx scanner rather than suppressed
        # line-by-line (inline nosemgrep is not honoured for this rule engine).
        #
        # Static proxy_pass to the k8s Service DNS name (fuzefront-devportal-
        # service, see deploy/helm/fuzefront/templates/devportal-service.yaml's
        # Service metadata.name), same convention as the proven-in-prod
        # frontend/nginx.conf (`proxy_pass http://fuzefront-backend:3001;` et
        # al). A k8s Service is a stable virtual IP for its whole lifetime —
        # backing pods restarting does NOT change it — so there is no
        # staleness problem for nginx's own startup-time DNS resolution to
        # protect against here. The previous `resolver 127.0.0.11` + `set $var`
        # indirection was copied from a Docker-Compose pattern (127.0.0.11 is
        # Docker's embedded DNS IP, not reachable in this k8s pod's netns) and
        # broke every /api/* call outright — sign-in (/api/auth/*) and the
        # catalog (/api/v1/*) identically, both 502/503 from nginx before ever
        # reaching devportal-service.
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://fuzefront-devportal-service:3012/;
            proxy_http_version 1.1;
            # Hardcoded rather than forwarding the client-supplied request
            # host: the Ingress in front of this pod only routes requests
            # whose host already matches developers.fuzefront.com, and
            # devportal-service never reads this header for any decision.
            proxy_set_header Host developers.fuzefront.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Client-side routed SPA
        location / {
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
