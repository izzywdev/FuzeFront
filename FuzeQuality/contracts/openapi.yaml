              schema: { $ref: '#/components/schemas/TestExecutionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/test-executions/evidence/refresh:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    post:
      operationId: refreshTestExecutionEvidence
      summary: Refresh provider artifacts for one immutable execution attempt
      description: >-
        Re-runs GitHub Actions artifact discovery through the repository's tenant-owned GitHub App
        installation. The execution outcome and attempt identity remain immutable; only merged evidence
        links and the explicit collection state are updated. This also repairs terminal attempts with no
        retained collection attempt; a successful empty lookup becomes an explicit `complete` result.
        Complete attempts may be reconciled again so expired or deleted GitHub artifacts are removed while
        externally hosted evidence is preserved.
      tags: [executions]
      security: [{ platformBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestExecutionEvidenceRefresh' }
      responses:
        '200':
          description: The exact execution attempt with refreshed provider evidence state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The repository has no GitHub App installation or the execution is still running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '502':
          description: Provider artifact discovery failed; previously retained evidence remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '504':
          description: Provider artifact discovery timed out; previously retained evidence remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

