# =============================================================================
# FuzeQuality — API contract
# =============================================================================
# This document describes the operations that are CONTRACT-GOVERNED today, and
# deliberately no more than that. Alongside platform probes, it publishes the
# reviewed repository-intelligence surface whose authorization and tenant
# boundaries are implemented and verified. Remaining routes are added one
# operation at a time alongside their actual authorization behavior.
#
# The irony is noted: FuzeQuality's own purpose is measuring whether other
# repositories' OpenAPI contracts are covered. This file is the start of it
# holding itself to the same standard.
# =============================================================================
openapi: 3.0.3
info:
  title: FuzeQuality
  description: >-
    Evidence graph across repositories, OpenAPI contracts, frontend surfaces,
    automated tests and Jira requirements. This document currently covers the
    platform operational surface and the reviewed repository-intelligence API:
    UX-flow candidates, policy/gate governance, and execution evidence.
  version: 0.84.3
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:4180
    description: Local development
  - url: https://fuzequality.fuzefront.com
    description: Production (the host deploy/helm/fuzequality/values-prod.yaml pins)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and contract-availability probe
      description: >-
        Unauthenticated. Reports the service, the contract version, and whether
        the process could load the OpenAPI document shipped in its image — so a
        build made without its contract is visible on the health check rather
        than at the moment a consumer first needs the spec.


        Distinct from `/health/live` and `/health/ready`, which predate it and
        are what the chart's kubelet probes use. `/health` is the platform-wide
        convention every Fuze service answers, and is what the landing page and
        the same-origin nginx proxy call.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health/live:
    get:
      operationId: getHealthLive
      summary: Kubelet liveness probe
      description: Pre-existing, unauthenticated. Answers `{"status":"ok"}`.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /health/ready:
    get:
      operationId: getHealthReady
      summary: Kubelet readiness probe
      description: Pre-existing, unauthenticated. Answers `{"status":"ready"}`.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The process is ready to serve.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]

  /openapi.yaml:
    get:
      operationId: getOpenApiYaml
      summary: This document, as committed
      description: >-
        Unauthenticated by design: the document describes the SHAPE of the API,
        never any data held in it, and requiring a token to discover the contract
        would gate the one thing that helps a caller construct a correctly
        authorized request.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The OpenAPI document, verbatim.
          content:
            application/yaml:
              schema:
                type: string
        '503':
          description: >-
            The endpoint exists but its document is missing from this build.
            Deliberately 503 and not 404 — a 404 would read as "this service
            publishes no spec", which is a different and wrong diagnosis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /openapi.json:
    get:
      operationId: getOpenApiJson
      summary: This document, re-serialised as JSON
      security: []
      tags: [operations]
      responses:
        '200':
          description: The same document, parsed and re-serialised as JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: The endpoint exists but its document is missing from this build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/internal/repository-flow-candidates:
    post:
      operationId: ingestRepositoryFlowCandidates
      summary: Persist repository UX-flow candidates produced by an analysis worker
      description: LiteLLM evidence IDs plus candidate step and wireframe target IDs must resolve to artifacts in the candidate's exact tenant-scoped repository revision; stale or invented references are rejected while deterministic evidence passages remain valid text.
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidates]
              properties:
                candidates:
                  type: array
                  items: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/internal/design-test-links:
    post:
      operationId: projectDesignTestLinkLifecycle
      summary: Project a FuzeX design-to-test link into FuzeQuality
      description: >-
        Cluster-internal lifecycle projection for the relationship between a
        FuzeX UX design target and a FuzeQuality test case. This endpoint is
        intentionally relationship-only: it never accepts prototype HTML,
        design-policy text, test output, credentials, or a URL for the service
        to fetch. FuzeX is the source of the trace link; FuzeQuality records
        whether that link is active and emits its own verified or revoked
        lifecycle event for downstream consumers.


        Callers authenticate with the FuzeQuality service token. The tenant ID
        is part of the event key and must be a UUID, so an event cannot be
        accidentally projected into an unscoped legacy tenant.
      tags: [worker-design-traceability]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignTestLinkLifecycleEvent' }
      responses:
        '202':
          description: The design-test relationship was accepted; `changed` is false for an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalAcceptedChange' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/repositories/{repositoryId}/scan-history:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listRepositoryScanHistory
      summary: List tenant-scoped repository analysis runs
      description: >-
        Returns immutable repository-analysis revisions in newest-first order.
        Continuation uses the stored scan timestamp and stable revision-row ID,
        so concurrent scans cannot make an existing page grow without bound.
      tags: [repository-analysis]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: A bounded page of repository analysis history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RepositoryScanHistoryEntry' }
                  page:
                    type: object
                    additionalProperties: false
                    required: [nextCursor, hasMore]
                    properties:
                      nextCursor: { type: string, nullable: true }
                      hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/quality-artifacts:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listRepositoryQualityArtifacts
      summary: List repository evidence for reviewed analysis
      description: >-
        Returns a bounded, exact-revision evidence inventory. The portal follows
        continuation cursors before presenting reviewed UX-flow and policy/gate
        evidence; the internal repository-analysis worker retains its full,
        service-authenticated exact-revision endpoint.
      tags: [repository-analysis]
      security: [{ platformBearer: [] }]
      parameters:
        - name: revision
          in: query
          description: Exact catalog revision; defaults to the repository's current analyzed revision.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding page; it pins implicit current-revision reads to the first page's analyzed revision.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: A bounded page of repository evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QualityArtifact' }
                  page:
                    type: object
                    additionalProperties: false
                    required: [nextCursor, hasMore]
                    properties:
                      nextCursor: { type: string, nullable: true }
                      hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/quality-artifacts/by-ids:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: resolveRepositoryQualityArtifacts
      summary: Resolve exact repository evidence identifiers
      description: >-
        Resolves a bounded set of revision-scoped artifact identifiers through
        the caller's tenant boundary without scanning complete artifact pages.
        Callers resolving more than 100 identifiers must issue bounded requests
        and merge the tenant-scoped results.
      tags: [repository-analysis]
      security: [{ platformBearer: [] }]
      parameters:
        - name: revision
          in: query
          description: Restrict logical and observation identifiers to one analyzed catalog revision.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Tenant-scoped evidence matching the requested identifiers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QualityArtifact' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/flow-candidates:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listRepositoryFlowCandidates
      summary: List tenant-scoped, reviewable UX-flow candidates
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [deterministic, litellm] }
        - name: status
          in: query
          schema: { type: string, enum: [proposed, confirmed, rejected] }
        - name: revision
          in: query
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: model
          in: query
          description: Exact FuzeInfra LiteLLM model identity stored with the proposal.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: promptVersion
          in: query
          description: Exact reviewed analysis prompt version.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: schemaVersion
          in: query
          description: Exact structured-output schema version.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: minConfidence
          in: query
          description: Inclusive lower detector-confidence bound.
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: maxConfidence
          in: query
          description: Inclusive upper detector-confidence bound. Must not be lower than minConfidence.
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: limit
          in: query
          description: Maximum number of candidates to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: UX-flow candidates discovered for the repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repositories/{repositoryId}/flow-candidates/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: getRepositoryFlowCandidate
      summary: Inspect one tenant-scoped UX-flow candidate and its wireframe
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: The exact revisioned flow candidate requested by the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repositories/{repositoryId}/flow-candidates/{candidateId}/review:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: reviewRepositoryFlowCandidate
      summary: Confirm or reject a detected UX-flow candidate
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, rejected] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
                expectedReviewedAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: >-
                    Optimistic review-state precondition. Null asserts that no prior
                    decision exists; an omitted value keeps legacy last-write-wins behavior.
      responses:
        '200':
          description: The reviewed candidate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The candidate revision or human-review state changed and must be refreshed.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/StaleFlowCandidateError' }
                  - { $ref: '#/components/schemas/StaleFlowReviewError' }
        '422':
          description: >-
            Confirmation requires complete FuzeInfra LiteLLM model, prompt, and schema
            provenance, reviewer rationale for grounding gaps, and a reviewable wireframe;
            every LiteLLM evidence, step, or wireframe artifact reference must resolve in
            the candidate's exact repository revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/repositories/{repositoryId}/flow-candidates/{candidateId}/history:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: listRepositoryFlowReviewHistory
      summary: List immutable human review decisions for a UX-flow candidate
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding review-history page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Newest-first review history for the tenant-owned candidate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RepositoryFlowReviewHistoryEntry' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/repositories/{repositoryId}/analysis-status:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    post:
      operationId: recordRepositoryAnalysisStatus
      summary: Record the revision-scoped FuzeInfra LiteLLM review lifecycle
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, status]
              properties:
                revision: { type: string, minLength: 1, maxLength: 500 }
                status: { type: string, enum: [queued, running, complete, failed] }
                startedAt: { type: string, format: date-time }
                finishedAt: { type: string, format: date-time }
                errorCode: { type: string, enum: [INTELLIGENCE_UNAVAILABLE, INTELLIGENCE_TIMEOUT] }
                counts:
                  type: object
                  additionalProperties: false
                  required: [deterministic, evaluations, proposed]
                  properties:
                    deterministic: { type: integer, minimum: 0 }
                    evaluations: { type: integer, minimum: 0 }
                    proposed: { type: integer, minimum: 0 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/repositories/{repositoryId}/scan-failure:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    post:
      operationId: recordRepositoryScanFailure
      summary: Record a sanitized terminal repository scan failure
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryScanFailure' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/repositories/{repositoryId}/policy-gate-evaluations:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listInternalPolicyGateEvaluations
      summary: Read policy/gate findings for a repository analysis worker
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/PolicyGateFindingKind' }
        - name: remediationAction
          in: query
          schema: { $ref: '#/components/schemas/PolicyGateRemediationAction' }
        - name: severity
          in: query
          schema: { type: string, enum: [high, medium, low] }
        - name: reviewStatus
          in: query
          schema: { type: string, enum: [proposed, accepted, dismissed] }
        - name: revision
          in: query
          description: Exact reviewed repository-analysis revision.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: subject
          in: query
          description: Exact case-insensitive policy or gate subject retained with the finding.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: minConfidence
          in: query
          description: Inclusive lower detector-confidence bound.
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: maxConfidence
          in: query
          description: Inclusive upper detector-confidence bound. Must not be lower than minConfidence.
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: limit
          in: query
          description: Maximum number of worker-visible evaluations to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding worker page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Policy/gate evaluations for the repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGateEvaluation' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/policy-gate-evaluations:
    post:
      operationId: ingestPolicyGateEvaluations
      summary: Persist policy/gate evaluations produced by an analysis worker
      description: >-
        Persists tenant-owned findings only after every policy, gate, and quoted
        source path resolves in the exact repository analysis revision.
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evaluations]
              properties:
                evaluations:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/PolicyGateEvaluationInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listPolicyGateEvaluations
      summary: List tenant-scoped policy/gate findings and their current review state
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
        - name: remediationAction
          in: query
          schema: { $ref: '#/components/schemas/PolicyGateRemediationAction' }
        - name: severity
          in: query
          schema: { type: string, enum: [high, medium, low] }
        - name: reviewStatus
          in: query
          schema: { type: string, enum: [proposed, accepted, dismissed] }
        - name: revision
          in: query
          description: Exact repository analysis revision that produced the finding.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: subject
          in: query
          description: Exact case-insensitive policy or gate subject retained with the finding.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: minConfidence
          in: query
          description: Inclusive lower detector-confidence bound.
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: maxConfidence
          in: query
          description: Inclusive upper detector-confidence bound. Must not be lower than minConfidence.
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: limit
          in: query
          description: Maximum number of evaluations to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Policy/gate evaluations for the repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGateEvaluation' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations/{evaluationId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/EvaluationId'
    get:
      operationId: getPolicyGateEvaluation
      summary: Inspect one tenant-scoped policy/gate finding and its evidence
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: The exact revisioned policy/gate evaluation requested by the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGateEvaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations/{evaluationId}/review:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/EvaluationId'
    post:
      operationId: reviewPolicyGateEvaluation
      summary: Accept or dismiss a policy/gate recommendation
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [accepted, dismissed] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
                expectedReviewedAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: The evaluation with its updated review state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGateEvaluation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The finding revision is stale or another reviewer changed the decision.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/StalePolicyGateEvaluationError' }
                  - { $ref: '#/components/schemas/StalePolicyGateReviewError' }
        '422':
          description: >-
            Accepting an anomaly remediation requires reviewer rationale and every
            policy, gate, and quoted source path must resolve in the finding's exact
            repository revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations/{evaluationId}/history:
