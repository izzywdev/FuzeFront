      summary: Ingest CI, integration, post-production, load, or stress evidence
      description: Provider-qualified GitHub workflow paths such as `.github/workflows/integration.yml@refs/heads/main` are canonicalized to their repository-relative YAML path before evidence is stored and matched to reviewed workflows.
      tags: [worker-executions]
