        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/analysis-retries:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    post:
      operationId: retryRepositoryAnalysis
      summary: Requeue failed reviewed analysis for the exact current revision
      description: >-
        Uses a dedicated durable analysis command to retry deterministic governance and FuzeInfra
        LiteLLM review without checking out, rescanning, or replaying unrelated inventory projections.
        Only failed current-revision analysis is retryable.
      tags: [repositories]
      security: [{ platformBearer: [] }]
      responses:
        '202':
          description: Analysis was durably requeued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryProcessingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The repository has no failed current-revision analysis to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

