      summary: Inspect one tenant-scoped retained test execution
      description: >-
        Returns the exact immutable execution record after verifying both repository ownership and
        execution membership in the authenticated tenant. The optional catalogRevision resolves the
        provider source revision to the analyzed catalog that owns policy/gate artifact identifiers.
