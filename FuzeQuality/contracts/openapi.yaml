        - $ref: '#/components/parameters/ExecutionEvidenceCollectionStatus'
        - $ref: '#/components/parameters/ExecutionEvidenceCheckedAfter'
        - $ref: '#/components/parameters/ExecutionEvidenceCheckedBefore'
        - $ref: '#/components/parameters/ExecutionEvidenceRequirement'
        - $ref: '#/components/parameters/ExecutionThresholdOutcome'
        - $ref: '#/components/parameters/ExecutionGateOutcome'
        - $ref: '#/components/parameters/ExecutionExternalRunId'
