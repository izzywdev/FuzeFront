# =============================================================================
# FuzeQuality — API contract
# =============================================================================
# This document describes the operations that are CONTRACT-GOVERNED today, and
# deliberately no more than that. Alongside platform probes, it publishes the
# reviewed repository-intelligence surface whose authorization and tenant
# boundaries are implemented and verified. Remaining routes are added one
# operation at a time alongside their actual authorization behavior.
#
# The irony is noted: FuzeQuality's own purpose is measuring whether other
# repositories' OpenAPI contracts are covered. This file is the start of it
# holding itself to the same standard.
# =============================================================================
openapi: 3.0.3
info:
  title: FuzeQuality
  description: >-
    Evidence graph across repositories, OpenAPI contracts, frontend surfaces,
    automated tests and Jira requirements. This document currently covers the
    platform operational surface and the reviewed repository-intelligence API:
    UX-flow candidates, policy/gate governance, and execution evidence.
  version: 0.24.0
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:4180
    description: Local development
  - url: https://fuzequality.fuzefront.com
    description: Production (the host deploy/helm/fuzequality/values-prod.yaml pins)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and contract-availability probe
      description: >-
        Unauthenticated. Reports the service, the contract version, and whether
        the process could load the OpenAPI document shipped in its image — so a
        build made without its contract is visible on the health check rather
        than at the moment a consumer first needs the spec.


        Distinct from `/health/live` and `/health/ready`, which predate it and
        are what the chart's kubelet probes use. `/health` is the platform-wide
        convention every Fuze service answers, and is what the landing page and
        the same-origin nginx proxy call.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health/live:
    get:
      operationId: getHealthLive
      summary: Kubelet liveness probe
      description: Pre-existing, unauthenticated. Answers `{"status":"ok"}`.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /health/ready:
    get:
      operationId: getHealthReady
      summary: Kubelet readiness probe
      description: Pre-existing, unauthenticated. Answers `{"status":"ready"}`.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The process is ready to serve.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]

  /openapi.yaml:
    get:
      operationId: getOpenApiYaml
      summary: This document, as committed
      description: >-
        Unauthenticated by design: the document describes the SHAPE of the API,
        never any data held in it, and requiring a token to discover the contract
        would gate the one thing that helps a caller construct a correctly
        authorized request.
      security: []
      tags: [operations]
      responses:
        '200':
          description: The OpenAPI document, verbatim.
          content:
            application/yaml:
              schema:
                type: string
        '503':
          description: >-
            The endpoint exists but its document is missing from this build.
            Deliberately 503 and not 404 — a 404 would read as "this service
            publishes no spec", which is a different and wrong diagnosis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /openapi.json:
    get:
      operationId: getOpenApiJson
      summary: This document, re-serialised as JSON
      security: []
      tags: [operations]
      responses:
        '200':
          description: The same document, parsed and re-serialised as JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: The endpoint exists but its document is missing from this build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/internal/repository-flow-candidates:
    post:
      operationId: ingestRepositoryFlowCandidates
      summary: Persist repository UX-flow candidates produced by an analysis worker
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidates]
              properties:
                candidates:
                  type: array
                  items: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/internal/design-test-links:
    post:
      operationId: projectDesignTestLinkLifecycle
      summary: Project a FuzeX design-to-test link into FuzeQuality
      description: >-
        Cluster-internal lifecycle projection for the relationship between a
        FuzeX UX design target and a FuzeQuality test case. This endpoint is
        intentionally relationship-only: it never accepts prototype HTML,
        design-policy text, test output, credentials, or a URL for the service
        to fetch. FuzeX is the source of the trace link; FuzeQuality records
        whether that link is active and emits its own verified or revoked
        lifecycle event for downstream consumers.


        Callers authenticate with the FuzeQuality service token. The tenant ID
        is part of the event key and must be a UUID, so an event cannot be
        accidentally projected into an unscoped legacy tenant.
      tags: [worker-design-traceability]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignTestLinkLifecycleEvent' }
      responses:
        '202':
          description: The design-test relationship was accepted; `changed` is false for an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalAcceptedChange' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/repositories/{repositoryId}/scan-history:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listRepositoryScanHistory
      summary: List tenant-scoped repository analysis runs
      description: >-
        Returns immutable repository-analysis revisions in newest-first order.
        Continuation uses the stored scan timestamp and stable revision-row ID,
        so concurrent scans cannot make an existing page grow without bound.
      tags: [repository-analysis]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: A bounded page of repository analysis history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RepositoryScanHistoryEntry' }
                  page:
                    type: object
                    additionalProperties: false
                    required: [nextCursor, hasMore]
                    properties:
                      nextCursor: { type: string, nullable: true }
                      hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/quality-artifacts:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listRepositoryQualityArtifacts
      summary: List repository evidence for reviewed analysis
      description: >-
        Returns a bounded, exact-revision evidence inventory. The portal follows
        continuation cursors before presenting reviewed UX-flow and policy/gate
        evidence; the internal repository-analysis worker retains its full,
        service-authenticated exact-revision endpoint.
      tags: [repository-analysis]
      security: [{ platformBearer: [] }]
      parameters:
        - name: revision
          in: query
          description: Exact catalog revision; defaults to the repository's current analyzed revision.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding page; it pins implicit current-revision reads to the first page's analyzed revision.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: A bounded page of repository evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QualityArtifact' }
                  page:
                    type: object
                    additionalProperties: false
                    required: [nextCursor, hasMore]
                    properties:
                      nextCursor: { type: string, nullable: true }
                      hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/quality-artifacts/by-ids:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: resolveRepositoryQualityArtifacts
      summary: Resolve exact repository evidence identifiers
      description: >-
        Resolves a bounded set of revision-scoped artifact identifiers through
        the caller's tenant boundary without scanning complete artifact pages.
      tags: [repository-analysis]
      security: [{ platformBearer: [] }]
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Tenant-scoped evidence matching the requested identifiers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QualityArtifact' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/flow-candidates:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listRepositoryFlowCandidates
      summary: List tenant-scoped, reviewable UX-flow candidates
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [deterministic, litellm] }
        - name: status
          in: query
          schema: { type: string, enum: [proposed, confirmed, rejected] }
        - name: revision
          in: query
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: model
          in: query
          description: Exact FuzeInfra LiteLLM model identity stored with the proposal.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: promptVersion
          in: query
          description: Exact reviewed analysis prompt version.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: schemaVersion
          in: query
          description: Exact structured-output schema version.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: limit
          in: query
          description: Maximum number of candidates to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: UX-flow candidates discovered for the repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repositories/{repositoryId}/flow-candidates/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: getRepositoryFlowCandidate
      summary: Inspect one tenant-scoped UX-flow candidate and its wireframe
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: The exact revisioned flow candidate requested by the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repositories/{repositoryId}/flow-candidates/{candidateId}/review:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: reviewRepositoryFlowCandidate
      summary: Confirm or reject a detected UX-flow candidate
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, rejected] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: The reviewed candidate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The candidate is not from the repository current analyzed revision and cannot be reviewed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaleFlowCandidateError' }

  /api/v1/repositories/{repositoryId}/flow-candidates/{candidateId}/history:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: listRepositoryFlowReviewHistory
      summary: List immutable human review decisions for a UX-flow candidate
      tags: [flow-candidates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding review-history page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Newest-first review history for the tenant-owned candidate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RepositoryFlowReviewHistoryEntry' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/repositories/{repositoryId}/analysis-status:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    post:
      operationId: recordRepositoryAnalysisStatus
      summary: Record the revision-scoped FuzeInfra LiteLLM review lifecycle
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, status]
              properties:
                revision: { type: string, minLength: 1, maxLength: 500 }
                status: { type: string, enum: [queued, running, complete, failed] }
                startedAt: { type: string, format: date-time }
                finishedAt: { type: string, format: date-time }
                errorCode: { type: string, enum: [INTELLIGENCE_UNAVAILABLE] }
                counts:
                  type: object
                  additionalProperties: false
                  required: [deterministic, evaluations, proposed]
                  properties:
                    deterministic: { type: integer, minimum: 0 }
                    evaluations: { type: integer, minimum: 0 }
                    proposed: { type: integer, minimum: 0 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/repositories/{repositoryId}/policy-gate-evaluations:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listInternalPolicyGateEvaluations
      summary: Read policy/gate findings for a repository analysis worker
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/PolicyGateFindingKind' }
        - name: severity
          in: query
          schema: { type: string, enum: [high, medium, low] }
        - name: reviewStatus
          in: query
          schema: { type: string, enum: [proposed, accepted, dismissed] }
        - name: revision
          in: query
          description: Exact reviewed repository-analysis revision.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: limit
          in: query
          description: Maximum number of worker-visible evaluations to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding worker page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Policy/gate evaluations for the repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGateEvaluation' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/policy-gate-evaluations:
    post:
      operationId: ingestPolicyGateEvaluations
      summary: Persist policy/gate evaluations produced by an analysis worker
      tags: [worker-intelligence]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evaluations]
              properties:
                evaluations:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/PolicyGateEvaluationInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listPolicyGateEvaluations
      summary: List tenant-scoped policy/gate findings and their current review state
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
        - name: severity
          in: query
          schema: { type: string, enum: [high, medium, low] }
        - name: reviewStatus
          in: query
          schema: { type: string, enum: [proposed, accepted, dismissed] }
        - name: revision
          in: query
          description: Exact repository analysis revision that produced the finding.
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: limit
          in: query
          description: Maximum number of evaluations to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Policy/gate evaluations for the repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGateEvaluation' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations/{evaluationId}/review:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/EvaluationId'
    post:
      operationId: reviewPolicyGateEvaluation
      summary: Accept or dismiss a policy/gate recommendation
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [accepted, dismissed] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: The evaluation with its updated review state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGateEvaluation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The finding is not from the repository current analyzed revision and cannot be reviewed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StalePolicyGateEvaluationError' }

  /api/v1/repositories/{repositoryId}/policy-gate-evaluations/{evaluationId}/history:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/EvaluationId'
    get:
      operationId: listPolicyGateReviewHistory
      summary: List the immutable review history for a policy/gate evaluation
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding review-history page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Review events in reverse chronological order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGateReviewHistoryEntry' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/internal/test-executions:
    post:
      operationId: ingestTestExecution
      summary: Ingest CI, integration, post-production, load, or stress evidence
      tags: [worker-executions]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestExecutionInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Policy/gate references cannot be proven against the execution's exact analyzed revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionEvidenceConflict' }

  /api/v1/repositories/{repositoryId}/processing-status:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: getRepositoryProcessingStatus
      summary: Read current scan and reviewed-analysis lifecycle state
      description: >-
        Tenant-scoped lightweight status used while a repository scan or FuzeInfra LiteLLM
        review is active. It excludes repository configuration and installation metadata.
      tags: [repositories]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: Current repository processing lifecycle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryProcessingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/analysis-retries:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    post:
      operationId: retryRepositoryAnalysis
      summary: Requeue failed reviewed analysis for the exact current revision
      description: >-
        Uses the durable outbox to retry deterministic governance and FuzeInfra LiteLLM review
        without checking out or rescanning the repository. Only failed current-revision analysis is retryable.
      tags: [repositories]
      security: [{ platformBearer: [] }]
      responses:
        '202':
          description: Analysis was durably requeued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryProcessingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The repository has no failed current-revision analysis to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/repositories/{repositoryId}/test-executions:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listTestExecutions
      summary: List filtered test-execution evidence for a repository
      tags: [executions]
      security: [{ platformBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ExecutionKind'
        - $ref: '#/components/parameters/ExecutionStatus'
        - $ref: '#/components/parameters/ExecutionProvider'
        - $ref: '#/components/parameters/ExecutionRevision'
        - $ref: '#/components/parameters/ExecutionWorkflowPath'
        - $ref: '#/components/parameters/ExecutionFrom'
        - $ref: '#/components/parameters/ExecutionUntil'
        - name: limit
          in: query
          description: Maximum number of immutable execution records to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by the preceding execution page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Matching execution evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TestExecution' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/performance-test-executions/latest:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listLatestPerformanceTestExecutions
      summary: Read the latest execution for every current reviewed load or stress workflow
      description: >-
        Resolves workflow paths only from the repository current analyzed load/stress artifacts,
        then returns at most one latest execution per path. This read model is independent of
        the mixed execution-history page so unrelated CI runs cannot hide performance evidence.
      tags: [executions]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: Latest load/stress execution evidence keyed by reviewed workflow path.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TestExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/integration-test-executions/latest:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listLatestIntegrationTestExecutions
      summary: Read the latest execution for every current detected integration workflow
      description: >-
        Resolves workflow paths only from the repository current analyzed integration-test
        artifacts, then returns at most one latest execution per path. This read model is
        independent of mixed execution-history filters and pagination.
      tags: [executions]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: Latest integration execution evidence keyed by detected workflow path.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TestExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/post-production-test-executions/latest:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listLatestPostProductionTestExecutions
      summary: Read the latest execution for every current detected post-production workflow
      description: >-
        Resolves workflow paths only from the repository current analyzed post-production
        artifacts, then returns at most one latest execution per path. This read model is
        independent of mixed execution-history filters and pagination.
      tags: [executions]
      security: [{ platformBearer: [] }]
      responses:
        '200':
          description: Latest post-production execution evidence keyed by detected workflow path.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TestExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/execution-performance:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listExecutionPerformance
      summary: Aggregate execution outcomes by explicit policy/gate pair
      tags: [executions]
      security: [{ platformBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ExecutionKind'
        - $ref: '#/components/parameters/ExecutionStatus'
        - $ref: '#/components/parameters/ExecutionProvider'
        - $ref: '#/components/parameters/ExecutionRevision'
        - $ref: '#/components/parameters/ExecutionWorkflowPath'
        - $ref: '#/components/parameters/ExecutionFrom'
        - $ref: '#/components/parameters/ExecutionUntil'
        - name: limit
          in: query
          description: Maximum number of policy-gate aggregate rows to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque aggregate cursor returned by the preceding page; it retains the first page's execution snapshot boundary.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Policy/gate outcome aggregates for the filtered evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGatePerformance' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/execution-trend:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
    get:
      operationId: listExecutionOutcomeTrend
      summary: Aggregate filtered execution outcomes by UTC day
      description: Returns immutable daily aggregates across the complete filtered execution history, independently of execution-row pagination.
      tags: [executions]
      security: [{ platformBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ExecutionKind'
        - $ref: '#/components/parameters/ExecutionStatus'
        - $ref: '#/components/parameters/ExecutionProvider'
        - $ref: '#/components/parameters/ExecutionRevision'
        - $ref: '#/components/parameters/ExecutionWorkflowPath'
        - $ref: '#/components/parameters/ExecutionFrom'
        - $ref: '#/components/parameters/ExecutionUntil'
        - name: limit
          in: query
          description: Maximum number of UTC-day aggregates to return in this page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque day cursor returned by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Daily outcomes ordered from newest to oldest.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionOutcomeTrend' }
                  page: { $ref: '#/components/schemas/HistoryCursorPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/performance-tests/{artifactId}/execute:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - name: artifactId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 500 }
    post:
      operationId: executePerformanceTest
      summary: Dispatch a scanner-verified workflow_dispatch load or stress test at its immutable analyzed commit
      tags: [executions]
      security: [{ platformBearer: [] }]
      responses:
        '202':
          description: The performance workflow was dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceDispatch' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The current catalog is not bound to an immutable analyzed source commit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: The definition is inventory-only, the GitHub App installation is unavailable, or dispatch failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  securitySchemes:
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: FuzeFront access token; tenant identity and endpoint permission are verified by FuzeFront Security.
    serviceToken:
      type: http
      scheme: bearer
      description: Cluster-internal FuzeQuality worker token.
  parameters:
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 500 }
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExecutionKind:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/ExecutionKind' }
    ExecutionStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ExecutionStatus' }
    ExecutionProvider:
      name: provider
      in: query
      description: Execution-ingestion origin.
      schema: { $ref: '#/components/schemas/ExecutionProvider' }
    ExecutionRevision:
      name: revision
      in: query
      description: Exact source revision recorded with the execution evidence.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ExecutionWorkflowPath:
      name: workflowPath
      in: query
      description: Exact repository-relative workflow path recorded with the execution evidence.
      schema: { type: string, minLength: 1, maxLength: 1000 }
    ExecutionFrom:
      name: from
      in: query
      description: Inclusive lower timestamp bound. Must not be later than `until`.
      schema: { type: string, format: date-time }
    ExecutionUntil:
      name: until
      in: query
      description: Inclusive upper timestamp bound. Must not be earlier than `from`.
      schema: { type: string, format: date-time }
  responses:
    Accepted:
      description: Accepted for persistence or asynchronous processing.
      content:
        application/json:
          schema:
            type: object
            required: [accepted]
            properties:
              accepted: { type: boolean, enum: [true] }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The caller lacks the required FuzeFront permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The tenant-scoped repository or requested evidence does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: The request body, path, or query parameters are invalid.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                description: Zod validation error details.
                type: object
                additionalProperties: true
  schemas:
    QualityArtifactExecutionTarget:
      type: object
      additionalProperties: false
      required: [provider, workflowPath, trigger]
      properties:
        provider: { type: string, enum: [github-actions] }
        workflowPath: { type: string, minLength: 1 }
        trigger: { type: string, enum: [workflow_dispatch] }
        requiredInputs:
          type: array
          items: { type: string }
    QualityArtifact:
      type: object
      additionalProperties: false
      required: [id, repositoryId, kind, title, sourcePath, summary, evidence]
      properties:
        id: { type: string, minLength: 1 }
        repositoryId: { type: string, format: uuid }
        kind:
          type: string
          enum: [route, story, documentation, policy, gate, test-plan, integration-test, post-production-test, load-test, stress-test]
        title: { type: string }
        sourcePath: { type: string }
        summary: { type: string }
        evidence:
          type: array
          items: { type: string }
        execution: { $ref: '#/components/schemas/QualityArtifactExecutionTarget' }
    RepositoryScanCounts:
      type: object
      additionalProperties: false
      required: [operations, surfaces, tests, diagnostics]
      properties:
        operations: { type: integer, minimum: 0 }
        surfaces: { type: integer, minimum: 0 }
        tests: { type: integer, minimum: 0 }
        diagnostics: { type: integer, minimum: 0 }
    RepositoryScanHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, revision, branch, status, trigger, counts]
      properties:
        id: { type: string, format: uuid }
        revision: { type: string, minLength: 1 }
        branch: { type: string, minLength: 1 }
        status: { type: string, enum: [never, queued, scanning, complete, failed] }
        scannedAt: { type: string, format: date-time }
        trigger: { type: string, enum: [manual, push, reconcile] }
        counts: { $ref: '#/components/schemas/RepositoryScanCounts' }
    RepositoryScanHistoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RepositoryScanHistoryEntry' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    RepositoryProcessingStatus:
      type: object
      additionalProperties: false
      required: [id, lastScanStatus]
      properties:
        id: { type: string, format: uuid }
        lastScanAt: { type: string, format: date-time }
        lastScanRevision: { type: string }
        lastScanStatus: { type: string, enum: [never, queued, running, complete, failed] }
        lastScanDetails:
          type: object
          additionalProperties: true
        lastAnalysis:
          type: object
          additionalProperties: false
          required: [revision, status]
          properties:
            revision: { type: string }
            status: { type: string, enum: [queued, running, complete, failed] }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            errorCode: { type: string, enum: [INTELLIGENCE_UNAVAILABLE] }
            counts:
              type: object
              additionalProperties: false
              required: [deterministic, evaluations, proposed]
              properties:
                deterministic: { type: integer, minimum: 0 }
                evaluations: { type: integer, minimum: 0 }
                proposed: { type: integer, minimum: 0 }
    FlowStep:
      type: object
      required: [actor, action, expectedOutcome, targetIds]
      properties:
        actor: { type: string }
        action: { type: string }
        expectedOutcome: { type: string }
        targetIds:
          type: array
          items: { type: string }
    FlowWireframe:
      type: object
      required: [kind, nodes]
      properties:
        kind: { type: string, enum: [sequence] }
        nodes:
          type: array
          items:
            type: object
            required: [label, targetIds]
            properties:
              label: { type: string }
              targetIds:
                type: array
                items: { type: string }
    RepositoryFlowCandidate:
      type: object
      required: [id, repositoryId, tenantId, revision, title, confidence, evidence, steps, wireframe, status, source, createdAt]
      properties:
        id: { type: string }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string }
        revision: { type: string }
        title: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/FlowStep' }
        wireframe: { $ref: '#/components/schemas/FlowWireframe' }
        status: { type: string, enum: [proposed, confirmed, rejected] }
        reviewedAt: { type: string, format: date-time }
        reviewedBy: { type: string }
        reviewReason: { type: string }
        analysis: { $ref: '#/components/schemas/RepositoryFlowAnalysisProvenance' }
        source: { type: string, enum: [deterministic, litellm] }
        createdAt: { type: string, format: date-time }
    RepositoryFlowCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    RepositoryFlowAnalysisProvenance:
      type: object
      additionalProperties: false
      required: [provider, model, promptVersion, schemaVersion]
      properties:
        provider: { type: string, enum: [fuzeinfra-litellm] }
        model: { type: string }
        promptVersion: { type: string }
        schemaVersion: { type: string }
    RepositoryFlowReviewHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, candidateId, tenantId, status, reviewedBy, createdAt]
      properties:
        id: { type: string }
        candidateId: { type: string }
        tenantId: { type: string }
        status: { type: string, enum: [confirmed, rejected] }
        reviewedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    PolicyGateFindingKind:
      type: string
      enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
    PolicyGateEvidencePassage:
      type: object
      additionalProperties: false
      required: [artifactId, sourcePath, text, signal]
      properties:
        artifactId: { type: string, minLength: 1, maxLength: 500 }
        sourcePath: { type: string, minLength: 1, maxLength: 1000 }
        text: { type: string, minLength: 1, maxLength: 2000 }
        signal:
          type: string
          enum: [policy, gate, obligation, prohibition, ambiguous]
    PolicyGateEvaluationInput:
      type: object
      additionalProperties: false
      required: [id, repositoryId, tenantId, revision, kind, severity, title, detail, policyArtifactIds, gateArtifactIds, confidence, scope, recommendation, reviewStatus, createdAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 200 }
        revision: { type: string, minLength: 1, maxLength: 500 }
        kind:
          type: string
          enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
        severity: { type: string, enum: [high, medium, low] }
        title: { type: string, minLength: 1, maxLength: 500 }
        detail: { type: string, minLength: 1, maxLength: 5000 }
        policyArtifactIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        gateArtifactIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        scope:
          type: object
          additionalProperties: false
          required: [sourcePaths, subjects]
          properties:
            sourcePaths:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 1000 }
            subjects:
              type: array
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 200 }
        evidencePassages:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/PolicyGateEvidencePassage' }
        recommendation: { type: string, minLength: 1, maxLength: 5000 }
        reviewStatus: { type: string, enum: [proposed] }
        createdAt: { type: string, format: date-time }
    PolicyGateEvaluation:
      type: object
      required: [id, repositoryId, tenantId, revision, kind, severity, title, detail, policyArtifactIds, gateArtifactIds, confidence, scope, recommendation, reviewStatus, createdAt]
      properties:
        id: { type: string }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string }
        revision: { type: string }
        kind:
          type: string
          enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
        severity: { type: string, enum: [high, medium, low] }
        title: { type: string }
        detail: { type: string }
        policyArtifactIds:
          type: array
          items: { type: string }
        gateArtifactIds:
          type: array
          items: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        scope:
          type: object
          additionalProperties: false
          required: [sourcePaths, subjects]
          properties:
            sourcePaths:
              type: array
              minItems: 1
              items: { type: string }
            subjects:
              type: array
              items: { type: string }
        evidencePassages:
          type: array
          items: { $ref: '#/components/schemas/PolicyGateEvidencePassage' }
        recommendation: { type: string }
        reviewStatus: { type: string, enum: [proposed, accepted, dismissed] }
        reviewedAt: { type: string, format: date-time }
        reviewedBy: { type: string }
        reviewReason: { type: string }
        createdAt: { type: string, format: date-time }
    PolicyGateEvaluationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyGateEvaluation' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    HistoryCursorPage:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Opaque continuation cursor; null when no later page exists.
        hasMore: { type: boolean }
    PolicyGateReviewHistoryEntry:
      type: object
      required: [id, evaluationId, tenantId, status, reviewedBy, createdAt]
      properties:
        id: { type: string }
        evaluationId: { type: string }
        tenantId: { type: string }
        status: { type: string, enum: [accepted, dismissed] }
        reviewedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    ExecutionKind:
      type: string
      enum: [ci, integration, post-production, load, stress]
    ExecutionStatus:
      type: string
      enum: [passed, failed, cancelled, running]
    ExecutionProvider:
      type: string
      enum: [github-actions, external]
    TestExecutionThresholdInput:
      type: object
      additionalProperties: false
      required: [metric, observed, operator, target]
      properties:
        metric: { type: string, minLength: 1, maxLength: 200 }
        observed: { type: number }
        unit: { type: string, minLength: 1, maxLength: 50 }
        operator: { type: string, enum: [lt, lte, gt, gte, eq] }
        target: { type: number }
    TestExecutionThreshold:
      type: object
      additionalProperties: false
      required: [metric, observed, operator, target, passed]
      properties:
        metric: { type: string, minLength: 1, maxLength: 200 }
        observed: { type: number }
        unit: { type: string, minLength: 1, maxLength: 50 }
        operator: { type: string, enum: [lt, lte, gt, gte, eq] }
        target: { type: number }
        passed: { type: boolean }
    TestExecutionGateEvaluation:
      type: object
      additionalProperties: false
      required: [policyArtifactId, gateArtifactId, status]
      properties:
        policyArtifactId: { type: string, minLength: 1, maxLength: 500 }
        gateArtifactId: { type: string, minLength: 1, maxLength: 500 }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        detail: { type: string, minLength: 1, maxLength: 1000 }
    TestExecutionEvidenceLink:
      type: object
      additionalProperties: false
      required: [kind, name, url]
      properties:
        kind: { type: string, enum: [video, report, trace, screenshot, log, other] }
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
    TestExecutionInput:
      type: object
      additionalProperties: false
      required: [repositoryId, tenantId, revision, kind, status, name]
      properties:
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1 }
        provider: { type: string, enum: [github-actions, external], default: external }
        externalRunId: { type: string, minLength: 1, maxLength: 500 }
        attempt: { type: integer, minimum: 1, default: 1 }
        revision: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/ExecutionKind' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        name: { type: string, minLength: 1, maxLength: 500 }
        workflowPath: { type: string, minLength: 1, maxLength: 1000 }
        sourceUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        policyArtifactIds:
          type: array
          maxItems: 100
          default: []
          items: { type: string }
        gateArtifactIds:
          type: array
          maxItems: 100
          default: []
          items: { type: string }
        gateEvaluations:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/TestExecutionGateEvaluation' }
        thresholds:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/TestExecutionThresholdInput' }
        evidenceLinks:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/TestExecutionEvidenceLink' }
        summary: { type: string, maxLength: 5000 }
    ExecutionEvidenceConflict:
      type: object
      additionalProperties: false
      required: [ok, code, error]
      properties:
        ok: { type: boolean, enum: [false] }
        code:
          type: string
          enum: [EXECUTION_EVIDENCE_REVISION_UNANALYZED, EXECUTION_EVIDENCE_REFERENCE_INVALID]
        error: { type: string }
        invalidPolicyArtifactIds:
          type: array
          items: { type: string }
        invalidGateArtifactIds:
          type: array
          items: { type: string }
    TestExecution:
      type: object
      required: [id, repositoryId, tenantId, provider, externalRunId, attempt, revision, kind, status, name, policyArtifactIds, gateArtifactIds, gateEvaluations, thresholds, evidenceLinks]
      properties:
        id: { type: string }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string }
        provider: { type: string, enum: [github-actions, external] }
        externalRunId: { type: string }
        attempt: { type: integer, minimum: 1 }
        revision: { type: string }
        kind: { $ref: '#/components/schemas/ExecutionKind' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        name: { type: string }
        workflowPath: { type: string }
        sourceUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        policyArtifactIds:
          type: array
          items: { type: string }
        gateArtifactIds:
          type: array
          items: { type: string }
        gateEvaluations:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionGateEvaluation' }
        thresholds:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionThreshold' }
        evidenceLinks:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionEvidenceLink' }
        summary: { type: string }
    TestExecutionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestExecution' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    DesignTestLinkTargetKind:
      type: string
      enum: [flow-step, frame, component]
      description: The kind of FuzeX design target identified by `targetRef`.
    DesignTestLinkLifecycleEvent:
      oneOf:
        - $ref: '#/components/schemas/DesignTestLinkUpsertEvent'
        - $ref: '#/components/schemas/DesignTestLinkRemovedEvent'
      discriminator:
        propertyName: type
        mapping:
          design-test-link.upsert: '#/components/schemas/DesignTestLinkUpsertEvent'
          design-test-link.removed: '#/components/schemas/DesignTestLinkRemovedEvent'
    DesignTestLinkUpsertEvent:
      type: object
      additionalProperties: false
      required: [type, tenantId, traceLinkId, fuzexProjectId, targetKind, targetRef, testCaseId]
      properties:
        type: { type: string, enum: [design-test-link.upsert] }
        tenantId: { type: string, format: uuid }
        traceLinkId: { type: string, minLength: 1, maxLength: 200 }
        fuzexProjectId: { type: string, minLength: 1, maxLength: 200 }
        targetKind: { $ref: '#/components/schemas/DesignTestLinkTargetKind' }
        targetRef: { type: string, minLength: 1, maxLength: 1000 }
        testCaseId: { type: string, minLength: 1, maxLength: 500 }
    DesignTestLinkRemovedEvent:
      type: object
      additionalProperties: false
      required: [type, tenantId, traceLinkId, fuzexProjectId, targetKind, targetRef, testCaseId]
      properties:
        type: { type: string, enum: [design-test-link.removed] }
        tenantId: { type: string, format: uuid }
        traceLinkId: { type: string, minLength: 1, maxLength: 200 }
        fuzexProjectId: { type: string, minLength: 1, maxLength: 200 }
        targetKind: { $ref: '#/components/schemas/DesignTestLinkTargetKind' }
        targetRef: { type: string, minLength: 1, maxLength: 1000 }
        testCaseId: { type: string, minLength: 1, maxLength: 500 }
    InternalAcceptedChange:
      type: object
      additionalProperties: false
      required: [accepted, changed]
      properties:
        accepted: { type: boolean, enum: [true] }
        changed:
          type: boolean
          description: False when the received lifecycle event was an idempotent replay.
    PolicyGatePerformance:
      type: object
      required: [repositoryId, policyArtifactId, gateArtifactId, passed, failed, cancelled, running]
      properties:
        repositoryId: { type: string }
        policyArtifactId: { type: string }
        policyTitle: { type: string }
        policySourcePath: { type: string }
        gateArtifactId: { type: string }
        gateTitle: { type: string }
        gateSourcePath: { type: string }
        revisionCount: { type: integer, minimum: 0 }
        latestRevision: { type: string }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        latestCompletedAt: { type: string, format: date-time }
    ExecutionOutcomeTrend:
      type: object
      additionalProperties: false
      required: [date, passed, failed, cancelled, running]
      properties:
        date: { type: string, format: date }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
    PerformanceDispatch:
      type: object
      required: [status, artifactId, workflowPath, ref, sourceRevision]
      properties:
        status: { type: string, enum: [dispatched] }
        artifactId: { type: string }
        workflowPath: { type: string }
        ref: { type: string }
        sourceRevision: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        code: { type: string }
    StaleFlowCandidateError:
      type: object
      additionalProperties: false
      required: [error, code, candidateRevision, currentRevision]
      properties:
        error: { type: string }
        code: { type: string, enum: [STALE_FLOW_CANDIDATE] }
        candidateRevision: { type: string }
        currentRevision: { type: string, nullable: true }
    StalePolicyGateEvaluationError:
      type: object
      additionalProperties: false
      required: [error, code, evaluationRevision, currentRevision]
      properties:
        error: { type: string }
        code: { type: string, enum: [STALE_POLICY_GATE_EVALUATION] }
        evaluationRevision: { type: string }
        currentRevision: { type: string, nullable: true }
    Health:
      type: object
      required: [status, service, version, openapi]
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            `ok` means the process is serving. It is deliberately NOT downgraded
            by a missing spec — the service is still correct and serving is more
            useful than crash-looping — the `openapi` field carries that signal.
        service:
          type: string
          example: fuzequality
        version:
          type: string
          description: The contract version this build implements.
          example: 0.1.0
        openapi:
          type: string
          enum: [available, unavailable]
          description: >-
            Whether the OpenAPI document was found and parsed at boot.
            `unavailable` means /openapi.yaml and /openapi.json answer 503.
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: openapi_unavailable
        message:
          type: string

tags:
  - name: operations
    description: Platform operational surface — probes and contract discovery.
  - name: flow-candidates
    description: Tenant-authorized review of detected UX-flow candidates.
  - name: policy-gates
    description: Tenant-authorized policy/gate governance and review history.
  - name: executions
    description: Tenant-authorized test evidence, performance aggregation, and controlled dispatch.
  - name: worker-intelligence
    description: Cluster-internal repository analysis worker operations.
  - name: worker-design-traceability
    description: Cluster-internal FuzeX design-to-test traceability projections.
  - name: worker-executions
    description: Cluster-internal execution-evidence ingestion.
