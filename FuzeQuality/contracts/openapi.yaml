      - $ref: '#/components/parameters/RepositoryId'
      - name: artifactId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 500 }
    post:
      operationId: executeTestSuite
      summary: Dispatch a scanner-verified integration, post-production, load, or stress workflow at its immutable analyzed commit
      tags: [executions]
      security: [{ platformBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDispatchRequest' }
      responses:
        '202':
          description: The reviewed test workflow was dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSuiteDispatch' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The current catalog is not bound to an immutable analyzed source commit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: The suite is inventory-only, is a lower-priority alias of a shared workflow, supplied inputs do not exactly match the analyzed required inputs, the GitHub App installation is unavailable, or dispatch failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Dispatch audit storage was unavailable, so no provider dispatch was attempted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/repositories/{repositoryId}/test-suites/{artifactId}/dispatches:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - name: artifactId
        in: path
        required: true
        description: Current observation identity or stable logical workflow identity.
        schema: { type: string, minLength: 1, maxLength: 500 }
    get:
      operationId: listTestSuiteDispatchHistory
      summary: Read the immutable controlled-dispatch audit for one reviewed suite
      description: >-
        Returns tenant-scoped dispatch attempts from newest to oldest. Continuation cursors use
        immutable request time and dispatch identity, so retries arriving between pages do not
        duplicate or skip retained attempts. A durable audit remains addressable by the artifact
        identity in its latest receipt after a later repository scan removes the workflow. Stable
        logical identities avoid revision-sized catalog scans; legacy observation identities are
        resolved through a bounded tenant-scoped dispatch lookup. Input values are never persisted
        or returned.
      tags: [executions]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque dispatch cursor returned by the preceding page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Controlled dispatch attempts ordered newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSuiteDispatchAuditPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/repositories/{repositoryId}/performance-tests/{artifactId}/execute:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - name: artifactId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 500 }
    post:
      operationId: executePerformanceTest
      summary: Dispatch a scanner-verified workflow_dispatch load or stress test at its immutable analyzed commit
      tags: [executions]
      security: [{ platformBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDispatchRequest' }
      responses:
        '202':
          description: The performance workflow was dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceDispatch' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The current catalog is not bound to an immutable analyzed source commit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: The definition is inventory-only, is a lower-priority alias of a shared workflow, supplied inputs do not exactly match the analyzed required inputs, the GitHub App installation is unavailable, or dispatch failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: Dispatch audit storage was unavailable, so no provider dispatch was attempted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  securitySchemes:
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: FuzeFront access token; tenant identity and endpoint permission are verified by FuzeFront Security.
    serviceToken:
      type: http
      scheme: bearer
      description: Cluster-internal FuzeQuality worker token.
  parameters:
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 500 }
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionKind:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/ExecutionKind' }
    ExecutionStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ExecutionStatus' }
    ExecutionProvider:
      name: provider
      in: query
      description: Execution-ingestion origin.
      schema: { $ref: '#/components/schemas/ExecutionProvider' }
    ExecutionName:
      name: name
      in: query
      description: Exact normalized suite or workflow name retained with the execution evidence.
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionEvidenceKind:
      name: evidenceKind
      in: query
      description: Require at least one retained execution attachment of this kind.
      schema: { type: string, enum: [video, report, trace, screenshot, log, other] }
    ExecutionEvidenceCollectionStatus:
      name: evidenceCollectionStatus
      in: query
      description: Require a provider artifact-discovery outcome, or `not-collected` for executions with no retained collection attempt.
      schema: { type: string, enum: [complete, partial, unavailable, not-collected] }
    ExecutionEvidenceCheckedAfter:
      name: evidenceCheckedAfter
      in: query
      description: Require a retained provider artifact check at or after this ISO-8601 instant; executions never checked are excluded.
      schema: { type: string, format: date-time }
    ExecutionEvidenceCheckedBefore:
      name: evidenceCheckedBefore
      in: query
      description: Require a retained provider artifact check at or before this ISO-8601 instant; executions never checked are excluded.
      schema: { type: string, format: date-time }
    ExecutionEvidenceRequirement:
      name: evidenceRequirement
      in: query
      description: Select executions missing evidence required for a reviewed quality claim. Invalid URL finds retained artifact links that are malformed or do not use HTTPS. Policy–gate outcome requires an explicit retained pair or an unambiguous legacy one-policy/one-gate association. Performance thresholds apply only to load and stress executions. Terminal timing requires both start and completion timestamps for a non-running execution.
      schema: { type: string, enum: [evidence-url-invalid, policy-gate-outcome-missing, post-production-video-missing, performance-threshold-missing, terminal-timing-missing] }
    ExecutionThresholdOutcome:
      name: thresholdOutcome
      in: query
      description: Require at least one retained threshold measurement with this evaluated outcome.
      schema: { type: string, enum: [passed, failed] }
    ExecutionGateOutcome:
      name: gateOutcome
      in: query
      description: Require retained policy-gate evaluation evidence with this outcome. When policyArtifactId or gateArtifactId is supplied, the outcome must belong to that selected policy, gate, or exact pair rather than another evaluation in the same execution. Legacy one-policy/one-gate executions use the execution outcome.
      schema: { $ref: '#/components/schemas/ExecutionStatus' }
    ExecutionExternalRunId:
      name: externalRunId
      in: query
      description: Exact provider-owned run identifier shared by all attempts of one CI run.
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionAttemptProvider:
      name: provider
      in: query
      required: true
      description: Required execution-ingestion origin for one provider-owned attempt history.
      schema: { $ref: '#/components/schemas/ExecutionProvider' }
    ExecutionAttemptExternalRunId:
      name: externalRunId
      in: query
      required: true
      description: Required provider-owned run identifier shared by every returned attempt.
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionPolicyArtifactId:
      name: policyArtifactId
      in: query
      description: Repository policy observation or stable logical identity. Equivalent observations across revisions are included.
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionGateArtifactId:
      name: gateArtifactId
      in: query
      description: Repository gate observation or stable logical identity. Equivalent observations across revisions are included.
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionBranch:
      name: branch
      in: query
      description: Exact provider-owned source branch recorded with the execution evidence.
      schema: { type: string, minLength: 1, maxLength: 500 }
    ExecutionRevision:
      name: revision
      in: query
      description: Exact source revision recorded with the execution evidence.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ExecutionWorkflowPath:
      name: workflowPath
      in: query
      description: Exact repository-relative workflow path recorded with the execution evidence. A provider-qualified GitHub `@ref` suffix is accepted and removed before matching history, trends, and policy-gate performance.
      schema: { type: string, minLength: 1, maxLength: 1000 }
    ExecutionAttemptScope:
      name: attemptScope
      in: query
      description: Restrict execution evidence to original attempts, provider reruns, or passed retries backed by a retained earlier failure for the same provider run.
      schema: { type: string, enum: [initial, retry, recovered] }
    ExecutionMinimumDurationMs:
      name: minimumDurationMs
      in: query
      description: Restrict evidence to completed executions whose valid duration is at least this many milliseconds.
      schema: { type: integer, minimum: 0, maximum: 2147483647 }
    ExecutionMaximumDurationMs:
      name: maximumDurationMs
      in: query
      description: Restrict evidence to completed executions whose valid duration is at most this many milliseconds. Must be greater than or equal to minimumDurationMs when both are supplied.
      schema: { type: integer, minimum: 0, maximum: 2147483647 }
    ExecutionFrom:
      name: from
      in: query
      description: Inclusive lower timestamp bound. Must not be later than `until`.
      schema: { type: string, format: date-time }
    ExecutionUntil:
      name: until
      in: query
      description: Inclusive upper timestamp bound. Must not be earlier than `from`.
      schema: { type: string, format: date-time }
  responses:
    Accepted:
      description: Accepted for persistence or asynchronous processing.
      content:
        application/json:
          schema:
            type: object
            required: [accepted]
            properties:
              accepted: { type: boolean, enum: [true] }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The caller lacks the required FuzeFront permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The tenant-scoped repository or requested evidence does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: The request body, path, or query parameters are invalid.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                description: Zod validation error details.
                type: object
                additionalProperties: true
  schemas:
    RepositoryScanFailure:
      type: object
      additionalProperties: false
      required: [code, message, failedAt]
      properties:
        code: { type: string, enum: [SCAN_TRANSPORT_LIMIT_EXCEEDED, SCAN_PROCESSING_FAILED] }
        message: { type: string, minLength: 1, maxLength: 500 }
        sourceRevision: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
        observedBytes: { type: integer, minimum: 1 }
        maxBytes: { type: integer, minimum: 1 }
        failedAt: { type: string, format: date-time }
    QualityArtifactExecutionTarget:
      type: object
      additionalProperties: false
      required: [provider, workflowPath, trigger]
      properties:
        provider: { type: string, enum: [github-actions] }
        workflowPath: { type: string, minLength: 1 }
        trigger: { type: string, enum: [workflow_dispatch] }
        requiredInputs:
          type: array
          items: { type: string }
    QualityArtifact:
      type: object
      additionalProperties: false
      required: [id, repositoryId, kind, title, sourcePath, summary, evidence]
      properties:
        id: { type: string, minLength: 1 }
        logicalId:
          type: string
          minLength: 1
          description: Stable repository artifact identity shared by its revision-scoped observations.
        revision:
          type: string
          minLength: 1
          description: Catalog revision that owns this artifact observation.
        repositoryId: { type: string, format: uuid }
        kind:
          type: string
          enum: [route, story, documentation, policy, gate, test-plan, integration-test, post-production-test, load-test, stress-test]
        title: { type: string }
        sourcePath: { type: string }
        summary: { type: string }
        evidence:
          type: array
          items: { type: string }
        execution: { $ref: '#/components/schemas/QualityArtifactExecutionTarget' }
    RepositoryScanCounts:
      type: object
      additionalProperties: false
      required: [operations, surfaces, tests, diagnostics]
      properties:
        operations: { type: integer, minimum: 0 }
        surfaces: { type: integer, minimum: 0 }
        tests: { type: integer, minimum: 0 }
        diagnostics: { type: integer, minimum: 0 }
    RepositoryScanHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, revision, branch, status, trigger, counts]
      properties:
        id: { type: string, format: uuid }
        revision: { type: string, minLength: 1 }
        branch: { type: string, minLength: 1 }
        status: { type: string, enum: [never, queued, scanning, complete, failed] }
        scannedAt: { type: string, format: date-time }
        trigger: { type: string, enum: [manual, push, reconcile] }
        counts: { $ref: '#/components/schemas/RepositoryScanCounts' }
    RepositoryScanHistoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RepositoryScanHistoryEntry' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    RepositoryProcessingStatus:
      type: object
      additionalProperties: false
      required: [id, lastScanStatus]
      properties:
        id: { type: string, format: uuid }
        lastScanAt: { type: string, format: date-time }
        lastScanRevision: { type: string }
        lastScanStatus: { type: string, enum: [never, queued, running, complete, failed] }
        lastScanDetails:
          type: object
          additionalProperties: true
        lastScanFailure: { $ref: '#/components/schemas/RepositoryScanFailure' }
        lastAnalysis:
          type: object
          additionalProperties: false
          required: [revision, status]
          properties:
            revision: { type: string }
            status: { type: string, enum: [queued, running, complete, failed] }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            errorCode: { type: string, enum: [INTELLIGENCE_UNAVAILABLE, INTELLIGENCE_TIMEOUT] }
            counts:
              type: object
              additionalProperties: false
              required: [deterministic, evaluations, proposed]
              properties:
                deterministic: { type: integer, minimum: 0 }
                evaluations: { type: integer, minimum: 0 }
                proposed: { type: integer, minimum: 0 }
    FlowStep:
      type: object
      required: [actor, action, expectedOutcome, targetIds]
      properties:
        actor: { type: string }
        action: { type: string }
        expectedOutcome: { type: string }
        targetIds:
          type: array
          items: { type: string }
    FlowWireframe:
      type: object
      required: [kind, nodes]
      properties:
        kind: { type: string, enum: [sequence] }
        nodes:
          type: array
          minItems: 1
          items:
            type: object
            required: [label, targetIds]
            properties:
              label: { type: string }
              targetIds:
                type: array
                items: { type: string }
    RepositoryFlowCandidate:
      type: object
      required: [id, repositoryId, tenantId, revision, title, confidence, evidence, steps, wireframe, status, source, createdAt]
      properties:
        id: { type: string }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string }
        revision: { type: string }
        title: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { type: string }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FlowStep' }
        wireframe: { $ref: '#/components/schemas/FlowWireframe' }
        status: { type: string, enum: [proposed, confirmed, rejected] }
        reviewedAt: { type: string, format: date-time }
        reviewedBy: { type: string }
        reviewReason: { type: string }
        analysis: { $ref: '#/components/schemas/RepositoryFlowAnalysisProvenance' }
        source: { type: string, enum: [deterministic, litellm] }
        createdAt: { type: string, format: date-time }
    RepositoryFlowCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RepositoryFlowCandidate' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    RepositoryFlowAnalysisProvenance:
      type: object
      additionalProperties: false
      required: [provider, model, promptVersion, schemaVersion]
      properties:
        provider: { type: string, enum: [fuzeinfra-litellm] }
        model: { type: string }
        promptVersion: { type: string }
        schemaVersion: { type: string }
        inputArtifactCount: { type: integer, minimum: 0 }
        promptArtifactCount: { type: integer, minimum: 0 }
        promptTruncated: { type: boolean }
        grounding:
          type: object
          additionalProperties: false
          required: [referencedArtifactCount, groundedArtifactCount, rejectedArtifactCount, ungroundedStepCount]
          properties:
            referencedArtifactCount: { type: integer, minimum: 0 }
            groundedArtifactCount: { type: integer, minimum: 0 }
            rejectedArtifactCount: { type: integer, minimum: 0 }
            ungroundedStepCount: { type: integer, minimum: 0 }
    RepositoryFlowReviewHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, candidateId, tenantId, status, reviewedBy, createdAt]
      properties:
        id: { type: string }
        candidateId: { type: string }
        tenantId: { type: string }
        status: { type: string, enum: [confirmed, rejected] }
        reviewedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    PolicyGateFindingKind:
      type: string
      enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
    PolicyGateEvidencePassage:
      type: object
      additionalProperties: false
      required: [artifactId, sourcePath, text, signal]
      properties:
        artifactId: { type: string, minLength: 1, maxLength: 500 }
        sourcePath: { type: string, minLength: 1, maxLength: 1000 }
        text: { type: string, minLength: 1, maxLength: 2000 }
        signal:
          type: string
          enum: [policy, gate, obligation, prohibition, ambiguous]
    PolicyGateRemediationAction:
      type: string
      enum: [build-gate, build-policy, disambiguate-policy, align-policy-gate]
    PolicyGateEvaluationInput:
      type: object
      additionalProperties: false
      required: [id, repositoryId, tenantId, revision, kind, severity, title, detail, policyArtifactIds, gateArtifactIds, confidence, scope, remediationAction, recommendation, reviewStatus, createdAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 200 }
        revision: { type: string, minLength: 1, maxLength: 500 }
        kind:
          type: string
          enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
        severity: { type: string, enum: [high, medium, low] }
        title: { type: string, minLength: 1, maxLength: 500 }
        detail: { type: string, minLength: 1, maxLength: 5000 }
        policyArtifactIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        gateArtifactIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        scope:
          type: object
          additionalProperties: false
          required: [sourcePaths, subjects]
          properties:
            sourcePaths:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 1000 }
            subjects:
              type: array
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 200 }
        evidencePassages:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/PolicyGateEvidencePassage' }
        remediationAction: { $ref: '#/components/schemas/PolicyGateRemediationAction' }
        recommendation: { type: string, minLength: 1, maxLength: 5000 }
        reviewStatus: { type: string, enum: [proposed] }
        createdAt: { type: string, format: date-time }
    PolicyGateEvaluation:
      type: object
      required: [id, repositoryId, tenantId, revision, kind, severity, title, detail, policyArtifactIds, gateArtifactIds, confidence, scope, remediationAction, recommendation, reviewStatus, createdAt]
      properties:
        id: { type: string }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string }
        revision: { type: string }
        kind:
          type: string
          enum: [guarded-policy, unguarded-policy, guard-without-policy, contradictory-policy, ambiguous-policy]
        severity: { type: string, enum: [high, medium, low] }
        title: { type: string }
        detail: { type: string }
        policyArtifactIds:
          type: array
          items: { type: string }
        gateArtifactIds:
          type: array
          items: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        scope:
          type: object
          additionalProperties: false
          required: [sourcePaths, subjects]
          properties:
            sourcePaths:
              type: array
              minItems: 1
              items: { type: string }
            subjects:
              type: array
              items: { type: string }
        evidencePassages:
          type: array
          items: { $ref: '#/components/schemas/PolicyGateEvidencePassage' }
        remediationAction: { $ref: '#/components/schemas/PolicyGateRemediationAction' }
        recommendation: { type: string }
        reviewStatus: { type: string, enum: [proposed, accepted, dismissed] }
        reviewedAt: { type: string, format: date-time }
        reviewedBy: { type: string }
        reviewReason: { type: string }
        createdAt: { type: string, format: date-time }
    PolicyGateEvaluationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyGateEvaluation' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    HistoryCursorPage:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Opaque continuation cursor; null when no later page exists.
        hasMore: { type: boolean }
    PolicyGateReviewHistoryEntry:
      type: object
      required: [id, evaluationId, tenantId, status, reviewedBy, createdAt]
      properties:
        id: { type: string }
        evaluationId: { type: string }
        tenantId: { type: string }
        status: { type: string, enum: [accepted, dismissed] }
        reviewedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    ExecutionKind:
      type: string
      enum: [ci, integration, post-production, load, stress]
    ExecutionStatus:
      type: string
      enum: [passed, failed, cancelled, running]
    ExecutionProvider:
      type: string
      enum: [github-actions, external]
    TestExecutionThresholdInput:
      type: object
      additionalProperties: false
      required: [metric, observed, operator, target]
      properties:
        metric: { type: string, minLength: 1, maxLength: 200 }
        observed: { type: number }
        unit: { type: string, minLength: 1, maxLength: 50 }
        operator: { type: string, enum: [lt, lte, gt, gte, eq] }
        target: { type: number }
    TestExecutionThreshold:
      type: object
      additionalProperties: false
      required: [metric, observed, operator, target, passed]
      properties:
        metric: { type: string, minLength: 1, maxLength: 200 }
        observed: { type: number }
        unit: { type: string, minLength: 1, maxLength: 50 }
        operator: { type: string, enum: [lt, lte, gt, gte, eq] }
        target: { type: number }
        passed: { type: boolean }
    TestExecutionGateEvaluation:
      type: object
      additionalProperties: false
      required: [policyArtifactId, gateArtifactId, status]
      properties:
        policyArtifactId: { type: string, minLength: 1, maxLength: 500 }
        gateArtifactId: { type: string, minLength: 1, maxLength: 500 }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        detail: { type: string, minLength: 1, maxLength: 1000 }
    TestExecutionEvidenceLink:
      type: object
      additionalProperties: false
      required: [kind, name, url]
      properties:
        kind: { type: string, enum: [video, report, trace, screenshot, log, other] }
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
    TestExecutionEvidenceCollection:
      type: object
      additionalProperties: false
      required: [status, checkedAt]
      oneOf:
        - title: Complete evidence collection
          properties:
            status: { type: string, enum: [complete] }
            issues: { type: array, maxItems: 0 }
            unverifiedLinks: { type: array, maxItems: 0 }
          not: { required: [errorCode] }
        - title: Partial evidence collection
          anyOf:
            - required: [errorCode]
            - required: [issues]
          properties:
            status: { type: string, enum: [partial] }
            errorCode: { type: string, enum: [PROVIDER_RESULT_LIMIT_EXCEEDED] }
            issues:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: string
                enum: [provider-result-limit-exceeded, attempt-provenance-unverified]
        - title: Unavailable evidence collection
          required: [errorCode]
          properties:
            status: { type: string, enum: [unavailable] }
            errorCode:
              type: string
              enum: [PROVIDER_TIMEOUT, PROVIDER_UNAVAILABLE, PROVIDER_RESPONSE_INVALID, PROVIDER_RESULT_LIMIT_EXCEEDED]
            issues: { type: array, maxItems: 0 }
            unverifiedLinks: { type: array, maxItems: 0 }
      properties:
        status: { type: string, enum: [complete, partial, unavailable] }
        checkedAt: { type: string, format: date-time }
        errorCode:
          type: string
          enum: [PROVIDER_TIMEOUT, PROVIDER_UNAVAILABLE, PROVIDER_RESPONSE_INVALID, PROVIDER_RESULT_LIMIT_EXCEEDED]
        issues:
          type: array
          maxItems: 2
          items:
            type: string
            enum: [provider-result-limit-exceeded, attempt-provenance-unverified]
        unverifiedLinks:
          type: array
          maxItems: 99
          description: Run-level artifacts withheld because provider metadata could not prove ownership by this exact retry attempt.
          items: { $ref: '#/components/schemas/TestExecutionEvidenceLink' }
    TestExecutionInput:
      type: object
      description: Running executions cannot include `completedAt`; when both timestamps are supplied, completion cannot precede start.
      additionalProperties: false
      required: [repositoryId, tenantId, revision, kind, status, name]
      properties:
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1 }
        provider: { type: string, enum: [github-actions, external], default: external }
        externalRunId: { type: string, minLength: 1, maxLength: 500 }
        attempt: { type: integer, minimum: 1, default: 1 }
        revision: { type: string, minLength: 1, maxLength: 200 }
        branch: { type: string, minLength: 1, maxLength: 500 }
        headRepository:
          type: string
          maxLength: 255
          pattern: '^[^/\s]+/[^/\s]+$'
          description: GitHub workflow head repository in owner/name form, used to reject fork evidence.
        kind: { $ref: '#/components/schemas/ExecutionKind' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        name: { type: string, minLength: 1, maxLength: 500 }
        workflowPath:
          type: string
          minLength: 1
          maxLength: 1000
          description: Repository-relative workflow YAML path; a provider `@ref` suffix is accepted and removed before storage.
        sourceUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
        startedAt:
          type: string
          format: date-time
          description: Provider-reported execution start instant.
        completedAt:
          type: string
          format: date-time
          description: Provider-reported terminal instant; forbidden while status is running and never earlier than startedAt.
        policyArtifactIds:
          type: array
          maxItems: 100
          default: []
          items: { type: string }
        gateArtifactIds:
          type: array
          maxItems: 100
          default: []
          items: { type: string }
        gateEvaluations:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/TestExecutionGateEvaluation' }
        thresholds:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/TestExecutionThresholdInput' }
        evidenceLinks:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/TestExecutionEvidenceLink' }
        evidenceCollection: { $ref: '#/components/schemas/TestExecutionEvidenceCollection' }
        summary: { type: string, maxLength: 5000 }
    ExecutionEvidenceConflict:
      type: object
      additionalProperties: false
      required: [ok, code, error]
      properties:
        ok: { type: boolean, enum: [false] }
        code:
          type: string
          enum: [EXECUTION_EVIDENCE_REVISION_UNANALYZED, EXECUTION_EVIDENCE_REFERENCE_INVALID]
        error: { type: string }
        invalidPolicyArtifactIds:
          type: array
          items: { type: string }
        invalidGateArtifactIds:
          type: array
          items: { type: string }
    TestExecutionEvidenceRefresh:
      type: object
      additionalProperties: false
      required: [provider, externalRunId, attempt]
      properties:
        provider: { type: string, enum: [github-actions] }
        externalRunId: { type: string, pattern: '^\d+$', maxLength: 500 }
        attempt: { type: integer, minimum: 1 }
    TestExecution:
      type: object
      description: The first terminal outcome for a provider run attempt is immutable; reruns use a new attempt.
      required: [id, repositoryId, tenantId, provider, externalRunId, attempt, revision, kind, status, name, policyArtifactIds, gateArtifactIds, gateEvaluations, thresholds, evidenceLinks]
      properties:
        id: { type: string }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string }
        provider: { type: string, enum: [github-actions, external] }
        externalRunId: { type: string }
        attempt: { type: integer, minimum: 1 }
        revision: { type: string }
        branch: { type: string, minLength: 1, maxLength: 500 }
        headRepository:
          type: string
          maxLength: 255
          pattern: '^[^/\s]+/[^/\s]+$'
          description: GitHub workflow head repository in owner/name form, used to reject fork evidence.
        kind: { $ref: '#/components/schemas/ExecutionKind' }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        name: { type: string }
        workflowPath:
          type: string
          description: Canonical repository-relative workflow YAML path without a provider `@ref` suffix.
        sourceUrl: { type: string, format: uri, pattern: '^https://', maxLength: 2000 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        policyArtifactIds:
          type: array
          items: { type: string }
        gateArtifactIds:
          type: array
          items: { type: string }
        gateEvaluations:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionGateEvaluation' }
        thresholds:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionThreshold' }
        evidenceLinks:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionEvidenceLink' }
        evidenceCollection: { $ref: '#/components/schemas/TestExecutionEvidenceCollection' }
        summary: { type: string }
    TestExecutionDetail:
      allOf:
        - $ref: '#/components/schemas/TestExecution'
        - type: object
          description: Exact execution detail with its source revision resolved to retained catalog evidence.
          properties:
            catalogRevision:
              type: string
              description: Catalog revision that owns this execution's policy and gate artifact identifiers.
    TestExecutionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestExecution' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    DesignTestLinkTargetKind:
      type: string
      enum: [flow-step, frame, component]
      description: The kind of FuzeX design target identified by `targetRef`.
    DesignTestLinkLifecycleEvent:
      oneOf:
        - $ref: '#/components/schemas/DesignTestLinkUpsertEvent'
        - $ref: '#/components/schemas/DesignTestLinkRemovedEvent'
      discriminator:
        propertyName: type
        mapping:
          design-test-link.upsert: '#/components/schemas/DesignTestLinkUpsertEvent'
          design-test-link.removed: '#/components/schemas/DesignTestLinkRemovedEvent'
    DesignTestLinkUpsertEvent:
      type: object
      additionalProperties: false
      required: [type, tenantId, traceLinkId, fuzexProjectId, targetKind, targetRef, testCaseId]
      properties:
        type: { type: string, enum: [design-test-link.upsert] }
        tenantId: { type: string, format: uuid }
        traceLinkId: { type: string, minLength: 1, maxLength: 200 }
        fuzexProjectId: { type: string, minLength: 1, maxLength: 200 }
        targetKind: { $ref: '#/components/schemas/DesignTestLinkTargetKind' }
        targetRef: { type: string, minLength: 1, maxLength: 1000 }
        testCaseId: { type: string, minLength: 1, maxLength: 500 }
    DesignTestLinkRemovedEvent:
      type: object
      additionalProperties: false
      required: [type, tenantId, traceLinkId, fuzexProjectId, targetKind, targetRef, testCaseId]
      properties:
        type: { type: string, enum: [design-test-link.removed] }
        tenantId: { type: string, format: uuid }
        traceLinkId: { type: string, minLength: 1, maxLength: 200 }
        fuzexProjectId: { type: string, minLength: 1, maxLength: 200 }
        targetKind: { $ref: '#/components/schemas/DesignTestLinkTargetKind' }
        targetRef: { type: string, minLength: 1, maxLength: 1000 }
        testCaseId: { type: string, minLength: 1, maxLength: 500 }
    InternalAcceptedChange:
      type: object
      additionalProperties: false
      required: [accepted, changed]
      properties:
        accepted: { type: boolean, enum: [true] }
        changed:
          type: boolean
          description: False when the received lifecycle event was an idempotent replay.
    PolicyGatePerformance:
      type: object
      required: [repositoryId, policyArtifactId, gateArtifactId, total, passed, failed, cancelled, running, passRate]
      properties:
        repositoryId: { type: string }
        policyArtifactId: { type: string }
        policyTitle: { type: string }
        policySourcePath: { type: string }
        gateArtifactId: { type: string }
        gateTitle: { type: string }
        gateSourcePath: { type: string }
        revisionCount: { type: integer, minimum: 0 }
        latestRevision: { type: string }
        total:
          type: integer
          minimum: 0
          description: All explicit outcomes observed for this policy/gate pair.
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        passRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Passed share of terminal outcomes; zero when no terminal outcome exists.
        latestCompletedAt: { type: string, format: date-time }
    ExecutionOutcomeTrend:
      type: object
      additionalProperties: false
      required: [date, total, passed, failed, cancelled, running, passRate, durationSampleCount, averageDurationMs, maximumDurationMs, retryAttemptCount, successfulRetryCount, recoveredRunCount]
      properties:
        date: { type: string, format: date }
        total:
          type: integer
          minimum: 0
          description: All retained executions in the UTC-day bucket.
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        passRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Passed share of terminal outcomes; zero when no terminal outcome exists.
        durationSampleCount: { type: integer, minimum: 0 }
        averageDurationMs: { type: integer, minimum: 0 }
        maximumDurationMs:
          type: integer
          minimum: 0
          description: Longest valid execution interval retained in the UTC-day bucket.
        retryAttemptCount: { type: integer, minimum: 0 }
        successfulRetryCount: { type: integer, minimum: 0 }
        recoveredRunCount:
          type: integer
          minimum: 0
          description: Passed retry attempts backed by a retained failed earlier attempt for the same provider run.
    PerformanceDispatch:
      type: object
      required: [status, artifactId, workflowPath, ref, sourceRevision, auditPersistence, dispatch]
      properties:
        status: { type: string, enum: [dispatched] }
        artifactId: { type: string }
        workflowPath: { type: string }
        ref: { type: string }
        sourceRevision: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
        auditPersistence:
          type: string
          enum: [persisted, pending]
          description: Whether the accepted provider outcome was durably finalized after bounded audit retries.
        dispatch: { $ref: '#/components/schemas/TestSuiteDispatchAudit' }
    WorkflowDispatchRequest:
      type: object
      additionalProperties: false
      properties:
        inputs:
          type: object
          maxProperties: 20
          propertyNames:
            pattern: '^[A-Za-z_][A-Za-z0-9_-]{0,63}$'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
      description: >-
        Values for the exact required workflow_dispatch input names discovered
        in the immutable analyzed workflow. Missing or extra names are rejected;
        values are forwarded to GitHub Actions and are not persisted.
    TestSuiteDispatch:
      type: object
      additionalProperties: false
      required: [status, artifactId, artifactKind, workflowPath, ref, sourceRevision, auditPersistence, dispatch]
      properties:
        status: { type: string, enum: [dispatched] }
        artifactId: { type: string }
        artifactKind: { type: string, enum: [integration-test, post-production-test, load-test, stress-test] }
        workflowPath: { type: string }
        ref: { type: string }
        sourceRevision: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
        auditPersistence:
          type: string
          enum: [persisted, pending]
          description: Whether the accepted provider outcome was durably finalized after bounded audit retries.
        dispatch: { $ref: '#/components/schemas/TestSuiteDispatchAudit' }
    TestSuiteDispatchAudit:
      type: object
      additionalProperties: false
      required: [id, repositoryId, tenantId, artifactId, artifactLogicalId, artifactKind, workflowPath, ref, sourceRevision, requestedBy, inputNames, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        repositoryId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 200 }
        artifactId: { type: string, minLength: 1, maxLength: 500 }
        artifactLogicalId:
          type: string
          minLength: 1
          maxLength: 500
          description: Stable suite identity used to retain dispatch history across repository scans.
        artifactKind: { type: string, enum: [integration-test, post-production-test, load-test, stress-test] }
        workflowPath: { type: string, minLength: 1, maxLength: 1000 }
        ref: { type: string, minLength: 1, maxLength: 500 }
        sourceRevision: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
        requestedBy: { type: string, minLength: 1, maxLength: 200 }
        inputNames:
          type: array
          maxItems: 20
          items: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_-]{0,63}$' }
          description: Reviewed workflow input names only; values are never persisted.
        status: { type: string, enum: [dispatching, accepted, failed] }
        error: { type: string, minLength: 1, maxLength: 2000 }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    TestSuiteDispatchAuditPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestSuiteDispatchAudit' }
        page: { $ref: '#/components/schemas/HistoryCursorPage' }
    ApiError:
      type: object
      required: [error]
      properties:
        auditPersistence:
          type: string
          enum: [persisted, pending]
          description: Present after a provider dispatch attempt to report whether its terminal audit state was durably finalized.
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        code: { type: string }
    StaleFlowCandidateError:
      type: object
      additionalProperties: false
      required: [error, code, candidateRevision, currentRevision]
      properties:
        error: { type: string }
        code: { type: string, enum: [STALE_FLOW_CANDIDATE] }
        candidateRevision: { type: string }
        currentRevision: { type: string, nullable: true }
    StaleFlowReviewError:
      type: object
      additionalProperties: false
      required: [error, code, expectedReviewedAt, currentReviewedAt]
      properties:
        error: { type: string }
        code: { type: string, enum: [STALE_FLOW_REVIEW] }
        expectedReviewedAt: { type: string, format: date-time, nullable: true }
        currentReviewedAt: { type: string, format: date-time, nullable: true }
    StalePolicyGateEvaluationError:
      type: object
      additionalProperties: false
      required: [error, code, evaluationRevision, currentRevision]
      properties:
        error: { type: string }
        code: { type: string, enum: [STALE_POLICY_GATE_EVALUATION] }
        evaluationRevision: { type: string }
        currentRevision: { type: string, nullable: true }
    StalePolicyGateReviewError:
      type: object
      additionalProperties: false
      required: [error, code, expectedReviewedAt, currentReviewedAt]
      properties:
        error: { type: string }
        code: { type: string, enum: [STALE_POLICY_GATE_REVIEW] }
        expectedReviewedAt: { type: string, format: date-time, nullable: true }
        currentReviewedAt: { type: string, format: date-time, nullable: true }
    Health:
      type: object
      required: [status, service, version, openapi]
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            `ok` means the process is serving. It is deliberately NOT downgraded
            by a missing spec — the service is still correct and serving is more
            useful than crash-looping — the `openapi` field carries that signal.
        service:
          type: string
          example: fuzequality
        version:
          type: string
          description: The contract version this build implements.
          example: 0.1.0
        openapi:
          type: string
          enum: [available, unavailable]
          description: >-
            Whether the OpenAPI document was found and parsed at boot.
            `unavailable` means /openapi.yaml and /openapi.json answer 503.
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: openapi_unavailable
        message:
          type: string

tags:
  - name: operations
    description: Platform operational surface — probes and contract discovery.
  - name: flow-candidates
    description: Tenant-authorized review of detected UX-flow candidates.
  - name: policy-gates
    description: Tenant-authorized policy/gate governance and review history.
  - name: executions
    description: Tenant-authorized test evidence, performance aggregation, and controlled dispatch.
  - name: worker-intelligence
    description: Cluster-internal repository analysis worker operations.
  - name: worker-design-traceability
    description: Cluster-internal FuzeX design-to-test traceability projections.
  - name: worker-executions
    description: Cluster-internal execution-evidence ingestion.
