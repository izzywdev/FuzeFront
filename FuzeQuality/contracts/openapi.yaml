    get:
      operationId: listTestExecutionAttempts
      summary: List the immutable attempt history for one provider-owned execution
      description: >-
        Returns only attempts sharing the exact repository, provider, and provider run identifier.
        This preserves tenant isolation and lets the portal prove a recovery from retained failure
        evidence instead of inferring flakiness from a partial mixed-execution page.
      tags: [executions]
      security: [{ platformBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ExecutionAttemptProvider'
        - $ref: '#/components/parameters/ExecutionAttemptExternalRunId'
