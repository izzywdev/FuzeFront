      summary: List the immutable review history for a policy/gate evaluation
      tags: [policy-gates]
      security: [{ platformBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding review-history page.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Review events in reverse chronological order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyGateReviewHistoryEntry' }
