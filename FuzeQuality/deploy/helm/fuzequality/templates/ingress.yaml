{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuzequality
  labels:
    {{- include "fuzequality.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: fuzequality-frontend, port: { number: 80 } }
{{- end }}
{{- if .Values.federatedMount.enabled }}
---
# Federated mount on the HOST SHELL's origin.
#
# The browser fetches https://<host>/apps/<slug>/assets/remoteEntry.js. Traefik
# strips /apps/<slug> and routes straight to fuzequality-frontend (ClusterIP),
# so the remote's entry + chunks are served from the same origin as the page:
# no second trip through the public edge, and no Cloudflare Access wall (the
# standalone `*.prod.fuzefront.com` host sits behind the admin Zero-Trust app,
# which answers asset requests with an HTML login page, not JavaScript).
#
# This Ingress lives in the APP's namespace, alongside the Service it targets —
# a k8s Ingress may only reference a Service in its own namespace, and Traefik
# watches all namespaces and merges rules per host. That is why the mount is
# owned here rather than by the fuzefront umbrella chart.
#
# Requires the app to be BUILT with `base: /apps/<slug>/` so its emitted chunk
# URLs resolve back through this same prefix (apps/web/vite.config.ts).
#
# No `tls:` block: the shared host terminates TLS at Cloudflare and the FuzeFront
# ingress runs with tls.enabled=false. Declaring a cert here would race
# cert-manager against the host's own Ingress for the same hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuzequality-federated-mount
  labels:
    {{- include "fuzequality.labels" . | nindent 4 }}
    app.kubernetes.io/component: federated-remote
  annotations:
    {{- if eq .Values.federatedMount.className "nginx" }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- else if eq .Values.federatedMount.className "traefik" }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-fuzequality-federated-stripprefix@kubernetescrd
    {{- end }}
spec:
  ingressClassName: {{ .Values.federatedMount.className }}
  rules:
    - host: {{ required "federatedMount.host is required when federatedMount.enabled" .Values.federatedMount.host | quote }}
      http:
        paths:
          {{- if eq .Values.federatedMount.className "nginx" }}
          - path: /apps/{{ .Values.federatedMount.slug }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: fuzequality-frontend, port: { number: 80 } }
          {{- else }}
          - path: /apps/{{ .Values.federatedMount.slug }}
            pathType: Prefix
            backend:
              service: { name: fuzequality-frontend, port: { number: 80 } }
          {{- end }}
{{- if eq .Values.federatedMount.className "traefik" }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fuzequality-federated-stripprefix
  labels:
    {{- include "fuzequality.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /apps/{{ .Values.federatedMount.slug }}
{{- end }}
{{- end }}
