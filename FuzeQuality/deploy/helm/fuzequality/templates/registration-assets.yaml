{{/*
Versioned registration assets required by the post-upgrade registration Job.
Helm cannot read files outside its chart; these copies make the deployed
ConfigMaps declarative and avoid a hidden, manually-created namespace dependency.
The source-of-truth copies remain FuzeQuality/registration and
packages/onboarding-kit/bin/register.sh. CI verifies they remain identical.
*/}}
{{- if .Values.registration.assets.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.registration.configMapName | quote }}
  labels:
    {{- include "fuzequality.labels" . | nindent 4 }}
    app.kubernetes.io/component: registration
data:
  manifest.json: |-
{{ .Files.Get "files/registration/manifest.json" | indent 4 }}
  policy.json: |-
{{ .Files.Get "files/registration/policy.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.registration.kitConfigMapName | quote }}
  labels:
    {{- include "fuzequality.labels" . | nindent 4 }}
    app.kubernetes.io/component: registration
data:
  register.sh: |-
{{ .Files.Get "files/onboarding-kit/register.sh" | indent 4 }}
{{- end }}
