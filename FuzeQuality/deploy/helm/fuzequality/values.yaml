global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

backendImage:
  repository: ghcr.io/izzywdev/fuzequality-backend
  tag: latest
frontendImage:
  repository: ghcr.io/izzywdev/fuzequality-frontend
  tag: latest

backend:
  replicas: 1
  port: 4180
  resources:
    requests: { cpu: 75m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
frontend:
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
bootstrap:
  # Runs before every API/worker start. It is intentionally small because it
  # only applies additive DDL and creates missing Kafka topics.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
workers:
  scanner:
    replicas: 1
    command: ["npm", "run", "start:scanner"]
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "2", memory: 2Gi }
  intelligence:
    replicas: 1
    command: ["npm", "run", "start:intelligence"]
    chromaRequired: true
    resources:
      requests: { cpu: 75m, memory: 128Mi }
      limits: { cpu: "1", memory: 1Gi }
  projector:
    replicas: 1
    command: ["npm", "run", "start:projector"]
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }

config:
  # The platform security service is the authority for portal bearer tokens and
  # scoped authorization checks. This is deliberately the in-cluster Service,
  # not the public host: FuzeQuality is a FuzeFront federated workload.
  fuzefrontSecurityUrl: http://fuzefront-security.fuzefront.svc.cluster.local:3002
  kafkaBrokers: fuzeinfra-kafka.fuzeinfra.svc.cluster.local:9092
  litellmUrl: http://litellm.fuzeinfra.svc.cluster.local:4000/v1
  chromaUrl: http://fuzeinfra-chromadb.fuzeinfra.svc.cluster.local:8000
  llmModel: quality-analysis
  jiraJql: project = FUZE ORDER BY updated DESC
  reconcileSchedule: "*/15 * * * *"

secret:
  existingSecret: fuzequality-secrets

chroma:
  existingSecret: fuzequality-chroma-credentials
  secretKey: token
  tenant: fuzequality
  database: fuzequality
  readyCollection: fuzequality_ready

# FuzeFront self-registration — what puts FuzeQuality in the portal's
# applications list. See templates/registration.yaml for why this is a
# post-install Job rather than an initContainer, and why it defaults OFF here
# while every sibling defaults it ON.
#
# SHORT VERSION: this chart is live and Argo-synced with prune + selfHeal.
# Turning registration on before the `fuzefront-registration` Secret and the two
# ConfigMaps exist in this namespace produces a failing Job. Turning it on as an
# initContainer would have produced a CrashLoopBackOff on the RUNNING frontend.
# Flip this to true in the same change that provisions the prerequisites —
# registration/README.md has both commands.
registration:
  enabled: false
  # Any image with a shell; curl + jq are installed at start. Kept as a value so
  # an air-gapped cluster can point at an internal mirror instead.
  image: alpine:3.20
  # Cluster-internal DNS for the applications-service that owns /api/v1/app-registry.
  apiUrl: http://fuzefront-applications.fuzefront.svc.cluster.local:3003
  # Sealed Secret holding the apps:register bearer token under key `token`.
  secretName: fuzefront-registration
  # ConfigMap built from ../../registration/ (manifest.json, policy.json).
  configMapName: fuzequality-registration
  # ConfigMap holding register.sh from @fuzefront/onboarding-kit.
  kitConfigMapName: fuzefront-onboarding-kit
  # Retries are cheap and the platform may still be starting; register.sh
  # already retries transient 5xx/connection failures internally.
  backoffLimit: 3

ingress:
  enabled: false
  className: nginx
  host: quality.fuzefront.com
  tlsSecret: fuzequality-tls
  clusterIssuer: letsencrypt-prod

# Same-origin mount of the Module-Federation remote on the HOST SHELL's origin,
# so the browser loads remoteEntry.js + chunks from https://<host>/apps/<slug>/…
# and the request is proxied in-cluster instead of hairpinning back out through
# the public edge. See templates/ingress.yaml for the full rationale.
#
# `slug` MUST match the app-registry slug AND the Vite `base` the frontend is
# built with (apps/web/vite.config.ts) — a mismatch serves remoteEntry.js fine
# and then 404s every chunk it imports.
federatedMount:
  enabled: false
  className: traefik
  host: ""            # e.g. app.fuzefront.com — the host shell's origin
  slug: fuzequality

kafkaTopics:
  # Legacy Sync-hook provisioning is disabled. Bootstrap init containers now
  # ensure topics on every API/worker startup, after Kafka is actually ready.
  enabled: false
  image: apache/kafka:3.9.1
  partitions: 3
  replicationFactor: 1
  retentionMs: "604800000"
