global:
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-pull

backendImage:
  repository: ghcr.io/izzywdev/fuzequality-backend
  tag: 0e46bdc6e640
frontendImage:
  repository: ghcr.io/izzywdev/fuzequality-frontend
  tag: 0e46bdc6e640

# FuzeQuality is a live, same-origin federated remote. Its registration assets
# and sealed registration token are delivered by this chart, so run the
# idempotent post-upgrade registration Job and restore the portal entry.
registration:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: quality.prod.fuzefront.com

# The path the host shell actually loads the remote from. quality.prod.fuzefront.com
# above stays for direct/admin access, but it sits behind the *.prod Cloudflare
# Access wall, so it can never serve remoteEntry.js to a browser.
federatedMount:
  enabled: true
  className: traefik
  host: app.fuzefront.com
  slug: fuzequality
