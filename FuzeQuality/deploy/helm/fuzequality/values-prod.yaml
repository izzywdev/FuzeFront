global:
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-pull

backendImage:
  repository: ghcr.io/izzywdev/fuzequality-backend
  tag: 7b0714d7abb4
frontendImage:
  repository: ghcr.io/izzywdev/fuzequality-frontend
  tag: 7b0714d7abb4

# FuzeQuality is a live, same-origin federated remote. Its registration assets
# and sealed registration token are delivered by this chart, so run the
# idempotent post-upgrade registration Job and restore the portal entry.
registration:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: fuzequality.fuzefront.com

# The path the host shell actually loads the remote from. The standalone host
# above serves the installable PWA/TWA at `/`, while portal federation remains
# same-origin under app.fuzefront.com.
federatedMount:
  enabled: true
  className: traefik
  host: app.fuzefront.com
  slug: fuzequality
