# Federation CORS, scoped by path but declared ONCE at server level.
#
# nginx's `add_header` is NOT additive across scopes: a `location` that sets ANY
# header of its own DISCARDS every `add_header` inherited from the enclosing
# `server`/`http` block. These two headers used to live inside the
# `~* \.(js|css|map)$` location, which meant any security header added to the
# server block later would have been silently dropped for precisely the static
# bundle the portal loads — the bug would have shipped invisibly.
#
# Varying the VALUE per path instead keeps every `add_header` at server level.
# The keys below mirror the static-asset location regex exactly, and an empty
# value makes nginx emit no header at all, so `/api/` responses still carry no
# CORS headers and stay protected by their own authentication layer.
map $uri $fq_federation_cors_origin {
  default            "";
  ~*\.(js|css|map)$  "https://app.fuzefront.com";
}

map $uri $fq_federation_cors_methods {
  default            "";
  ~*\.(js|css|map)$  "GET, OPTIONS";
}

# Health checks are public so load balancers and standalone clients can use the
# same endpoints. Bound each client here as defense in depth; API readiness is a
# constant-time database probe, but it still consumes a pooled connection.
limit_req_zone $binary_remote_addr zone=fq_health:10m rate=10r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The remoteEntry and chunks are fetched by the FuzeFront portal origin.
  # Keep the API itself protected by its own authentication layer; this only
  # permits the browser to load the public static federation assets.
  add_header Access-Control-Allow-Origin $fq_federation_cors_origin always;
  add_header Access-Control-Allow-Methods $fq_federation_cors_methods always;

  # Keep the remote loadable even if an ingress controller does not apply its
  # strip-prefix middleware. The production Traefik route strips this prefix,
  # while this alias makes the image contract correct for direct probes and
  # other controllers too. Both paths resolve to the same immutable bundle.
  location ^~ /apps/fuzequality/ {
    alias /usr/share/nginx/html/;
  }

  location ~* \.(js|css|map)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://fuzequality-backend:4180;
    proxy_set_header Host fuzequality-backend;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Standalone web/TWA authentication stays on the product origin. Route only
  # the platform Security namespace to FuzeFront; all other /api/v1 routes keep
  # flowing to FuzeQuality above. The browser never sees an internal service
  # host and the resulting bearer is used by the tenant-scoped catalog API.
  location ^~ /api/v1/security/ {
    proxy_pass http://fuzefront-security.fuzefront.svc.cluster.local:3002;
    proxy_set_header Host fuzequality.fuzefront.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Traefik supplies the normalized client address in X-Real-IP. Forward one
    # address to Security instead of appending the Traefik peer: Security trusts
    # exactly one hop, so an appended chain would key public-mail throttles by
    # the shared ingress address and let one client exhaust another's quota.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_real_ip;
  }

  # FuzeOne mobile acceptance probes this uniform endpoint on every standalone
  # product origin. The API owns `/health`; keep `/api/health` as a same-origin
  # alias rather than letting nginx's SPA fallback return HTML with status 200.
  location = /api/health {
    proxy_pass http://fuzequality-backend:4180/health;
    proxy_set_header Host fuzequality-backend;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Same-origin operational surface.
  #
  # `location /health/` (with the trailing slash) matches /health/live and
  # /health/ready but NOT /health itself — a bare /health fell through to
  # `location /` and was answered with index.html, i.e. 200 text/html from the
  # static server, which looks exactly like a healthy API to anything that only
  # checks the status code. The exact-match block below is what makes the
  # platform-wide /health convention actually reach the API pod.
  location = /health {
    limit_req zone=fq_health burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://fuzequality-backend:4180/health;
    proxy_set_header Host fuzequality-backend;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health/ {
    limit_req zone=fq_health burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://fuzequality-backend:4180;
  }

  # The contract, reachable from the browser on the SAME ORIGIN as the app —
  # so no cross-origin base URL and no mixed-content path exists under TLS.
  location = /openapi.json {
    proxy_pass http://fuzequality-backend:4180/openapi.json;
    proxy_set_header Host fuzequality-backend;
  }

  location = /openapi.yaml {
    proxy_pass http://fuzequality-backend:4180/openapi.yaml;
    proxy_set_header Host fuzequality-backend;
  }
}
