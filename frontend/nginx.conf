worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    # Serve webmanifest with the correct MIME type
    types {
        application/manifest+json  webmanifest;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/manifest+json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---------------------------------------------------------------------
    # H2C-smuggling guard for the ONE location that proxies an upgrade
    # (/socket.io/). Forwarding the client's `Upgrade` value verbatim lets a
    # caller send `Upgrade: h2c` and have nginx hand it to the upstream, which
    # — if the upstream speaks h2c — yields a long-lived, unrestricted HTTP/2
    # tunnel straight to the backend that bypasses every reverse-proxy access
    # control expressed as nginx locations.
    #
    # These maps allow-list the single value we actually support. Anything
    # that is not `websocket` (case-insensitive) resolves to the empty string,
    # and proxy_set_header with an empty value omits the header entirely — so
    # `Upgrade: h2c` never reaches an upstream. Socket.IO's HTTP long-polling
    # transport sends no Upgrade header at all and takes the `default` branch,
    # which keeps the Connection semantics nginx would have used anyway.
    map $http_upgrade $ws_upgrade {
        default         "";
        "~*^websocket$" "websocket";
    }
    map $http_upgrade $ws_connection {
        default         "close";
        "~*^websocket$" "upgrade";
    }

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers live in each location block rather than here so that
        # nginx's add_header inheritance rule (location add_header clears all
        # parent add_headers) cannot strip them from any response.
        #
        # THE INVARIANT: this server block declares NO add_header of its own,
        # and EVERY location below repeats the full four-header set verbatim:
        #
        #     add_header X-Frame-Options "SAMEORIGIN" always;
        #     add_header X-Content-Type-Options "nosniff" always;
        #     add_header X-XSS-Protection "1; mode=block" always;
        #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        #
        # `add_header` is NOT additive across scopes: a location containing any
        # add_header DISCARDS every add_header inherited from its parent. So a
        # location that sets only, say, Cache-Control would serve its routes
        # with zero security headers. Repeating the set in full is the only
        # shape that cannot silently drop one — that failure already happened
        # twice here (the /apps/ block once omitted X-XSS-Protection; /health
        # carried only Content-Type and therefore no security headers at all).
        #
        # If you add a location, copy the four lines. If you add a fifth
        # security header, add it to EVERY location or it is not deployed.
        # An `include` snippet would be the tidier shape, but frontend/Dockerfile
        # COPYs this single file to /etc/nginx/nginx.conf and ships no snippets
        # directory, so an include would reference a path that does not exist in
        # the image.
        #
        # This config sets no Content-Security-Policy; CSP is not introduced
        # here. The Module-Federation host loads every remote's chunks from its
        # own origin (frontend/src/utils/loadFederatedApp.ts resolves
        # integration.remoteEntry against `origin`), so any future CSP must keep
        # script-src permitting same-origin scripts or the shell white-screens.

        # Service worker and its registration helper must never be long-cached —
        # a stale SW would block PWA updates from reaching users.
        location ~* (sw\.js|registerSW\.js|workbox-.+\.js)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Web app manifest — no-cache so display/icon changes propagate quickly
        location ~* \.(webmanifest)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache";
            add_header Content-Type "application/manifest+json";
            try_files $uri =404;
        }

        # Digital Asset Links for Android TWA validation
        location = /.well-known/assetlinks.json {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache";
            add_header Content-Type "application/json";
            try_files $uri =404;
        }

        # Handle static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Backend 3-way split (Phase 3 cutover). nginx matches the most-specific
        # location prefix first, so these per-service blocks win over the /api/
        # catch-all below. Used for in-pod / port-forward scenarios; the ingress
        # does the same path routing upstream of nginx.
        #
        # `proxy_set_header Host $host` in the blocks below is DELIBERATE and
        # load-bearing; it is not an oversight, and it must not be "hardened"
        # into $proxy_host or a literal. The security service selects the
        # identity tenant from the raw Host header
        # (backend/security/src/middleware/tenant-context.ts) and resolves
        # social-login return origins from it
        # (providers/authentik/socialReturnOrigins.ts); the monolith reads it in
        # middleware/portalContext.ts. Pinning Host to the upstream's own name
        # would make every request arrive as `fuzefront-security:3002`, match no
        # tenant, and be rejected `400 unknown_host` — a total auth outage.
        #
        # The allow-listing a scanner asks for here already exists, twice, and
        # in the only two places that can know the answer: the ingress routes on
        # host so only configured hosts reach this pod at all, and
        # resolveTenantByHost() fail-closes on anything it does not recognise.
        # Neither list can be duplicated here — this conf is baked into the
        # image by frontend/Dockerfile and is identical in dev, local kind, and
        # prod, while the host set differs in each and changes whenever a tenant
        # is onboarded. A hardcoded allow-list here would break tenant
        # onboarding without adding a check that is not already enforced.
        #
        # `location ^~ /apps/` is the exception and does NOT forward Host; see
        # its own comment. It routes by path only, so it needs nothing from it.

        # Security-service: the provider-agnostic Security API. This is the
        # surface the SPA and all consumers use (/api/v1/security/{session,
        # methods,social,mfa,verify,authz,tenants,...}). It was missing here
        # while /api/auth/ and /api/organizations/ were routed, so it fell
        # through to the /api/ catch-all and reached fuzefront-backend — the
        # MONOLITH, which does not serve it, i.e. a 404 on every auth call.
        #
        # Not currently live: the ingress routes /api/v1/security straight to
        # fuzefront-security ahead of nginx, so prod is unaffected today. This
        # closes the gap for in-pod / port-forward use and, more importantly,
        # removes a landmine — any ingress change that let /api/* reach this pod
        # would silently break all authentication. The identical omission in the
        # e2e nginx is exactly what made sign-in untestable there.
        location /api/v1/security/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-security:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Security-service: deprecated /api/auth shim + organizations.
        location /api/auth/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-security:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        location /api/organizations/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-security:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Applications-service: app registry.
        location /api/apps/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-applications:3003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API catch-all -> thin backend (health + any non-split /api/* during the
        # dual-serving soak). WebSocket upgrades go to /socket.io/ only; do NOT
        # forward Upgrade here to prevent H2C smuggling.
        location /api/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Federated remotes: /apps/<slug>/* -> the backend's same-origin asset
        # proxy. MUST be declared, and must sit above `location /`: nginx picks
        # the longest matching prefix, so without this block these requests fall
        # into the SPA fallback and remoteEntry.js comes back as 200 + index.html.
        # A module served as text/html is refused by the browser, which is the
        # blank-panel-behind-a-green-healthcheck failure the portal census
        # reports. No Upgrade forwarding — these are static asset fetches.
        #
        # All four security headers are repeated here on purpose. `add_header` in
        # a location block REPLACES the server-level set rather than adding to
        # it, so an incomplete list here silently drops whatever it omits — this
        # block originally left out X-XSS-Protection and would have served these
        # assets without it.
        #
        # Host is deliberately NOT forwarded. nginx then sends the upstream's own
        # name (`$proxy_host`), so a client-supplied Host header cannot reach the
        # backend. The backend routes these by path only, so it needs nothing
        # from the original Host.
        #
        # `^~` IS LOAD-BEARING — without it this entire block is dead for every
        # file a federated remote actually loads. nginx does NOT resolve a
        # location by "longest prefix wins": it checks `=`, then `^~` prefixes,
        # then REGEX locations in file order, and only falls back to the longest
        # plain prefix if no regex matched. The `~* \.(js|css|png|...)$` static
        # asset block above is declared FIRST and matches `remoteEntry.js`, so a
        # PLAIN `location /apps/` never runs: the request lands in that block's
        # `try_files $uri =404` against the SPA docroot, where no remote asset
        # exists, and every `/apps/<slug>/*.js` and `*.css` answers 404 while
        # `/apps/<slug>/` (no extension) still proxies correctly — a confusing
        # half-working split. `^~` tells nginx to stop before the regex stage.
        #
        # The comment above reasons only about the `/` SPA fallback (200 + HTML),
        # which is the failure this block was written to prevent. That is the
        # SECOND failure mode; the regex shadow is the first, and it is why
        # /apps/fuzesocial/remoteEntry.js and /apps/fuzeagent/remoteEntry.js
        # answered 404 in prod rather than 200-that-is-HTML.
        # Regression-tested by src/__tests__/nginxAppsPrecedence.test.ts.
        location ^~ /apps/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-backend:3001;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat-service: AI chat + RAG. SSE streaming, so buffering MUST be off and
        # the read timeout long. baseUrl on the client is `${origin}/chat-api`, so
        # /chat-api/chat/stream maps to the service's /chat/stream.
        location /chat-api/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-chat-service:3006/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE: disable proxy + nginx buffering so text_delta events flush live.
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_read_timeout 86400;
        }

        # WebSocket proxy -> applications-service (owns Socket.IO).
        location /socket.io/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://fuzefront-applications:3003;
            proxy_http_version 1.1;
            # Upgrade is allow-listed to `websocket` by the maps in the http
            # block above — NOT forwarded verbatim — so `Upgrade: h2c` cannot be
            # smuggled through to the applications service. See those maps for
            # the reasoning; this is the only location that proxies an upgrade.
            proxy_set_header Upgrade $ws_upgrade;
            proxy_set_header Connection $ws_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle SPA routing - fallback to index.html
        location / {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        #
        # This block used to declare ONLY `add_header Content-Type text/plain`.
        # Because a location's add_header set replaces rather than extends its
        # parent's, that made /health the one route served with no security
        # headers whatsoever — the exact foot-gun the invariant above exists to
        # prevent, live in this file. The four headers are repeated here for the
        # same reason they are repeated everywhere else.
        location /health {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Type text/plain;
            access_log off;
            return 200 "healthy\n";
        }
    }
}
