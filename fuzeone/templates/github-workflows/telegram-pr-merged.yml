# Managed by fuzeone — Telegram notification on PR merge.
# Requires secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (inherited).
#
# SELF-CONTAINED (inlined), not a `uses:` call into izzywdev/AITools — AITools is
# being retired (izzywdev/FuzeSDLC governance/reusable-workflows.md). Deliberately
# plain `curl` rather than a marketplace Telegram action: this sends one HTTP POST,
# and a third-party action here would be a supply-chain dependency that sees
# TELEGRAM_BOT_TOKEN for no benefit.
name: Notify Telegram on PR merge
on:
  pull_request:
    types: [closed]
jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Every value goes through env, never into the shell body. A PR title is
      # author-controlled text and would otherwise be interpolated straight into a
      # shell script.
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          BY: ${{ github.event.pull_request.merged_by.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Unconfigured consumer -> clean skip, never a failure. Both secrets must
          # be present to send; missing either one is a no-op, not an error.
          if [ -z "${TOKEN}" ] || [ -z "${CHAT}" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured on ${REPO} — skipping Telegram notification (not a failure)."
            exit 0
          fi
          TEXT="✅ PR merged in ${REPO}
          #${NUM}: ${TITLE}
          merged by ${BY:-unknown} into ${BASE:-?}
          ${URL}"
          curl -sS --fail-with-body \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=false"
