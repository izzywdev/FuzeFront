# Flag Registry — source-controlled taxonomy for the Fuze family flag platform.
#
# Owner: feature-flags-engineer
# Backend: Unleash (self-hosted, FuzeFront-hosted), consumed via OpenFeature +
#          the @fuzefront/feature-flags client.
#
# This file is the authoritative record of every flag in the Unleash default
# project. When a new flag is defined here, feature-flags-engineer creates it
# in Unleash (admin UI or API) with exactly the settings below.
#
# Naming convention: <repo>.<domain>.<flag>  (lowercase, kebab within segment)
# Types:
#   release        — ship dark / gradual rollout; default OFF; short-lived.
#   ops-kill-switch — circuit-breaker; default ON; long-lived.
#   experiment     — A/B / multivariate; carries a measurement window.
#   permission     — entitlement gate (rollout convenience only — real authz is Permit).
#
# Every flag carries: owner, type, default, description, removal_criterion.
# Release and experiment flags must have a removal_criterion.
#
# Unleash setup (production environment, default project):
#   release flags   → strategy: flexibleRollout 100% + segment "developers" (id 1)
#   ops-kill-switch → strategy: flexibleRollout 100%, NO segment
#
# The developers segment constrains on Unleash's built-in `userId` field
# (FuzeFront users.id UUIDs) so developers see all features while the rest of
# the rollout follows the deliberate strategy.
#
# Do NOT add the flag to Unleash directly from here — this file is source
# control; feature-flags-engineer creates/retires flags in Unleash separately.

flags:
  # ---------------------------------------------------------------------------
  # fuzefront.apps.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.apps.org-context-disabled
    type: ops-kill-switch
    default: true
    description: >
      Controls whether federated apps requiring active organization context are
      rendered in disabled state when the user is in personal context. ON in prod;
      OFF is the break-glass that turns the org-context gating off.
    owner: frontend-engineer
    removal_criterion: Removed only if org-context gating is removed from the shell.
    gates:
      - "FuzeFront host SidePanel & AppSelector org-context gating"
    web_exposed: true

  - key: fuzefront.apps.org-context-hidden
    type: release
    default: false
    description: >
      Controls whether federated apps requiring active organization context are
      completely hidden from navigation and launchers when in personal context.
    owner: frontend-engineer
    removal_criterion: Permanent platform capability.
    gates:
      - "FuzeFront host SidePanel & AppSelector org-context gating"
    web_exposed: true

  # "Build your application" + app ownership/publishing (applications-service).
  # All three are release flags, default OFF, read by the server
  # (backend/applications/src/app-registry/flags.ts) AND by the UI (the
  # Applications page "Build with FuzeAgent" card, the creator contact line and
  # the publishing controls), hence web_exposed: true. Never a substitute for
  # Permit: authority over an app stays in Permit + the org role.
  - key: fuzefront.apps.build-with-agent
    type: release
    default: false
    description: >
      Gates the build-session API (POST/GET /api/v1/app-registry/build-sessions*)
      that starts a FuzeAgent session which develops and deploys an app into the
      caller's personal account or an organization, and (later) the "Build your
      application" card on the Applications page. OFF => every build-session
      endpoint answers 503 feature_disabled.
    owner: backend-engineer
    removal_criterion: >
      Delete this flag and the off-path 503 branch once build-with-agent is
      rolled out to 100% of orgs and stable for one release cycle.
    gates:
      - "applications-service build-sessions API"
      - "Applications page: Build your application card"
    web_exposed: true

  - key: fuzefront.apps.creator-ownership
    type: release
    default: false
    description: >
      Gates the "org-held, user-originated" ownership model: writing
      apps.created_by_user_id, assigning the creator's App#creator Permit
      resource-instance role, and exposing createdBy / creator on App DTOs.
      OFF => created_by_user_id is never written and the App shape is
      byte-identical to before.
    owner: backend-engineer
    removal_criterion: >
      Delete this flag and the off-path once creator ownership is rolled out to
      100% of orgs, the Permit App#creator policy is live, and the flag-OFF path
      is no longer exercised.
    gates:
      - "applications-service created_by_user_id write + creator Permit role"
      - "App DTO createdBy/creator fields"
      - "Application detail: creator contact line"
    web_exposed: true

  - key: fuzefront.apps.marketplace-publishing
    type: release
    default: false
    description: >
      Gates the marketplace publication-request endpoints
      (POST /apps/{slug}/publication-requests[/approve|/reject],
      GET /apps/{slug}/publication) and the publish controls in the UI.
      OFF => those endpoints answer 503 feature_disabled.
    owner: backend-engineer
    removal_criterion: >
      Delete this flag and the off-path 503 branch once marketplace publishing
      is rolled out to 100% of orgs and stable for one release cycle.
    gates:
      - "applications-service publication-requests API"
      - "Application detail: publish to marketplace controls"
    web_exposed: true

  # ---------------------------------------------------------------------------
  # fuzefront.authz.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.authz.chat-agent-security-api
    type: release
    default: false
    description: >
      FuzeFront#254 — wrap Permit behind the FuzeFront Security API; consumer
      products must not call the PDP/Permit cloud directly. Selects, in
      chat-service's agent-tool permission check
      (agent/authzGateway.ts), between the direct Permit PDP REST call
      (agent/permit.ts, today's behavior, OFF) and the same decision asked of
      FuzeFront's own Security API via @fuzefront/auth's createAuthzClient
      (agent/securityApiPermitAdapter.ts, ON) — the same wrapper
      config-service's middleware/authz.ts already uses in production. Both
      branches evaluate the identical Permit-backed policy and are
      fail-closed; this flag selects the TRANSPORT, never the decision.
      Rollout convenience only — never a substitute for the Permit check
      itself.
    owner: backend-engineer
    removal_criterion: >
      Delete once the wrapped path is enabled for 100% of environments and
      the direct-PDP path (agent/permit.ts's PermitClient, PERMIT_PDP_URL /
      config.permitPdpUrl) is no longer exercised in prod. Remove the flag
      from Unleash AND the `direct` branch of AuthzGateway in the same PR.
    gates:
      - "chat-service agent-tool permission check (agent/executor.ts -> agent/authzGateway.ts)"
    web_exposed: false
    jira: ~

  # ---------------------------------------------------------------------------
  # fuzefront.account-security.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.account-security.hub
    type: release
    default: false
    description: >
      Gates the Account Security hub UI and its supporting API routes.
      Enable per-org as the hub rolls out.
    owner: platform team
    removal_criterion: When the hub is GA and enabled for 100% of orgs.
    gates:
      - Account Security hub frontend routes and sidebar entry
    web_exposed: true
    jira: ~

  # ---------------------------------------------------------------------------
  # fuzefront.billing.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.billing.invoice-history
    type: release
    default: false
    description: >
      Gates the invoice-history page and its billing API surface.
      Enable per-org as billing rolls out.
    owner: platform team
    removal_criterion: When invoice history is GA and enabled for 100% of orgs.
    gates:
      - Invoice history frontend page and billing API routes
    web_exposed: true
    jira: ~

  # ---------------------------------------------------------------------------
  # fuzefront.platform.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.platform.multi-tenant-portals
    type: release
    default: false
    description: >
      Master switch for the multi-tenant portals feature (FF-EPIC-09-S4).
      Gates the portal bootstrap surface. Custom domains (see
      fuzefront.platform.portal-domains) require BOTH flags. FF-EPIC-17-S7
      additionally reuses it to gate the master-admin portal fleet console
      (`/admin/portals`, `MasterAdminPortalsFlow`,
      `@fuzefront/security-client` 0.7.0) rather than minting a new flag —
      the fleet console has nothing to manage while the platform-wide
      capability itself is off.
    owner: platform team
    removal_criterion: >
      When multi-tenant portals are GA and enabled for 100% of orgs.
      Drop the flag and the pre-epic code path.
    gates:
      - Portal shell and PortalLoginFlow boot surface
      - Custom-domain feature (conjunction with portal-domains)
      - Master-admin portal fleet console (FF-EPIC-17-S7, UI-side)
    web_exposed: true
    jira: ~

  - key: fuzefront.platform.portal-domains
    type: release
    default: false
    description: >
      Gates the self-service custom-domain surface: attaching a domain,
      polling its status, and detaching it (FF-EPIC-16 / FFRNT-91).
      With the flag OFF the platform behaves exactly as before — portals
      remain reachable only at their existing fixed hosts.
      Requires fuzefront.platform.multi-tenant-portals to also be ON.
    owner: platform team
    removal_criterion: >
      Delete once custom domains are GA AND FuzeInfra's production
      enablement (FFRNT-137) has soaked; then drop the flag and the
      isCustomDomainsEnabled guard.
    gates:
      - Custom-domain attach / status-poll / detach API routes
    web_exposed: false
    jira: FFRNT-91

  - key: fuzefront.platform.portals-directory
    type: release
    default: false
    description: >
      Gates the master-admin Portals Directory: the `/portals` frontend
      page + SidePanel "Portals" nav entry, and the `identityMode` /
      `launchUrl` fields that `GET /api/v1/admin/portals` adds to the
      portal fleet list (backend S1, #640; frontend S3, #642). OFF =>
      `GET /api/v1/admin/portals`'s response is byte-identical to the
      pre-existing shape (neither new field emitted) and the `/portals`
      page + nav entry are hidden. This flag is rollout convenience only
      — it gates response shape and UI visibility, not authorization;
      `GET /api/v1/admin/portals` stays `requireRole(['admin'])`-gated
      in both flag states.
    owner: platform team
    removal_criterion: >
      Delete once the Portals Directory is GA and enabled for 100% of
      admins; then drop the flag and the OFF-path field-stripping branch
      in routes/adminPortals.ts plus the hidden-by-default SidePanel entry.
    gates:
      - /portals frontend page (PortalsDirectory)
      - SidePanel "Portals" nav entry
      - GET /api/v1/admin/portals identityMode / launchUrl response fields
    web_exposed: true
    jira: ~

  - key: fuzefront.platform.config-management
    type: release
    default: false
    description: >
      Gates CONSUMERS reading their configuration FROM config-service
      (FF-EPIC-17-S8) — whether a FuzeFront service resolves its settings
      through GET /v1/config vs. its own pre-existing configuration source.
      Does NOT gate config-service's own existence: /health always answers
      and the /v1/* read+write surface (FFRNT-157/158) is never 503'd by
      this flag. config-service surfaces its own evaluation of this flag
      as `configManagementEnabled` on GET /health (informational only,
      never affecting the status code) so a consumer has a single source
      of truth for the rollout decision without needing direct Unleash
      access. Each consuming service still evaluates the flag itself
      (via @fuzefront/feature-flags, with its own org/user context) before
      deciding whether to call config-service — see FFRNT-260 (consumer
      integration guide).
    owner: backend-engineer (platform / config-service)
    removal_criterion: >
      Delete once config-service is GA and every consumer reads through
      it at 100% rollout; then drop the flag and the
      `configManagementEnabled` field on config-service's GET /health.
    gates:
      - config-service GET /health configManagementEnabled field
      - Consumer services' decision to read settings via @fuzefront/config-client
    web_exposed: false
    jira: FFRNT-255
    epic: FF-EPIC-17
    story: S8

  # ---------------------------------------------------------------------------
  # fuzefront.app-registry.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.app-registry.v1-registry-write
    type: release
    default: false
    description: >
      Gates the new versioned write paths (register / update / delete /
      activate / suspend) so the contract surface can merge dark and be
      released deliberately. Read GETs are NOT gated (safe to expose).
    owner: backend-engineer (app-registry)
    removal_criterion: >
      Delete once /api/v1/app-registry is 100% rolled out and stable;
      then drop the flag and the off-path 503 branch.
    gates:
      - /api/v1/app-registry write routes
    web_exposed: false
    jira: ~

  - key: fuzefront.app-registry.kafka-events-kill-switch
    type: ops-kill-switch
    default: true
    description: >
      Circuit-breaker for emitting Kafka events on the app-registry write
      path (the expensive / risky async fan-out). Flip OFF to stop
      emitting without a redeploy.
    owner: backend-engineer (app-registry)
    removal_criterion: Only if Kafka emission is removed from the write path.
    gates:
      - Kafka event emission on app-registry write path
    web_exposed: false
    jira: ~

  # ---------------------------------------------------------------------------
  # fuzefront.apps.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.apps.portal-catalog
    type: release
    default: false
    description: >
      Gates BOTH S2's list() portal-catalog filter (the org-less/public-app
      leak fix) AND S3's catalog admin API enforcement (FF-EPIC-12-S5).
      OFF => byte-identical pre-epic behaviour (org-less/public apps remain
      globally visible, the admin API 503s as not-yet-enabled).
    owner: backend-engineer (platform)
    removal_criterion: >
      Delete this flag and the pre-epic unscoped branch in list() once the
      portal catalog is 100% rolled out and the flag-OFF path is no longer
      exercised.
    gates:
      - Portal catalog list() org filter
      - Catalog admin API enforcement
    web_exposed: false
    jira: ~

  # ---------------------------------------------------------------------------
  # fuzefront.selection-lists.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.selection-lists.service
    type: release
    default: false
    description: >
      Gates ALL selection-list surface, server and client. Enable per-org
      (or by percentage) as the service rolls out.
      Server: every /v1/selection-lists/* route in selection-list-service
      answers 404 while OFF (router-level gate in src/app.ts
      middleware/flagGate.ts, plus per-handler checks and /v1/resolve).
      Client: the "Selection Lists" shell sidebar entry (SidePanel) and the
      /settings/selection-lists* routes (App.tsx redirect to /dashboard).
      Runbook: docs/runbooks/selection-lists-flag-rollout.md.
    owner: platform team
    removal_criterion: >
      When the service is GA and enabled for 100% of orgs and stable for
      one release cycle. Delete the flag, the SidePanel/App.tsx useFlag
      guards, and selection-list-service flags.ts + middleware/flagGate.ts
      + per-handler checks in one cleanup PR.
    gates:
      - selection-list-service API (all /v1/selection-lists/* + /v1/resolve, server-side)
      - '"Selection Lists" shell left-sidebar nav entry (UI-side, S9)'
      - '/settings/selection-lists* shell routes (UI-side)'
    web_exposed: true
    jira: FFRNT-201
    sub_tasks:
      - FFRNT-250
      - FFRNT-251
    epic: FF-EPIC-17
    story: S15
    unleash:
      project: default
      environments:
        production:
          enabled: true
          strategies:
            - type: flexibleRollout
              rollout: 100
              stickiness: default
              segments:
                - id: 1
                  name: developers
          # No org/user targeting at creation — enable per-org via Unleash
          # targeting rules once the service is ready for a given org.

  - key: fuzefront.selection-lists.seed-defaults
    type: release
    default: false
    description: >
      Gates BOTH selection-list-service seeding consumers (SL5 event contract,
      docs/planning/selection-lists-events.md section 11): the
      `identity.org.created` seeding consumer and the
      `selection-lists.seed.requested` handler, plus the reconciler/backfill.
      Evaluated per message with context { orgId, app: 'selection-list-service' }.
      OFF behaviour: org.created is skipped (the reconciler catches up once
      ON); seed.requested answers `selection-lists.seed.failed` with reason
      SEEDING_DISABLED, retryable: true. Independent of (and additionally
      requires) the master gate fuzefront.selection-lists.service. Publishing
      of the change events is NOT flagged. Server-side only; fails closed
      (no client or any evaluation error => OFF). Created OFF in every
      Unleash environment — it is never enabled by this registry entry;
      enablement is a deliberate per-org ramp by the owner.
    owner: izzywdev
    removal_criterion: >
      Remove once seeding has been ON for all orgs for 30 consecutive days
      with zero `selection-lists.seed.failed` events in that window (and the
      reconciler has backfilled every existing org). Delete the flag in
      Unleash, FLAG_KEYS.SELECTION_LISTS_SEED_DEFAULTS, and
      isSeedDefaultsEnabled() with both consumer guards in one cleanup PR.
    gates:
      - selection-list-service identity.org.created seeding consumer (server-side)
      - selection-list-service selection-lists.seed.requested handler (server-side)
      - selection-list-service seeding reconciler / backfill (server-side)
    web_exposed: false
    jira: ~
    epic: FF-EPIC-17

  - key: fuzefront.selection-lists.shared-lists
    type: release
    default: false
    description: >
      Gates ALL shared/common-list behaviour added in selection-lists 4.1.0
      (docs/planning/selection-lists-shared-and-fork.md, SL9): list
      `visibility` (private | org | platform) and the shared read, the
      `include_shared` / `visibility` listing parameters and key shadowing,
      `POST /v1/selection-lists/{listId}/fork`, `409 fork_required` on common
      lists, resolve of platform lists + the fork redirect
      (`effective_item_id`), the `list.forked` / `visibility.changed` events,
      and honouring seed-list `visibility`. OFF behaviour: the service answers
      exactly as 4.0.0 in behaviour while still emitting 4.1.0 shapes (every
      list `visibility: private`, `forked_from: null`, items
      `origin_item_id: null`); `include_shared`/`visibility` are accepted and
      ignored; the fork operation answers 404; PATCH/create with a
      non-`private` visibility is 400; seed-list `visibility` is ignored. Real
      authorization never routes through this flag: reads stay behind Permit
      (`SelectionListCatalog:read_shared`, instance `read`) and every
      mutation behind the instance roles. Independent of, and additionally
      requires, the master gate fuzefront.selection-lists.service. Created OFF
      in every Unleash environment (prod-unleash-ops `selection-lists-shared`,
      create only) — enablement is a deliberate per-org ramp by the owner.
    owner: izzywdev
    removal_criterion: >
      Remove once the flag has been ON for all orgs for 30 consecutive days
      with no fork / shared-read incident. Delete the flag in Unleash,
      FLAG_KEYS.SELECTION_LISTS_SHARED_LISTS, the WEB_EXPOSED_FLAGS entry,
      isSharedListsEnabled() and every off-path branch in
      services/selection-list-service in one cleanup PR.
    gates:
      - selection-list-service shared read, visibility, fork, resolve redirect, events, seed visibility (server-side)
      - selection-lists UI shared/common badge, fork-to-edit flow, picker effective-list lookup (UI-side, UI wave)
    web_exposed: true
    jira: ~
    epic: FF-EPIC-17

  # ---------------------------------------------------------------------------
  # fuzefront.identity.* (FF-EPIC-17 — personal identity / root membership /
  # portal reconciliation)
  # ---------------------------------------------------------------------------
  - key: fuzefront.identity.root-membership
    type: release
    default: false
    description: >
      Backend slice (FF-EPIC-17-S1/S2): on signup / auth self-heal, upserts a
      root organization_memberships(role='member') row instead of creating a
      type='personal' org. Frontend UI (personal-context switcher) reads
      whatever `user_role` the org list actually returns, so it degrades
      gracefully while this flag is OFF — root simply keeps resolving its
      pre-flag role (today: no membership row) until backend S1/S2 ship.
    owner: platform team (backend-engineer, FF-EPIC-17-S1/S2)
    removal_criterion: >
      When every environment has migrated (S2 backfill run + verified
      idempotent) and 100% of signups take the root-membership path. Drop the
      type='personal' provisioning branch alongside.
    gates:
      - organizationProvisioning.ts root-membership upsert (backend/src, backend/security/src)
      - auth self-heal hooks (backend/security/src/routes/auth.ts)
    web_exposed: false
    jira: ~
    epic: FF-EPIC-17
    story: S1

  - key: fuzefront.identity.personal-context
    type: release
    default: false
    description: >
      Gates the reconciled identity-context-switcher UI (FF-EPIC-17-S4,
      design/frames/identity-context-switcher/**): the unified
      ContextSwitcher (Personal + org/sub-org tree, replacing the flat org
      list in UserMenu.tsx's OrganizationSwitcherSection) and the "My orgs &
      sub-orgs" view superseding OrganizationPage.tsx's local `<select>`.
      Flag OFF preserves today's UI exactly (flat org list, local `<select>`
      + tabs) — zero regression while fuzefront.identity.root-membership is
      still rolling out server-side.
    owner: platform team (frontend-engineer, FF-EPIC-17-S4)
    removal_criterion: >
      When the reconciled switcher is GA and enabled for 100% of users; then
      delete OrganizationPage.tsx's `<select>` branch and this flag check.
    gates:
      - "@fuzefront/identity-ui ContextSwitcherFlow in UserMenu.tsx (header)"
      - "/organizations MyOrganizationsFlow (supersedes OrganizationPage.tsx select)"
      - "/organizations/:id OrganizationDetailPage (root MEMBER badge, never GUEST)"
    web_exposed: true
    jira: ~
    epic: FF-EPIC-17
    story: S4

  - key: fuzefront.identity.member-directory
    type: release
    default: false
    description: >
      Gates the NEW root/portal member-directory surface (FF-EPIC-17-S5):
      the paginated, server-side-searchable `GET /api/organizations/:id/directory`
      endpoint (backend, #671) and its `/organizations/:id/directory` UI
      (frontend, #672, design/frames/member-directory/**). Flag OFF => the
      endpoint does not exist (404, zero regression — it is new surface, not
      a modified one) and the directory link/route is hidden.
    owner: backend-engineer (identity, FF-EPIC-17-S5)
    removal_criterion: >
      Delete once the member-directory UI is rolled out to 100% of users and
      the flag-OFF (disabled) path is no longer exercised in prod; then drop
      the flag checks in both the route and the frontend.
    gates:
      - "GET /api/organizations/:id/directory (backend/security/src/routes/organizations.ts)"
      - "/organizations/:id/directory MemberDirectoryPage + OrganizationDetailPage link"
    web_exposed: true
    jira: ~
    epic: FF-EPIC-17
    story: S5

  - key: fuzefront.identity.prefixed-ids
    type: release
    default: false
    description: >
      Gates the TypeID-prefixed wire form on all entity-returning API responses
      (FFRNT-185 step 4). When ON, response bodies carry prefixed TypeID strings
      (e.g. `org_01h…`, `usr_01h…`) instead of bare UUIDs. The dual-accept
      window — `configureIdentity({ legacyUuidTypes })` in each backend's
      startup — ensures incoming bare UUIDs are still accepted during the client
      migration period, so flipping this flag is safe for existing clients.
      In-code default is OFF (fail-safe when Unleash is unreachable); Unleash
      production strategy is global 100 % flexibleRollout.
    owner: backend-engineer (identity, FFRNT-185)
    removal_criterion: >
      Delete once every entity type in FFRNT-185 has completed its dual-accept
      window closure (removed from legacyUuidTypes), no call-site in the
      codebase still references this flag, and the TypeID wire form is the sole
      accepted format. Remove the flag from Unleash AND all isPrefixedIdsEnabled
      call-sites in the same PR.
    gates:
      - "prefixDtoIds wired into all entity-returning route handlers (backend/src, backend/security/src, backend/applications/src)"
      - "configureIdentity({ legacyUuidTypes }) set at startup in all three backends"
    web_exposed: false
    jira: FFRNT-185
    epic: ~
    story: step 4

  - key: fuzefront.identity.employee-console
    type: release
    default: false
    description: >
      Gates the "Employee" formalization (FF-EPIC-17-S8, #655) and its
      cross-org staff console (FF-EPIC-17-S9, #673): widening the root
      org-admin grant trigger to also recognize the EXPLICIT `employee`
      user-role marker (the legacy implicit `roles ~ admin` trigger is
      unaffected and always active regardless of this flag), surfacing
      "Employee" in the role catalog (`GET /api/organizations/:id/roles`),
      and the `/staff` + `/staff/orgs/:id` cross-org console UI. Flag OFF
      preserves today's implicit-admin-only behavior with zero regression.
      Rollout convenience only — never replaces the ReBAC `org-admin`-on-root
      grant / a `permit.check`.
    owner: backend-engineer (identity, FF-EPIC-17-S8/S9)
    removal_criterion: >
      Delete once the Employee label + explicit-marker trigger + console are
      100% rolled out and the flag-OFF path is no longer exercised in prod.
    gates:
      - "rootOrgAdmin.ts explicit employee-marker grant trigger (backend/src, backend/security/src)"
      - "GET /api/organizations/:id/roles Employee catalog entry"
      - "/staff, /staff/orgs/:id EmployeeConsoleFlow UI (SidePanel nav entry)"
    web_exposed: true
    jira: ~
    epic: FF-EPIC-17

  # ---------------------------------------------------------------------------
  # fuzefront.devportal.*
  # ---------------------------------------------------------------------------
  - key: fuzefront.devportal.enabled
    type: release
    default: false
    description: >
      docs/planning/developers-portal.md: gates the whole developers.fuzefront.com
      capability — devportal-service (spec registry harvest, Security-API-authorized
      catalog/playground routes), devportal-frontend (home/catalog/spec-viewer/
      playground/my-access), the root-org `developer` membership auto-provisioning
      hook, and the Authentik redirect URI. Flag OFF means the capability is dark:
      no route is served, no provisioning happens, existing root-membership/Permit
      behavior for every other flow is unaffected. Rolled out to internal staff
      first (developers segment) before public developer access.
    owner: backend-engineer / frontend-engineer / devops-engineer (devportal)
    removal_criterion: >
      Delete once developers.fuzefront.com is GA and the flag has been at 100%
      rollout with no flag-OFF traffic for a full release cycle.
    gates:
      - "devportal-service routes (spec registry, catalog, playground proxy)"
      - "devportal-frontend (home, catalog, spec viewer, playground, my access)"
      - "ensureDeveloperMembership root-org provisioning (backend/src, backend/security/src)"
      - "deploy/helm/fuzefront/authentik/blueprints/provider-oidc.yaml redirect_uris entry"
    web_exposed: true
    jira: ~
    epic: ~
    story: S8/S9
