[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzefront-identity"
version = "1.0.0"
description = "Server-owned entity identifiers and graph-create middleware for FuzeFront microservices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
# Deliberately dependency-free: this installs into any Python microservice
# regardless of framework, and the ASGI middleware is pure ASGI (no Starlette).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["fuzefront_identity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
