[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzefront-auth"
version = "0.2.0"
description = "Consumable authN middleware for Python FuzeFront-family services -- stable Identity shape with a fail-closed token verifier (legacy-hs256 / federated-jwks), Flask decorator and FastAPI dependency. Python peer of @fuzefront/auth. Verifies only; never mints tokens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
# >=2.10.1: 2.10.0 accepted an `iss` that was merely a substring of the configured issuer
# (GHSA-75c5-xw7c-p5pm). The verifier also compares `iss` exactly itself.
dependencies = ["PyJWT[crypto]>=2.10.1,<3"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
flask = ["flask>=2.3"]
dev = [
    "pytest>=8.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "flask>=2.3",
    "asgiref>=3.2",  # Flask async views (flask[async])
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fuzefront_auth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
