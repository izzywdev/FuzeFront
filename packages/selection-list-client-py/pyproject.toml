[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzefront-selection-list-client"
version = "1.0.0"
description = "Python client for the FuzeFront SelectionList service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "UNLICENSED"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fuzefront_selection_list_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
